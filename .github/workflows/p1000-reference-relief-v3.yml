name: Preview P1000 reference relief v3

on:
  push:
    branches:
      - 'test/p1000-reference-relief-v3-20260925'
    paths:
      - 'tmp/reference-relief-v3-trigger.txt'

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Render P1000 locally only
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/renderer/render.py --product P1000-CS --fix-palette
          test -s content/pattern-system/output/P1000-CS/P1000-CS.html
          test -s content/pattern-system/output/P1000-CS/P1000-CS-product.webp

      - name: Capture finished design and zoom
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from PIL import Image

          out=Path("content/pattern-system/output/P1000-CS")
          html=out/"P1000-CS.html"
          preview=out/"P1000-CS-reference-relief-v3.png"
          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              page=browser.new_page(viewport={"width":1800,"height":2400},device_scale_factor=4)
              page.goto(html.resolve().as_uri(),wait_until="load",timeout=120000)
              page.wait_for_function("document.documentElement.getAttribute('data-drielo-ready') === '1'",timeout=120000)
              page.locator("#finished-design").screenshot(path=str(preview),type="png")
              browser.close()
          im=Image.open(preview).convert("RGB")
          w,h=im.size
          # Large crop through forehead/hair to make cell relief and empty Aida legible.
          crop=im.crop((int(w*.30),int(h*.05),int(w*.72),int(h*.38)))
          crop.save(out/"P1000-CS-reference-relief-v3-zoom.png","PNG")
          print(preview, im.size)
          PY

      - name: Upload prototype images
        uses: actions/upload-artifact@v4
        with:
          name: p1000-reference-relief-v3
          path: |
            content/pattern-system/output/P1000-CS/P1000-CS-reference-relief-v3.png
            content/pattern-system/output/P1000-CS/P1000-CS-reference-relief-v3-zoom.png
            content/pattern-system/output/P1000-CS/P1000-CS-product.webp
          retention-days: 30

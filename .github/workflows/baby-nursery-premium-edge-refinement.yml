name: Baby Nursery Approved Kawaii v4

on:
  workflow_dispatch:
  push:
    branches:
      - feature/baby-nursery-premium-edge-refinement
    paths:
      - 'content/pattern-system/collections/baby-nursery/reference-library/direct-reference-bundle-v4.part*'
      - 'content/pattern-system/collections/baby-nursery/reference-library/manifest.json'
      - 'content/pattern-system/collections/baby-nursery/collection.json'
      - '.github/workflows/baby-nursery-premium-edge-refinement.yml'

permissions:
  contents: write

concurrency:
  group: baby-nursery-approved-kawaii-v4
  cancel-in-progress: true

jobs:
  build-publish-review:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REVIEW_BRANCH: feature/baby-nursery-premium-edge-refinement
      DESIGN_IDS: "I0002 I0003 I0004 I0005 I0006 I0008 I0011 I0017 I0021 I0023"

    steps:
      - name: Checkout approved review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_BRANCH }}
          fetch-depth: 0

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Build 10 approved designs in four techniques
        env:
          DRIELO_GALLERY_REVISION: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for DESIGN in $DESIGN_IDS; do
            echo "===== APPROVED KAWAII V4 $DESIGN ====="
            python3 content/pattern-system/baby_nursery/publish_design.py "$DESIGN"
          done

      - name: Verify exact direct matrices, palette, masters and files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          from PIL import Image, ImageDraw

          root=Path(".")
          system=root/"content"/"pattern-system"
          coldir=system/"collections"/"baby-nursery"
          collection=json.loads((coldir/"collection.json").read_text(encoding="utf-8"))
          manifest=json.loads((coldir/"reference-library"/"manifest.json").read_text(encoding="utf-8"))
          parts=manifest["direct_reference_bundle_parts"]
          encoded="".join((coldir/"reference-library"/p).read_text(encoding="ascii").strip() for p in parts)
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          digest=hashlib.sha256(raw).hexdigest()
          if digest!=manifest["direct_reference_bundle_decoded_sha256"]:
              raise SystemExit(f"bundle digest mismatch {digest}")
          bundle=json.loads(raw.decode("utf-8"))
          direct=bundle["designs"]
          ids="I0002 I0003 I0004 I0005 I0006 I0008 I0011 I0017 I0021 I0023".split()
          allowed_hex={p["hex"].upper() for p in collection["palette"]}
          allowed_rgb={tuple(int(p["hex"].lstrip("#")[i:i+2],16) for i in (0,2,4)) for p in collection["palette"]}
          designs={d["base_design_id"]:d for d in json.loads((coldir/"designs.json").read_text(encoding="utf-8"))["designs"]}
          grids={"CS":(100,120),"C2C":(60,72),"TC":(80,96),"LH":(60,72)}
          report={"version":4,"label":"approved-kawaii-v4","designs":[]}

          thumbs=[]
          for design in ids:
              meta=designs[design]
              d=direct.get(design)
              if not d or not d.get("approved_kawaii_v4") or not d.get("approved_preview_v2"):
                  raise SystemExit(f"{design}: approved v4 direct reference missing")
              matrix_raw=zlib.decompress(base64.b64decode(d["matrix_zlib_base64"],validate=True))
              if hashlib.sha256(matrix_raw).hexdigest()!=d["matrix_sha256"]:
                  raise SystemExit(f"{design}: matrix digest mismatch")
              rows=matrix_raw.decode("ascii").splitlines()
              if len(rows)!=120 or any(len(r)!=100 for r in rows):
                  raise SystemExit(f"{design}: direct matrix is not 100x120")
              expected_stitches=sum(c!="." for r in rows for c in r)

              for suffix,(w,h) in grids.items():
                  code=f"{design}-{suffix}"
                  pat=json.loads((system/"patterns"/code/"pattern.json").read_text(encoding="utf-8"))
                  if (pat.get("stitch_width"),pat.get("stitch_height"))!=(w,h):
                      raise SystemExit(f"{code}: wrong grid")
                  if any(str(t.get("color","")).upper() not in allowed_hex for t in pat.get("threads",[])):
                      raise SystemExit(f"{code}: unapproved colour")
                  if suffix=="CS":
                      canonical=[[None if c=="." else c for c in row] for row in rows]
                      if pat.get("matrix")!=canonical:
                          raise SystemExit(f"{code}: CS matrix differs from approved kawaii v4")
                      if pat.get("total_stitches")!=expected_stitches:
                          raise SystemExit(f"{code}: stitch count mismatch")
                  pdf=root/"content/products/files"/f"Drielo_{code}.pdf"
                  image=root/"content/products/assets"/f"{code}-product.webp"
                  gallery=[root/"content/products/assets"/f"{code}-gallery-{i}.webp" for i in (2,3,4)]
                  if not pdf.is_file() or pdf.stat().st_size<100000 or pdf.read_bytes()[:4]!=b"%PDF":
                      raise SystemExit(f"{code}: invalid PDF")
                  if not image.is_file() or image.stat().st_size<50000:
                      raise SystemExit(f"{code}: invalid product image")
                  if any((not g.is_file()) or g.stat().st_size<30000 for g in gallery):
                      raise SystemExit(f"{code}: invalid gallery")

              ref=coldir/"reference-masters"/f"{design}-{meta['slug']}-reference.png"
              im=Image.open(ref).convert("RGBA")
              if im.size!=(800,960):
                  raise SystemExit(f"{design}: master wrong size")
              alpha=im.getchannel("A")
              amin,amax=alpha.getextrema()
              bbox=alpha.getbbox()
              if amin!=0 or amax!=255 or not bbox:
                  raise SystemExit(f"{design}: master is not transparent")
              bad=set()
              for r,g,b,a in im.getdata():
                  if a and (r,g,b) not in allowed_rgb:
                      bad.add((r,g,b))
                      if len(bad)>=3: break
              if bad:
                  raise SystemExit(f"{design}: master has colours outside palette {sorted(bad)}")

              report["designs"].append({
                  "design_id":design,
                  "slug":meta["slug"],
                  "stitches":expected_stitches,
                  "colours":int(d.get("derived_colours",0)),
                  "matrix_sha256":d["matrix_sha256"],
                  "source_reference_filename":d.get("source_reference_filename"),
                  "bbox":list(bbox),
                  "status":"PASS"
              })
              white=Image.new("RGB",im.size,(255,255,255))
              white.paste(im,mask=alpha)
              white.thumbnail((300,360),Image.Resampling.NEAREST)
              thumbs.append((design,meta["title_en"],white))

          qa=coldir/"qa"
          qa.mkdir(parents=True,exist_ok=True)
          (qa/"approved-kawaii-v4-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          cw,ch=320,400
          sheet=Image.new("RGB",(cw*5,ch*2),(255,255,255))
          draw=ImageDraw.Draw(sheet)
          for i,(design,title,im) in enumerate(thumbs):
              x=(i%5)*cw+(cw-im.width)//2
              y=(i//5)*ch+28
              sheet.paste(im,(x,y))
              draw.text(((i%5)*cw+8,(i//5)*ch+6),f"{design} {title}",fill=(0,0,0))
          sheet.save(qa/"approved-kawaii-v4-contact-sheet.webp","WEBP",quality=95,method=6)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit generated outputs to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for DESIGN in $DESIGN_IDS; do
            git add               content/pattern-system/collections/baby-nursery/source-designs/${DESIGN}-*.png               content/pattern-system/collections/baby-nursery/reference-masters/${DESIGN}-*-reference.png               content/pattern-system/patterns/${DESIGN}-CS/pattern.json               content/pattern-system/patterns/${DESIGN}-C2C/pattern.json               content/pattern-system/patterns/${DESIGN}-TC/pattern.json               content/pattern-system/patterns/${DESIGN}-LH/pattern.json               content/pattern-system/products/${DESIGN}-CS/product.json               content/pattern-system/products/${DESIGN}-C2C/product.json               content/pattern-system/products/${DESIGN}-TC/product.json               content/pattern-system/products/${DESIGN}-LH/product.json               content/products/assets/${DESIGN}-CS-product.webp               content/products/assets/${DESIGN}-CS-gallery-2.webp               content/products/assets/${DESIGN}-CS-gallery-3.webp               content/products/assets/${DESIGN}-CS-gallery-4.webp               content/products/assets/${DESIGN}-C2C-product.webp               content/products/assets/${DESIGN}-C2C-gallery-2.webp               content/products/assets/${DESIGN}-C2C-gallery-3.webp               content/products/assets/${DESIGN}-C2C-gallery-4.webp               content/products/assets/${DESIGN}-TC-product.webp               content/products/assets/${DESIGN}-TC-gallery-2.webp               content/products/assets/${DESIGN}-TC-gallery-3.webp               content/products/assets/${DESIGN}-TC-gallery-4.webp               content/products/assets/${DESIGN}-LH-product.webp               content/products/assets/${DESIGN}-LH-gallery-2.webp               content/products/assets/${DESIGN}-LH-gallery-3.webp               content/products/assets/${DESIGN}-LH-gallery-4.webp
          done
          git add content/products/catalog.json content/pattern-system/collections/baby-nursery/qa/
          if ! git diff --cached --quiet; then
            git commit -m "Build approved Baby Nursery kawaii v4 patterns [skip ci]"
            git push origin HEAD:${REVIEW_BRANCH}
          fi

      - name: Build WooCommerce review package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="/tmp/drielo-baby-kawaii-v4"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"
          python3 - "$STAGE" <<'PY'
          import json,sys
          from pathlib import Path
          stage=Path(sys.argv[1])
          ids="I0002 I0003 I0004 I0005 I0006 I0008 I0011 I0017 I0021 I0023".split()
          codes={f"{d}-{s}" for d in ids for s in ("CS","C2C","TC","LH")}
          src=json.loads(Path("content/products/catalog.json").read_text(encoding="utf-8"))
          out=dict(src)
          out["products"]=[p for p in src.get("products",[]) if p.get("code") in codes]
          out["collections"]=[c for c in src.get("collections",[]) if c.get("slug")=="baby-nursery"]
          cats={
            "cross-stitch-patterns","cross-stitch-baby-nursery",
            "c2c-crochet-patterns","c2c-crochet-baby-nursery",
            "tapestry-crochet-patterns","tapestry-crochet-baby-nursery",
            "latch-hook-rug-patterns","latch-hook-rug-baby-nursery",
          }
          out["categories"]=[c for c in src.get("categories",[]) if c.get("slug") in cats]
          if {p.get("code") for p in out["products"]}!=codes:
              raise SystemExit("WooCommerce package does not contain all 40 approved products")
          (stage/"content/products/catalog.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          for DESIGN in $DESIGN_IDS; do
            for suffix in CS C2C TC LH; do
              code="${DESIGN}-${suffix}"
              cp "content/products/assets/${code}-product.webp" "$STAGE/content/products/assets/"
              cp "content/products/assets/${code}-gallery-2.webp" "$STAGE/content/products/assets/"
              cp "content/products/assets/${code}-gallery-3.webp" "$STAGE/content/products/assets/"
              cp "content/products/assets/${code}-gallery-4.webp" "$STAGE/content/products/assets/"
              cp "content/products/files/Drielo_${code}.pdf" "$STAGE/content/products/files/"
            done
          done
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf "/tmp/drielo-baby-kawaii-v4.tgz" -C "$STAGE" content

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload WooCommerce review package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/drielo_products_key /tmp/drielo-baby-kawaii-v4.tgz             "$VPS_USER@$VPS_HOST:/tmp/drielo-baby-kawaii-v4-${GITHUB_RUN_ID}.tgz"

      - name: Publish 40 approved products to WooCommerce and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-baby-kawaii-v4-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-baby-kawaii-v4-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $ids=array("I0002","I0003","I0004","I0005","I0006","I0008","I0011","I0017","I0021","I0023");
            foreach ($ids as $design) foreach (array("CS","C2C","TC","LH") as $suffix) {
              $sku="DRIELO-".$design."-".$suffix;
              $id=wc_get_product_id_by_sku($sku);
              $p=$id ? wc_get_product($id) : false;
              if (!$p) { fwrite(STDERR,"Missing ".$sku.PHP_EOL); exit(2); }
              $cols=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
              $url=get_permalink($id);
              echo $sku." status=".$p->get_status()." image=".$p->get_image_id()." gallery=".count($p->get_gallery_image_ids())." downloads=".count($p->get_downloads())." url=".$url.PHP_EOL;
              if ($p->get_status()!=="publish" || !$p->get_image_id() || count($p->get_gallery_image_ids())<3 || count($p->get_downloads())<1 || !in_array("baby-nursery",is_wp_error($cols)?array():$cols,true)) exit(3);
            }
          '
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Archive PDFs and QA
        uses: actions/upload-artifact@v4
        with:
          name: baby-nursery-approved-kawaii-v4
          path: |
            content/products/files/Drielo_I*.pdf
            content/pattern-system/collections/baby-nursery/qa/approved-kawaii-v4-report.json
            content/pattern-system/collections/baby-nursery/qa/approved-kawaii-v4-contact-sheet.webp
          retention-days: 30

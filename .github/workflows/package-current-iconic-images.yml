name: Package current Iconic Destinations images

on:
  push:
    branches: [iconic-batch01-conceptual-v2]
    paths:
      - '.github/workflows/package-current-iconic-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current Iconic branch
        uses: actions/checkout@v4
        with:
          ref: iconic-batch01-conceptual-v2
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Build ZIP from current approved PNGs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, zipfile, re

          root = Path("content/pattern-system/collections/iconic-destinations")
          src = root / "approved-pixel-designs"
          out = root / "assets" / "iconic-destinations-current-100-images.zip"

          wanted = {f"D{n:04d}" for n in range(31, 40)}
          wanted.add("D0046")
          wanted.update(f"D{n:04d}" for n in range(61, 151))

          files = []
          for p in sorted(src.glob("*.png")):
              m = re.match(r"(D\d{4})-", p.name)
              if m and m.group(1) in wanted:
                  files.append(p)

          ids = [re.match(r"(D\d{4})-", p.name).group(1) for p in files]
          if len(files) != 100 or set(ids) != wanted:
              missing = sorted(wanted - set(ids))
              extra = sorted(set(ids) - wanted)
              raise SystemExit(f"Expected 100 current images; got {len(files)} missing={missing} extra={extra}")

          manifest = []
          bad = []
          for p in files:
              with Image.open(p) as im:
                  rgb = im.convert("RGB")
                  colours = len(set(rgb.getdata()))
                  row = {
                      "file": p.name,
                      "id": re.match(r"(D\d{4})-", p.name).group(1),
                      "format": im.format,
                      "width": rgb.width,
                      "height": rgb.height,
                      "colours": colours,
                  }
                  manifest.append(row)
                  if im.format != "PNG" or rgb.size != (100, 120):
                      bad.append(row)

          if bad:
              raise SystemExit("Non-compliant current images: " + json.dumps(bad, ensure_ascii=False))

          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for p in files:
                  zf.write(p, arcname=p.name)
              zf.writestr("manifest.json", json.dumps(manifest, ensure_ascii=False, indent=2))

          print(f"CURRENT_ICONIC_IMAGES=100")
          print(f"ZIP={out}")
          print(f"ZIP_BYTES={out.stat().st_size}")
          print(f"COLOUR_COUNTS_MIN={min(x['colours'] for x in manifest)}")
          print(f"COLOUR_COUNTS_MAX={max(x['colours'] for x in manifest)}")
          PY

      - name: Commit ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pattern-system/collections/iconic-destinations/assets/iconic-destinations-current-100-images.zip
          if git diff --cached --quiet; then
            echo "ZIP already current"
          else
            git commit -m "Package current 100 Iconic Destinations images [skip ci]"
            git push origin HEAD:iconic-batch01-conceptual-v2
          fi

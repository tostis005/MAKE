name: Validate P0001 multitech production
on:
  push:
    branches: [production-p0001-multitech]
    paths: ['.github/workflows/tmp-validate-p0001.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate importer and catalogue
        shell: bash
        run: |
          set -euo pipefail
          php -l content/tools/import-products.php
          python3 - <<'PY'
          import json, pathlib, base64, urllib.request, tarfile, tempfile
          root=pathlib.Path('content/products')
          catalog=json.loads((root/'catalog.json').read_text())
          products=catalog['products']
          variants=[p for p in products if p.get('design_id')=='P0001']
          assert len(variants)==4, len(variants)
          assert len({p['sku'] for p in products})==len(products)
          assert len({p['code'] for p in products})==len(products)
          expected={'cross-stitch','c2c-crochet','tapestry-crochet','latch-hook'}
          assert {p['filters']['technique'][0] for p in variants}==expected
          for p in variants:
              tags=p.get('etsy_tags_en',[])
              assert len(tags)<=13
              assert all(len(t)<=20 for t in tags), (p['sku'],tags)

          sources=json.loads((root/'pdf-sources.json').read_text())
          for filename,spec in sources.items():
              req=urllib.request.Request(spec['url'],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read()
              data=base64.b64decode(raw) if spec.get('base64') else raw
              assert data[:4]==b'%PDF', filename
              assert len(data)>100000, (filename,len(data))
              print(filename,len(data))

          spec=json.loads((root/'gallery-bundle-source.json').read_text())
          req=urllib.request.Request(spec['url'],headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=180) as r:
              raw=r.read()
          data=base64.b64decode(raw) if spec.get('base64',True) else raw
          with tempfile.NamedTemporaryFile(suffix='.tar.gz') as fh:
              fh.write(data); fh.flush()
              with tarfile.open(fh.name,'r:gz') as tar:
                  names=[m.name for m in tar.getmembers() if m.isfile()]
          assert len([n for n in names if n.endswith('.webp')])==8, names
          print('gallery assets',len(names))
          PY

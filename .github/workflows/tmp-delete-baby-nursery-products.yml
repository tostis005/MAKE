name: TEMP Delete Baby Nursery Products

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-delete-baby-nursery-products.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_delete_baby_key
          chmod 600 ~/.ssh/drielo_delete_baby_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Delete Baby Nursery products, media and old PDFs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_delete_baby_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            if (!class_exists("WooCommerce")) { fwrite(STDERR,"WooCommerce inactive\n"); exit(2); }

            $ids=get_posts(array(
              "post_type"=>"product",
              "post_status"=>"any",
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "tax_query"=>array(array(
                "taxonomy"=>"product_collection",
                "field"=>"slug",
                "terms"=>array("baby-nursery"),
              )),
            ));
            echo "BABY_PRODUCTS_FOUND=".count($ids).PHP_EOL;
            foreach($ids as $id){
              $p=wc_get_product($id);
              if($p){ echo "DELETE ".$p->get_sku()." id=".$id.PHP_EOL; }
              wp_delete_post($id,true);
            }

            $attachments=get_posts(array(
              "post_type"=>"attachment",
              "post_status"=>"inherit",
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "meta_query"=>array(array(
                "key"=>"_drielo_source_asset",
                "value"=>"assets/I0",
                "compare"=>"LIKE",
              )),
            ));
            echo "BABY_ATTACHMENTS_FOUND=".count($attachments).PHP_EOL;
            foreach($attachments as $aid){ wp_delete_attachment($aid,true); }

            $left=get_posts(array(
              "post_type"=>"product",
              "post_status"=>"any",
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "tax_query"=>array(array(
                "taxonomy"=>"product_collection",
                "field"=>"slug",
                "terms"=>array("baby-nursery"),
              )),
            ));
            echo "BABY_PRODUCTS_LEFT=".count($left).PHP_EOL;
            if(count($left)!==0){ exit(3); }
          '

          "${DOCKER[@]}" exec make-wp sh -lc 'find /var/www/html/wp-content/uploads/woocommerce_uploads/drielo -maxdepth 1 -type f -name "Drielo_I*.pdf" -print -delete 2>/dev/null || true'
          REMOTE

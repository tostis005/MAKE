name: Reset Animals and regenerate Cross Stitch products

on:
  push:
    branches:
      - feature/animals-auto-publish
    paths:
      - 'tmp/animals-cs-regeneration/READY'

permissions:
  contents: write
  actions: write

concurrency:
  group: drielo-animals-full-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Stop previous Animals regeneration runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}/actions/workflows/animals-auto-publish.yml/runs?branch=feature%2Fanimals-auto-publish&per_page=100"
          ids="$(gh api --method GET "$API" --jq '.workflow_runs[] | select(.status=="queued" or .status=="in_progress") | .id' || true)"
          if [ -n "$ids" ]; then
            echo "$ids" | while read -r id; do
              [ -n "$id" ] || continue
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$id/cancel" >/dev/null || true
            done
          fi
          for i in $(seq 1 60); do
            active="$(gh api --method GET "$API" --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' || echo 0)"
            echo "Active previous Animals runs: $active"
            [ "$active" = "0" ] && break
            sleep 5
          done

      - name: Checkout Animals branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/animals-auto-publish

      - name: Reset Animals queue and catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')

          designs_path=root/'content/pattern-system/collections/animals/designs.json'
          designs=json.loads(designs_path.read_text(encoding='utf-8'))
          for item in designs.get('designs',[]):
              item['product_status']='pending-cross-stitch-regeneration'
          designs_path.write_text(json.dumps(designs,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          queue_path=root/'content/pattern-system/animals_auto/publish_queue.json'
          queue=json.loads(queue_path.read_text(encoding='utf-8'))
          queue['auto_continue']=True
          queue['max_attempts_per_design']=3
          queue['recovery_attempts_per_design']=5
          queue['restarted_at']='2026-09-29T05:48:00Z'
          queue['restart_reason']='Delete every live Animals product and regenerate A0001-A0030 as Cross Stitch only.'
          queue['restart_from']='A0001'
          queue['mode']='cross-stitch-only'
          queue['paused_reason']=None
          for item in queue.get('items',[]):
              item['status']='pending'
              item['attempts']=0
              for key in ('last_run','last_error','published_at','failed_at'):
                  item.pop(key,None)
          queue_path.write_text(json.dumps(queue,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          catalog_path=root/'content/products/catalog.json'
          catalog=json.loads(catalog_path.read_text(encoding='utf-8'))
          before=len(catalog.get('products',[]))
          catalog['products']=[p for p in catalog.get('products',[]) if p.get('collection')!='animals']
          removed=before-len(catalog['products'])
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('RESET_CATALOG_REMOVED',removed)
          PY

      - name: Commit reset state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pattern-system/collections/animals/designs.json
          git add content/pattern-system/animals_auto/publish_queue.json
          git add content/products/catalog.json
          git rm tmp/animals-cs-regeneration/READY
          git commit -m "Reset Animals for full Cross Stitch regeneration"
          git fetch origin feature/animals-auto-publish
          git rebase origin/feature/animals-auto-publish
          git push origin HEAD:feature/animals-auto-publish

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_animals_reset_key
          chmod 600 ~/.ssh/drielo_animals_reset_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Delete every Animals product from WooCommerce
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_animals_reset_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            exit 1
          fi
          "${DOCKER[@]}" exec make-wp php -d memory_limit=1024M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";
            global $wpdb;
            $statuses=array_keys(get_post_stati());
            $tax_ids=get_posts(array(
              "post_type"=>"product","post_status"=>$statuses,"posts_per_page"=>-1,"fields"=>"ids",
              "tax_query"=>array(array("taxonomy"=>"product_collection","field"=>"slug","terms"=>array("animals")))
            ));
            $like=$wpdb->esc_like("DRIELO-A")."%";
            $sku_ids=$wpdb->get_col($wpdb->prepare(
              "SELECT DISTINCT post_id FROM {$wpdb->postmeta} WHERE meta_key=%s AND meta_value LIKE %s",
              "_sku",$like
            ));
            $ids=array_values(array_unique(array_map("intval",array_merge($tax_ids,$sku_ids))));
            sort($ids);
            echo "ANIMALS_DELETE_BEFORE=".count($ids).PHP_EOL;
            foreach($ids as $id){ wp_delete_post($id,true); }
            $left=get_posts(array(
              "post_type"=>"product","post_status"=>$statuses,"posts_per_page"=>-1,"fields"=>"ids",
              "tax_query"=>array(array("taxonomy"=>"product_collection","field"=>"slug","terms"=>array("animals")))
            ));
            $left_sku=$wpdb->get_col($wpdb->prepare(
              "SELECT DISTINCT post_id FROM {$wpdb->postmeta} WHERE meta_key=%s AND meta_value LIKE %s",
              "_sku",$like
            ));
            echo "ANIMALS_DELETE_AFTER=".(count($left)+count($left_sku)).PHP_EOL;
            if(count($left)!==0 || count($left_sku)!==0){ exit(3); }
          '
          REMOTE

      - name: Start full Animals Cross Stitch regeneration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/animals-auto-publish.yml/dispatches"             -f ref=feature/animals-auto-publish

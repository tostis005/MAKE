name: Cancel stale product import once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-import-products-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale import run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 36338965235 --repo "${GITHUB_REPOSITORY}" || true
          echo "STALE_IMPORT_CANCEL_REQUESTED"

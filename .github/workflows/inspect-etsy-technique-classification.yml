name: Inspect Etsy technique classification

on:
  push:
    branches:
      - feature/etsy-technique-classification
    paths:
      - '.github/workflows/inspect-etsy-technique-classification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_etsy_class_key
          chmod 600 ~/.ssh/drielo_etsy_class_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect production Etsy mapping
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_etsy_class_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";

            $sync=Drielo_Etsy_Sync::instance();
            $ref=new ReflectionClass($sync);
            $req=$ref->getMethod("etsy_request"); $req->setAccessible(true);

            $settings=get_option("drielo_etsy_settings",array());
            $shop=preg_replace("/\D+/","",(string)($settings["shop_id"]??""));
            $sections=$req->invoke($sync,"GET","/v3/application/shops/".$shop."/sections",array(),false);
            echo "SECTIONS=".wp_json_encode($sections).PHP_EOL;

            $tax=$req->invoke($sync,"GET","/v3/application/seller-taxonomy/nodes",array(),false);
            $nodes=is_array($tax)&&isset($tax["results"])&&is_array($tax["results"])?$tax["results"]:$tax;
            $flat=array();
            $walk=function($items,$trail=array()) use (&$walk,&$flat){
              foreach((array)$items as $node){
                if(!is_array($node)) continue;
                $name=trim((string)($node["name"]??""));
                $path=array_merge($trail,array($name));
                $id=absint($node["id"]??0);
                if($id) $flat[$id]=implode(" > ",array_filter($path));
                if(!empty($node["children"])&&is_array($node["children"])) $walk($node["children"],$path);
              }
            };
            $walk($nodes);

            $all=get_posts(array(
              "post_type"=>"product",
              "post_status"=>array("publish","draft","private","pending"),
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "orderby"=>"ID",
              "order"=>"ASC"
            ));

            $by=array("CS"=>array(),"C2C"=>array(),"TC"=>array(),"LH"=>array());
            foreach($all as $id){
              $p=wc_get_product($id); if(!$p) continue;
              $sku=(string)$p->get_sku();
              if(!preg_match("/-(CS|C2C|TC|LH)$/",$sku,$m)) continue;
              $lid=absint(get_post_meta($id,"_drielo_etsy_listing_id",true));
              if(!$lid) continue;
              $remote=$req->invoke($sync,"GET","/v3/application/listings/".$lid,array(),false);
              if(is_wp_error($remote)) continue;
              $tid=absint($remote["taxonomy_id"]??0);
              $sid=absint($remote["shop_section_id"]??0);
              $by[$m[1]][]=array(
                "sku"=>$sku,
                "listing_id"=>$lid,
                "title"=>(string)($remote["title"]??""),
                "state"=>(string)($remote["state"]??""),
                "taxonomy_id"=>$tid,
                "taxonomy_path"=>(string)($flat[$tid]??""),
                "shop_section_id"=>$sid
              );
            }

            foreach($by as $code=>$rows){
              $summary=array();
              foreach($rows as $row){
                $key=$row["taxonomy_id"]."|".$row["shop_section_id"]."|".$row["taxonomy_path"];
                if(!isset($summary[$key])) $summary[$key]=array("count"=>0,"sample"=>$row);
                $summary[$key]["count"]++;
              }
              echo $code."_SUMMARY=".wp_json_encode(array_values($summary)).PHP_EOL;
              echo $code."_ROWS=".wp_json_encode(array_slice($rows,0,20)).PHP_EOL;
            }

            $run=get_option("drielo_etsy_sync_run",array());
            echo "ACTIVE_RUN=".wp_json_encode(array(
              "id"=>$run["id"]??"",
              "status"=>$run["status"]??"",
              "mode"=>$run["mode"]??"",
              "total"=>count((array)($run["product_ids"]??array())),
              "updated_at"=>$run["updated_at"]??""
            )).PHP_EOL;
          '
          REMOTE

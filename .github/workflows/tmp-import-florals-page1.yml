name: TEMP Import Florals Page-1 Assets

on:
  push:
    branches:
      - feature/florals-auto-publish
    paths:
      - '.github/workflows/tmp-import-florals-page1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-import-florals-page1
  cancel-in-progress: true

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/florals-auto-publish
          fetch-depth: 0

      - name: Download exact user-approved page-1 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/pattern-system/collections/florals/assets

          curl -fL --retry 3 --retry-delay 1 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-3408-81f4-817f-8b428514bdb0/raw?se=2026-09-24T13%3A10%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=0989d086-c7d4-5a7d-b8aa-bb7dc1225070&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A29%3A39Z&ske=2026-09-25T12%3A29%3A39Z&sks=b&skv=2026-02-06&sig=jIq0r4CLoTgSJjE03e2I45jpyf6o0E2hWtomyHyZU20%3D'             -o content/pattern-system/collections/florals/assets/page-1-cross-stitch.webp

          curl -fL --retry 3 --retry-delay 1 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-835c-81f5-b8e9-d907dd3cfd12/raw?se=2026-09-24T13%3A10%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=9683675c-f286-5c33-95ba-17b7259541f3&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T11%3A13%3A13Z&ske=2026-09-25T11%3A13%3A13Z&sks=b&skv=2026-02-06&sig=1lefctQyoQ6aaGQP96dqhv6zvQnBosA%2BMTjd3iyW83k%3D'             -o content/pattern-system/collections/florals/assets/page-1-c2c-crochet.webp

          curl -fL --retry 3 --retry-delay 1 'https://sdmntprseasia.oaiusercontent.com/files/00000000-060c-8207-9cdb-0dce6ec94941/raw?se=2026-09-24T13%3A10%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=8800ac03-38a3-5e6f-a35a-9e1b37474fa1&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T10%3A33%3A08Z&ske=2026-09-25T10%3A33%3A08Z&sks=b&skv=2026-02-06&sig=DydGhdSOrn78/tq%2BJqLnmAe/9vjjlER61k20s12w3aI%3D'             -o content/pattern-system/collections/florals/assets/page-1-tapestry-crochet.webp

          curl -fL --retry 3 --retry-delay 1 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-ef1c-81fd-b35c-b15f95c1641f/raw?se=2026-09-24T13%3A10%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=2a1a58f9-936f-5590-9e06-f5d40cdaf88d&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A16%3A36Z&ske=2026-09-25T12%3A16%3A36Z&sks=b&skv=2026-02-06&sig=6MVJijhjIbIJOEjrks9pRCdNQpi12JioAusjUWPUhOw%3D'             -o content/pattern-system/collections/florals/assets/page-1-latch-hook.webp

      - name: Verify files and lock mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          from PIL import Image

          root=Path('content/pattern-system/collections/florals')
          files={
            'CS': root/'assets/page-1-cross-stitch.webp',
            'C2C': root/'assets/page-1-c2c-crochet.webp',
            'TC': root/'assets/page-1-tapestry-crochet.webp',
            'LH': root/'assets/page-1-latch-hook.webp',
          }
          for tech,p in files.items():
              if not p.is_file() or p.stat().st_size < 150000:
                  raise SystemExit(f'{tech}: missing or suspiciously small asset: {p}')
              im=Image.open(p)
              if im.size != (1200,1200):
                  raise SystemExit(f'{tech}: unexpected dimensions {im.size}')
              print(tech, p.stat().st_size, hashlib.sha256(p.read_bytes()).hexdigest())

          path=root/'collection.json'
          d=json.loads(path.read_text(encoding='utf-8'))
          m=d.setdefault('mockup_spec',{})
          m['technique_assets']={
            'CS':'assets/page-1-cross-stitch.webp',
            'C2C':'assets/page-1-c2c-crochet.webp',
            'TC':'assets/page-1-tapestry-crochet.webp',
            'LH':'assets/page-1-latch-hook.webp',
          }
          m['status']='florals-specific-page-1-scenes-user-approved'
          m['mapping_note']=(
            'Strict one-to-one Florals mapping from the four user uploads: '
            'CS = framed white Aida/cross-stitch canvas (114968); '
            'C2C = cream blanket/panel on freestanding wooden rack (114966); '
            'TC = cream crochet wall hanging on horizontal dowel (114967); '
            'LH = plush tufted rug wall hanging on dowel (114969). '
            'Do not swap these assets between techniques.'
          )
          m['source_files']={
            'CS':'user-upload-114968',
            'C2C':'user-upload-114966',
            'TC':'user-upload-114967',
            'LH':'user-upload-114969',
          }
          path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit imported page-1 assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             content/pattern-system/collections/florals/assets/page-1-cross-stitch.webp             content/pattern-system/collections/florals/assets/page-1-c2c-crochet.webp             content/pattern-system/collections/florals/assets/page-1-tapestry-crochet.webp             content/pattern-system/collections/florals/assets/page-1-latch-hook.webp             content/pattern-system/collections/florals/collection.json
          git commit -m "Replace Florals page-1 scenes with approved user uploads [skip ci]"
          git push origin HEAD:feature/florals-auto-publish

name: TEMP Import Florals Sources Batch 5
on:
  push:
    branches: [feature/florals-pattern-generation]
    paths: ['.github/workflows/tmp-import-florals-sources-b5.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drielo-florals-source-import-b5
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/florals-pattern-generation
          fetch-depth: 0
      - name: Download approved sources F0021-F0025
        shell: bash
        run: |
          set -euo pipefail
          D='content/pattern-system/collections/florals/source-designs'
          mkdir -p "$D"
          curl -fL --retry 2 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-7274-81f7-96ec-f64e622dd0a7/raw?se=2026-09-24T14%3A26%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=1ea58c3e-a1d7-5e6c-a134-10fb2b19d531&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A41%3A07Z&ske=2026-09-25T13%3A41%3A07Z&sks=b&skv=2026-02-06&sig=m44%2B0XSf0taYoPiyECz5ZdyECx16UziU5kZtcwXEkV8%3D' -o "$D/F0021-hanging-pink-flower-basket.png"
          curl -fL --retry 2 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-7d60-81fb-9791-01760ee7b797/raw?se=2026-09-24T14%3A26%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=8ac8dc5f-cdc3-5f14-ab93-3de8fc13fad9&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T14%3A10%3A50Z&ske=2026-09-25T14%3A10%3A50Z&sks=b&skv=2026-02-06&sig=McAc9ctWYQiJIz%2B0HVnt8kkV8lomVHaSzw8RnB%2BjFNs%3D' -o "$D/F0022-bluebell-bouquet.png"
          curl -fL --retry 2 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-2fe4-822f-8cb9-71a46dd92322/raw?se=2026-09-24T14%3A26%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=696f8b43-243a-5f2e-a1c6-1761560d017f&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A53%3A32Z&ske=2026-09-25T12%3A53%3A32Z&sks=b&skv=2026-02-06&sig=gehWsYEwnqh5jswyoPUimwSnhTi7340on5sjDwm5t/E%3D' -o "$D/F0023-magnolia-branch.png"
          curl -fL --retry 2 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2478-820e-85c4-5e7351b77b8c/raw?se=2026-09-24T14%3A26%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=ce3a6298-7a19-5577-9aec-3d8012578d90&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A15%3A18Z&ske=2026-09-25T13%3A15%3A18Z&sks=b&skv=2026-02-06&sig=5VQC3c%2BG7BBIbR24VdI/r9zrk6J%2BxA9JzcORLHBlrS0%3D' -o "$D/F0024-enamel-herb-pot.png"
          curl -fL --retry 2 'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-4470-8208-9e52-efc29613e729/raw?se=2026-09-24T14%3A26%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=61081ed7-7e16-5f0c-afad-8cfbf1455248&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A48%3A43Z&ske=2026-09-25T13%3A48%3A43Z&sks=b&skv=2026-02-06&sig=gdAlsa7q6XJKVn1QIGX93kdNJhpjQjd43xcnnE9//ms%3D' -o "$D/F0025-daisy-wreath.png"
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          d=Path('content/pattern-system/collections/florals/source-designs')
          for i in range(21,26):
              p=next(d.glob(f'F{i:04d}-*.png'))
              im=Image.open(p).convert('RGBA')
              if im.size!=(100,120) or im.getchannel('A').getbbox() is None: raise SystemExit(f'bad {p}: {im.size}')
              print(p.name,p.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pattern-system/collections/florals/source-designs/F002{1,2,3,4,5}-*.png
          git commit -m "Import approved Florals sources F0021-F0025 [skip ci]"
          git fetch origin feature/florals-pattern-generation
          git rebase origin/feature/florals-pattern-generation
          git push origin HEAD:feature/florals-pattern-generation

name: Build final Pop Art portraits pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pop-art-portraits-pack.yml'
      - '.github/scripts/build_pop_art_portrait_pack.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build and validate 60-image portrait pack
        run: python .github/scripts/build_pop_art_portrait_pack.py

      - name: Commit export and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/pop-art-portraits-final exports/pop-art-portraits-60-100x120.zip exports/pop-art-portraits-60-preview.png
          git rm .github/workflows/build-pop-art-portraits-pack.yml
          git commit -m "Build final 60-image Pop Art portraits pack [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

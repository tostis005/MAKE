name: Force cancel Etsy Iconic replacement runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-cancel-etsy-iconic.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel obsolete runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 36483449814 36483920142; do
            code=$(curl -sS -o "/tmp/force-$run.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run/force-cancel")
            echo "force-cancel $run HTTP $code"
            if [ "$code" != "202" ] && [ "$code" != "409" ]; then
              cat "/tmp/force-$run.json"
              exit 1
            fi
          done

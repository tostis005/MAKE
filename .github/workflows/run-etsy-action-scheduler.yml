name: Run Etsy Action Scheduler queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-etsy-action-scheduler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-etsy-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_as_key
          chmod 600 ~/.ssh/drielo_as_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Process Etsy Action Scheduler queue now
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_as_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";

            if(!class_exists("ActionScheduler_QueueRunner")){
              fwrite(STDERR,"ActionScheduler_QueueRunner unavailable".PHP_EOL);
              exit(2);
            }

            for($round=1;$round<=20;$round++){
              $pending=function_exists("as_get_scheduled_actions")
                ? count(as_get_scheduled_actions(array(
                    "hook"=>"drielo_etsy_sync_product_async",
                    "group"=>"drielo-etsy",
                    "status"=>"pending",
                    "per_page"=>200
                  ),"ids"))
                : 0;

              echo "ROUND=".$round." PENDING_BEFORE=".$pending.PHP_EOL;
              if($pending===0) break;

              $processed=ActionScheduler_QueueRunner::instance()->run();
              echo "ROUND=".$round." PROCESSED=".$processed.PHP_EOL;

              $run=get_option("drielo_etsy_sync_run",array());
              $batch=(string)($run["id"]??"");
              $ids=array_values(array_filter(array_map("absint",(array)($run["product_ids"]??array()))));
              $counts=array("queued"=>0,"running"=>0,"success"=>0,"failed"=>0,"skipped"=>0,"other"=>0);
              foreach($ids as $id){
                $bid=(string)get_post_meta($id,"_drielo_etsy_batch_id",true);
                $state=(string)get_post_meta($id,"_drielo_etsy_batch_state",true);
                if(!$bid||!hash_equals($batch,$bid)){$counts["other"]++;continue;}
                if(isset($counts[$state]))$counts[$state]++;else $counts["other"]++;
              }
              echo "COUNTS=".wp_json_encode($counts).PHP_EOL;

              if((int)$processed<=0) break;
            }

            $remaining=function_exists("as_get_scheduled_actions")
              ? count(as_get_scheduled_actions(array(
                  "hook"=>"drielo_etsy_sync_product_async",
                  "group"=>"drielo-etsy",
                  "status"=>"pending",
                  "per_page"=>200
                ),"ids"))
              : 0;
            echo "PENDING_FINAL=".$remaining.PHP_EOL;
          '
          REMOTE

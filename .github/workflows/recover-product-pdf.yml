name: Recover Drielo product PDFs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-product-pdf.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_recover_key
          chmod 600 ~/.ssh/drielo_recover_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Recover P0002-P0011 from WooCommerce storage
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p recovered
          for n in $(seq -w 2 11); do
            code="P00${n}"
            file="Drielo_${code}.pdf"
            echo "Recovering ${file}"
            ssh -i ~/.ssh/drielo_recover_key "$VPS_USER@$VPS_HOST" "bash -s -- '${file}'" > "recovered/${file}" <<'REMOTE'
          set -euo pipefail
          file="$1"
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "make-wp container not found" >&2
            exit 1
          fi
          "${DOCKER[@]}" exec make-wp cat "/var/www/html/wp-content/uploads/woocommerce_uploads/drielo/${file}"
          REMOTE
            test "$(stat -c%s "recovered/${file}")" -gt 100000
          done

      - name: Upload recovered PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Drielo_P0002-P0011
          path: recovered/*.pdf
          if-no-files-found: error
          retention-days: 1

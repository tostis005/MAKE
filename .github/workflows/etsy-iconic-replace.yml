name: Replace non-cross-stitch Etsy listings with Iconic Destinations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-iconic-replace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_etsy_replace_key
          chmod 600 ~/.ssh/drielo_etsy_replace_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Preflight and replace existing Etsy listings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/drielo_etsy_replace_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR make-wp container not found"; exit 1
          fi

          "${DOCKER[@]}" exec make-wp php -d memory_limit=1536M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";
            require_once ABSPATH."wp-admin/includes/plugin.php";

            if(!class_exists("Drielo_Etsy_Sync")){
              fwrite(STDERR,"ERROR Etsy plugin unavailable\n"); exit(2);
            }

            $sync=Drielo_Etsy_Sync::instance();
            $ref=new ReflectionClass($sync);
            $method=function($name)use($ref,$sync){
              $m=$ref->getMethod($name); $m->setAccessible(true); return [$m,$sync];
            };
            [$settings_m,$obj]=$method("settings");
            [$request,$obj]=$method("etsy_request");
            [$resolve_taxonomy,$obj]=$method("resolve_taxonomy_id");
            [$listing_payload,$obj]=$method("listing_payload");
            [$sync_inventory,$obj]=$method("sync_inventory");
            [$sync_images,$obj]=$method("sync_images");
            [$sync_downloads,$obj]=$method("sync_downloads");
            [$sync_classification,$obj]=$method("sync_technique_classification");
            [$sync_section,$obj]=$method("sync_shop_section");
            [$asset_hash_m,$obj]=$method("product_asset_hash");
            [$content_hash_m,$obj]=$method("product_content_hash");
            [$technique_m,$obj]=$method("product_technique");

            $manual=$ref->getProperty("manual_sync_context");
            $manual->setAccessible(true);

            $settings=$settings_m->invoke($sync);
            $shop=(string)($settings["shop_id"]??"");
            if($shop===""){fwrite(STDERR,"ERROR Etsy Shop ID missing\n");exit(3);}

            $norm=static function($s){
              $s=strtolower(remove_accents(trim((string)$s)));
              $s=preg_replace("/[^a-z0-9]+/"," ",$s);
              return trim(preg_replace("/\\s+/"," ",(string)$s));
            };
            $looks_cross_stitch=static function($row,$cross_titles)use($norm){
              $title=$norm($row["title"]??"");
              return (int)($row["taxonomy_id"]??0)===87
                || str_contains($title,"cross stitch")
                || str_contains($title,"punto de cruz")
                || isset($cross_titles[$title]);
            };

            $all_ids=get_posts([
              "post_type"=>"product",
              "post_status"=>["publish","draft","private","pending"],
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "orderby"=>"ID",
              "order"=>"ASC"
            ]);

            $cross_titles=[];
            $linked_by_listing=[];
            $linked_cross=[];
            $targets=[];
            foreach($all_ids as $id){
              $p=wc_get_product($id); if(!$p) continue;
              $sku=(string)$p->get_sku();
              $tech=(string)$technique_m->invoke($sync,$p);
              if($tech==="" && preg_match("/-CS$/",$sku)) $tech="cross-stitch";
              $listing=(string)get_post_meta($id,"_drielo_etsy_listing_id",true);
              if($listing!==""){
                $linked_by_listing[$listing]=[
                  "product_id"=>(int)$id,
                  "sku"=>$sku,
                  "technique"=>$tech,
                  "title"=>(string)$p->get_name()
                ];
                if($tech==="cross-stitch") $linked_cross[$listing]=true;
              }
              if($tech==="cross-stitch"){
                foreach([
                  $p->get_name(),
                  get_post_meta($id,"_drielo_etsy_title_en",true),
                  get_post_meta($id,"_drielo_etsy_title_es",true),
                  get_post_meta($id,"_drielo_title_en",true),
                  get_post_meta($id,"_drielo_title_es",true)
                ] as $title){
                  $n=$norm($title); if($n!=="") $cross_titles[$n]=true;
                }
              }

              $terms=taxonomy_exists("product_collection")?wp_get_post_terms($id,"product_collection",["fields"=>"slugs"]):[];
              if(is_wp_error($terms) || !in_array("iconic-destinations",(array)$terms,true)) continue;
              if($tech!=="cross-stitch" && !preg_match("/^DRIELO-D\\d{4}-CS$/",$sku)) continue;

              $img_ids=array_values(array_filter(array_unique(array_merge([$p->get_image_id()],$p->get_gallery_image_ids()))));
              $downloads=$p->get_downloads();
              if(!$img_ids || !$downloads){
                fwrite(STDERR,"PREFLIGHT_FAIL target assets sku=".$sku." images=".count($img_ids)." downloads=".count($downloads)."\n");
                exit(4);
              }
              $taxonomy=(int)$resolve_taxonomy->invoke($sync,$p);
              if($taxonomy!==87){
                fwrite(STDERR,"PREFLIGHT_FAIL unexpected cross-stitch taxonomy sku=".$sku." taxonomy=".$taxonomy."\n");
                exit(5);
              }
              $targets[]=[
                "id"=>(int)$id,
                "sku"=>$sku,
                "product"=>$p,
                "local_listing"=>$listing,
                "taxonomy"=>$taxonomy,
                "expected_images"=>min(20,count($img_ids)),
                "expected_files"=>min(5,count($downloads))
              ];
            }
            usort($targets,fn($a,$b)=>strcmp($a["sku"],$b["sku"]));
            if(!$targets){fwrite(STDERR,"PREFLIGHT_FAIL no Iconic Destinations cross-stitch targets\n");exit(6);}

            // Read the live active/inactive Etsy inventory. No writes before the entire pairing is validated.
            $remote=[];
            foreach(["active","inactive"] as $state){
              for($offset=0;$offset<3000;$offset+=100){
                $res=$request->invoke($sync,"GET","/v3/application/shops/".rawurlencode($shop)."/listings?state=".$state."&limit=100&offset=".$offset,[],true);
                if(is_wp_error($res)){
                  fwrite(STDERR,"PREFLIGHT_FAIL Etsy listing fetch: ".$res->get_error_message()."\n"); exit(7);
                }
                $rows=(array)($res["results"]??[]);
                foreach($rows as $r){
                  $lid=(string)($r["listing_id"]??"");
                  if($lid!=="") $remote[$lid]=$r;
                }
                if(count($rows)<100) break;
              }
            }

            $used=[];
            $unlinked=[];
            foreach($targets as &$t){
              $lid=(string)$t["local_listing"];
              if($lid===""){
                $t["listing_id"]="";
                $unlinked[]=&$t;
                continue;
              }
              $probe=$request->invoke($sync,"GET","/v3/application/listings/".rawurlencode($lid),[],true);
              if(is_wp_error($probe) || in_array(strtolower((string)($probe["state"]??"")),["removed","deleted"],true)){
                $t["listing_id"]="";
                $unlinked[]=&$t;
                continue;
              }
              $t["listing_id"]=$lid;
              $used[$lid]=true;
            }
            unset($t);

            $candidates=[];
            foreach($remote as $lid=>$r){
              if(isset($used[$lid]) || isset($linked_cross[$lid])) continue;
              if($looks_cross_stitch($r,$cross_titles)) continue;
              $local=$linked_by_listing[$lid]??null;
              if($local && (string)($local["technique"]??"")==="cross-stitch") continue;
              $priority=0;
              if($local) $priority+=100;
              if((string)($r["state"]??"")==="active") $priority+=10;
              $candidates[]=[
                "listing_id"=>$lid,
                "title"=>(string)($r["title"]??""),
                "state"=>(string)($r["state"]??""),
                "taxonomy_id"=>(int)($r["taxonomy_id"]??0),
                "priority"=>$priority,
                "old_product_id"=>$local?(int)$local["product_id"]:0,
                "old_sku"=>$local?(string)$local["sku"]:""
              ];
            }
            usort($candidates,function($a,$b){
              if($a["priority"]!==$b["priority"]) return $b["priority"]<=>$a["priority"];
              return ((int)$a["listing_id"])<=>((int)$b["listing_id"]);
            });

            $need=count($unlinked);
            echo "PREFLIGHT targets=".count($targets)." already_linked=".(count($targets)-$need)." need_reuse=".$need." reusable_non_cs=".count($candidates)." plugin_version=".(defined("Drielo_Etsy_Sync::VERSION")?Drielo_Etsy_Sync::VERSION:"unknown")."\n";
            if(count($candidates)<$need){
              fwrite(STDERR,"PREFLIGHT_FAIL insufficient reusable non-cross-stitch listings: need=".$need." available=".count($candidates)."\n");
              exit(8);
            }

            // Pair deterministic candidates with unlinked targets.
            $candidate_index=0;
            foreach($targets as &$t){
              if((string)$t["listing_id"]!=="") continue;
              $candidate=$candidates[$candidate_index++];
              $t["listing_id"]=(string)$candidate["listing_id"];
              $t["reused"]=true;
              $t["old_product_id"]=(int)$candidate["old_product_id"];
              $t["old_sku"]=(string)$candidate["old_sku"];
              $t["old_title"]=(string)$candidate["title"];
              $t["old_state"]=(string)$candidate["state"];
              $t["old_taxonomy"]=(int)$candidate["taxonomy_id"];
              $used[$t["listing_id"]]=true;
            }
            unset($t);

            // Re-verify every destination listing immediately before enabling writes.
            foreach($targets as $t){
              $lid=(string)$t["listing_id"];
              $probe=$request->invoke($sync,"GET","/v3/application/listings/".rawurlencode($lid),[],true);
              if(is_wp_error($probe)){
                fwrite(STDERR,"PREFLIGHT_FAIL unreadable listing=".$lid." sku=".$t["sku"]." error=".$probe->get_error_message()."\n");
                exit(9);
              }
              if(!empty($t["reused"])){
                if((string)($probe["title"]??"")!==(string)$t["old_title"] || (int)($probe["taxonomy_id"]??0)!==(int)$t["old_taxonomy"]){
                  fwrite(STDERR,"PREFLIGHT_FAIL candidate changed listing=".$lid." sku=".$t["sku"]."\n"); exit(10);
                }
                if($looks_cross_stitch($probe,$cross_titles)){
                  fwrite(STDERR,"PREFLIGHT_FAIL candidate now looks cross-stitch listing=".$lid."\n"); exit(11);
                }
              }
            }

            echo "PREFLIGHT_OK all targets/assets/listings verified; starting authorized overwrite\n";
            $manual->setValue($sync,true);

            $success=[];
            $failed=[];
            $total=count($targets);
            $position=0;
            foreach($targets as $t){
              $position++;
              $id=(int)$t["id"];
              $sku=(string)$t["sku"];
              $listing=(string)$t["listing_id"];
              $p=wc_get_product($id);
              if(!$p){$failed[]=["sku"=>$sku,"listing"=>$listing,"error"=>"product disappeared"];continue;}

              update_post_meta($id,"_drielo_etsy_auto_renew","no");
              update_post_meta($id,"_drielo_etsy_enabled","yes");
              update_post_meta($id,"_drielo_etsy_target_state","active");

              $done=false;
              $last_error="";
              for($attempt=1;$attempt<=3 && !$done;$attempt++){
                try{
                  $payload=$listing_payload->invoke($sync,$p,(int)$t["taxonomy"]);
                  $payload["should_auto_renew"]="false";
                  $payload["type"]="download";

                  $stage=$request->invoke(
                    $sync,
                    "PATCH",
                    "/v3/application/shops/".rawurlencode($shop)."/listings/".rawurlencode($listing),
                    $payload,
                    true
                  );
                  if(is_wp_error($stage)) throw new Exception("listing: ".$stage->get_error_message());

                  // Persist the reassignment after the listing itself has accepted the new product.
                  update_post_meta($id,"_drielo_etsy_listing_id",$listing);
                  update_post_meta($id,"_drielo_etsy_remote_state","active");
                  update_post_meta($id,"_drielo_etsy_taxonomy_id",(int)$t["taxonomy"]);

                  if(!empty($t["reused"]) && !empty($t["old_product_id"]) && (int)$t["old_product_id"]!==$id){
                    $old=(int)$t["old_product_id"];
                    delete_post_meta($old,"_drielo_etsy_listing_id");
                    delete_post_meta($old,"_drielo_etsy_remote_state");
                    delete_post_meta($old,"_drielo_etsy_asset_hash");
                    delete_post_meta($old,"_drielo_etsy_content_hash");
                    delete_post_meta($old,"_drielo_etsy_last_error");
                    delete_post_meta($old,"_drielo_etsy_last_warning");
                    delete_post_meta($old,"_drielo_etsy_shop_section_id");
                    update_post_meta($old,"_drielo_etsy_enabled","no");
                  }

                  $stage=$sync_inventory->invoke($sync,$p,$listing);
                  if(is_wp_error($stage)) throw new Exception("inventory: ".$stage->get_error_message());

                  $stage=$sync_images->invoke($sync,$p,$listing);
                  if(is_wp_error($stage)) throw new Exception("images: ".$stage->get_error_message());

                  $stage=$sync_downloads->invoke($sync,$p,$listing);
                  if(is_wp_error($stage)) throw new Exception("files: ".$stage->get_error_message());

                  $stage=$request->invoke(
                    $sync,
                    "PATCH",
                    "/v3/application/shops/".rawurlencode($shop)."/listings/".rawurlencode($listing),
                    ["state"=>"active","type"=>"download","should_auto_renew"=>"false"],
                    true
                  );
                  if(is_wp_error($stage)) throw new Exception("state: ".$stage->get_error_message());

                  $classification=$sync_classification->invoke($sync,$p,$listing);
                  if(is_wp_error($classification)) throw new Exception("classification: ".$classification->get_error_message());
                  $sync_section->invoke($sync,$p,$listing);

                  $verify=$request->invoke($sync,"GET","/v3/application/listings/".rawurlencode($listing),[],true);
                  $images=$request->invoke($sync,"GET","/v3/application/listings/".rawurlencode($listing)."/images",[],true);
                  $files=$request->invoke($sync,"GET","/v3/application/shops/".rawurlencode($shop)."/listings/".rawurlencode($listing)."/files",[],true);
                  if(is_wp_error($verify)) throw new Exception("verify listing: ".$verify->get_error_message());
                  if(is_wp_error($images)) throw new Exception("verify images: ".$images->get_error_message());
                  if(is_wp_error($files)) throw new Exception("verify files: ".$files->get_error_message());

                  $expected_payload=$listing_payload->invoke($sync,$p,(int)$t["taxonomy"]);
                  $expected_title=(string)($expected_payload["title"]??$p->get_name());
                  $image_count=count((array)($images["results"]??[]));
                  $file_count=count((array)($files["results"]??[]));
                  $renew=!empty($verify["should_auto_renew"]);
                  $remote_title=(string)($verify["title"]??"");
                  $remote_tax=(int)($verify["taxonomy_id"]??0);
                  $remote_state=(string)($verify["state"]??"");
                  $remote_type=(string)($verify["type"]??"");

                  if(
                    $remote_title!==$expected_title
                    || $remote_tax!==(int)$t["taxonomy"]
                    || $remote_state!=="active"
                    || $remote_type!=="download"
                    || $renew
                    || $image_count!==(int)$t["expected_images"]
                    || $file_count!==(int)$t["expected_files"]
                  ){
                    throw new Exception(
                      "verify mismatch title=".($remote_title===$expected_title?"ok":"bad").
                      " taxonomy=".$remote_tax.
                      " state=".$remote_state.
                      " type=".$remote_type.
                      " auto_renew=".($renew?"true":"false").
                      " images=".$image_count."/".$t["expected_images"].
                      " files=".$file_count."/".$t["expected_files"]
                    );
                  }

                  update_post_meta($id,"_drielo_etsy_remote_state","active");
                  update_post_meta($id,"_drielo_etsy_asset_hash",$asset_hash_m->invoke($sync,$p));
                  update_post_meta($id,"_drielo_etsy_content_hash",$content_hash_m->invoke($sync,$p));
                  update_post_meta($id,"_drielo_etsy_last_sync",current_time("mysql"));
                  delete_post_meta($id,"_drielo_etsy_last_error");
                  delete_post_meta($id,"_drielo_etsy_last_warning");

                  $done=true;
                  $success[]=[
                    "sku"=>$sku,
                    "listing_id"=>$listing,
                    "reused"=>!empty($t["reused"]),
                    "old_sku"=>(string)($t["old_sku"]??""),
                    "images"=>$image_count,
                    "files"=>$file_count
                  ];
                  echo "SYNC_OK ".$position."/".$total." sku=".$sku." listing=".$listing." reused=".(!empty($t["reused"])?"yes":"no")." images=".$image_count." files=".$file_count." auto_renew=false\n";
                }catch(Throwable $e){
                  $last_error=$e->getMessage();
                  echo "SYNC_RETRY ".$position."/".$total." sku=".$sku." attempt=".$attempt." error=".$last_error."\n";
                  if($attempt<3) sleep(3*$attempt);
                }
              }

              if(!$done){
                update_post_meta($id,"_drielo_etsy_last_error",$last_error);
                update_post_meta($id,"_drielo_etsy_last_sync",current_time("mysql"));
                $failed[]=["sku"=>$sku,"listing_id"=>$listing,"error"=>$last_error];
                echo "SYNC_FAILED ".$position."/".$total." sku=".$sku." listing=".$listing." error=".$last_error."\n";
              }
            }

            $manual->setValue($sync,false);
            echo "FINAL targets=".$total." success=".count($success)." failed=".count($failed)." auto_renew_false=".count($success)."\n";
            echo "FAILED_JSON=".wp_json_encode($failed,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
            if($failed || count($success)!==$total) exit(20);
          '
          REMOTE

name: TEMP Reset Florals Products

on:
  push:
    branches:
      - feature/florals-auto-publish
    paths:
      - '.github/workflows/tmp-reset-florals-products.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drielo-reset-florals-products
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_florals_reset_key
          chmod 600 ~/.ssh/drielo_florals_reset_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Delete managed Florals products and media from WooCommerce
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_florals_reset_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          "${DOCKER[@]}" exec make-wp php -d memory_limit=1024M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";
            global $wpdb;

            $ids=$wpdb->get_col(
              "SELECT DISTINCT p.ID
               FROM {$wpdb->posts} p
               JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID
               WHERE p.post_type=\"product\"
                 AND pm.meta_key=\"_sku\"
                 AND pm.meta_value LIKE \"DRIELO-F%\""
            );
            $deleted=0;
            foreach(array_map("intval",$ids) as $id){
              if("1" !== (string)get_post_meta($id,"_drielo_managed_product",true)){
                echo "SKIP unmanaged product_id=".$id.PHP_EOL;
                continue;
              }
              $p=wc_get_product($id);
              $sku=$p ? $p->get_sku() : "";
              wp_delete_post($id,true);
              echo "DELETED PRODUCT sku=".$sku." product_id=".$id.PHP_EOL;
              $deleted++;
            }

            $attachments=get_posts(array(
              "post_type"=>"attachment",
              "post_status"=>"inherit",
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "meta_query"=>array(array(
                "key"=>"_drielo_source_asset",
                "value"=>"assets/F",
                "compare"=>"LIKE"
              ))
            ));
            $media_deleted=0;
            foreach(array_map("intval",$attachments) as $aid){
              wp_delete_attachment($aid,true);
              $media_deleted++;
            }

            $term=get_term_by("slug","florals","product_collection");
            if($term instanceof WP_Term){
              clean_term_cache($term->term_id,"product_collection");
              $term=get_term($term->term_id,"product_collection");
              if($term instanceof WP_Term && 0 === (int)$term->count){
                wp_delete_term($term->term_id,"product_collection");
                echo "DELETED COLLECTION florals".PHP_EOL;
              }
            }

            $uploads=wp_upload_dir();
            $dir=trailingslashit($uploads["basedir"])."woocommerce_uploads/drielo";
            foreach(glob($dir."/Drielo_F*.pdf") ?: array() as $file){
              @unlink($file);
            }

            echo "RESET_RESULT products=".$deleted." media=".$media_deleted.PHP_EOL;
          '
          REMOTE

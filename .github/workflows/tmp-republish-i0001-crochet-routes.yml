name: TEMP republish I0001 crochet routes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-republish-i0001-crochet-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-i0001-crochet-routes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Validate canonical collection routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('.')
          system=root/'content'/'pattern-system'
          col=json.loads((system/'collections'/'baby-nursery'/'collection.json').read_text(encoding='utf-8'))
          assets=col['mockup_spec']['technique_assets']
          expected={
            'C2C':'collections/baby-nursery/assets/cover-c2c-crochet.jpg',
            'TC':'collections/baby-nursery/assets/cover-crochet.jpg',
          }
          for suffix,path in expected.items():
              if assets.get(suffix)!=path:
                  raise SystemExit(f'{suffix}: collection route {assets.get(suffix)} != {path}')
              prod=json.loads((system/'products'/f'I0001-{suffix}'/'product.json').read_text(encoding='utf-8'))
              if prod.get('page_1_asset')!=path:
                  raise SystemExit(f'I0001-{suffix}: product route {prod.get("page_1_asset")} != {path}')
              print(suffix,path)
          print('CROCHET_ROUTES_OK')
          PY

      - name: Regenerate only I0001 C2C and tapestry
        env:
          DRIELO_I0001_SUFFIXES: C2C,TC
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/baby_nursery/publish_i0001.py

      - name: Validate regenerated PDFs and images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('.')
          catalog=json.loads((root/'content/products/catalog.json').read_text(encoding='utf-8'))
          rows={p.get('code'):p for p in catalog.get('products',[])}
          expected={
            'I0001-C2C':'collections/baby-nursery/assets/cover-c2c-crochet.jpg',
            'I0001-TC':'collections/baby-nursery/assets/cover-crochet.jpg',
          }
          for code,cover in expected.items():
              pdf=root/'content/products/files'/f'Drielo_{code}.pdf'
              img=root/'content/products/assets'/f'{code}-product.webp'
              if not pdf.is_file() or pdf.stat().st_size<100000 or pdf.read_bytes()[:4]!=b'%PDF':
                  raise SystemExit(f'{code}: invalid PDF')
              if not img.is_file() or img.stat().st_size<50000:
                  raise SystemExit(f'{code}: invalid image')
              row=rows.get(code)
              if not row:
                  raise SystemExit(f'{code}: missing catalog row')
              if str(row.get('gallery_revision'))!='2026092407':
                  raise SystemExit(f'{code}: stale gallery revision {row.get("gallery_revision")}')
              print(code,'pdf',pdf.stat().st_size,'image',img.stat().st_size,'cover',cover)
          print('I0001_CROCHET_OUTPUTS_OK')
          PY

      - name: Build two-product WooCommerce package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/drielo-i0001-crochet
          mkdir -p /tmp/drielo-i0001-crochet/content/products/assets
          mkdir -p /tmp/drielo-i0001-crochet/content/products/files
          mkdir -p /tmp/drielo-i0001-crochet/content/tools

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('content/products/catalog.json').read_text(encoding='utf-8'))
          codes={'I0001-C2C','I0001-TC'}
          out=dict(d)
          out['products']=[p for p in d.get('products',[]) if p.get('code') in codes]
          Path('/tmp/drielo-i0001-crochet/content/products/catalog.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          if {p.get('code') for p in out['products']} != codes:
              raise SystemExit('Filtered catalog does not contain exactly C2C and TC')
          PY

          for code in I0001-C2C I0001-TC; do
            cp "content/products/assets/${code}-product.webp" /tmp/drielo-i0001-crochet/content/products/assets/
            cp "content/products/files/Drielo_${code}.pdf" /tmp/drielo-i0001-crochet/content/products/files/
          done
          cp content/tools/import-products.php /tmp/drielo-i0001-crochet/content/tools/
          tar -czf /tmp/drielo-i0001-crochet.tgz -C /tmp/drielo-i0001-crochet content

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/drielo_products_key /tmp/drielo-i0001-crochet.tgz "$VPS_USER@$VPS_HOST:/tmp/drielo-i0001-crochet-${GITHUB_RUN_ID}.tgz"

      - name: Import C2C and tapestry into WooCommerce
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-i0001-crochet-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-i0001-crochet-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $codes=array("DRIELO-I0001-C2C","DRIELO-I0001-TC");
            foreach ($codes as $sku) {
              $id=wc_get_product_id_by_sku($sku);
              $p=$id ? wc_get_product($id) : false;
              if (!$p) { fwrite(STDERR,"Missing ".$sku.PHP_EOL); exit(2); }
              $cols=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
              echo $sku." id=".$id." status=".$p->get_status()." image=".$p->get_image_id()." downloads=".count($p->get_downloads())." collection=".implode(",",is_wp_error($cols)?array():$cols)." url=".get_permalink($id).PHP_EOL;
              if ($p->get_status()!=="publish" || !$p->get_image_id() || count($p->get_downloads())<1 || !in_array("baby-nursery",is_wp_error($cols)?array():$cols,true)) {
                fwrite(STDERR,"Incomplete ".$sku.PHP_EOL); exit(3);
              }
            }
          '
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Persist regenerated catalog and images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             content/products/catalog.json             content/products/assets/I0001-C2C-product.webp             content/products/assets/I0001-TC-product.webp
          if git diff --cached --quiet; then
            echo "No generated repository changes."
          else
            git commit -m "Republish I0001 C2C and tapestry covers [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Archive regenerated PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baby-nursery-I0001-c2c-tapestry-pdfs
          path: |
            content/products/files/Drielo_I0001-C2C.pdf
            content/products/files/Drielo_I0001-TC.pdf
          retention-days: 30

name: Rebuild Iconic batch 01 photoreal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/generate_iconic_batch01_photoreal.py'
      - '.github/workflows/rebuild-iconic-batch01-photoreal.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: drielo-iconic-destinations-auto-publish
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Build photoreal 100x120 sources
        run: python3 .github/scripts/generate_iconic_batch01_photoreal.py

      - name: Validate photographic source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          from PIL import Image
          root=Path('content/pattern-system')
          col=root/'collections'/'iconic-destinations'
          zip_path=col/'assets'/'iconic-batch-01-clean-q50.zip'
          manifest=json.loads((col/'assets'/'iconic-batch-01-photoreal-sources.json').read_text())
          queue=json.loads((root/'iconic_destinations'/'publish_queue.json').read_text())
          pending=[x for x in queue['items'] if x.get('status')=='pending']
          if len(pending)!=10:
              raise SystemExit(f'Expected 10 photoreal pending items, got {len(pending)}')
          if len(manifest)!=10 or any(x.get('license')!='CC0 1.0' for x in manifest):
              raise SystemExit('Photographic source manifest is invalid')
          with zipfile.ZipFile(zip_path,'r') as zf:
              if len(zf.namelist())!=10:
                  raise SystemExit('ZIP must contain 10 PNGs')
              for row in pending:
                  member=row['source_zip_member']
                  raw=zf.read(member)
                  src=root/row['input_png']
                  if raw!=src.read_bytes():
                      raise SystemExit(f"{row['base_design_id']}: ZIP/input byte mismatch")
                  with Image.open(src) as im:
                      rgb=im.convert('RGB')
                      colours=len(set(rgb.getdata()))
                      if rgb.size!=(100,120):
                          raise SystemExit(f"{row['base_design_id']}: wrong dimensions {rgb.size}")
                      if not (45<=colours<=50):
                          raise SystemExit(f"{row['base_design_id']}: wrong colour count {colours}")
          print('PHOTOREAL_BATCH01_VALID count=10 grid=100x120 palette=45..50')
          PY

      - name: Persist regenerated sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             content/pattern-system/collections/iconic-destinations/assets/iconic-batch-01-clean-q50.zip             content/pattern-system/collections/iconic-destinations/assets/iconic-batch-01-photoreal-sources.json             content/pattern-system/collections/iconic-destinations/input-pngs-q50             content/pattern-system/collections/iconic-destinations/designs.json             content/pattern-system/iconic_destinations/publish_queue.json
          git commit -m "Replace Iconic batch 01 with photoreal sources [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start republishing batch 01
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/iconic-destinations-auto-publish.yml/dispatches"             -f ref=main
          echo "PHOTOREAL_ICONIC_BATCH01_REPUBLISH_STARTED"

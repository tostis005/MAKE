name: Probe Global Etsy Import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-global-etsy-import.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_probe_key
          chmod 600 ~/.ssh/drielo_probe_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Read current Etsy batch
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_probe_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $run=get_option("drielo_etsy_sync_run",array());
            $batch=(string)($run["id"]??"");
            $ids=array_values(array_filter(array_map("absint",(array)($run["product_ids"]??array()))));
            $counts=array("queued"=>0,"running"=>0,"success"=>0,"failed"=>0,"skipped"=>0,"other"=>0);
            $linked=0;
            foreach($ids as $id){
              $bid=(string)get_post_meta($id,"_drielo_etsy_batch_id",true);
              $state=(string)get_post_meta($id,"_drielo_etsy_batch_state",true);
              if(!$bid||!hash_equals($batch,$bid)){$counts["other"]++;continue;}
              if(isset($counts[$state]))$counts[$state]++;else $counts["other"]++;
              if(absint(get_post_meta($id,"_drielo_etsy_listing_id",true))) $linked++;
            }
            $pending=0;
            if(function_exists("as_get_scheduled_actions")){
              $pending=count(as_get_scheduled_actions(array(
                "hook"=>"drielo_etsy_sync_product_async",
                "group"=>"drielo-etsy",
                "status"=>"pending",
                "per_page"=>500
              ),"ids"));
            }
            echo "BATCH=".$batch.PHP_EOL;
            echo "TOTAL=".count($ids).PHP_EOL;
            echo "COUNTS=".wp_json_encode($counts).PHP_EOL;
            echo "LINKED_NOW=".$linked.PHP_EOL;
            echo "AS_PENDING=".$pending.PHP_EOL;
          '
          REMOTE

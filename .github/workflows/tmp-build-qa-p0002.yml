name: Build QA P0002 multitech
on:
  push:
    branches: [bulk-multitech-p0002-p0020]
    paths: ['.github/workflows/tmp-build-qa-p0002.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install renderer
        run: |
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Build P0002 four techniques
        run: python content/pattern-system/multitech/bulk_generate.py --start 2 --end 2 --workers 2
      - name: Render QA page
        run: |
          mkdir -p content/pattern-system/multitech/qa
          pdftoppm -f 2 -l 2 -singlefile -png -r 130 content/products/files/Drielo_P0002-CS.pdf content/pattern-system/multitech/qa/P0002-CS-page2
      - name: Commit P0002 sources and product images for QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/products/catalog.json content/products/assets/P0002-*-product.webp content/pattern-system/products/P0002-* content/pattern-system/patterns/P0002-* content/pattern-system/multitech/qa/P0002-CS-page2.png
          git commit -m "Generate P0002 multitech sources and QA [skip ci]"
          git push origin HEAD:bulk-multitech-p0002-p0020
      - uses: actions/upload-artifact@v4
        with:
          name: P0002-multitech-pdfs
          path: content/products/files/Drielo_P0002-*.pdf
          retention-days: 7

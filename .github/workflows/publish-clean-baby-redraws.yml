name: Publish Clean Baby Nursery Redraws

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-clean-baby-redraws.yml'

permissions:
  contents: write

concurrency:
  group: drielo-baby-clean-redraws
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout required paths
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/publish-clean-baby-redraws.yml
            content/pattern-system/baby_nursery/
            content/pattern-system/multitech/
            content/pattern-system/collections/baby-nursery/collection.json
            content/pattern-system/collections/baby-nursery/designs.json
            content/pattern-system/collections/baby-nursery/assets/
            content/pattern-system/collections/baby-nursery/mapped-designs/I0021-whale-dmc.png
            content/pattern-system/collections/baby-nursery/mapped-designs/I0026-long-neck-dinosaur-dmc.png
            content/pattern-system/collections/baby-nursery/mapped-designs/I0027-triceratops-dmc.png
            content/pattern-system/collections/baby-nursery/mapped-designs/I0029-stegosaurus-dmc.png
            content/pattern-system/collections/baby-nursery/mapped-designs/I0043-rainbow-clouds-dmc.png
            content/pattern-system/patterns/I0021-CS/
            content/pattern-system/patterns/I0026-CS/
            content/pattern-system/patterns/I0027-CS/
            content/pattern-system/patterns/I0029-CS/
            content/pattern-system/patterns/I0043-CS/
            content/pattern-system/products/I0021-CS/
            content/pattern-system/products/I0026-CS/
            content/pattern-system/products/I0027-CS/
            content/pattern-system/products/I0029-CS/
            content/pattern-system/products/I0043-CS/
            content/source-images/collections/baby-nursery/
            content/products/catalog.json
            content/products/assets/baby-nursery-collection-cover-v2.jpg
            content/products/assets/I0021-CS-*
            content/products/assets/I0026-CS-*
            content/products/assets/I0027-CS-*
            content/products/assets/I0029-CS-*
            content/products/assets/I0043-CS-*
            content/products/files/Drielo_I0021-CS.pdf
            content/products/files/Drielo_I0026-CS.pdf
            content/products/files/Drielo_I0027-CS.pdf
            content/products/files/Drielo_I0029-CS.pdf
            content/products/files/Drielo_I0043-CS.pdf
            content/tools/import-products.php

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Generate clean source PNGs from scratch
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/baby_nursery/regenerate_clean_artwork.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          report=json.loads(Path("content/pattern-system/collections/baby-nursery/clean-redraw-2026-09-28.json").read_text())
          for row in report["targets"]:
              m=row["margins"]
              if min(m.values())<10:
                  raise SystemExit(f"{row['id']}: unsafe margins {m}")
              p=Path("content/source-images/collections/baby-nursery/products")/row["file"]
              with Image.open(p) as im:
                  if im.size!=(100,120): raise SystemExit(f"{row['id']}: wrong source size")
                  if im.mode!="RGBA": raise SystemExit(f"{row['id']}: wrong mode")
              print("CLEAN_SOURCE_VALID",row["id"],m)
          PY

      - name: Commit clean source PNGs before downstream generation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse             content/source-images/collections/baby-nursery/products/I0021-whale.png             content/source-images/collections/baby-nursery/products/I0026-long-neck-dinosaur.png             content/source-images/collections/baby-nursery/products/I0027-triceratops.png             content/source-images/collections/baby-nursery/products/I0029-stegosaurus.png             content/source-images/collections/baby-nursery/products/I0043-rainbow-clouds.png             content/source-images/collections/baby-nursery/source-manifest.json             content/source-images/collections/baby-nursery/qa_report.json             content/pattern-system/collections/baby-nursery/designs.json             content/pattern-system/collections/baby-nursery/clean-redraw-2026-09-28.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace five Baby Nursery artworks with clean redraws [skip ci]"
            git push origin HEAD:main
          fi

      - name: Regenerate patterns, product images and PDFs
        env:
          DRIELO_GALLERY_REVISION: clean-redraw-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cp content/products/catalog.json /tmp/catalog-before-clean-redraw.json
          rm -rf /tmp/baby-clean-rows && mkdir -p /tmp/baby-clean-rows
          for id in I0021 I0026 I0027 I0029 I0043; do
            echo "Generating $id from clean source"
            python3 content/pattern-system/baby_nursery/publish_cs_exact_dmc.py "$id"
            python3 -c 'import json,sys; from pathlib import Path; base=sys.argv[1]; code=f"{base}-CS"; c=json.loads(Path("content/products/catalog.json").read_text(encoding="utf-8")); row=next((p for p in c.get("products",[]) if p.get("code")==code),None); row is not None or (_ for _ in ()).throw(SystemExit("missing "+code)); Path(f"/tmp/baby-clean-rows/{base}.json").write_text(json.dumps(row,ensure_ascii=False,indent=2),encoding="utf-8")' "$id"
          done

      - name: Validate regenerated bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          ids=("I0021","I0026","I0027","I0029","I0043")
          for base in ids:
              code=f"{base}-CS"
              pat=json.loads((Path("content/pattern-system/patterns")/code/"pattern.json").read_text())
              if (pat.get("stitch_width"),pat.get("stitch_height"))!=(100,120):
                  raise SystemExit(f"{code}: wrong grid")
              hero=Path("content/products/assets")/f"{code}-product.webp"
              with Image.open(hero) as im:
                  if im.size!=(1536,1536): raise SystemExit(f"{code}: wrong hero {im.size}")
              for n in (2,3,4):
                  g=Path("content/products/assets")/f"{code}-gallery-{n}.webp"
                  if not g.is_file() or g.stat().st_size<10000: raise SystemExit(f"{code}: bad gallery {n}")
              pdf=Path("content/products/files")/f"Drielo_{code}.pdf"
              if not pdf.is_file() or pdf.stat().st_size<100000: raise SystemExit(f"{code}: bad PDF")
              print("CLEAN_BUNDLE_VALID",code)
          PY

      - name: Build five-product WooCommerce package
        env:
          REVISION: clean-redraw-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE="/tmp/drielo-baby-clean-redraw"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"
          python3 - "$STAGE" <<'PY'
          import json,os,sys
          from pathlib import Path
          stage=Path(sys.argv[1])
          ids=("I0021","I0026","I0027","I0029","I0043")
          rows=[json.loads((Path("/tmp/baby-clean-rows")/f"{x}.json").read_text()) for x in ids]
          base=json.loads(Path("/tmp/catalog-before-clean-redraw.json").read_text())
          rev=os.environ["REVISION"]
          for p in rows: p["gallery_revision"]=rev
          coll=next(c for c in base.get("collections",[]) if c.get("slug")=="baby-nursery")
          cats=[c for c in base.get("categories",[]) if c.get("slug") in {"cross-stitch-patterns","cross-stitch-baby-nursery"}]
          out=dict(base); out["products"]=rows; out["collections"]=[coll]; out["categories"]=cats; out["retired_products"]=[]; out["retired_collections"]=[]
          (stage/"content/products/catalog.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          PY
          for base in I0021 I0026 I0027 I0029 I0043; do
            code="${base}-CS"
            cp "content/products/assets/${code}-product.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-2.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-3.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-4.webp" "$STAGE/content/products/assets/"
            cp "content/products/files/Drielo_${code}.pdf" "$STAGE/content/products/files/"
          done
          cp content/products/assets/baby-nursery-collection-cover-v2.jpg "$STAGE/content/products/assets/"
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf /tmp/drielo-baby-clean-redraw.tgz -C "$STAGE" content

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_clean_key
          chmod 600 ~/.ssh/drielo_clean_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/drielo_clean_key /tmp/drielo-baby-clean-redraw.tgz "$VPS_USER@$VPS_HOST:/tmp/drielo-baby-clean-redraw-${GITHUB_RUN_ID}.tgz"

      - name: Update five existing products and force new image URLs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_clean_key "$VPS_USER@$VPS_HOST" "RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-baby-clean-redraw-${RUN_ID}.tgz"
          HOST_STAGE="/tmp/drielo-baby-clean-redraw-${RUN_ID}"
          CONTAINER_STAGE="/tmp/drielo-products-clean-${RUN_ID}"
          IMPORTER="/tmp/drielo-import-clean-${RUN_ID}.php"
          rm -rf "$HOST_STAGE"; mkdir -p "$HOST_STAGE"; tar -xzf "$ARCHIVE" -C "$HOST_STAGE"
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi

          PRE_JSON=$("${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $o=array(); foreach(array("I0021","I0026","I0027","I0029","I0043") as $b){$o[$b]=(int)wc_get_product_id_by_sku("DRIELO-".$b."-CS");}
            echo json_encode($o);
          ')
          echo "PRE_IDS=$PRE_JSON"

          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$CONTAINER_STAGE' '$IMPORTER' && mkdir -p '$CONTAINER_STAGE'"
          "${DOCKER[@]}" cp "$HOST_STAGE/content/products/." "make-wp:$CONTAINER_STAGE"
          "${DOCKER[@]}" cp "$HOST_STAGE/content/tools/import-products.php" "make-wp:$IMPORTER"
          "${DOCKER[@]}" exec make-wp php -d memory_limit=1024M "$IMPORTER" /var/www/html "$CONTAINER_STAGE"

          "${DOCKER[@]}" exec -e RUN_ID="$RUN_ID" -e PRE_JSON="$PRE_JSON" make-wp php -d memory_limit=1024M -r '
            require "/var/www/html/wp-load.php";
            require_once ABSPATH."wp-admin/includes/file.php";
            require_once ABSPATH."wp-admin/includes/image.php";
            require_once ABSPATH."wp-admin/includes/media.php";
            $run=preg_replace("/[^0-9A-Za-z_-]/","",getenv("RUN_ID"));
            $pre=json_decode(getenv("PRE_JSON"),true);
            $bases=array("I0021","I0026","I0027","I0029","I0043");

            function clean_media($src,$key,$title,$run){
              if(!is_file($src)){throw new RuntimeException("missing ".$src);}
              $stem=pathinfo(basename($key),PATHINFO_FILENAME); $ext=pathinfo(basename($key),PATHINFO_EXTENSION);
              $filename=$stem."-redraw".$run.".".$ext;
              $bits=wp_upload_bits($filename,null,(string)file_get_contents($src));
              if(!empty($bits["error"])){throw new RuntimeException($bits["error"]);}
              $type=wp_check_filetype($filename,null);
              $id=wp_insert_attachment(array("post_mime_type"=>$type["type"]?:"image/webp","post_title"=>$title,"post_status"=>"inherit"),$bits["file"]);
              if(is_wp_error($id)){throw new RuntimeException($id->get_error_message());}
              $meta=wp_generate_attachment_metadata($id,$bits["file"]); if(is_array($meta)){wp_update_attachment_metadata($id,$meta);}
              update_post_meta($id,"_drielo_source_asset",$key);
              update_post_meta($id,"_drielo_source_hash",md5_file($src)?:"");
              update_post_meta($id,"_drielo_source_revision","clean-redraw-".$run);
              return (int)$id;
            }

            foreach($bases as $base){
              $sku="DRIELO-".$base."-CS"; $pid=(int)wc_get_product_id_by_sku($sku);
              if($pid!==(int)$pre[$base]){throw new RuntimeException("ID changed ".$sku);}
              $p=wc_get_product($pid); if(!$p){throw new RuntimeException("missing product ".$sku);}
              $old=array_merge(array((int)$p->get_image_id()),array_map("intval",$p->get_gallery_image_ids()));
              $root="/tmp/drielo-products-clean-".$run."/assets/";
              $hero=clean_media($root.$base."-CS-product.webp","assets/".$base."-CS-product.webp",$p->get_name()." clean redraw featured",$run);
              $gallery=array();
              foreach(array(2,3,4) as $n){$gallery[]=clean_media($root.$base."-CS-gallery-".$n.".webp","assets/".$base."-CS-gallery-".$n.".webp",$p->get_name()." clean redraw gallery ".$n,$run);}
              $p->set_image_id($hero); $p->set_gallery_image_ids($gallery); $p->save();
              foreach($old as $oid){if($oid>0){delete_post_meta($oid,"_drielo_source_asset");delete_post_meta($oid,"_drielo_source_hash");delete_post_meta($oid,"_drielo_source_revision");}}
              $url=wp_get_attachment_url($hero);
              if(strpos((string)$url,"-redraw".$run.".webp")===false){throw new RuntimeException("bad redraw URL ".$sku);}
              echo "UPDATED_REDRAW ".$sku." product_id=".$pid." hero=".$hero." url=".$url.PHP_EOL;
            }
            wp_cache_flush();
            $ids=get_posts(array("post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids","tax_query"=>array(array("taxonomy"=>"product_collection","field"=>"slug","terms"=>array("baby-nursery")))));
            echo "BABY_PUBLISHED_COUNT=".count($ids).PHP_EOL;
            if(count($ids)!==60){throw new RuntimeException("Expected 60 Baby Nursery products");}
          '

          "${DOCKER[@]}" exec make-wp sh -lc 'if [ -d /var/www/html/wp-content/cache ]; then find /var/www/html/wp-content/cache -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true; fi'
          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$CONTAINER_STAGE' '$IMPORTER'"
          rm -rf "$ARCHIVE" "$HOST_STAGE"
          REMOTE

      - name: Verify public hero bytes
        shell: bash
        run: |
          set -euo pipefail
          for base in I0021 I0026 I0027 I0029 I0043; do
            public="https://drielo.com/wp-content/uploads/2026/09/${base}-CS-product-redraw${GITHUB_RUN_ID}.webp"
            curl -fL --retry 5 --retry-delay 2 -H 'Cache-Control: no-cache' "$public" -o "/tmp/${base}-public.webp"
            local_hash=$(sha256sum "content/products/assets/${base}-CS-product.webp" | awk '{print $1}')
            live_hash=$(sha256sum "/tmp/${base}-public.webp" | awk '{print $1}')
            echo "${base} local=${local_hash} live=${live_hash}"
            [ "$local_hash" = "$live_hash" ] || exit 2
          done

      - name: Commit generated pattern and product assets
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/catalog-before-clean-redraw.json content/products/catalog.json
          for base in I0021 I0026 I0027 I0029 I0043; do
            git restore "content/products/files/Drielo_${base}-CS.pdf" 2>/dev/null || true
          done
          git add --sparse             content/pattern-system/collections/baby-nursery/mapped-designs/I0021-whale-dmc.png             content/pattern-system/collections/baby-nursery/mapped-designs/I0026-long-neck-dinosaur-dmc.png             content/pattern-system/collections/baby-nursery/mapped-designs/I0027-triceratops-dmc.png             content/pattern-system/collections/baby-nursery/mapped-designs/I0029-stegosaurus-dmc.png             content/pattern-system/collections/baby-nursery/mapped-designs/I0043-rainbow-clouds-dmc.png
          for base in I0021 I0026 I0027 I0029 I0043; do
            code="${base}-CS"
            git add --sparse               "content/pattern-system/patterns/${code}/pattern.json"               "content/pattern-system/products/${code}/product.json"               "content/products/assets/${code}-product.webp"               "content/products/assets/${code}-gallery-2.webp"               "content/products/assets/${code}-gallery-3.webp"               "content/products/assets/${code}-gallery-4.webp"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate products from clean Baby Nursery redraws [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

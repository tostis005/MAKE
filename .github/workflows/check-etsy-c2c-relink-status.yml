name: Check Etsy C2C relink status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-etsy-c2c-relink-status.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_etsy_status_key
          chmod 600 ~/.ssh/drielo_etsy_status_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Read local C2C Etsy links
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: "55"
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(ssh -i ~/.ssh/drielo_etsy_status_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          "${DOCKER[@]}" exec make-wp php -r '
            require "/var/www/html/wp-load.php";
            $ids=get_posts(array("post_type"=>"product","post_status"=>array("publish","draft","private","pending"),"posts_per_page"=>-1,"fields"=>"ids"));
            $rows=array();
            foreach($ids as $id){
              $p=wc_get_product($id); if(!$p) continue;
              $sku=(string)$p->get_sku();
              if(!preg_match("/^DRIELO-P\\d{4}-C2C$/",$sku)) continue;
              $terms=taxonomy_exists("product_collection")?wp_get_post_terms($id,"product_collection",array("fields"=>"slugs")):array();
              if(is_wp_error($terms)||!in_array("pop-art-25",(array)$terms,true)) continue;
              $rows[]=array("sku"=>$sku,"listing_id"=>(string)get_post_meta($id,"_drielo_etsy_listing_id",true),"last_sync"=>(string)get_post_meta($id,"_drielo_etsy_last_sync",true),"last_error"=>(string)get_post_meta($id,"_drielo_etsy_last_error",true));
            }
            usort($rows,static fn($a,$b)=>strcmp($a["sku"],$b["sku"]));
            $linked=array_values(array_filter($rows,static fn($r)=>$r["listing_id"]!==""));
            $pending=array_values(array_filter($rows,static fn($r)=>$r["listing_id"]===""));
            echo "LINKED_COUNT=".count($linked).PHP_EOL;
            echo "PENDING_COUNT=".count($pending).PHP_EOL;
            echo "LINKED=".wp_json_encode($linked,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            echo "PENDING=".wp_json_encode($pending,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
          '
          REMOTE
          )
          BODY=$(printf '### Etsy Pop Art C2C local status\n\n```text\n%s\n```\n' "$OUT")
          PAYLOAD=$(jq -n --arg body "$BODY" '{body:$body}')
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -d "$PAYLOAD" >/dev/null

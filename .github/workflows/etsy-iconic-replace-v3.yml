name: Etsy Iconic replacement parallel v3
# live-observe-probe: 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etsy-iconic-replace-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/etsy_v3_key
          chmod 600 ~/.ssh/etsy_v3_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Build and persist validated one-to-one plan
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -i ~/.ssh/etsy_v3_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          "${DOCKER[@]}" exec make-wp php -d memory_limit=1536M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";
            if(!class_exists("Drielo_Etsy_Sync")){fwrite(STDERR,"ERROR plugin unavailable\n");exit(2);}
            $sync=Drielo_Etsy_Sync::instance();
            $ref=new ReflectionClass($sync);
            $meth=function($n)use($ref,$sync){$m=$ref->getMethod($n);$m->setAccessible(true);return [$m,$sync];};
            [$settings_m,$o]=$meth("settings");
            [$request,$o]=$meth("etsy_request");
            [$resolve,$o]=$meth("resolve_taxonomy_id");
            [$tech,$o]=$meth("product_technique");
            $settings=$settings_m->invoke($sync);
            $shop=(string)($settings["shop_id"]??"");
            if($shop===""){fwrite(STDERR,"ERROR missing shop id\n");exit(3);}

            $norm=static function($s){
              $s=strtolower(remove_accents(trim((string)$s)));
              $s=preg_replace("/[^a-z0-9]+/"," ",$s);
              return trim(preg_replace("/\\s+/"," ",(string)$s));
            };

            $ids=get_posts([
              "post_type"=>"product",
              "post_status"=>["publish","draft","private","pending"],
              "posts_per_page"=>-1,
              "fields"=>"ids"
            ]);
            $cross_titles=[];$linked=[];$linked_cross=[];$targets=[];
            foreach($ids as $id){
              $p=wc_get_product($id); if(!$p) continue;
              $sku=(string)$p->get_sku();
              $t=(string)$tech->invoke($sync,$p);
              if($t==="" && preg_match("/-CS$/",$sku)) $t="cross-stitch";
              $lid=(string)get_post_meta($id,"_drielo_etsy_listing_id",true);
              if($lid!==""){
                $linked[$lid]=["product_id"=>(int)$id,"sku"=>$sku,"technique"=>$t];
                if($t==="cross-stitch") $linked_cross[$lid]=true;
              }
              if($t==="cross-stitch"){
                foreach([$p->get_name(),get_post_meta($id,"_drielo_etsy_title_en",true),get_post_meta($id,"_drielo_etsy_title_es",true),get_post_meta($id,"_drielo_title_en",true),get_post_meta($id,"_drielo_title_es",true)] as $title){
                  $n=$norm($title); if($n!=="") $cross_titles[$n]=true;
                }
              }
              $terms=taxonomy_exists("product_collection")?wp_get_post_terms($id,"product_collection",["fields"=>"slugs"]):[];
              if(is_wp_error($terms)||!in_array("iconic-destinations",(array)$terms,true)) continue;
              if(!preg_match("/^DRIELO-D\\d{4}-CS$/",$sku)) continue;
              $imgs=array_values(array_filter(array_unique(array_merge([$p->get_image_id()],$p->get_gallery_image_ids()))));
              $downloads=$p->get_downloads();
              if(!$imgs||!$downloads){fwrite(STDERR,"PREFLIGHT_FAIL assets ".$sku."\n");exit(4);}
              $tax=(int)$resolve->invoke($sync,$p);
              if($tax!==87){fwrite(STDERR,"PREFLIGHT_FAIL taxonomy ".$sku."=".$tax."\n");exit(5);}
              $targets[]=[
                "index"=>0,"product_id"=>(int)$id,"sku"=>$sku,"listing_id"=>$lid,
                "taxonomy_id"=>$tax,"expected_images"=>min(20,count($imgs)),
                "expected_files"=>min(5,count($downloads)),
                "old_product_id"=>0,"old_sku"=>"","reused"=>false
              ];
            }
            usort($targets,fn($a,$b)=>strcmp($a["sku"],$b["sku"]));
            foreach($targets as $i=>&$t){$t["index"]=$i;} unset($t);
            if(count($targets)!==100){fwrite(STDERR,"PREFLIGHT_FAIL expected 100 targets, got ".count($targets)."\n");exit(6);}

            $looks_cs=static function($r)use($norm,$cross_titles){
              $title=$norm($r["title"]??"");
              return (int)($r["taxonomy_id"]??0)===87 || str_contains($title,"cross stitch") || str_contains($title,"punto de cruz") || isset($cross_titles[$title]);
            };

            $remote=[];
            foreach(["active","inactive"] as $state){
              for($offset=0;$offset<3000;$offset+=100){
                $res=$request->invoke($sync,"GET","/v3/application/shops/".rawurlencode($shop)."/listings?state=".$state."&limit=100&offset=".$offset,[],true);
                if(is_wp_error($res)){fwrite(STDERR,"PREFLIGHT_FAIL remote list ".$res->get_error_message()."\n");exit(7);}
                $rows=(array)($res["results"]??[]);
                foreach($rows as $r){$lid=(string)($r["listing_id"]??"");if($lid!=="")$remote[$lid]=$r;}
                if(count($rows)<100)break;
              }
            }

            $used=[];$need=[];
            foreach($targets as &$t){
              $lid=(string)$t["listing_id"];
              if($lid!==""){
                $probe=$request->invoke($sync,"GET","/v3/application/listings/".rawurlencode($lid),[],true);
                if(!is_wp_error($probe)&&!in_array(strtolower((string)($probe["state"]??"")),["removed","deleted"],true)){
                  $used[$lid]=true;
                  continue;
                }
                $t["listing_id"]="";
              }
              $need[]=$t["index"];
            }
            unset($t);

            $cand=[];
            foreach($remote as $lid=>$r){
              if(isset($used[$lid])||isset($linked_cross[$lid])||$looks_cs($r))continue;
              $local=$linked[$lid]??null;
              if($local && (string)($local["technique"]??"")==="cross-stitch")continue;
              $priority=($local?100:0)+(((string)($r["state"]??"")==="active")?10:0);
              $cand[]=[
                "listing_id"=>$lid,"title"=>(string)($r["title"]??""),
                "taxonomy_id"=>(int)($r["taxonomy_id"]??0),
                "state"=>(string)($r["state"]??""),"priority"=>$priority,
                "old_product_id"=>$local?(int)$local["product_id"]:0,
                "old_sku"=>$local?(string)$local["sku"]:""
              ];
            }
            usort($cand,function($a,$b){return $a["priority"]===$b["priority"]?(((int)$a["listing_id"])<=>((int)$b["listing_id"])):($b["priority"]<=>$a["priority"]);});
            if(count($cand)<count($need)){fwrite(STDERR,"PREFLIGHT_FAIL need ".count($need)." candidates, have ".count($cand)."\n");exit(8);}

            echo "LIVE_LINK_STATE targets=".count($targets)." linked=".(count($targets)-count($need))." need=".count($need)." candidates=".count($cand)."\\n";

            $candidate_cursor=0;
            foreach($need as $idx){
              $assigned=false;
              while($candidate_cursor<count($cand)){
                $c=$cand[$candidate_cursor++];
                $probe=$request->invoke($sync,"GET","/v3/application/listings/".rawurlencode((string)$c["listing_id"]),[],true);
                if(is_wp_error($probe)) continue;
                $state=strtolower((string)($probe["state"]??""));
                if(!in_array($state,["active","inactive"],true) || $looks_cs($probe)) continue;
                $targets[$idx]["listing_id"]=(string)$c["listing_id"];
                $targets[$idx]["reused"]=true;
                $targets[$idx]["old_product_id"]=(int)$c["old_product_id"];
                $targets[$idx]["old_sku"]=(string)$c["old_sku"];
                $targets[$idx]["candidate_title"]=(string)($probe["title"]??"");
                $targets[$idx]["candidate_taxonomy"]=(int)($probe["taxonomy_id"]??0);
                $assigned=true;
                break;
              }
              if(!$assigned){
                fwrite(STDERR,"PREFLIGHT_FAIL exhausted verified non-cross-stitch candidates at target ".$targets[$idx]["sku"]."\n");
                exit(8);
              }
            }

            // Last read-only recheck before any Etsy write can happen in the matrix.
            foreach($targets as $t){
              $lid=(string)$t["listing_id"];
              $probe=$request->invoke($sync,"GET","/v3/application/listings/".rawurlencode($lid),[],true);
              if(is_wp_error($probe)){fwrite(STDERR,"PREFLIGHT_FAIL unreadable ".$lid." ".$t["sku"]."\n");exit(9);}
              if(!empty($t["reused"])){
                if($looks_cs($probe)){
                  fwrite(STDERR,"PREFLIGHT_FAIL candidate is cross-stitch ".$lid."\n");exit(10);
                }
              }
              update_post_meta((int)$t["product_id"],"_drielo_etsy_auto_renew","no");
              update_post_meta((int)$t["product_id"],"_drielo_etsy_enabled","yes");
              update_post_meta((int)$t["product_id"],"_drielo_etsy_target_state","active");
              delete_post_meta((int)$t["product_id"],"_drielo_etsy_v3_status");
            }

            update_option("drielo_etsy_iconic_v3_plan",$targets,false);
            echo "PLAN_OK targets=".count($targets)." already_linked=".(count($targets)-count($need))." reused_needed=".count($need)." reusable_available=".count($cand)." shards=4\n";
          '
          REMOTE

  sync:
    if: ${{ false }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/etsy_v3_key
          chmod 600 ~/.ssh/etsy_v3_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Sync shard
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/etsy_v3_key "$VPS_USER@$VPS_HOST" "SHARD='$SHARD' bash -s" <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          "${DOCKER[@]}" exec -e SHARD="$SHARD" make-wp php -d memory_limit=1536M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";
            $shard=(int)getenv("SHARD");
            $plan=get_option("drielo_etsy_iconic_v3_plan",[]);
            if(!is_array($plan)||count($plan)!==100){fwrite(STDERR,"ERROR invalid plan\n");exit(2);}
            if(!class_exists("Drielo_Etsy_Sync")){fwrite(STDERR,"ERROR plugin unavailable\n");exit(3);}
            $sync=Drielo_Etsy_Sync::instance();
            $ref=new ReflectionClass($sync);
            $meth=function($n)use($ref,$sync){$m=$ref->getMethod($n);$m->setAccessible(true);return [$m,$sync];};
            [$settings_m,$o]=$meth("settings");[$request,$o]=$meth("etsy_request");[$payload_m,$o]=$meth("listing_payload");
            [$inventory_m,$o]=$meth("sync_inventory");[$images_m,$o]=$meth("sync_images");[$files_m,$o]=$meth("sync_downloads");
            [$class_m,$o]=$meth("sync_technique_classification");[$section_m,$o]=$meth("sync_shop_section");
            [$asset_hash_m,$o]=$meth("product_asset_hash");[$content_hash_m,$o]=$meth("product_content_hash");
            $manual=$ref->getProperty("manual_sync_context");$manual->setAccessible(true);$manual->setValue($sync,true);
            $settings=$settings_m->invoke($sync);$shop=(string)($settings["shop_id"]??"");
            $ok=0;$fail=0;$mine=0;
            foreach($plan as $t){
              if(((int)$t["index"]%4)!==$shard)continue;
              $mine++;
              $id=(int)$t["product_id"];$sku=(string)$t["sku"];$listing=(string)$t["listing_id"];
              $p=wc_get_product($id);
              if(!$p){$fail++;update_post_meta($id,"_drielo_etsy_v3_status","failed: product missing");continue;}
              $done=false;$last="";
              for($attempt=1;$attempt<=3&&!$done;$attempt++){
                try{
                  $payload=$payload_m->invoke($sync,$p,(int)$t["taxonomy_id"]);
                  $payload["should_auto_renew"]="false";$payload["type"]="download";
                  $r=$request->invoke($sync,"PATCH","/v3/application/shops/".rawurlencode($shop)."/listings/".rawurlencode($listing),$payload,true);
                  if(is_wp_error($r))throw new Exception("listing: ".$r->get_error_message());

                  update_post_meta($id,"_drielo_etsy_listing_id",$listing);
                  update_post_meta($id,"_drielo_etsy_remote_state","active");
                  update_post_meta($id,"_drielo_etsy_taxonomy_id",(int)$t["taxonomy_id"]);
                  update_post_meta($id,"_drielo_etsy_auto_renew","no");

                  if(!empty($t["reused"])&&!empty($t["old_product_id"])&&(int)$t["old_product_id"]!==$id){
                    $old=(int)$t["old_product_id"];
                    delete_post_meta($old,"_drielo_etsy_listing_id");
                    delete_post_meta($old,"_drielo_etsy_remote_state");
                    delete_post_meta($old,"_drielo_etsy_asset_hash");
                    delete_post_meta($old,"_drielo_etsy_content_hash");
                    delete_post_meta($old,"_drielo_etsy_last_error");
                    delete_post_meta($old,"_drielo_etsy_last_warning");
                    delete_post_meta($old,"_drielo_etsy_shop_section_id");
                    update_post_meta($old,"_drielo_etsy_enabled","no");
                  }

                  $r=$inventory_m->invoke($sync,$p,$listing);if(is_wp_error($r))throw new Exception("inventory: ".$r->get_error_message());
                  $r=$images_m->invoke($sync,$p,$listing);if(is_wp_error($r))throw new Exception("images: ".$r->get_error_message());
                  $r=$files_m->invoke($sync,$p,$listing);if(is_wp_error($r))throw new Exception("files: ".$r->get_error_message());
                  $r=$request->invoke($sync,"PATCH","/v3/application/shops/".rawurlencode($shop)."/listings/".rawurlencode($listing),["state"=>"active","type"=>"download","should_auto_renew"=>"false"],true);
                  if(is_wp_error($r))throw new Exception("state: ".$r->get_error_message());
                  $r=$class_m->invoke($sync,$p,$listing);if(is_wp_error($r))throw new Exception("classification: ".$r->get_error_message());
                  $section_m->invoke($sync,$p,$listing);

                  $vr=$request->invoke($sync,"GET","/v3/application/listings/".rawurlencode($listing),[],true);
                  $vi=$request->invoke($sync,"GET","/v3/application/listings/".rawurlencode($listing)."/images",[],true);
                  $vf=$request->invoke($sync,"GET","/v3/application/shops/".rawurlencode($shop)."/listings/".rawurlencode($listing)."/files",[],true);
                  if(is_wp_error($vr)||is_wp_error($vi)||is_wp_error($vf))throw new Exception("verification GET failed");
                  $expected=$payload_m->invoke($sync,$p,(int)$t["taxonomy_id"]);
                  $title=(string)($vr["title"]??"");
                  $tax=(int)($vr["taxonomy_id"]??0);$state=(string)($vr["state"]??"");
                  $renew=!empty($vr["should_auto_renew"]);
                  $ic=count((array)($vi["results"]??[]));$fc=count((array)($vf["results"]??[]));
                  if($title!==(string)($expected["title"]??"")||$tax!==87||$state!=="active"||$renew||$ic!==(int)$t["expected_images"]||$fc!==(int)$t["expected_files"]){
                    throw new Exception("verify mismatch title=".($title===(string)($expected["title"]??"")?"ok":"bad")." tax=".$tax." state=".$state." renew=".($renew?"true":"false")." images=".$ic."/".$t["expected_images"]." files=".$fc."/".$t["expected_files"]);
                  }

                  update_post_meta($id,"_drielo_etsy_remote_state","active");
                  update_post_meta($id,"_drielo_etsy_asset_hash",$asset_hash_m->invoke($sync,$p));
                  update_post_meta($id,"_drielo_etsy_content_hash",$content_hash_m->invoke($sync,$p));
                  update_post_meta($id,"_drielo_etsy_last_sync",current_time("mysql"));
                  delete_post_meta($id,"_drielo_etsy_last_error");delete_post_meta($id,"_drielo_etsy_last_warning");
                  update_post_meta($id,"_drielo_etsy_v3_status","success");
                  echo "SHARD".$shard."_OK index=".$t["index"]." sku=".$sku." listing=".$listing." reused=".(!empty($t["reused"])?"yes":"no")." images=".$ic." files=".$fc." renew=false\n";
                  $ok++;$done=true;
                }catch(Throwable $e){
                  $last=$e->getMessage();
                  echo "SHARD".$shard."_RETRY index=".$t["index"]." sku=".$sku." attempt=".$attempt." error=".$last."\n";
                  if($attempt<3)sleep(5*$attempt);
                }
              }
              if(!$done){
                $fail++;update_post_meta($id,"_drielo_etsy_last_error",$last);update_post_meta($id,"_drielo_etsy_last_sync",current_time("mysql"));update_post_meta($id,"_drielo_etsy_v3_status","failed: ".$last);
                echo "SHARD".$shard."_FAILED index=".$t["index"]." sku=".$sku." listing=".$listing." error=".$last."\n";
              }
            }
            $manual->setValue($sync,false);
            echo "SHARD_FINAL shard=".$shard." assigned=".$mine." success=".$ok." failed=".$fail."\n";
            if($fail>0)exit(20);
          '
          REMOTE

  verify:
    if: always()
    needs: [prepare, sync]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/etsy_v3_key
          chmod 600 ~/.ssh/etsy_v3_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Verify final local markers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/etsy_v3_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          "${DOCKER[@]}" exec make-wp php -d memory_limit=1024M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";
            $plan=get_option("drielo_etsy_iconic_v3_plan",[]);
            if(!is_array($plan)||count($plan)!==100){fwrite(STDERR,"FINAL_FAIL plan missing\n");exit(2);}
            $ok=[];$bad=[];
            foreach($plan as $t){
              $id=(int)$t["product_id"];$status=(string)get_post_meta($id,"_drielo_etsy_v3_status",true);
              $lid=(string)get_post_meta($id,"_drielo_etsy_listing_id",true);
              $renew=(string)get_post_meta($id,"_drielo_etsy_auto_renew",true);
              if($status==="success"&&$lid===(string)$t["listing_id"]&&$renew==="no")$ok[]=$t["sku"];
              else $bad[]=["sku"=>$t["sku"],"listing"=>$lid,"status"=>$status,"renew"=>$renew,"error"=>(string)get_post_meta($id,"_drielo_etsy_last_error",true)];
            }
            echo "FINAL targets=".count($plan)." success=".count($ok)." failed=".count($bad)." auto_renew_no=".count($ok)."\n";
            if($bad)echo "FINAL_BAD=".wp_json_encode($bad,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
            if($bad)exit(20);
          '
          REMOTE

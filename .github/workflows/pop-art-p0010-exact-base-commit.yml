name: Pop Art P0010 Exact Base Commit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pop-art-resto-24
    paths:
      - '.github/workflows/pop-art-p0010-exact-base-commit.yml'

permissions:
  contents: write

concurrency:
  group: drielo-pop-art-p0010-exact-base-commit
  cancel-in-progress: false

jobs:
  rebuild-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: feature/pop-art-resto-24

      - name: Install renderer dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Rebuild P0010 from exact P0009 base
        env:
          DRIELO_GALLERY_REVISION: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 content/pattern-system/pop_art_25/publish_design.py P0010

      - name: Verify exact base and sunglasses-only differences
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("content/pattern-system")
          p9=json.loads((root/"patterns/P0009-CS/pattern.json").read_text())
          p10=json.loads((root/"patterns/P0010-CS/pattern.json").read_text())

          if (p9["stitch_width"],p9["stitch_height"]) != (100,120):
              raise SystemExit("P0009 unexpected grid")
          if (p10["stitch_width"],p10["stitch_height"]) != (100,120):
              raise SystemExit("P0010 unexpected grid")

          diffs=[]
          for y in range(120):
              for x in range(100):
                  a=p9["matrix"][y][x]
                  b=p10["matrix"][y][x]
                  if a != b:
                      diffs.append((x,y,a,b))
                      if not (5 <= x <= 50 and 44 <= y <= 64):
                          raise SystemExit(f"Unexpected non-glasses change at {(x,y)}: {a}->{b}")
                      if b not in {"A","C"}:
                          raise SystemExit(f"Unexpected sunglasses colour at {(x,y)}: {b}")

          if not (150 <= len(diffs) <= 400):
              raise SystemExit(f"Unexpected sunglasses diff size: {len(diffs)}")

          src=root/"collections/pop-art-25/sources/P0010.png"
          if not src.is_file() or src.stat().st_size < 1000:
              raise SystemExit("P0010 source missing")

          for suffix in ("CS","C2C","TC","LH"):
              code=f"P0010-{suffix}"
              pat=root/"patterns"/code/"pattern.json"
              prod=root/"products"/code/"product.json"
              pdf=Path("content/products/files")/f"Drielo_{code}.pdf"
              img=Path("content/products/assets")/f"{code}-product.webp"
              if not pat.is_file() or not prod.is_file() or not pdf.is_file() or not img.is_file():
                  raise SystemExit(f"Missing generated asset for {code}")

          print("P0010_EXACT_BASE_OK", len(diffs))
          PY

      - name: Mark P0010 published in queue
        run: |
          set -euo pipefail
          python3 content/pattern-system/pop_art_25/queue_state.py success P0010 \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Commit regenerated P0010 bundle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/pattern-system/pop_art_25/publish_queue.json
          git add content/pattern-system/collections/pop-art-25/designs.json
          git add content/pattern-system/collections/pop-art-25/sources/P0010.png
          git add content/pattern-system/collections/pop-art-25/reference-masters/P0010-*-reference.png
          git add content/products/catalog.json
          for suffix in CS C2C TC LH; do
            code="P0010-${suffix}"
            git add "content/pattern-system/patterns/${code}/pattern.json"
            git add "content/pattern-system/products/${code}/product.json"
            git add "content/products/assets/${code}-product.webp"
            git add "content/products/assets/${code}-gallery-2.webp"
            git add "content/products/assets/${code}-gallery-3.webp"
            git add "content/products/assets/${code}-gallery-4.webp"
            git add "content/products/files/Drielo_${code}.pdf"
          done

          git commit -m "Commit exact-base Pearl sunglasses bundle"
          git push origin HEAD:feature/pop-art-resto-24

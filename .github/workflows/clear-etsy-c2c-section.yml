name: Clear Cross Stitch section from reused C2C listings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clear-etsy-c2c-section.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  clear-section:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_c2c_section_key
          chmod 600 ~/.ssh/drielo_c2c_section_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Clear inherited Cross Stitch section
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: "55"
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUT=$(ssh -i ~/.ssh/drielo_c2c_section_key "$VPS_USER@$VPS_HOST" 'bash -s' 2>&1 <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          "${DOCKER[@]}" exec make-wp php -d memory_limit=512M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";
            if(!class_exists("Drielo_Etsy_Sync")) exit(2);
            $sync=Drielo_Etsy_Sync::instance();
            $ref=new ReflectionClass($sync);
            $req=$ref->getMethod("etsy_request"); $req->setAccessible(true);
            $settings_m=$ref->getMethod("settings"); $settings_m->setAccessible(true);
            $settings=$settings_m->invoke($sync);
            $shop=(string)($settings["shop_id"]??"");
            if($shop==="") exit(3);

            $ids=get_posts(array("post_type"=>"product","post_status"=>array("publish","draft","private","pending"),"posts_per_page"=>-1,"fields"=>"ids"));
            $rows=array();
            foreach($ids as $id){
              $p=wc_get_product($id); if(!$p) continue;
              $sku=(string)$p->get_sku();
              if(!preg_match("/^DRIELO-P\\d{4}-C2C$/",$sku)) continue;
              $terms=taxonomy_exists("product_collection")?wp_get_post_terms($id,"product_collection",array("fields"=>"slugs")):array();
              if(is_wp_error($terms)||!in_array("pop-art-25",(array)$terms,true)) continue;
              $listing=(string)get_post_meta($id,"_drielo_etsy_listing_id",true);
              if($listing==="") continue;
              $rows[]=array("id"=>(int)$id,"sku"=>$sku,"listing_id"=>$listing);
            }
            usort($rows,static fn($a,$b)=>strcmp($a["sku"],$b["sku"]));
            if(count($rows)!==26){fwrite(STDERR,"Expected 26 linked C2C listings, got ".count($rows)."\n");exit(4);}

            $before=array();
            foreach($rows as $row){
              $v=$req->invoke($sync,"GET","/v3/application/listings/".rawurlencode($row["listing_id"]),array(),true);
              if(is_wp_error($v)){fwrite(STDERR,"GET failed ".$row["sku"]." ".$v->get_error_message()."\n");exit(5);}
              $before[$row["sku"]]=(int)($v["shop_section_id"]??0);
            }
            echo "BEFORE_SECTIONS=".wp_json_encode($before).PHP_EOL;

            // Probe one listing first. updateListing accepts nullable shop_section_id;
            // Etsy uses 0 here to remove the section assignment.
            $probe=$rows[0];
            $clear=$req->invoke($sync,"PATCH","/v3/application/shops/".rawurlencode($shop)."/listings/".rawurlencode($probe["listing_id"]),array("shop_section_id"=>0),true);
            if(is_wp_error($clear)){fwrite(STDERR,"PROBE_CLEAR_FAILED ".$clear->get_error_message()."\n");exit(6);}
            $probe_v=$req->invoke($sync,"GET","/v3/application/listings/".rawurlencode($probe["listing_id"]),array(),true);
            if(is_wp_error($probe_v)){fwrite(STDERR,"PROBE_VERIFY_FAILED ".$probe_v->get_error_message()."\n");exit(7);}
            $probe_section=(int)($probe_v["shop_section_id"]??0);
            echo "PROBE_SECTION_AFTER=".$probe_section.PHP_EOL;
            if($probe_section!==0){fwrite(STDERR,"Probe did not clear section\n");exit(8);}

            $cleared=1;
            foreach(array_slice($rows,1) as $row){
              $res=$req->invoke($sync,"PATCH","/v3/application/shops/".rawurlencode($shop)."/listings/".rawurlencode($row["listing_id"]),array("shop_section_id"=>0),true);
              if(is_wp_error($res)){fwrite(STDERR,"CLEAR_FAILED ".$row["sku"]." ".$res->get_error_message()."\n");exit(9);}
              $cleared++;
            }

            $after=array(); $bad=array();
            foreach($rows as $row){
              $v=$req->invoke($sync,"GET","/v3/application/listings/".rawurlencode($row["listing_id"]),array(),true);
              if(is_wp_error($v)){fwrite(STDERR,"FINAL_GET_FAILED ".$row["sku"]."\n");exit(10);}
              $section=(int)($v["shop_section_id"]??0);
              $after[$row["sku"]]=$section;
              if($section!==0) $bad[]=$row["sku"];
              if($section===0) delete_post_meta($row["id"],"_drielo_etsy_shop_section_id");
            }
            echo "CLEARED_COUNT=".$cleared.PHP_EOL;
            echo "BAD_COUNT=".count($bad).PHP_EOL;
            echo "AFTER_SECTIONS=".wp_json_encode($after).PHP_EOL;
            if(count($bad)>0) exit(11);
          '
          REMOTE
          )
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          BODY=$(printf '### Etsy C2C section cleanup\n\n```text\n%s\n```\n' "$OUT")
          PAYLOAD=$(jq -n --arg body "$BODY" '{body:$body}')
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -d "$PAYLOAD" >/dev/null
          exit "$RC"

name: TEMP Clear Baby Nursery After QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-clear-baby-nursery-after-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drielo-baby-nursery-auto-publish
  cancel-in-progress: true

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_clear_baby_key
          chmod 600 ~/.ssh/drielo_clear_baby_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Delete Baby Nursery products and related media
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_clear_baby_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $ids=get_posts(array(
              "post_type"=>"product",
              "post_status"=>"any",
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "tax_query"=>array(array(
                "taxonomy"=>"product_collection",
                "field"=>"slug",
                "terms"=>array("baby-nursery"),
              )),
            ));
            echo "BABY_PRODUCTS_FOUND=".count($ids).PHP_EOL;
            $media=array();
            foreach($ids as $id){
              $p=wc_get_product($id);
              if($p){
                $sku=$p->get_sku();
                echo "DELETE ".$sku." id=".$id.PHP_EOL;
                $featured=$p->get_image_id();
                if($featured){ $media[$featured]=true; }
                foreach($p->get_gallery_image_ids() as $gid){ $media[$gid]=true; }
              }
              wp_delete_post($id,true);
            }
            foreach(array_keys($media) as $aid){
              if(get_post($aid)){ wp_delete_attachment($aid,true); }
            }
            $left=get_posts(array(
              "post_type"=>"product",
              "post_status"=>"any",
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "tax_query"=>array(array(
                "taxonomy"=>"product_collection",
                "field"=>"slug",
                "terms"=>array("baby-nursery"),
              )),
            ));
            echo "BABY_PRODUCTS_LEFT=".count($left).PHP_EOL;
            if(count($left)!==0){ exit(3); }
          '

          "${DOCKER[@]}" exec make-wp sh -lc 'find /var/www/html/wp-content/uploads/woocommerce_uploads/drielo -maxdepth 1 -type f -name "Drielo_I*.pdf" -print -delete 2>/dev/null || true'
          REMOTE

name: Florals Auto Publish Collection

on:
  push:
    branches: [feature/florals-auto-publish]
    paths:
      - '.github/workflows/florals-auto-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-florals-auto-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.design }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        design:
          - F0001
          - F0002
          - F0003
          - F0004
          - F0005
          - F0006
          - F0007
          - F0008
          - F0009
          - F0010
          - F0011
          - F0012
          - F0013
          - F0014
          - F0015
          - F0016
          - F0017
          - F0018
          - F0019
          - F0020
          - F0021
          - F0022
          - F0023
          - F0024
          - F0025
          - F0026
          - F0027
          - F0028
          - F0029
          - F0030

    steps:
      - name: Checkout Florals branch
        uses: actions/checkout@v4
        with:
          ref: feature/florals-auto-publish
          fetch-depth: 0

      - name: Check queue state
        id: state
        shell: bash
        env:
          DESIGN: ${{ matrix.design }}
        run: |
          set -euo pipefail
          python3 - "$DESIGN" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          from pathlib import Path
          design,out=sys.argv[1:]
          q=json.loads(Path('content/pattern-system/florals/publish_queue.json').read_text(encoding='utf-8'))
          item=next(x for x in q['items'] if x['base_design_id']==design)
          with open(out,'a',encoding='utf-8') as fh:
              fh.write('skip=' + ('true' if item.get('status')=='published' else 'false') + '\n')
          print(design,item.get('status'),item.get('attempts',0))
          PY

      - name: Install renderer dependencies
        if: steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Generate canonical source, four patterns, PDFs and store images
        if: steps.state.outputs.skip != 'true'
        env:
          DESIGN: ${{ matrix.design }}
          DRIELO_GALLERY_REVISION: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/florals/publish_design.py "$DESIGN"

      - name: Validate generated Florals bundle
        if: steps.state.outputs.skip != 'true'
        env:
          DESIGN: ${{ matrix.design }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$DESIGN" <<'PY'
          import json,sys
          from pathlib import Path
          from PIL import Image

          design=sys.argv[1]
          root=Path('.')
          system=root/'content'/'pattern-system'
          collection=json.loads((system/'collections/florals/collection.json').read_text(encoding='utf-8'))
          allowed={str(x['dmc']) for x in collection['palette']}
          max_colors=int(collection.get('pattern_rules',{}).get('per_design_max_colors',14))
          designs=json.loads((system/'collections/florals/designs.json').read_text(encoding='utf-8'))['designs']
          meta=next(x for x in designs if x['base_design_id']==design)

          ref=system/f"collections/florals/reference-masters/{design}-{meta['slug']}-reference.png"
          if not ref.is_file():
              raise SystemExit(f'{design}: reference master missing')
          im=Image.open(ref).convert('RGBA')
          bbox=im.getchannel('A').getbbox()
          if im.size!=(800,960) or not bbox or im.getchannel('A').getextrema()[0]!=0:
              raise SystemExit(f'{design}: invalid transparent canonical master')
          if min(bbox[0],bbox[1],800-bbox[2],960-bbox[3])<24:
              raise SystemExit(f'{design}: canonical artwork touches safety margin: {bbox}')

          grids={'CS':(100,120),'C2C':(60,72),'TC':(80,96),'LH':(60,72)}
          catalog=json.loads((root/'content/products/catalog.json').read_text(encoding='utf-8'))
          rows={p.get('code'):p for p in catalog.get('products',[])}
          for suffix,(w,h) in grids.items():
              code=f'{design}-{suffix}'
              pat=json.loads((system/'patterns'/code/'pattern.json').read_text(encoding='utf-8'))
              prod=json.loads((system/'products'/code/'product.json').read_text(encoding='utf-8'))
              if pat.get('collection')!='florals' or prod.get('collection')!='florals':
                  raise SystemExit(f'{code}: wrong collection')
              if (pat.get('stitch_width'),pat.get('stitch_height'))!=(w,h):
                  raise SystemExit(f'{code}: wrong grid')
              if len(pat.get('matrix',[]))!=h or any(len(r)!=w for r in pat['matrix']):
                  raise SystemExit(f'{code}: malformed matrix')
              if not pat.get('threads') or len(pat['threads'])>max_colors:
                  raise SystemExit(f'{code}: invalid colour count')
              if any(str(t.get('dmc')) not in allowed for t in pat['threads']):
                  raise SystemExit(f'{code}: thread outside Florals palette')
              if (pat.get('outline_policy') or {}).get('enabled'):
                  raise SystemExit(f'{code}: Florals must not add an external outline')
              pdf=root/'content/products/files'/f'Drielo_{code}.pdf'
              image=root/'content/products/assets'/f'{code}-product.webp'
              gallery=[root/'content/products/assets'/f'{code}-gallery-{i}.webp' for i in (2,3,4)]
              if not pdf.is_file() or pdf.stat().st_size<100000 or pdf.read_bytes()[:4]!=b'%PDF':
                  raise SystemExit(f'{code}: invalid PDF')
              if not image.is_file() or image.stat().st_size<40000:
                  raise SystemExit(f'{code}: invalid product image')
              if any((not g.is_file()) or g.stat().st_size<25000 for g in gallery):
                  raise SystemExit(f'{code}: invalid gallery')
              row=rows.get(code)
              if not row or row.get('collection')!='florals':
                  raise SystemExit(f'{code}: missing catalog row')
              print(code,'stitches',pat['total_stitches'],'colors',len(pat['threads']),
                    'pdf',pdf.stat().st_size,'image',image.stat().st_size)
          print(design,'FLORALS_BUNDLE_VALID','bbox',bbox)
          PY

      - name: Build four-product WooCommerce package
        if: steps.state.outputs.skip != 'true'
        env:
          DESIGN: ${{ matrix.design }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE="/tmp/drielo-${DESIGN}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"

          python3 - "$DESIGN" "$STAGE" <<'PY'
          import json,sys
          from pathlib import Path
          design=sys.argv[1]
          stage=Path(sys.argv[2])
          d=json.loads(Path('content/products/catalog.json').read_text(encoding='utf-8'))
          codes={f'{design}-{s}' for s in ('CS','C2C','TC','LH')}
          cats={
            'cross-stitch-patterns','cross-stitch-florals',
            'c2c-crochet-patterns','c2c-crochet-florals',
            'tapestry-crochet-patterns','tapestry-crochet-florals',
            'latch-hook-rug-patterns','latch-hook-rug-florals',
          }
          out=dict(d)
          out['products']=[p for p in d.get('products',[]) if p.get('code') in codes]
          out['collections']=[c for c in d.get('collections',[]) if c.get('slug')=='florals']
          out['categories']=[c for c in d.get('categories',[]) if c.get('slug') in cats]
          out['retired_products']=[]
          out['retired_collections']=[]
          found={p.get('code') for p in out['products']}
          if found!=codes:
              raise SystemExit(f'Package catalog mismatch: {found} != {codes}')
          (stage/'content/products/catalog.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          PY

          for suffix in CS C2C TC LH; do
            code="${DESIGN}-${suffix}"
            cp "content/products/assets/${code}-product.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-2.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-3.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-4.webp" "$STAGE/content/products/assets/"
            cp "content/products/files/Drielo_${code}.pdf" "$STAGE/content/products/files/"
          done
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf "/tmp/drielo-${DESIGN}.tgz" -C "$STAGE" content

      - name: Configure SSH
        if: steps.state.outputs.skip != 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_florals_key
          chmod 600 ~/.ssh/drielo_florals_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload product package
        if: steps.state.outputs.skip != 'true'
        env:
          DESIGN: ${{ matrix.design }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/drielo_florals_key "/tmp/drielo-${DESIGN}.tgz" "$VPS_USER@$VPS_HOST:/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}.tgz"

      - name: Publish four products to WooCommerce and verify
        if: steps.state.outputs.skip != 'true'
        env:
          DESIGN: ${{ matrix.design }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_florals_key "$VPS_USER@$VPS_HOST" "DESIGN='${DESIGN}' GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products

          "${DOCKER[@]}" exec -e DESIGN="$DESIGN" make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $design=getenv("DESIGN");
            foreach(array("CS","C2C","TC","LH") as $suffix){
              $sku="DRIELO-".$design."-".$suffix;
              $id=wc_get_product_id_by_sku($sku);
              $p=$id ? wc_get_product($id) : false;
              if(!$p){fwrite(STDERR,"MISSING ".$sku.PHP_EOL);exit(2);}
              $terms=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
              $downloads=count($p->get_downloads());
              $image=$p->get_image_id();
              $gallery=count($p->get_gallery_image_ids());
              echo $sku." id=".$id." status=".$p->get_status()." image=".$image." gallery=".$gallery." downloads=".$downloads." collection=".implode(",",is_wp_error($terms)?array():$terms)." url=".get_permalink($id).PHP_EOL;
              if($p->get_status()!=="publish" || !$image || $gallery<3 || $downloads<1 || !in_array("florals",is_wp_error($terms)?array():$terms,true)){exit(3);}
            }
          '
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Commit generated Florals design to branch
        if: steps.state.outputs.skip != 'true'
        env:
          DESIGN: ${{ matrix.design }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             content/pattern-system/collections/florals/designs.json             content/pattern-system/collections/florals/source-designs/manifest.json             content/pattern-system/collections/florals/source-designs/${DESIGN}-*.png             content/pattern-system/collections/florals/reference-masters/${DESIGN}-*-reference.png             content/pattern-system/patterns/${DESIGN}-CS/pattern.json             content/pattern-system/patterns/${DESIGN}-C2C/pattern.json             content/pattern-system/patterns/${DESIGN}-TC/pattern.json             content/pattern-system/patterns/${DESIGN}-LH/pattern.json             content/pattern-system/products/${DESIGN}-CS/product.json             content/pattern-system/products/${DESIGN}-C2C/product.json             content/pattern-system/products/${DESIGN}-TC/product.json             content/pattern-system/products/${DESIGN}-LH/product.json             content/products/catalog.json             content/products/assets/${DESIGN}-CS-product.webp             content/products/assets/${DESIGN}-CS-gallery-2.webp             content/products/assets/${DESIGN}-CS-gallery-3.webp             content/products/assets/${DESIGN}-CS-gallery-4.webp             content/products/assets/${DESIGN}-C2C-product.webp             content/products/assets/${DESIGN}-C2C-gallery-2.webp             content/products/assets/${DESIGN}-C2C-gallery-3.webp             content/products/assets/${DESIGN}-C2C-gallery-4.webp             content/products/assets/${DESIGN}-TC-product.webp             content/products/assets/${DESIGN}-TC-gallery-2.webp             content/products/assets/${DESIGN}-TC-gallery-3.webp             content/products/assets/${DESIGN}-TC-gallery-4.webp             content/products/assets/${DESIGN}-LH-product.webp             content/products/assets/${DESIGN}-LH-gallery-2.webp             content/products/assets/${DESIGN}-LH-gallery-3.webp             content/products/assets/${DESIGN}-LH-gallery-4.webp

          if git diff --cached --quiet; then
            echo "Generated design already matches branch."
          else
            git commit -m "Publish Florals ${DESIGN} in four techniques [skip ci]"
            git fetch origin feature/florals-auto-publish
            git rebase origin/feature/florals-auto-publish
            git push origin HEAD:feature/florals-auto-publish
          fi

      - name: Mark design published in queue
        if: steps.state.outputs.skip != 'true'
        env:
          DESIGN: ${{ matrix.design }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/florals-auto-publish
          git reset --hard origin/feature/florals-auto-publish
          python3 content/pattern-system/florals/queue_state.py success "$DESIGN" --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git add content/pattern-system/florals/publish_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Mark Florals ${DESIGN} published [skip ci]"
            git push origin HEAD:feature/florals-auto-publish
          fi

      - name: Archive PDFs for this design
        if: success() && steps.state.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: florals-${{ matrix.design }}-pdfs
          path: |
            content/products/files/Drielo_${{ matrix.design }}-CS.pdf
            content/products/files/Drielo_${{ matrix.design }}-C2C.pdf
            content/products/files/Drielo_${{ matrix.design }}-TC.pdf
            content/products/files/Drielo_${{ matrix.design }}-LH.pdf
          retention-days: 30

      - name: Record failure in queue
        if: failure() && steps.state.outputs.skip != 'true'
        env:
          DESIGN: ${{ matrix.design }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/florals-auto-publish
          git reset --hard origin/feature/florals-auto-publish
          python3 content/pattern-system/florals/queue_state.py fail "$DESIGN"             --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             --error "Automatic Florals publish job failed; see GitHub Actions logs."
          git add content/pattern-system/florals/publish_queue.json
          git commit -m "Record Florals ${DESIGN} auto-publish failure [skip ci]"
          git push origin HEAD:feature/florals-auto-publish

name: Reset Iconic Destinations and import 60

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: drielo-iconic-full-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Stop previous Iconic publisher runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for STATE in queued in_progress; do
            gh run list \
              --workflow iconic-destinations-auto-publish.yml \
              --status "$STATE" \
              --limit 30 \
              --json databaseId \
              --jq '.[].databaseId' | while read -r RUN; do
                [ -z "$RUN" ] || gh run cancel "$RUN" || true
              done
          done
          sleep 8

      - name: Build approved ZIP with 60 q50 PNG sources
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/import_iconic_mosaic.py

      - name: Validate approved ZIP and all 60 PNG sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import io
          import json
          import zipfile
          import zlib
          from pathlib import Path
          from PIL import Image

          root = Path('content/pattern-system')
          col = root / 'collections' / 'iconic-destinations'
          queue = json.loads((root / 'iconic_destinations' / 'publish_queue.json').read_text(encoding='utf-8'))
          designs = json.loads((col / 'designs.json').read_text(encoding='utf-8'))['designs']
          zip_path = col / 'assets' / 'iconic-60-pngs-q50.zip'
          preview = col / 'assets' / 'iconic-60-pngs-q50-mosaic.png'

          if len(designs) != 60:
              raise SystemExit(f'Expected 60 designs, got {len(designs)}')
          if len(queue.get('items', [])) != 60:
              raise SystemExit(f"Expected 60 queue items, got {len(queue.get('items', []))}")
          if queue.get('auto_continue') is not False:
              raise SystemExit('Queue must remain paused until shop reset finishes')
          if not zip_path.is_file():
              raise SystemExit('Approved 60-PNG ZIP was not generated')

          with Image.open(preview) as im:
              if im.size != (1000, 720):
                  raise SystemExit(f'Preview mosaic is {im.size}, expected 1000x720')

          expected_ids = [f'D{i:04d}' for i in range(1, 61)]
          if [x['base_design_id'] for x in queue['items']] != expected_ids:
              raise SystemExit('Queue order is not D0001-D0060')

          with zipfile.ZipFile(zip_path, 'r') as zf:
              names = zf.namelist()
              png_names = [n for n in names if n.lower().endswith('.png')]
              if len(png_names) != 60 or len(set(png_names)) != 60:
                  raise SystemExit(f'ZIP must contain exactly 60 unique PNGs, got {len(png_names)}')

              for index, item in enumerate(queue['items']):
                  base = item['base_design_id']
                  design = next(x for x in designs if x['base_design_id'] == base)
                  row, colnum = divmod(index, 10)
                  expected_name = f'destino_{row+1:02d}_{colnum+1:02d}.png'
                  if expected_name not in names:
                      raise SystemExit(f'{base}: {expected_name} missing from ZIP')

                  input_path = root / item['input_png']
                  if not input_path.is_file():
                      raise SystemExit(f'{base}: input PNG missing')

                  disk_bytes = input_path.read_bytes()
                  zip_bytes = zf.read(expected_name)
                  if disk_bytes != zip_bytes:
                      raise SystemExit(f'{base}: ZIP PNG differs from product input PNG')

                  with Image.open(io.BytesIO(zip_bytes)) as im:
                      rgb = im.convert('RGB')
                      if rgb.size != (100, 120):
                          raise SystemExit(f'{base}: PNG size {rgb.size}, expected 100x120')
                      colours = len(set(rgb.getdata()))
                      if not (1 <= colours <= 50):
                          raise SystemExit(f'{base}: PNG has {colours} colours, expected <= 50')

                  pixz = col / 'pixel-sources' / f'{base}.pixz'
                  raw = zlib.decompress(base64.b64decode(pixz.read_text().strip()))
                  n = raw[0]
                  if not (1 <= n <= 50):
                      raise SystemExit(f'{base}: invalid pixz palette {n}')
                  if len(raw) != 1 + n * 3 + 12000:
                      raise SystemExit(f'{base}: malformed 100x120 pixz')

          print('APPROVED_ZIP_VALID pngs=60 each=100x120 max_colours=50')
          PY

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Permanently delete all existing Iconic Destinations products
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $term=get_term_by("slug","iconic-destinations","product_collection");
            if(!$term instanceof WP_Term){echo "ICONIC_COLLECTION_NOT_FOUND".PHP_EOL;exit(0);}
            $ids=get_posts(array(
              "post_type"=>"product",
              "post_status"=>array("publish","draft","pending","private","future","trash"),
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "no_found_rows"=>true,
              "tax_query"=>array(array(
                "taxonomy"=>"product_collection",
                "field"=>"term_id",
                "terms"=>array((int)$term->term_id)
              ))
            ));
            $deleted=0;
            foreach(array_map("intval",$ids) as $id){
              if("1"!==(string)get_post_meta($id,"_drielo_managed_product",true)){
                echo "SKIP_UNMANAGED product_id=".$id.PHP_EOL;
                continue;
              }
              $p=wc_get_product($id);
              $sku=$p instanceof WC_Product ? $p->get_sku() : "";
              wp_delete_post($id,true);
              echo "DELETED_ICONIC sku=".$sku." product_id=".$id.PHP_EOL;
              $deleted++;
            }
            echo "DELETED_ICONIC_TOTAL=".$deleted.PHP_EOL;
          '
          REMOTE

      - name: Enable approved PNG queue and persist ZIP plus 60 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          qpath=Path('content/pattern-system/iconic_destinations/publish_queue.json')
          queue=json.loads(qpath.read_text(encoding='utf-8'))
          if len(queue.get('items', [])) != 60:
              raise SystemExit('Refusing to enable queue without 60 valid items')
          queue['auto_continue']=True
          qpath.write_text(json.dumps(queue,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('APPROVED_Q50_QUEUE_ENABLED pending=60')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            content/pattern-system/iconic_destinations/publish_queue.json \
            content/pattern-system/collections/iconic-destinations/designs.json \
            content/pattern-system/collections/iconic-destinations/input-pngs-q50 \
            content/pattern-system/collections/iconic-destinations/pixel-sources \
            content/pattern-system/collections/iconic-destinations/assets/iconic-60-pngs-q50.zip \
            content/pattern-system/collections/iconic-destinations/assets/iconic-60-pngs-q50-mosaic.png

          git commit -m "Import approved 60-PNG q50 Iconic source pack [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start sequential generation of 60 PDFs and WooCommerce products
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/iconic-destinations-auto-publish.yml/dispatches" \
            -f ref=main
          echo "APPROVED_Q50_ICONIC_IMPORT_STARTED D0001-D0060"

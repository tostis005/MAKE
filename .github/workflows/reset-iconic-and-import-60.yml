name: Reset Iconic Destinations from uploaded ZIP
# trigger: hardened-zip-png-only-reset-2026-09-26

on:
  push:
    branches: [main]
    paths:
      - 'content/pattern-system/collections/iconic-destinations/assets/iconic-60-pngs-q50.zip'
      - '.github/workflows/reset-iconic-and-import-60.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: drielo-iconic-full-reset
  cancel-in-progress: false

jobs:
  reset-from-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PNG importer dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Stop previous Iconic publisher runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for STATE in queued in_progress; do
            gh run list \
              --workflow iconic-destinations-auto-publish.yml \
              --status "$STATE" \
              --limit 30 \
              --json databaseId \
              --jq '.[].databaseId' | while read -r RUN; do
                [ -z "$RUN" ] || gh run cancel "$RUN" || true
              done
          done
          sleep 8

      - name: Extract and validate all 60 PNGs from uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/import_iconic_zip.py

      - name: Verify ZIP-only sources are exact and product-ready
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import json
          import zipfile
          from pathlib import Path
          from PIL import Image

          root = Path('content/pattern-system')
          col = root / 'collections' / 'iconic-destinations'
          zip_path = col / 'assets' / 'iconic-60-pngs-q50.zip'
          queue = json.loads((root / 'iconic_destinations' / 'publish_queue.json').read_text(encoding='utf-8'))
          designs = json.loads((col / 'designs.json').read_text(encoding='utf-8'))['designs']

          if queue.get('mode') != 'direct-zip-png-only-60x100x120-v3':
              raise SystemExit(f"Wrong queue mode: {queue.get('mode')}")
          if queue.get('auto_continue') is not False:
              raise SystemExit('Queue must remain paused until WooCommerce reset is complete')
          if len(queue.get('items', [])) != 60 or len(designs) != 60:
              raise SystemExit('Expected exactly 60 designs and queue items')

          expected_ids = [f'D{i:04d}' for i in range(1, 61)]
          if [x['base_design_id'] for x in queue['items']] != expected_ids:
              raise SystemExit('Queue order is not D0001-D0060')

          expected_names = [f'destino_{r:02d}_{c:02d}.png' for r in range(1,7) for c in range(1,11)]
          with zipfile.ZipFile(zip_path, 'r') as zf:
              names = zf.namelist()
              png_names = [n for n in names if n.lower().endswith('.png')]
              if sorted(png_names) != sorted(expected_names):
                  raise SystemExit('ZIP must contain exactly destino_01_01.png through destino_06_10.png')

              for index, item in enumerate(queue['items']):
                  base = item['base_design_id']
                  row, colnum = divmod(index, 10)
                  expected_name = f'destino_{row+1:02d}_{colnum+1:02d}.png'
                  raw_png = zf.read(expected_name)

                  with Image.open(io.BytesIO(raw_png)) as im:
                      rgb = im.convert('RGB')
                      if rgb.size != (100, 120):
                          raise SystemExit(f'{base}: ZIP PNG size {rgb.size}, expected 100x120')
                      colours = len(set(rgb.getdata()))
                      if not (1 <= colours <= 50):
                          raise SystemExit(f'{base}: ZIP PNG has {colours} colours, expected <=50')

                  input_path = root / item['input_png']
                  if not input_path.is_file():
                      raise SystemExit(f'{base}: extracted input PNG missing')
                  if input_path.read_bytes() != raw_png:
                      raise SystemExit(f'{base}: extracted PNG differs from ZIP bytes')

                  pixz = col / 'pixel-sources' / f'{base}.pixz'
                  raw = zlib.decompress(base64.b64decode(pixz.read_text().strip()))
                  n = raw[0]
                  if not (1 <= n <= 50):
                      raise SystemExit(f'{base}: invalid pixz palette {n}')
                  if len(raw) != 1 + n * 3 + 12000:
                      raise SystemExit(f'{base}: malformed 100x120 pixz')

          print('UPLOADED_ZIP_SOURCE_VALID designs=60 each=100x120 max_colours=50')
          PY

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Permanently delete all Iconic products and old collection media
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $term=get_term_by("slug","iconic-destinations","product_collection");
            if(!$term instanceof WP_Term){echo "ICONIC_COLLECTION_NOT_FOUND".PHP_EOL;exit(2);}

            $ids=get_posts(array(
              "post_type"=>"product",
              "post_status"=>array("publish","draft","pending","private","future","trash"),
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "no_found_rows"=>true,
              "tax_query"=>array(array(
                "taxonomy"=>"product_collection",
                "field"=>"term_id",
                "terms"=>array((int)$term->term_id)
              ))
            ));

            $media=array();
            foreach(array_map("intval",$ids) as $id){
              $p=wc_get_product($id);
              if($p instanceof WC_Product){
                $image_id=(int)$p->get_image_id();
                if($image_id){$media[$image_id]=true;}
                foreach(array_map("intval",$p->get_gallery_image_ids()) as $aid){
                  if($aid){$media[$aid]=true;}
                }
              }
              $children=get_posts(array(
                "post_type"=>"attachment",
                "post_status"=>"inherit",
                "post_parent"=>$id,
                "posts_per_page"=>-1,
                "fields"=>"ids",
                "no_found_rows"=>true
              ));
              foreach(array_map("intval",$children) as $aid){
                if($aid){$media[$aid]=true;}
              }
            }

            $known=get_posts(array(
              "post_type"=>"attachment",
              "post_status"=>"inherit",
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "no_found_rows"=>true,
              "meta_query"=>array(array("key"=>"_drielo_source_asset","compare"=>"EXISTS"))
            ));
            foreach(array_map("intval",$known) as $aid){
              $asset=(string)get_post_meta($aid,"_drielo_source_asset",true);
              if(preg_match("#^assets/D([0-9]{4})-CS-#i",$asset,$m)){
                $n=(int)$m[1];
                if($n>=1 && $n<=60){$media[$aid]=true;}
              }
            }

            $deleted=0;
            foreach(array_map("intval",$ids) as $id){
              $p=wc_get_product($id);
              $sku=$p instanceof WC_Product ? $p->get_sku() : "";
              wp_delete_post($id,true);
              echo "DELETED_ICONIC sku=".$sku." product_id=".$id.PHP_EOL;
              $deleted++;
            }

            $deleted_media=0;
            foreach(array_keys($media) as $aid){
              if(get_post_type((int)$aid)==="attachment" && wp_delete_attachment((int)$aid,true)){
                echo "DELETED_ICONIC_MEDIA attachment_id=".$aid.PHP_EOL;
                $deleted_media++;
              }
            }

            $uploads=wp_upload_dir();
            $dir=trailingslashit($uploads["basedir"])."woocommerce_uploads/drielo";
            $deleted_pdfs=0;
            for($n=1;$n<=60;$n++){
              $file=$dir."/Drielo_D".str_pad((string)$n,4,"0",STR_PAD_LEFT)."-CS.pdf";
              if(is_file($file) && @unlink($file)){$deleted_pdfs++;}
            }

            $remaining=get_posts(array(
              "post_type"=>"product",
              "post_status"=>array("publish","draft","pending","private","future","trash"),
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "no_found_rows"=>true,
              "tax_query"=>array(array(
                "taxonomy"=>"product_collection",
                "field"=>"term_id",
                "terms"=>array((int)$term->term_id)
              ))
            ));
            if($remaining){echo "ERROR_REMAINING_ICONIC=".count($remaining).PHP_EOL;exit(3);}
            wc_delete_product_transients();
            echo "ICONIC_PURGE_COMPLETE products=".$deleted." media=".$deleted_media." pdfs=".$deleted_pdfs.PHP_EOL;
          '
          REMOTE

      - name: Enable uploaded ZIP queue and persist exact 60 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          qpath=Path('content/pattern-system/iconic_destinations/publish_queue.json')
          queue=json.loads(qpath.read_text(encoding='utf-8'))
          if queue.get('mode') != 'direct-zip-png-only-60x100x120-v3':
              raise SystemExit('Refusing to enable anything except hardened individual-ZIP-PNG queue')
          if len(queue.get('items', [])) != 60:
              raise SystemExit('Refusing to enable queue without 60 valid ZIP designs')
          queue['auto_continue']=True
          qpath.write_text(json.dumps(queue,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('ZIP_PNG_ONLY_QUEUE_ENABLED pending=60')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            content/pattern-system/iconic_destinations/publish_queue.json \
            content/pattern-system/collections/iconic-destinations/designs.json \
            content/pattern-system/collections/iconic-destinations/input-pngs-q50 \
            content/pattern-system/collections/iconic-destinations/pixel-sources \
            content/pattern-system/collections/iconic-destinations/assets/iconic-60-pngs-q50-mosaic.png

          git commit -m "Import 60 Iconic products from uploaded ZIP [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start sequential generation of 60 products
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/iconic-destinations-auto-publish.yml/dispatches" \
            -f ref=main
          echo "ZIP_PNG_ONLY_ICONIC_IMPORT_STARTED D0001-D0060"

name: Install Drielo pattern system

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-drielo-pattern-system.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and install pattern system
        shell: bash
        env:
          BUNDLE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-d0f0-820e-8c1b-d753641b69a7/raw?se=2026-09-23T10%3A04%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=4e216911-be0c-5734-9488-136c56188647&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T00%3A56%3A46Z&ske=2026-09-24T00%3A56%3A46Z&sks=b&skv=2026-02-06&sig=UT5SIZ0i2MDbWyz4YVEUZMLbLmkpWtI44uA/FLys0RI%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$BUNDLE_URL" -o /tmp/drielo-pattern-system.b64
          base64 --decode /tmp/drielo-pattern-system.b64 > /tmp/drielo-pattern-system.tar.gz
          mkdir -p content
          rm -rf content/pattern-system
          tar -xzf /tmp/drielo-pattern-system.tar.gz -C content
          test -f content/pattern-system/template/DRIELO_Pattern_Template_MASTER.html
          test -f content/pattern-system/renderer/render.py
          test -f content/pattern-system/workflow.yml
          cp content/pattern-system/workflow.yml .github/workflows/build-pattern-pdf.yml
          rm content/pattern-system/workflow.yml
          rm -rf .bootstrap-pattern-generator
          python3 content/pattern-system/renderer/validate_all.py

      - name: Commit installed system
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/install-drielo-pattern-system.yml
          git add content/pattern-system .github/workflows/build-pattern-pdf.yml
          git add -A .bootstrap-pattern-generator || true
          git commit -m "Install Drielo pattern generation system"
          git push origin HEAD:main

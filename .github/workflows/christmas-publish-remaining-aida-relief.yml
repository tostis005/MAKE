# rerun-after-n0001-binary-fix-20261004
name: Publish All Christmas Minis Aida Relief

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/christmas-publish-remaining-aida-relief.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-christmas-all-aida-relief
  cancel-in-progress: false

jobs:
  publish-all:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Render N0001 through N0015 with Aida relief
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq -w 1 15); do
            ID="N$(printf '%04d' "$((10#$n))")"
            echo "=== Rendering $ID ==="
            python3 content/pattern-system/christmas/publish_christmas_aida_relief.py "$ID"
          done

      - name: Validate all Christmas products
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root=Path('.')
          for i in range(1,16):
              base=f'N{i:04d}'
              code=f'{base}-CS'
              pat=json.loads((root/f'content/pattern-system/patterns/{code}/pattern.json').read_text())
              assert pat['algorithm']=='pixel-exact-alpha-1px-1stitch-aida-relief-v4', code
              assert (pat['source_width'],pat['source_height'])==(50,60), code
              assert (pat['stitch_width'],pat['stitch_height'])==(100,120), code
              assert pat['source_offset']=={'x':25,'y':30}, code
              matrix=pat['matrix']
              total=sum(v is not None for row in matrix for v in row)
              assert total==pat['total_stitches'], (code,total,pat['total_stitches'])
              assert 0<total<3000, (code,total)
              for y in range(120):
                  for x in range(100):
                      if not (25<=x<75 and 30<=y<90):
                          assert matrix[y][x] is None, (code,x,y)

              pdf=root/f'content/products/files/Drielo_{code}.pdf'
              hero=root/f'content/products/assets/{code}-product.webp'
              design=root/f'content/products/assets/{code}-design.webp'
              galleries=[root/f'content/products/assets/{code}-gallery-{j}.webp' for j in (2,3,4)]
              assert pdf.is_file() and pdf.read_bytes()[:4]==b'%PDF' and pdf.stat().st_size>100000, code
              with Image.open(hero) as im:
                  assert im.size==(1536,1536), (code,im.size)
              with Image.open(design) as im:
                  assert im.size==(1000,1200), (code,im.size)
              assert all(p.is_file() and p.stat().st_size>10000 for p in galleries), code
              print('VALID',code,'stitches',total,'blank',12000-total,'colours',len(pat['threads']))
          print('ALL_CHRISTMAS_AIDA_RELIEF_VALID count=15')
          PY

      - name: Build batch WooCommerce package
        shell: bash
        run: |
          set -euo pipefail
          STAGE=/tmp/drielo-christmas-all
          rm -rf "$STAGE"
          mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"

          python3 - "$STAGE" <<'PY'
          import json,sys
          from pathlib import Path
          stage=Path(sys.argv[1])
          src=json.loads(Path('content/products/catalog.json').read_text())
          wanted={f'N{i:04d}-CS' for i in range(1,16)}
          rows=[p for p in src['products'] if p.get('code') in wanted]
          if len(rows)!=15:
              raise SystemExit(f'Expected 15 Christmas rows, got {len(rows)}')
          collection=next(c for c in src['collections'] if c.get('slug')=='christmas')
          cats=[c for c in src.get('categories',[]) if c.get('slug') in {'cross-stitch-patterns','cross-stitch-christmas'}]
          out=dict(src)
          out['products']=rows
          out['collections']=[collection]
          out['categories']=cats
          out['retired_products']=[]
          out['retired_collections']=[]
          (stage/'content/products/catalog.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

          for i in $(seq 1 15); do
            CODE="N$(printf '%04d' "$i")-CS"
            cp "content/products/assets/${CODE}-product.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${CODE}-gallery-2.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${CODE}-gallery-3.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${CODE}-gallery-4.webp" "$STAGE/content/products/assets/"
            cp "content/products/files/Drielo_${CODE}.pdf" "$STAGE/content/products/files/"
          done
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf /tmp/drielo-christmas-all.tgz -C "$STAGE" content

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Publish all Christmas products to production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/drielo_products_key /tmp/drielo-christmas-all.tgz "$VPS_USER@$VPS_HOST:/tmp/drielo-christmas-all-$GITHUB_RUN_ID.tgz"
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-christmas-remaining-$GITHUB_RUN_ID.tgz"
          STAGE="/tmp/drielo-christmas-remaining-$GITHUB_RUN_ID"
          trap 'rm -rf "$ARCHIVE" "$STAGE"' EXIT
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $ok=0;
            for($i=1;$i<=15;$i++){
              $sku="DRIELO-N".str_pad((string)$i,4,"0",STR_PAD_LEFT)."-CS";
              $id=wc_get_product_id_by_sku($sku);
              $p=$id?wc_get_product($id):false;
              if(!$p){fwrite(STDERR,"Missing ".$sku."\n");continue;}
              $cols=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
              $valid=$p->get_status()==="publish"
                && $p->get_image_id()
                && count($p->get_gallery_image_ids())===3
                && count($p->get_downloads())>=1
                && $p->is_virtual()
                && $p->is_downloadable()
                && in_array("christmas",is_wp_error($cols)?array():$cols,true);
              echo "CHRISTMAS_PRODUCTION"
                ." id=".$id
                ." sku=".$sku
                ." status=".$p->get_status()
                ." image=".$p->get_image_id()
                ." gallery=".count($p->get_gallery_image_ids())
                ." downloads=".count($p->get_downloads())
                ." valid=".($valid?"yes":"no")
                ." url=".get_permalink($id).PHP_EOL;
              if($valid)$ok++;
            }
            if($ok!==15){fwrite(STDERR,"Expected 15 valid products, got ".$ok."\n");exit(3);}
            echo "CHRISTMAS_ALL_PRODUCTION_VALID count=".$ok.PHP_EOL;
          '
          REMOTE

      - name: Persist generated Christmas assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in $(seq 2 15); do
            CODE="N$(printf '%04d' "$i")-CS"
            git add "content/pattern-system/patterns/${CODE}/pattern.json"
            git add "content/pattern-system/products/${CODE}/product.json"
            git add "content/products/assets/${CODE}-product.webp"
            git add "content/products/assets/${CODE}-design.webp"
            git add "content/products/assets/${CODE}-gallery-2.webp"
            git add "content/products/assets/${CODE}-gallery-3.webp"
            git add "content/products/assets/${CODE}-gallery-4.webp"
            git add -f "content/products/files/Drielo_${CODE}.pdf"
          done
          git add content/products/catalog.json

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Render all Christmas minis with Aida relief engine [skip ci]"
            git fetch origin main --depth=20
            git rebase origin/main
            git push origin HEAD:main
          fi

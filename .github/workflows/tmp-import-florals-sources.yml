name: TEMP Import Approved Florals Sources

on:
  push:
    branches:
      - feature/florals-pattern-generation
    paths:
      - '.github/workflows/tmp-import-florals-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-florals-source-import
  cancel-in-progress: true

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Florals generation branch
        uses: actions/checkout@v4
        with:
          ref: feature/florals-pattern-generation
          fetch-depth: 0

      - name: Install pattern dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Download 30 approved 100x120 source PNGs
        shell: bash
        run: |
          set -euo pipefail
          D='content/pattern-system/collections/florals/source-designs'
          mkdir -p "$D"

          curl -fL --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1638-820e-85cc-72ef186466d1/raw?se=2026-09-24T14%3A07%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=70c4d5a6-78a7-5363-b95a-e7b5a9d0c9ad&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A15%3A36Z&ske=2026-09-25T12%3A15%3A36Z&sks=b&skv=2026-02-06&sig=3byh7u6z4oVnjxCSa7JBzLrRXntp05ohF30Xvp%2B2cow%3D' -o "$D/F0001-blue-daisy-pitcher.png"

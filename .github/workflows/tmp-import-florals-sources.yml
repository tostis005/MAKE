name: TEMP Import Florals Sources Batch 1

on:
  push:
    branches:
      - feature/florals-pattern-generation
    paths:
      - '.github/workflows/tmp-import-florals-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-florals-source-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/florals-pattern-generation
          fetch-depth: 0

      - name: Download approved sources F0001-F0005
        shell: bash
        run: |
          set -euo pipefail
          D='content/pattern-system/collections/florals/source-designs'
          mkdir -p "$D"
          curl -fL --retry 2 'https://sdmntprseasia.oaiusercontent.com/files/00000000-4e3c-8207-92f2-a140f28349b0/raw?se=2026-09-24T14%3A15%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=6dc48868-a488-58e2-8c29-ad9b79e82d30&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T11%3A29%3A48Z&ske=2026-09-25T11%3A29%3A48Z&sks=b&skv=2026-02-06&sig=oO4yhiLWPtLRluqpY1RPtlZXBu/Qft5NjGlbOXNlqEg%3D' -o "$D/F0001-blue-daisy-pitcher.png"
          curl -fL --retry 2 'https://sdmntpreastus.oaiusercontent.com/files/00000000-a1a0-81f9-981d-4ac3c6bf8405/raw?se=2026-09-24T14%3A15%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=f9415396-f270-50de-b50f-02b084953828&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A26%3A30Z&ske=2026-09-25T12%3A26%3A30Z&sks=b&skv=2026-02-06&sig=p8XdGyCtFyiJnIOr8ndMay7DkNT8JdBdJoHFcrnsIbU%3D' -o "$D/F0002-pink-peony.png"
          curl -fL --retry 2 'https://sdmntprcacentral.oaiusercontent.com/files/00000000-cc04-820d-ba3f-332249939f58/raw?se=2026-09-24T14%3A15%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=c0388738-a4fd-57c7-a078-8037f7d0e3fa&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A35%3A06Z&ske=2026-09-25T13%3A35%3A06Z&sks=b&skv=2026-02-06&sig=jaOGmlXFHwm/1pyfuswjpnNynbDexhatmFUWpTxl1kM%3D' -o "$D/F0003-lavender-ribbon-bundle.png"
          curl -fL --retry 2 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-90ac-820c-80e7-f7a700253bd2/raw?se=2026-09-24T14%3A16%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=dab35d95-f8a1-5023-91d8-03ae8cc359e9&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A21%3A06Z&ske=2026-09-25T12%3A21%3A06Z&sks=b&skv=2026-02-06&sig=f/8oMOfrBJ4QdWhCwDV0iD5JNxsgfuKUPGxuAORqdyg%3D' -o "$D/F0004-sunflower-stem.png"
          curl -fL --retry 2 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-e378-81fd-b203-2bc03c18d917/raw?se=2026-09-24T14%3A16%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=1895ed08-6ce5-509f-8a2f-9753a89dec9e&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T06%3A41%3A53Z&ske=2026-09-25T06%3A41%3A53Z&sks=b&skv=2026-02-06&sig=tCEHldZILtW8t3POhpwPtBBZuUVQ64XHRqLlS6JMZps%3D' -o "$D/F0005-blue-hydrangea.png"

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for i in range(1,6):
              p=next(Path('content/pattern-system/collections/florals/source-designs').glob(f'F{i:04d}-*.png'))
              im=Image.open(p).convert('RGBA')
              if im.size!=(100,120) or im.getchannel('A').getbbox() is None:
                  raise SystemExit(f'bad source {p}: {im.size}')
              print(p.name,p.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pattern-system/collections/florals/source-designs/F000{1,2,3,4,5}-*.png
          git commit -m "Import approved Florals sources F0001-F0005 [skip ci]"
          git push origin HEAD:feature/florals-pattern-generation

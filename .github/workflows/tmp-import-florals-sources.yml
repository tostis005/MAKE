name: TEMP Import Florals Sources Batch 2

on:
  push:
    branches:
      - feature/florals-pattern-generation
    paths:
      - '.github/workflows/tmp-import-florals-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-florals-source-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/florals-pattern-generation
          fetch-depth: 0

      - name: Download approved sources F0006-F0010
        shell: bash
        run: |
          set -euo pipefail
          D='content/pattern-system/collections/florals/source-designs'
          mkdir -p "$D"
          curl -fL --retry 2 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-d224-81fd-979f-6d7335065719/raw?se=2026-09-24T14%3A19%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=a7b4e2b6-d90d-52db-bb60-7ae95bcc79de&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A37%3A54Z&ske=2026-09-25T13%3A37%3A54Z&sks=b&skv=2026-02-06&sig=Dd8TwpreLENy9sQHTREmys2vTkc42Zwh0bEVbP8XD/k%3D' -o "$D/F0006-cherry-blossom-branch.png"
          curl -fL --retry 2 'https://sdmntpreastus.oaiusercontent.com/files/00000000-041c-81f9-ad42-45c5ffbd0127/raw?se=2026-09-24T14%3A20%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=ccd82936-a61e-5ba6-b51b-fe605e7a51bf&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A37%3A37Z&ske=2026-09-25T13%3A37%3A37Z&sks=b&skv=2026-02-06&sig=TVLi%2BpnfiPMcOfmzyO2MWeGDWSSW8SwKK7OeT6mE84E%3D' -o "$D/F0007-pink-floral-heart-wreath.png"
          curl -fL --retry 2 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-62d4-8246-90af-9bfda5179331/raw?se=2026-09-24T14%3A20%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=d926d40f-75ca-56e0-89ea-1418ab5bfc7c&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A07%3A45Z&ske=2026-09-25T13%3A07%3A45Z&sks=b&skv=2026-02-06&sig=1XSelfHpFLZ8p4kdcKmQD3uld0qDpJnvHuTghEl%2BYSg%3D' -o "$D/F0008-daisy-mason-jar.png"
          curl -fL --retry 2 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-b0a0-81f4-ba95-0a9040641816/raw?se=2026-09-24T14%3A21%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=b8471e8d-ec19-5990-aa1b-ce318b8ae8ca&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A26%3A17Z&ske=2026-09-25T12%3A26%3A17Z&sks=b&skv=2026-02-06&sig=OIDAxvcyFaSl8ulPV0RZtIVjZTylLuiNkxTRhmGbnR8%3D' -o "$D/F0009-eucalyptus-ribbon-bundle.png"
          curl -fL --retry 2 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-bc90-81f7-ab39-04ee948d6f32/raw?se=2026-09-24T14%3A21%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=1f15e925-153f-5840-a4a7-f068349941ce&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A01%3A15Z&ske=2026-09-25T12%3A01%3A15Z&sks=b&skv=2026-02-06&sig=knhCfjS7zzfksou3RV%2B73lV8BNy7sOxXo/bXzjSdq00%3D' -o "$D/F0010-potted-strawberry-plant.png"

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          d=Path('content/pattern-system/collections/florals/source-designs')
          for i in range(6,11):
              p=next(d.glob(f'F{i:04d}-*.png'))
              im=Image.open(p).convert('RGBA')
              if im.size!=(100,120) or im.getchannel('A').getbbox() is None:
                  raise SystemExit(f'bad source {p}: {im.size}')
              print(p.name,p.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pattern-system/collections/florals/source-designs/F000{6,7,8,9}-*.png content/pattern-system/collections/florals/source-designs/F0010-*.png
          git commit -m "Import approved Florals sources F0006-F0010 [skip ci]"
          git push origin HEAD:feature/florals-pattern-generation

      - name: Verify imported canonical sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          d=Path('content/pattern-system/collections/florals/source-designs')
          files=sorted(d.glob('F????-*.png'))
          ids={p.name[:5] for p in files}
          expected={f'F{i:04d}' for i in range(1,31)}
          if ids != expected:
              raise SystemExit(f'Source ids mismatch: missing={sorted(expected-ids)} extra={sorted(ids-expected)}')
          for p in files:
              im=Image.open(p).convert('RGBA')
              if im.size!=(100,120):
                  raise SystemExit(f'{p.name}: {im.size} != (100,120)')
              if im.getchannel('A').getbbox() is None:
                  raise SystemExit(f'{p.name}: empty source')
              print(p.name, p.stat().st_size)
          print('APPROVED_FLORALS_SOURCES_VALID', len(files))
          PY

      - name: Generate 120 pattern/product JSONs
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/florals/build_collection.py

      - name: Validate generated collection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('content/pattern-system')
          status=json.loads((root/'florals/generation_status.json').read_text(encoding='utf-8'))
          if status.get('design_count') != 30 or status.get('pattern_count') != 120:
              raise SystemExit(status)
          grids={'CS':(100,120),'C2C':(60,72),'TC':(80,96),'LH':(60,72)}
          for i in range(1,31):
              base=f'F{i:04d}'
              for suffix,(w,h) in grids.items():
                  code=f'{base}-{suffix}'
                  p=json.loads((root/'patterns'/code/'pattern.json').read_text(encoding='utf-8'))
                  prod=json.loads((root/'products'/code/'product.json').read_text(encoding='utf-8'))
                  if (p['stitch_width'],p['stitch_height'])!=(w,h):
                      raise SystemExit(f'{code}: bad grid')
                  if p['collection']!='florals' or prod['collection']!='florals':
                      raise SystemExit(f'{code}: bad collection')
                  if not p['threads'] or len(p['threads'])>14:
                      raise SystemExit(f'{code}: bad colors')
          print('FLORALS_30X4_VALID')
          PY

      - name: Commit approved sources and generated pattern set
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-import-florals-sources.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A             .github/workflows/tmp-import-florals-sources.yml             content/pattern-system/collections/florals/source-designs             content/pattern-system/collections/florals/designs.json             content/pattern-system/florals/generation_status.json             content/pattern-system/patterns/F*             content/pattern-system/products/F*

          git commit -m "Import approved Florals sources and build 120 patterns [skip ci]"
          git push origin HEAD:feature/florals-pattern-generation

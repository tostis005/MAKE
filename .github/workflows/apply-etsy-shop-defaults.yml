name: Apply Etsy shop defaults
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-etsy-shop-defaults.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/make_deploy_key
          chmod 600 ~/.ssh/make_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Save detected Etsy shop settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/make_deploy_key "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $s=get_option("drielo_etsy_settings",array());
            $s["shop_id"]="68150909";
            $s["shop_name"]="Drielo";
            $s["taxonomy_id"]=6343;
            update_option("drielo_etsy_settings",$s,false);
            $saved=get_option("drielo_etsy_settings",array());
            echo "SHOP_ID=".($saved["shop_id"]??"").PHP_EOL;
            echo "SHOP_NAME=".($saved["shop_name"]??"").PHP_EOL;
            echo "TAXONOMY_ID=".($saved["taxonomy_id"]??"").PHP_EOL;
          '
          REMOTE
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-etsy-shop-defaults.yml
          git config user.name "Drielo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/apply-etsy-shop-defaults.yml
          git commit -m "Remove Etsy defaults helper workflow"
          git push

name: Florals Clean Reimport Queue
# Page-one assets: approved Florals uploads; strict one-to-one technique mapping.

on:
  push:
    branches:
      - feature/florals-clean-reimport
    paths:
      - '.github/workflows/florals-clean-reimport-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: drielo-florals-clean-reimport
  cancel-in-progress: true

jobs:
  publish-next:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Florals feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: feature/florals-clean-reimport

      - name: Select next pending Florals design
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/florals/queue_state.py next --github-output "$GITHUB_OUTPUT"

      - name: Show queue state
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/florals/queue_state.py summary
          echo "Selected: ${{ steps.select.outputs.design_id }}"

      - name: Install renderer dependencies
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Show Florals page-one mapping
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('content/pattern-system/collections/florals/collection.json').read_text())
          for k,v in c['mockup_spec']['technique_assets'].items():
              print(f"{k} => {v}")
          print(c['mockup_spec']['mapping_note'])
          PY

      - name: Generate canonical source, four patterns, PDFs and store images
        if: steps.select.outputs.design_id != ''
        env:
          DRIELO_GALLERY_REVISION: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/florals/publish_design.py "${{ steps.select.outputs.design_id }}"

      - name: Validate generated Florals bundle
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          python3 - "$DESIGN" <<'PY'
          import json,sys
          from pathlib import Path
          from PIL import Image, ImageChops

          design=sys.argv[1]
          root=Path('.')
          system=root/'content'/'pattern-system'
          collection=json.loads((system/'collections/florals/collection.json').read_text(encoding='utf-8'))
          if len(collection.get('palette',[])) != 24:
              raise SystemExit('Florals collection must contain exactly 24 master colours')
          allowed_dmc={str(x['dmc']) for x in collection['palette']}
          max_colors=int(collection.get('pattern_rules',{}).get('per_design_max_colors',14))
          designs=json.loads((system/'collections/florals/designs.json').read_text(encoding='utf-8'))['designs']
          meta=next(x for x in designs if x['base_design_id']==design)

          ref=system/f"collections/florals/reference-masters/{design}-{meta['slug']}-reference.png"
          src=system/f"collections/florals/source-designs/{design}-{meta['slug']}.png"
          if not ref.is_file() or not src.is_file():
              raise SystemExit(f'{design}: canonical source/reference missing')
          im=Image.open(ref).convert('RGBA')
          sim=Image.open(src).convert('RGBA')
          bbox=im.getchannel('A').getbbox()
          if im.size!=(800,960) or sim.size not in ((100,120),(800,960)) or not bbox:
              raise SystemExit(f'{design}: invalid canonical dimensions: source={sim.size}, reference={im.size}')
          if im.getchannel('A').getextrema()[0] != 0:
              raise SystemExit(f'{design}: canonical master must retain transparent background')
          if min(bbox[0],bbox[1],800-bbox[2],960-bbox[3]) < 8:
              raise SystemExit(f'{design}: canonical artwork touches safety margin: {bbox}')
          source_master = sim if sim.size==(800,960) else sim.resize((800,960), Image.Resampling.NEAREST)
          if ImageChops.difference(source_master,im).getbbox() is not None:
              raise SystemExit(f'{design}: source and reference master differ')

          grids={'CS':(100,120),'C2C':(60,72),'TC':(80,96),'LH':(60,72)}
          catalog=json.loads((root/'content/products/catalog.json').read_text(encoding='utf-8'))
          rows={p.get('code'):p for p in catalog.get('products',[])}
          for suffix,(w,h) in grids.items():
              code=f'{design}-{suffix}'
              pat=json.loads((system/'patterns'/code/'pattern.json').read_text(encoding='utf-8'))
              prod=json.loads((system/'products'/code/'product.json').read_text(encoding='utf-8'))
              if pat.get('collection')!='florals' or prod.get('collection')!='florals':
                  raise SystemExit(f'{code}: wrong collection')
              if (pat.get('stitch_width'),pat.get('stitch_height'))!=(w,h):
                  raise SystemExit(f'{code}: wrong grid')
              if len(pat.get('matrix',[]))!=h or any(len(r)!=w for r in pat['matrix']):
                  raise SystemExit(f'{code}: malformed matrix')
              if not pat.get('threads') or len(pat['threads'])>max_colors:
                  raise SystemExit(f'{code}: invalid colour count')
              if any(str(t.get('dmc')) not in allowed_dmc for t in pat['threads']):
                  raise SystemExit(f'{code}: thread outside Florals palette')
              if (pat.get('outline_policy') or {}).get('enabled'):
                  raise SystemExit(f'{code}: Florals must not add an external outline')

              pdf=root/'content/products/files'/f'Drielo_{code}.pdf'
              image=root/'content/products/assets'/f'{code}-product.webp'
              gallery=[root/'content/products/assets'/f'{code}-gallery-{i}.webp' for i in (2,3,4)]
              if not pdf.is_file() or pdf.stat().st_size<100000 or pdf.read_bytes()[:4]!=b'%PDF':
                  raise SystemExit(f'{code}: invalid PDF')
              if not image.is_file() or image.stat().st_size<40000:
                  raise SystemExit(f'{code}: invalid product image')
              for g in gallery:
                  if not g.is_file() or g.stat().st_size<25000:
                      raise SystemExit(f'{code}: invalid gallery image {g.name}')

              row=rows.get(code)
              if not row or row.get('collection')!='florals' or not str(row.get('sku','')).startswith('DRIELO-F'):
                  raise SystemExit(f'{code}: missing Florals catalogue row / F-prefix SKU')
              expected_gallery=[f'assets/{code}-gallery-{i}.webp' for i in (2,3,4)]
              if row.get('gallery') != expected_gallery:
                  raise SystemExit(f'{code}: wrong gallery list')
              if row.get('gallery_preview_pages') != {'facts':3,'colour_a1':8,'symbol_a1':12}:
                  raise SystemExit(f'{code}: gallery page mapping missing')
              print(code,'stitches',pat['total_stitches'],'colors',len(pat['threads']),
                    'pdf',pdf.stat().st_size,'image',image.stat().st_size)
          print(design,'FLORALS_BUNDLE_VALID','bbox',bbox)
          PY

      - name: Enforce corrected Florals artwork QA
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          python3 - "$DESIGN" <<'PY'
          import json,sys
          from pathlib import Path
          design=sys.argv[1]
          root=Path('content/pattern-system')
          all_blue={'3753','3747','3325','3760'}
          pale_blue={'3753','3747'}
          all_blue_ids={'F0002','F0003','F0004'}
          pale_blue_ids={
              'F0006','F0007','F0009','F0010','F0012','F0013','F0014','F0015',
              'F0016','F0017','F0018','F0019','F0021','F0023','F0025','F0028','F0029'
          }
          for suffix in ('CS','C2C','TC','LH'):
              code=f'{design}-{suffix}'
              p=json.loads((root/'patterns'/code/'pattern.json').read_text(encoding='utf-8'))
              dmcs={str(t['dmc']) for t in p['threads']}
              if design in all_blue_ids and dmcs & all_blue:
                  raise SystemExit(f'{code}: forbidden blue artefact DMCs {sorted(dmcs & all_blue)}')
              if design in pale_blue_ids and dmcs & pale_blue:
                  raise SystemExit(f'{code}: forbidden pale-blue artefact DMCs {sorted(dmcs & pale_blue)}')
          print(design,'ARTWORK_QA_VALID')
          PY

      - name: Build isolated WooCommerce package
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          STAGE="/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"

          python3 - "$DESIGN" "$STAGE" <<'PY'
          import json,sys
          from pathlib import Path

          design=sys.argv[1]
          stage=Path(sys.argv[2])
          catalog=json.loads(Path('content/products/catalog.json').read_text(encoding='utf-8'))
          codes={f'{design}-{s}' for s in ('CS','C2C','TC','LH')}
          selected=[p for p in catalog.get('products',[]) if p.get('code') in codes]
          found={p.get('code') for p in selected}
          if found != codes:
              raise SystemExit(f'Package catalogue mismatch: {found} != {codes}')

          cats={slug for p in selected for slug in p.get('categories',[])}
          base=dict(catalog)
          base['collections']=[c for c in catalog.get('collections',[]) if c.get('slug')=='florals']
          base['categories']=[c for c in catalog.get('categories',[]) if c.get('slug') in cats]
          base['retired_products']=[]
          base['retired_collections']=[]
          if len(base['collections']) != 1:
              raise SystemExit('Florals collection definition missing')

          out=dict(base)
          out['products']=selected
          (stage/'content/products/catalog.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )

          by_code={p['code']:p for p in selected}
          for suffix in ('CS','C2C','TC','LH'):
              one=dict(base)
              one['products']=[by_code[f'{design}-{suffix}']]
              (stage/f'content/products/catalog-{suffix}.json').write_text(
                  json.dumps(one,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
              )
          PY

          for suffix in CS C2C TC LH; do
            code="${DESIGN}-${suffix}"
            cp "content/products/assets/${code}-product.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-2.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-3.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-4.webp" "$STAGE/content/products/assets/"
            cp "content/products/files/Drielo_${code}.pdf" "$STAGE/content/products/files/"
          done
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf "/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}.tgz" -C "$STAGE" content

      - name: Configure SSH
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_florals_key
          chmod 600 ~/.ssh/drielo_florals_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        if: steps.select.outputs.design_id != ''
        env:
          DESIGN: ${{ steps.select.outputs.design_id }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/drielo_florals_key "/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}.tgz" \
            "$VPS_USER@$VPS_HOST:/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}.tgz"

      - name: Publish four Florals products to WooCommerce and verify
        if: steps.select.outputs.design_id != ''
        env:
          DESIGN: ${{ steps.select.outputs.design_id }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_florals_key "$VPS_USER@$VPS_HOST" \
            "DESIGN='${DESIGN}' GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"

          CONTAINER_STAGE="/tmp/drielo-products-florals-${GITHUB_RUN_ID}"
          CONTAINER_IMPORTER="/tmp/drielo-import-products-florals-${GITHUB_RUN_ID}.php"
          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$CONTAINER_STAGE' '$CONTAINER_IMPORTER' && mkdir -p '$CONTAINER_STAGE'"
          "${DOCKER[@]}" cp "$STAGE/content/products/." "make-wp:${CONTAINER_STAGE}/"
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" "make-wp:${CONTAINER_IMPORTER}"

          for suffix in CS C2C TC LH; do
            code="${DESIGN}-${suffix}"
            "${DOCKER[@]}" exec make-wp sh -lc "
              test -s '${CONTAINER_STAGE}/assets/${code}-product.webp' &&
              test -s '${CONTAINER_STAGE}/assets/${code}-gallery-2.webp' &&
              test -s '${CONTAINER_STAGE}/assets/${code}-gallery-3.webp' &&
              test -s '${CONTAINER_STAGE}/assets/${code}-gallery-4.webp' &&
              test -s '${CONTAINER_STAGE}/files/Drielo_${code}.pdf' &&
              cp '${CONTAINER_STAGE}/catalog-${suffix}.json' '${CONTAINER_STAGE}/catalog.json'
            "

            ok=0
            for attempt in 1 2 3; do
              echo "Importing ${code} attempt ${attempt}/3"
              if "${DOCKER[@]}" exec make-wp php -d memory_limit=1024M -d max_execution_time=0 \
                   "$CONTAINER_IMPORTER" /var/www/html "$CONTAINER_STAGE"; then
                ok=1
                break
              fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: failed to import ${code} after 3 attempts"
              exit 4
            fi
          done

          "${DOCKER[@]}" exec -e DESIGN="$DESIGN" make-wp php -d memory_limit=1024M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";
            $design=getenv("DESIGN");
            foreach(array("CS","C2C","TC","LH") as $suffix){
              $sku="DRIELO-".$design."-".$suffix;
              $id=wc_get_product_id_by_sku($sku);
              $p=$id ? wc_get_product($id) : false;
              if(!$p){fwrite(STDERR,"MISSING ".$sku.PHP_EOL);exit(2);}
              $terms=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
              $downloads=count($p->get_downloads());
              $image=$p->get_image_id();
              $gallery=count($p->get_gallery_image_ids());
              echo $sku." id=".$id." status=".$p->get_status()." image=".$image.
                   " gallery=".$gallery." downloads=".$downloads." collection=".
                   implode(",",is_wp_error($terms)?array():$terms)." url=".get_permalink($id).PHP_EOL;
              if($p->get_status()!=="publish" || !$image || $gallery<3 || $downloads<1 ||
                 !in_array("florals",is_wp_error($terms)?array():$terms,true)){
                fwrite(STDERR,"Incomplete ".$sku.PHP_EOL);exit(3);
              }
            }
          '
          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$CONTAINER_STAGE' '$CONTAINER_IMPORTER'"
          REMOTE

      - name: Mark Florals design published
        if: success() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          python3 content/pattern-system/florals/queue_state.py success "$DESIGN" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Commit generated Florals design and advance queue
        if: success() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/pattern-system/florals/publish_queue.json
          git add content/pattern-system/collections/florals/designs.json
          git add content/pattern-system/collections/florals/source-designs/manifest.json
          git add content/pattern-system/collections/florals/source-designs/${DESIGN}-*.png
          git add content/pattern-system/collections/florals/reference-masters/${DESIGN}-*-reference.png
          git add content/products/catalog.json
          for suffix in CS C2C TC LH; do
            code="${DESIGN}-${suffix}"
            git add "content/pattern-system/patterns/${code}/pattern.json"
            git add "content/pattern-system/products/${code}/product.json"
            git add "content/products/assets/${code}-product.webp"
            git add "content/products/assets/${code}-gallery-2.webp"
            git add "content/products/assets/${code}-gallery-3.webp"
            git add "content/products/assets/${code}-gallery-4.webp"
            git add "content/products/files/Drielo_${code}.pdf"
          done

          if git diff --cached --quiet; then
            echo "No Florals files changed."
          else
            git commit -m "Publish Florals ${DESIGN} in four techniques"
            git fetch --depth=20 origin feature/florals-clean-reimport
            git rebase origin/feature/florals-clean-reimport
            git push origin HEAD:feature/florals-clean-reimport
          fi

      - name: Archive four Florals PDFs
        if: success() && steps.select.outputs.design_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: florals-${{ steps.select.outputs.design_id }}-pdfs
          path: |
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-CS.pdf
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-C2C.pdf
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-TC.pdf
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-LH.pdf
          retention-days: 30

      - name: Record failure and allow Florals queue to continue
        if: failure() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=20 origin feature/florals-clean-reimport
          git reset --hard origin/feature/florals-clean-reimport
          python3 content/pattern-system/florals/queue_state.py fail "$DESIGN" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --error "Florals production publish run failed; see GitHub Actions logs."
          git add content/pattern-system/florals/publish_queue.json
          git commit -m "Record Florals ${DESIGN} auto-publish result"
          git push origin HEAD:feature/florals-clean-reimport

      - name: Dispatch next queued Florals design
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=20 origin feature/florals-clean-reimport
          git reset --hard origin/feature/florals-clean-reimport
          if [ "$(python3 content/pattern-system/florals/queue_state.py has-work)" = "yes" ]; then
            echo "Pending Florals designs remain; dispatching the next run."
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/florals-clean-reimport-publish.yml/dispatches" \
              -f ref=feature/florals-clean-reimport
          else
            echo "No pending Florals designs remain."
            python3 content/pattern-system/florals/queue_state.py summary
          fi


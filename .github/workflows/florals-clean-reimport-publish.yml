name: Florals Clean Reimport Queue

on:
  push:
    branches:
      - feature/florals-clean-reimport
    paths:
      - '.github/workflows/florals-clean-reimport-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drielo-florals-clean-reimport
  cancel-in-progress: true

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Florals import paused
        run: echo "Florals clean reimport is intentionally paused. No products will be generated or published."

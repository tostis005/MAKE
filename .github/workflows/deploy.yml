              -e MAKE_SMOKE_NEEDLE="$needle" \
              -e MAKE_SMOKE_LABEL="$label" \
              -e MAKE_SMOKE_FORBIDDEN="$forbidden" \
              make-wp php -r '
                $host=getenv("MAKE_SMOKE_HOST");
                $route=getenv("MAKE_SMOKE_ROUTE");
                $needle=getenv("MAKE_SMOKE_NEEDLE");
                $label=getenv("MAKE_SMOKE_LABEL");
                $forbidden=getenv("MAKE_SMOKE_FORBIDDEN");
                $context=stream_context_create(array("http"=>array(
                    "method"=>"GET",
                    "header"=>"Host: ".$host."\r\nUser-Agent: Drielo-Smoke\r\n",
                    "ignore_errors"=>true,
                    "follow_location"=>0,
                    "timeout"=>15,
                )));
                $html=@file_get_contents("http://127.0.0.1".$route,false,$context);
                $status=$http_response_header[0] ?? "no-status";
                $has_forbidden=$forbidden!=="" && $html!==false && strpos($html,$forbidden)!==false;
                if ($html===false || strpos($status,"200")===false || ($needle!=="" && strpos($html,$needle)===false) || $has_forbidden) {
                    fwrite(STDERR,$label." smoke test failed route=".$route." status=".$status.PHP_EOL);
                    exit(2);

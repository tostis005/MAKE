name: Deploy Drielo theme to WordPress

on:
  push:
    branches: [main]
    paths:
      - '*.php'
      - 'inc/**'
      - 'style.css'
      - 'assets/**'
      - 'plugins/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: make-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate WordPress theme
        shell: bash
        run: |
          set -euo pipefail
          test -s style.css
          test -s functions.php
          test -s header.php
          test -s front-page.php
          test -s home.php
          find . -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          node --check assets/js/site.js

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/make_deploy_key
          chmod 600 ~/.ssh/make_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Build approved category artwork
        shell: bash
        run: |
          set -euo pipefail
          cat \
            assets/images/categories/.latest-sprite.part00 \
            assets/images/categories/.latest-sprite.part01 \
            assets/images/categories/.latest-sprite.part02 \
            assets/images/categories/.latest-sprite.part03 \
            assets/images/categories/.latest-sprite.part04 \
            assets/images/categories/.latest-sprite.part05 \
            assets/images/categories/.latest-sprite.part06 \
            assets/images/categories/.latest-sprite.part07 \
            assets/images/categories/.latest-sprite.part07a \
            assets/images/categories/.latest-sprite.part08 \
            assets/images/categories/.latest-sprite.part09 \
            assets/images/categories/.latest-sprite.part10 \
            assets/images/categories/.latest-sprite.part11 \
            assets/images/categories/.latest-sprite.part12 \
            | base64 --decode > assets/images/categories/category-art-generated.webp
          test "$(wc -c < assets/images/categories/category-art-generated.webp)" -eq 108898
          php -r '$d=file_get_contents("assets/images/categories/category-art-generated.webp"); if (substr($d,0,4)!=="RIFF" || substr($d,8,4)!=="WEBP") { fwrite(STDERR,"Invalid generated category sprite\n"); exit(1); }'
          rm assets/images/categories/.latest-sprite.part*

      - name: Build Drielo Etsy Sync plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/drielo-etsy-sync.tar.gz
          test -s plugins/drielo-etsy-sync/drielo-etsy-sync.php
          php -l plugins/drielo-etsy-sync/drielo-etsy-sync.php
          tar -C plugins -czf /tmp/drielo-etsy-sync.tar.gz drielo-etsy-sync

      - name: Build Drielo Catalog Architecture plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/drielo-catalog-plugin /tmp/drielo-catalog-architecture.zip /tmp/drielo-catalog-architecture.tar.gz
          mkdir -p /tmp/drielo-catalog-plugin
          base64 --decode plugins/drielo-catalog-architecture-1.3.0.zip.b64 > /tmp/drielo-catalog-architecture.zip
          unzip -q /tmp/drielo-catalog-architecture.zip -d /tmp/drielo-catalog-plugin
          test -s /tmp/drielo-catalog-plugin/drielo-catalog-architecture/drielo-catalog-architecture.php
          php -l /tmp/drielo-catalog-plugin/drielo-catalog-architecture/drielo-catalog-architecture.php
          tar -C /tmp/drielo-catalog-plugin -czf /tmp/drielo-catalog-architecture.tar.gz drielo-catalog-architecture

      - name: Build official WooCommerce Stripe Gateway plugin
        shell: bash
        run: |
          set -euo pipefail
          STRIPE_VERSION="11.0.0"
          rm -rf /tmp/stripe-plugin /tmp/woocommerce-gateway-stripe.zip /tmp/woocommerce-gateway-stripe.tar.gz
          mkdir -p /tmp/stripe-plugin
          curl -fL --retry 3 --retry-delay 2 \
            "https://downloads.wordpress.org/plugin/woocommerce-gateway-stripe.${STRIPE_VERSION}.zip" \
            -o /tmp/woocommerce-gateway-stripe.zip
          unzip -q /tmp/woocommerce-gateway-stripe.zip -d /tmp/stripe-plugin
          test -s /tmp/stripe-plugin/woocommerce-gateway-stripe/woocommerce-gateway-stripe.php
          php -l /tmp/stripe-plugin/woocommerce-gateway-stripe/woocommerce-gateway-stripe.php
          tar -C /tmp/stripe-plugin -czf /tmp/woocommerce-gateway-stripe.tar.gz woocommerce-gateway-stripe

      - name: Package theme
        run: tar --exclude='./.git' --exclude='./.github' --exclude='./README.md' --exclude='./plugins' -czf /tmp/make-theme.tar.gz .

      - name: Upload theme
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/make_deploy_key /tmp/make-theme.tar.gz "$VPS_USER@$VPS_HOST:/tmp/make-theme-${GITHUB_RUN_ID}.tar.gz"

      - name: Upload Drielo Etsy Sync plugin
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/make_deploy_key /tmp/drielo-etsy-sync.tar.gz "$VPS_USER@$VPS_HOST:/tmp/drielo-etsy-sync-${GITHUB_RUN_ID}.tar.gz"

      - name: Upload Drielo Catalog Architecture plugin
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/make_deploy_key /tmp/drielo-catalog-architecture.tar.gz "$VPS_USER@$VPS_HOST:/tmp/drielo-catalog-architecture-${GITHUB_RUN_ID}.tar.gz"

      - name: Upload official WooCommerce Stripe Gateway plugin
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/make_deploy_key /tmp/woocommerce-gateway-stripe.tar.gz "$VPS_USER@$VPS_HOST:/tmp/woocommerce-gateway-stripe-${GITHUB_RUN_ID}.tar.gz"

      - name: Deploy into Drielo WordPress container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/make_deploy_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/make-theme-${GITHUB_RUN_ID}.tar.gz"
          STAGE="/tmp/make-theme-${GITHUB_RUN_ID}"
          TARGET="/var/www/html/wp-content/themes/make"
          PLUGIN_ARCHIVE="/tmp/drielo-etsy-sync-${GITHUB_RUN_ID}.tar.gz"
          PLUGIN_STAGE="/tmp/drielo-etsy-sync-${GITHUB_RUN_ID}"
          PLUGIN_TARGET="/var/www/html/wp-content/plugins/drielo-etsy-sync"
          CATALOG_PLUGIN_ARCHIVE="/tmp/drielo-catalog-architecture-${GITHUB_RUN_ID}.tar.gz"
          CATALOG_PLUGIN_STAGE="/tmp/drielo-catalog-architecture-${GITHUB_RUN_ID}"
          CATALOG_PLUGIN_TARGET="/var/www/html/wp-content/plugins/drielo-catalog-architecture"
          STRIPE_PLUGIN_ARCHIVE="/tmp/woocommerce-gateway-stripe-${GITHUB_RUN_ID}.tar.gz"
          STRIPE_PLUGIN_STAGE="/tmp/woocommerce-gateway-stripe-${GITHUB_RUN_ID}"
          STRIPE_PLUGIN_TARGET="/var/www/html/wp-content/plugins/woocommerce-gateway-stripe"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE" "$PLUGIN_ARCHIVE" "$PLUGIN_STAGE" "$CATALOG_PLUGIN_ARCHIVE" "$CATALOG_PLUGIN_STAGE" "$STRIPE_PLUGIN_ARCHIVE" "$STRIPE_PLUGIN_STAGE"; }
          trap cleanup EXIT
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi
          rm -rf "$STAGE" "$PLUGIN_STAGE" "$CATALOG_PLUGIN_STAGE" "$STRIPE_PLUGIN_STAGE"
          mkdir -p "$STAGE" "$PLUGIN_STAGE" "$CATALOG_PLUGIN_STAGE" "$STRIPE_PLUGIN_STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          tar -xzf "$PLUGIN_ARCHIVE" -C "$PLUGIN_STAGE"
          tar -xzf "$CATALOG_PLUGIN_ARCHIVE" -C "$CATALOG_PLUGIN_STAGE"
          tar -xzf "$STRIPE_PLUGIN_ARCHIVE" -C "$STRIPE_PLUGIN_STAGE"
          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$TARGET' && mkdir -p '$TARGET'"
          "${DOCKER[@]}" cp "$STAGE/." "make-wp:$TARGET/"
          "${DOCKER[@]}" exec make-wp sh -lc "chown -R www-data:www-data '$TARGET' && find '$TARGET' -type d -exec chmod 755 {} + && find '$TARGET' -type f -exec chmod 644 {} + && test -s '$TARGET/style.css' && test -s '$TARGET/functions.php'"

          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$PLUGIN_TARGET' && mkdir -p '$PLUGIN_TARGET'"
          "${DOCKER[@]}" cp "$PLUGIN_STAGE/drielo-etsy-sync/." "make-wp:$PLUGIN_TARGET/"
          "${DOCKER[@]}" exec make-wp sh -lc "chown -R www-data:www-data '$PLUGIN_TARGET' && find '$PLUGIN_TARGET' -type d -exec chmod 755 {} + && find '$PLUGIN_TARGET' -type f -exec chmod 644 {} + && test -s '$PLUGIN_TARGET/drielo-etsy-sync.php'"
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            require_once ABSPATH . "wp-admin/includes/plugin.php";
            $plugin = "drielo-etsy-sync/drielo-etsy-sync.php";
            if (!is_plugin_active($plugin)) {
                $result = activate_plugin($plugin);
                if (is_wp_error($result)) {
                    fwrite(STDERR, "Drielo Etsy Sync activation failed: " . $result->get_error_message() . PHP_EOL);
                    exit(2);
                }
            }
            echo "DRIELO_ETSY_PLUGIN_ACTIVE=" . (is_plugin_active($plugin) ? "yes" : "no") . PHP_EOL;
          '
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            require_once ABSPATH . "wp-admin/includes/plugin.php";
            $plugin = "drielo-etsy-sync/drielo-etsy-sync.php";
            if (!is_plugin_active($plugin) || !class_exists("Drielo_Etsy_Sync")) {
                fwrite(STDERR, "Drielo Etsy Sync verification failed" . PHP_EOL);
                exit(2);
            }
            $data = get_plugin_data(WP_PLUGIN_DIR . "/" . $plugin, false, false);
            $version = isset($data["Version"]) ? (string) $data["Version"] : "";
            if ("1.4.8" !== $version) {
                fwrite(STDERR, "Unexpected Drielo Etsy Sync version: " . $version . PHP_EOL);
                exit(2);
            }
            echo "DRIELO_ETSY_PLUGIN_VERSION=" . $version . PHP_EOL;
                        echo "DRIELO_ETSY_PLUGIN_VERIFIED=yes" . PHP_EOL;
          '

          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$CATALOG_PLUGIN_TARGET' && mkdir -p '$CATALOG_PLUGIN_TARGET'"
          "${DOCKER[@]}" cp "$CATALOG_PLUGIN_STAGE/drielo-catalog-architecture/." "make-wp:$CATALOG_PLUGIN_TARGET/"
          "${DOCKER[@]}" exec make-wp sh -lc "chown -R www-data:www-data '$CATALOG_PLUGIN_TARGET' && find '$CATALOG_PLUGIN_TARGET' -type d -exec chmod 755 {} + && find '$CATALOG_PLUGIN_TARGET' -type f -exec chmod 644 {} + && test -s '$CATALOG_PLUGIN_TARGET/drielo-catalog-architecture.php'"

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            require_once ABSPATH . "wp-admin/includes/plugin.php";
            $plugin = "drielo-catalog-architecture/drielo-catalog-architecture.php";
            if (!is_plugin_active($plugin)) {
                $result = activate_plugin($plugin);
                if (is_wp_error($result)) {
                    fwrite(STDERR, "Drielo Catalog Architecture activation failed: " . $result->get_error_message() . PHP_EOL);
                    exit(2);
                }
            }
            echo "DRIELO_CATALOG_PLUGIN_ACTIVE=" . (is_plugin_active($plugin) ? "yes" : "no") . PHP_EOL;
          '

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            if (!class_exists("Drielo_Catalog_Architecture")) {
                fwrite(STDERR, "Drielo Catalog Architecture bootstrap failed" . PHP_EOL);
                exit(2);
            }
            Drielo_Catalog_Architecture::install();
            echo "DRIELO_CATALOG_ATTRIBUTES_BOOTSTRAPPED=yes" . PHP_EOL;
          '

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            if (!class_exists("Drielo_Catalog_Architecture")) {
                fwrite(STDERR, "Drielo Catalog Architecture verification failed" . PHP_EOL);
                exit(2);
            }
            foreach (array("pa_technique","pa_theme","pa_style","pa_project","pa_orientation","pa_season","pa_difficulty","pa_color-family") as $taxonomy) {
                if (!taxonomy_exists($taxonomy)) {
                    fwrite(STDERR, "Missing catalog taxonomy: " . $taxonomy . PHP_EOL);
                    exit(2);
                }
            }
            $result = Drielo_Catalog_Architecture::migrate_current_products();
            $cross = get_term_by("slug","cross-stitch","pa_technique");
            if (!$cross) {
                fwrite(STDERR, "Missing Cross Stitch term" . PHP_EOL);
                exit(2);
            }
            echo "DRIELO_CATALOG_PLUGIN_VERIFIED=yes" . PHP_EOL;
            echo "DRIELO_CATALOG_CROSS_STITCH_COUNT=" . (int) $cross->count . PHP_EOL;
            echo "DRIELO_CATALOG_MIGRATED=" . (int) ($result["updated"] ?? 0) . PHP_EOL;
          '

          if ! "${DOCKER[@]}" exec make-wp sh -lc "test -s '$STRIPE_PLUGIN_TARGET/woocommerce-gateway-stripe.php'"; then
            "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$STRIPE_PLUGIN_TARGET' && mkdir -p '$STRIPE_PLUGIN_TARGET'"
            "${DOCKER[@]}" cp "$STRIPE_PLUGIN_STAGE/woocommerce-gateway-stripe/." "make-wp:$STRIPE_PLUGIN_TARGET/"
            "${DOCKER[@]}" exec make-wp sh -lc "chown -R www-data:www-data '$STRIPE_PLUGIN_TARGET' && find '$STRIPE_PLUGIN_TARGET' -type d -exec chmod 755 {} + && find '$STRIPE_PLUGIN_TARGET' -type f -exec chmod 644 {} +"
            echo "DRIELO_STRIPE_PLUGIN_INSTALLED=yes"
          else
            echo "DRIELO_STRIPE_PLUGIN_INSTALLED=existing"
          fi

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            require_once ABSPATH . "wp-admin/includes/plugin.php";
            $plugin = "woocommerce-gateway-stripe/woocommerce-gateway-stripe.php";
            if (!is_plugin_active($plugin)) {
                $result = activate_plugin($plugin);
                if (is_wp_error($result)) {
                    fwrite(STDERR, "WooCommerce Stripe Gateway activation failed: " . $result->get_error_message() . PHP_EOL);
                    exit(2);
                }
            }
            $data = get_plugin_data(WP_PLUGIN_DIR . "/" . $plugin, false, false);
            $adaptive = apply_filters("wc_stripe_is_adaptive_pricing_supported", true);
            if ($adaptive !== false) {
                fwrite(STDERR, "Stripe Adaptive Pricing guard is not active" . PHP_EOL);
                exit(2);
            }
            echo "DRIELO_STRIPE_PLUGIN_ACTIVE=" . (is_plugin_active($plugin) ? "yes" : "no") . PHP_EOL;
            echo "DRIELO_STRIPE_PLUGIN_VERSION=" . ($data["Version"] ?? "unknown") . PHP_EOL;
            echo "DRIELO_STRIPE_ADAPTIVE_PRICING=disabled" . PHP_EOL;
            echo "DRIELO_WP_VERSION=" . get_bloginfo("version") . PHP_EOL;
            echo "DRIELO_WC_VERSION=" . (defined("WC_VERSION") ? WC_VERSION : "unknown") . PHP_EOL;
          '

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $desired = "/%postname%/";
            if ((string) get_option("permalink_structure", "") !== $desired) {
                update_option("permalink_structure", $desired);
            }
            if ((int) get_option("blog_public", 0) !== 1) {
                update_option("blog_public", 1);
            }
            if ((string) get_option("blogname", "") !== "Drielo") {
                update_option("blogname", "Drielo");
            }
            require_once ABSPATH . "wp-admin/includes/misc.php";
            flush_rewrite_rules(false);
            global $wp_rewrite;
            $rules = explode("\n", trim((string) $wp_rewrite->mod_rewrite_rules()));
            $written = insert_with_markers(ABSPATH . ".htaccess", "WordPress", $rules);
            $image_cache_rules = array(
                "<IfModule mod_expires.c>",
                "ExpiresActive On",
                "ExpiresByType image/avif \"access plus 1 hour\"",
                "ExpiresByType image/gif \"access plus 1 hour\"",
                "ExpiresByType image/jpeg \"access plus 1 hour\"",
                "ExpiresByType image/png \"access plus 1 hour\"",
                "ExpiresByType image/webp \"access plus 1 hour\"",
                "</IfModule>",
                "<IfModule mod_headers.c>",
                "<FilesMatch \"\\.(?:avif|gif|jpe?g|png|webp)$\">",
                "Header set Cache-Control \"public, max-age=3600, stale-while-revalidate=86400\"",
                "</FilesMatch>",
                "</IfModule>",
            );
            $cache_written = insert_with_markers(ABSPATH . ".htaccess", "Drielo Image Cache", $image_cache_rules);
            echo "MAKE_PERMALINK_STRUCTURE=" . (string) get_option("permalink_structure", "") . PHP_EOL;
            echo "MAKE_BLOG_PUBLIC=" . (string) get_option("blog_public", "") . PHP_EOL;
            echo "MAKE_HTACCESS=" . (is_readable(ABSPATH . ".htaccess") ? "present" : "missing") . PHP_EOL;
            echo "MAKE_HTACCESS_RULES=" . ($written ? "written" : "failed") . PHP_EOL;
            echo "MAKE_IMAGE_CACHE_RULES=" . ($cache_written ? "written" : "failed") . PHP_EOL;
            if ( function_exists( "wp_cache_flush" ) ) { wp_cache_flush(); }
            if ( function_exists( "rocket_clean_domain" ) ) { rocket_clean_domain(); }
            if ( function_exists( "wp_cache_clear_cache" ) ) { wp_cache_clear_cache(); }
            if ( function_exists( "w3tc_flush_all" ) ) { w3tc_flush_all(); }
            do_action( "litespeed_purge_all" );
            echo "Drielo theme deployed" . PHP_EOL;
          '
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            require_once ABSPATH . "wp-admin/includes/image.php";
            $ids=get_posts(array(
              "post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids",
              "meta_key"=>"_drielo_managed_product","meta_value"=>"1"
            ));
            $attachments=array();
            foreach($ids as $id){
              $image_id=(int)get_post_thumbnail_id($id);
              if($image_id>0){$attachments[$image_id]=true;}
            }
            foreach(array_keys($attachments) as $attachment_id){
              if(function_exists("wp_update_image_subsizes")){
                wp_update_image_subsizes((int)$attachment_id);
              } else {
                $file=get_attached_file((int)$attachment_id);
                if($file){
                  $metadata=wp_generate_attachment_metadata((int)$attachment_id,$file);
                  if(is_array($metadata)){wp_update_attachment_metadata((int)$attachment_id,$metadata);}
                }
              }
            }
            echo "DRIELO_CARD_DERIVATIVES=" . count($attachments) . PHP_EOL;
            if (!empty($attachments)) {
              $sample_id=(int)array_key_first($attachments);
              foreach(array("make-store-card-small-context","make-store-card-context") as $sample_size){
                $sample=wp_get_attachment_image_src($sample_id,$sample_size);
                $meta=wp_get_attachment_metadata($sample_id);
                $bytes=0;
                if(is_array($meta) && isset($meta["sizes"][$sample_size]["file"])){
                  $base=dirname((string)get_attached_file($sample_id));
                  $file=$base . "/" . $meta["sizes"][$sample_size]["file"];
                  if(is_file($file)){$bytes=(int)filesize($file);}
                }
                if(is_array($sample)){
                  echo "DRIELO_CARD_SAMPLE size=" . $sample_size . " width=" . (int)$sample[1] . " height=" . (int)$sample[2] . " bytes=" . $bytes . " url=" . $sample[0] . PHP_EOL;
                  $head=wp_remote_head($sample[0],array("timeout"=>15,"redirection"=>2));
                  if(!is_wp_error($head)){
                    echo "DRIELO_CARD_HEADERS size=" . $sample_size . " cache-control=" . (string)wp_remote_retrieve_header($head,"cache-control") . " content-length=" . (string)wp_remote_retrieve_header($head,"content-length") . " server=" . (string)wp_remote_retrieve_header($head,"server") . PHP_EOL;
                  }
                }
              }
            }
          '
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            echo "MAKE_SITE_URL=" . home_url("/") . PHP_EOL;
            foreach (array("es","en") as $lang) {
                $q = new WP_Query(array(
                    "post_type" => "post",
                    "post_status" => "publish",
                    "posts_per_page" => 1,
                    "meta_query" => array(array("key" => "_make_language", "value" => $lang)),
                ));
                echo "MAKE_JOURNAL_" . strtoupper($lang) . "_COUNT=" . (int) $q->found_posts . PHP_EOL;
            }
            echo "MAKE_JOURNAL_ES_URL=" . (function_exists("make_journal_url") ? make_journal_url("es") : home_url("/journal/")) . PHP_EOL;
            echo "MAKE_JOURNAL_EN_URL=" . (function_exists("make_journal_url") ? make_journal_url("en") : home_url("/en/journal/")) . PHP_EOL;
            echo "MAKE_POLYLANG=" . (function_exists("pll_current_language") ? "yes" : "no") . PHP_EOL;
            $posts_page = (int) get_option("page_for_posts");
            echo "MAKE_PAGE_FOR_POSTS=" . $posts_page . PHP_EOL;
            if ($posts_page) {
                echo "MAKE_PAGE_FOR_POSTS_SLUG=" . get_post_field("post_name", $posts_page) . PHP_EOL;
                echo "MAKE_PAGE_FOR_POSTS_STATUS=" . get_post_status($posts_page) . PHP_EOL;
                echo "MAKE_PAGE_FOR_POSTS_URL=" . get_permalink($posts_page) . PHP_EOL;
            }
            $rules = get_option("rewrite_rules", array());
            $rules = is_array($rules) ? $rules : array();
            foreach ($rules as $pattern => $target) {
                if (strpos($pattern, "journal") !== false || strpos($pattern, "categoria") !== false || strpos($pattern, "category") !== false) {
                    echo "MAKE_REWRITE_RULE=" . $pattern . " => " . $target . PHP_EOL;
                }
            }
          '
          SITE_HOST="$( "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r 'require "/var/www/html/wp-load.php"; $u=parse_url(home_url("/")); echo $u["host"] . (isset($u["port"]) ? ":" . $u["port"] : "");' )"

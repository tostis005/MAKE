            if (!is_array($shop_card) || (int)$shop_card[1]>560 || (int)$shop_card[2]>700 || !is_array($home_card) || (int)$home_card[1]>560 || (int)$home_card[2]>700 || !is_array($collection_card) || (int)$collection_card[1]>300 || (int)$collection_card[2]>300) {

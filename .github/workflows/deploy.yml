            $rate=(float)make_store_usd_eur_rate();
            $expected=round($usd*$rate,6);
            if (abs($usd-4.99)>0.001 || abs($eur-$expected)>0.001 || $rate<=0) {
                fwrite(STDERR,"Currency conversion failed USD=".$usd." EUR=".$eur." RATE=".$rate.PHP_EOL);
                exit(2);
            }
            echo "DRIELO_CURRENCY_OK USD=".$usd." EUR=".$eur." RATE=".$rate.PHP_EOL;
          '


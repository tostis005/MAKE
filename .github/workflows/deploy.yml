name: Deploy MAKE theme to WordPress

on:
  push:
    branches: [main]
    paths:
      - '*.php'
      - 'style.css'
      - 'assets/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: make-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate WordPress theme
        shell: bash
        run: |
          set -euo pipefail
          test -s style.css
          test -s functions.php
          test -s header.php
          test -s front-page.php
          test -s home.php
          find . -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          node --check assets/js/site.js

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/make_deploy_key
          chmod 600 ~/.ssh/make_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Package theme
        run: tar --exclude='./.git' --exclude='./.github' --exclude='./README.md' -czf /tmp/make-theme.tar.gz .

      - name: Upload theme
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/make_deploy_key /tmp/make-theme.tar.gz "$VPS_USER@$VPS_HOST:/tmp/make-theme-${GITHUB_RUN_ID}.tar.gz"

      - name: Deploy into make-wp container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/make_deploy_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/make-theme-${GITHUB_RUN_ID}.tar.gz"
          STAGE="/tmp/make-theme-${GITHUB_RUN_ID}"
          TARGET="/var/www/html/wp-content/themes/make"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi
          rm -rf "$STAGE" && mkdir -p "$STAGE" && tar -xzf "$ARCHIVE" -C "$STAGE"
          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$TARGET' && mkdir -p '$TARGET'"
          "${DOCKER[@]}" cp "$STAGE/." "make-wp:$TARGET/"
          "${DOCKER[@]}" exec make-wp sh -lc "chown -R www-data:www-data '$TARGET' && find '$TARGET' -type d -exec chmod 755 {} + && find '$TARGET' -type f -exec chmod 644 {} + && test -s '$TARGET/style.css' && test -s '$TARGET/functions.php'"
          "${DOCKER[@]}" exec make-wp php -r '
            require "/var/www/html/wp-load.php";
            require_once ABSPATH . "wp-admin/includes/misc.php";
            $structure = (string) get_option("permalink_structure", "");
            if ($structure === "") {
                update_option("permalink_structure", "/%postname%/");
                echo "MAKE_PERMALINK_STRUCTURE=/%postname%/ (configured)" . PHP_EOL;
            } else {
                echo "MAKE_PERMALINK_STRUCTURE=" . $structure . PHP_EOL;
            }
            flush_rewrite_rules(true);
            if (function_exists("save_mod_rewrite_rules")) {
                $saved = save_mod_rewrite_rules();
                echo "MAKE_HTACCESS_WRITTEN=" . ($saved ? "yes" : "no") . PHP_EOL;
            }
            echo "MAKE theme deployed" . PHP_EOL;
          '
          "${DOCKER[@]}" exec make-wp php -r '
            require "/var/www/html/wp-load.php";
            echo "MAKE_SITE_URL=" . home_url("/") . PHP_EOL;
            foreach (array("es","en") as $lang) {
                $q = new WP_Query(array(
                    "post_type" => "post",
                    "post_status" => "publish",
                    "posts_per_page" => 1,
                    "meta_query" => array(array("key" => "_make_language", "value" => $lang)),
                ));
                echo "MAKE_JOURNAL_" . strtoupper($lang) . "_COUNT=" . (int) $q->found_posts . PHP_EOL;
            }
            echo "MAKE_JOURNAL_ES_URL=" . home_url("/journal/") . PHP_EOL;
            echo "MAKE_JOURNAL_EN_URL=" . home_url("/en/journal/") . PHP_EOL;
            echo "MAKE_POLYLANG=" . (function_exists("pll_current_language") ? "yes" : "no") . PHP_EOL;
            $posts_page = (int) get_option("page_for_posts");
            echo "MAKE_PAGE_FOR_POSTS=" . $posts_page . PHP_EOL;
            if ($posts_page) {
                echo "MAKE_PAGE_FOR_POSTS_SLUG=" . get_post_field("post_name", $posts_page) . PHP_EOL;
                echo "MAKE_PAGE_FOR_POSTS_STATUS=" . get_post_status($posts_page) . PHP_EOL;
                echo "MAKE_PAGE_FOR_POSTS_URL=" . get_permalink($posts_page) . PHP_EOL;
            }
            $rules = get_option("rewrite_rules", array());
            $rules = is_array($rules) ? $rules : array();
            foreach ($rules as $pattern => $target) {
                if (strpos($pattern, "journal") !== false) {
                    echo "MAKE_REWRITE_RULE=" . $pattern . " => " . $target . PHP_EOL;
                }
            }
          '
          SITE_HOST="$( "${DOCKER[@]}" exec make-wp php -r 'require "/var/www/html/wp-load.php"; $u=parse_url(home_url("/")); echo $u["host"] . (isset($u["port"]) ? ":" . $u["port"] : "");' )"
          for ROUTE in /journal/ /en/journal/; do
            "${DOCKER[@]}" exec \
              -e MAKE_SMOKE_HOST="$SITE_HOST" \
              -e MAKE_SMOKE_ROUTE="$ROUTE" \
              make-wp php -r '
                $host = getenv("MAKE_SMOKE_HOST");
                $route = getenv("MAKE_SMOKE_ROUTE");
                $context = stream_context_create(array(
                    "http" => array(
                        "method" => "GET",
                        "header" => "Host: " . $host . "\r\nUser-Agent: MAKE-Journal-Smoke\r\n",
                        "ignore_errors" => true,
                        "follow_location" => 0,
                        "timeout" => 15,
                    ),
                ));
                $html = @file_get_contents("http://127.0.0.1" . $route, false, $context);
                $status = isset($http_response_header[0]) ? $http_response_header[0] : "no-status";
                $needle = str_starts_with($route, "/en/") ? "Latest articles" : "Últimos artículos";
                if ($html === false || strpos($status, "200") === false || strpos($html, $needle) === false || strpos($html, "post-card") === false) {
                    fwrite(STDERR, "Journal HTTP smoke test failed for " . $route . " status=" . $status . PHP_EOL);
                    exit(2);
                }
                echo "MAKE_JOURNAL_SMOKE_OK=" . $route . " status=" . $status . " bytes=" . strlen($html) . PHP_EOL;
              '
          done
          REMOTE

          if [ "$CURRENCY_STATUS" != "302" ] || ! grep -q "drielo_currency.*EUR" "$CURRENCY_COOKIE" || ! grep -q "drielo_usd_eur_rate" "$CURRENCY_COOKIE" || printf '%s' "$CURRENCY_LOCATION" | grep -q "currency="; then

name: Preview P1000 Aida fabric prototype

on:
  push:
    branches:
      - 'test/p1000-approved-stitch-aida-v2-20260925'
    paths:
      - 'tmp/aida-fabric-preview-trigger.txt'

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Render Einstein P1000 locally only
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/renderer/render.py --product P1000-CS --fix-palette
          test -s content/pattern-system/output/P1000-CS/P1000-CS-product.webp
          test -s content/pattern-system/output/P1000-CS/P1000-CS.html

      - name: Capture approved-stitch Aida preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out=Path("content/pattern-system/output/P1000-CS")
          html=out/"P1000-CS.html"
          preview=out/"P1000-CS-aida-fabric-preview.png"
          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              page=browser.new_page(viewport={"width":1600,"height":2200},device_scale_factor=3)
              page.goto(html.resolve().as_uri(),wait_until="load",timeout=120000)
              page.wait_for_function("document.documentElement.getAttribute('data-drielo-ready') === '1'",timeout=120000)
              page.locator("#finished-design").screenshot(path=str(preview),type="png")
              browser.close()
          if not preview.is_file() or preview.stat().st_size < 10000:
              raise SystemExit("Aida preview capture failed")
          print(preview, preview.stat().st_size)
          PY

      - name: Upload prototype images
        uses: actions/upload-artifact@v4
        with:
          name: p1000-approved-stitch-aida-v2
          path: |
            content/pattern-system/output/P1000-CS/P1000-CS-product.webp
            content/pattern-system/output/P1000-CS/P1000-CS-aida-fabric-preview.png
          retention-days: 30

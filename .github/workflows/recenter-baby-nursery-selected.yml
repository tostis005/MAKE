name: Recenter Baby Nursery Selected Designs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recenter-baby-nursery-selected.yml'

permissions:
  contents: write

concurrency:
  group: drielo-baby-nursery-recenter-selected
  cancel-in-progress: true

jobs:
  recenter:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout only Baby Nursery repair paths
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/recenter-baby-nursery-selected.yml
            content/pattern-system/baby_nursery/
            content/pattern-system/multitech/
            content/pattern-system/collections/baby-nursery/collection.json
            content/pattern-system/collections/baby-nursery/designs.json
            content/pattern-system/collections/baby-nursery/assets/
            content/pattern-system/collections/baby-nursery/mapped-designs/I0021-whale-dmc.png
            content/pattern-system/collections/baby-nursery/mapped-designs/I0025-seahorse-dmc.png
            content/pattern-system/collections/baby-nursery/mapped-designs/I0026-long-neck-dinosaur-dmc.png
            content/pattern-system/collections/baby-nursery/mapped-designs/I0027-triceratops-dmc.png
            content/pattern-system/collections/baby-nursery/mapped-designs/I0029-stegosaurus-dmc.png
            content/pattern-system/collections/baby-nursery/mapped-designs/I0043-rainbow-clouds-dmc.png
            content/pattern-system/collections/baby-nursery/mapped-designs/I0044-sun-dmc.png
            content/pattern-system/collections/baby-nursery/mapped-designs/I0057-rattle-dmc.png
            content/pattern-system/patterns/I0021-CS/
            content/pattern-system/patterns/I0025-CS/
            content/pattern-system/patterns/I0026-CS/
            content/pattern-system/patterns/I0027-CS/
            content/pattern-system/patterns/I0029-CS/
            content/pattern-system/patterns/I0043-CS/
            content/pattern-system/patterns/I0044-CS/
            content/pattern-system/patterns/I0057-CS/
            content/pattern-system/products/I0021-CS/
            content/pattern-system/products/I0025-CS/
            content/pattern-system/products/I0026-CS/
            content/pattern-system/products/I0027-CS/
            content/pattern-system/products/I0029-CS/
            content/pattern-system/products/I0043-CS/
            content/pattern-system/products/I0044-CS/
            content/pattern-system/products/I0057-CS/
            content/source-images/collections/baby-nursery/
            content/products/catalog.json
            content/products/assets/baby-nursery-collection-cover-v2.jpg
            content/products/assets/I0021-CS-*
            content/products/assets/I0025-CS-*
            content/products/assets/I0026-CS-*
            content/products/assets/I0027-CS-*
            content/products/assets/I0029-CS-*
            content/products/assets/I0043-CS-*
            content/products/assets/I0044-CS-*
            content/products/assets/I0057-CS-*
            content/products/files/Drielo_I0021-CS.pdf
            content/products/files/Drielo_I0025-CS.pdf
            content/products/files/Drielo_I0026-CS.pdf
            content/products/files/Drielo_I0027-CS.pdf
            content/products/files/Drielo_I0029-CS.pdf
            content/products/files/Drielo_I0043-CS.pdf
            content/products/files/Drielo_I0044-CS.pdf
            content/products/files/Drielo_I0057-CS.pdf
            content/tools/import-products.php

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Normalize selected source layouts
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/baby_nursery/normalize_selected_layout.py

      - name: Regenerate only selected products
        env:
          DRIELO_GALLERY_REVISION: layout-recenter-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cp content/products/catalog.json /tmp/catalog-before-layout-recenter.json
          rm -rf /tmp/baby-layout-rows && mkdir -p /tmp/baby-layout-rows
          for id in I0021 I0025 I0026 I0027 I0029 I0043 I0044 I0057; do
            echo "Regenerating $id"
            python3 content/pattern-system/baby_nursery/publish_cs_exact_dmc.py "$id"
            python3 -c 'import json,sys; from pathlib import Path; base=sys.argv[1]; code=f"{base}-CS"; catalog=json.loads(Path("content/products/catalog.json").read_text(encoding="utf-8")); row=next((p for p in catalog.get("products",[]) if p.get("code")==code),None); row is not None or (_ for _ in ()).throw(SystemExit(f"{code}: publisher did not emit catalog row")); Path(f"/tmp/baby-layout-rows/{base}.json").write_text(json.dumps(row,ensure_ascii=False,indent=2),encoding="utf-8"); print("CAPTURED_ROW",code)' "$id"
          done

      - name: Validate safe margins and generated bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root=Path(".")
          report=json.loads((root/"content/pattern-system/collections/baby-nursery/layout-normalization-2026-09-28.json").read_text())
          ids=("I0021","I0025","I0026","I0027","I0029","I0043","I0044","I0057")
          got={x["id"]:x for x in report["items"]}
          for base in ids:
              row=got[base]
              m=row["after_margins"]
              if min(m["left"],m["right"],m["top"],m["bottom"])<10:
                  raise SystemExit(f"{base}: unsafe margins {m}")
              if abs(m["left"]-m["right"])>1 or abs(m["top"]-m["bottom"])>1:
                  raise SystemExit(f"{base}: not centered {m}")

              code=f"{base}-CS"
              captured=Path("/tmp/baby-layout-rows")/f"{base}.json"
              if not captured.is_file():
                  raise SystemExit(f"{code}: missing captured row")
              rowcat=json.loads(captured.read_text(encoding="utf-8"))
              if rowcat.get("code")!=code:
                  raise SystemExit(f"{code}: wrong captured row")

              pat=json.loads((root/"content/pattern-system/patterns"/code/"pattern.json").read_text())
              if (pat.get("stitch_width"),pat.get("stitch_height"))!=(100,120):
                  raise SystemExit(f"{code}: wrong grid")

              hero=root/"content/products/assets"/f"{code}-product.webp"
              gallery=[root/"content/products/assets"/f"{code}-gallery-{i}.webp" for i in (2,3,4)]
              pdf=root/"content/products/files"/f"Drielo_{code}.pdf"
              with Image.open(hero) as im:
                  if im.size!=(1536,1536):
                      raise SystemExit(f"{code}: wrong hero size {im.size}")
              if any(not g.is_file() or g.stat().st_size<10000 for g in gallery):
                  raise SystemExit(f"{code}: invalid gallery")
              if not pdf.is_file() or pdf.stat().st_size<100000:
                  raise SystemExit(f"{code}: invalid PDF")
              print(code,"SAFE_AND_VALID",m)
          PY

      - name: Build eight-product WooCommerce package
        env:
          REPAIR_REVISION: layout-recenter-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE="/tmp/drielo-baby-layout-recenter"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"

          python3 - "$STAGE" <<'PY'
          import json,os,sys
          from pathlib import Path
          stage=Path(sys.argv[1])
          ids=("I0021","I0025","I0026","I0027","I0029","I0043","I0044","I0057")
          codes={f"{x}-CS" for x in ids}
          rows=[json.loads((Path("/tmp/baby-layout-rows")/f"{x}.json").read_text(encoding="utf-8")) for x in ids]
          if {p.get("code") for p in rows}!=codes:
              raise SystemExit("Selected layout rows are incomplete")
          revision=os.environ["REPAIR_REVISION"]
          for p in rows:
              p["gallery_revision"]=revision

          base_catalog=json.loads(Path("/tmp/catalog-before-layout-recenter.json").read_text(encoding="utf-8"))
          coll=next(c for c in base_catalog.get("collections",[]) if c.get("slug")=="baby-nursery")
          cats=[c for c in base_catalog.get("categories",[]) if c.get("slug") in {"cross-stitch-patterns","cross-stitch-baby-nursery"}]
          out=dict(base_catalog)
          out["products"]=rows
          out["collections"]=[coll]
          out["categories"]=cats
          out["retired_products"]=[]
          out["retired_collections"]=[]
          (stage/"content/products/catalog.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

          for base in I0021 I0025 I0026 I0027 I0029 I0043 I0044 I0057; do
            code="${base}-CS"
            cp "content/products/assets/${code}-product.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-2.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-3.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-4.webp" "$STAGE/content/products/assets/"
            cp "content/products/files/Drielo_${code}.pdf" "$STAGE/content/products/files/"
          done
          cp content/products/assets/baby-nursery-collection-cover-v2.jpg "$STAGE/content/products/assets/"
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf /tmp/drielo-baby-layout-recenter.tgz -C "$STAGE" content

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_layout_key
          chmod 600 ~/.ssh/drielo_layout_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/drielo_layout_key /tmp/drielo-baby-layout-recenter.tgz "$VPS_USER@$VPS_HOST:/tmp/drielo-baby-layout-recenter-${GITHUB_RUN_ID}.tgz"

      - name: Update eight products and force new media URLs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_layout_key "$VPS_USER@$VPS_HOST" "RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-baby-layout-recenter-${RUN_ID}.tgz"
          STAGE="/tmp/drielo-baby-layout-recenter-${RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"; exit 1
          fi

          PRE_JSON=$("${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $out=array();
            foreach(array("I0021","I0025","I0026","I0027","I0029","I0043","I0044","I0057") as $b){
              $out[$b]=(int)wc_get_product_id_by_sku("DRIELO-".$b."-CS");
            }
            echo json_encode($out);
          ')
          echo "PRE_IDS=$PRE_JSON"

          PRE_COUNT=$("${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $ids=get_posts(array("post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids","tax_query"=>array(array("taxonomy"=>"product_collection","field"=>"slug","terms"=>array("baby-nursery")))));
            echo count($ids);
          ')
          echo "Baby Nursery published before: $PRE_COUNT"
          [ "$PRE_COUNT" = "60" ] || { echo "Expected 60 before layout update"; exit 8; }

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php && mkdir -p /tmp/drielo-products'
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=1024M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products

          # Create brand-new versioned media URLs, so browser/CDN cache cannot reuse
          # any previously published hero or gallery image.
          "${DOCKER[@]}" exec -e RUN_ID="$RUN_ID" -e PRE_JSON="$PRE_JSON" make-wp php -d memory_limit=1024M -r '
            require "/var/www/html/wp-load.php";
            require_once ABSPATH."wp-admin/includes/file.php";
            require_once ABSPATH."wp-admin/includes/image.php";
            require_once ABSPATH."wp-admin/includes/media.php";

            $run=preg_replace("/[^0-9A-Za-z_-]/","",getenv("RUN_ID"));
            $pre=json_decode(getenv("PRE_JSON"),true);
            $bases=array("I0021","I0025","I0026","I0027","I0029","I0043","I0044","I0057");

            function layout_media($src,$source_key,$title,$run){
              if(!is_file($src)){throw new RuntimeException("Missing ".$src);}
              $stem=pathinfo(basename($source_key),PATHINFO_FILENAME);
              $ext=pathinfo(basename($source_key),PATHINFO_EXTENSION);
              $filename=$stem."-layout".$run.".".$ext;
              $bits=wp_upload_bits($filename,null,(string)file_get_contents($src));
              if(!empty($bits["error"])){throw new RuntimeException($bits["error"]);}
              $type=wp_check_filetype($filename,null);
              $id=wp_insert_attachment(array(
                "post_mime_type"=>$type["type"]?:"image/webp",
                "post_title"=>$title,
                "post_status"=>"inherit",
              ),$bits["file"]);
              if(is_wp_error($id)){throw new RuntimeException($id->get_error_message());}
              $meta=wp_generate_attachment_metadata($id,$bits["file"]);
              if(is_array($meta)){wp_update_attachment_metadata($id,$meta);}
              update_post_meta($id,"_drielo_source_asset",$source_key);
              update_post_meta($id,"_drielo_source_hash",md5_file($src)?:"");
              update_post_meta($id,"_drielo_source_revision","layout-recenter-".$run);
              return (int)$id;
            }

            foreach($bases as $base){
              $sku="DRIELO-".$base."-CS";
              $pid=(int)wc_get_product_id_by_sku($sku);
              if($pid!==(int)$pre[$base]){throw new RuntimeException("Product ID changed ".$sku);}
              $p=wc_get_product($pid);
              $old_featured=(int)$p->get_image_id();
              $old_gallery=array_map("intval",$p->get_gallery_image_ids());

              $hero_key="assets/".$base."-CS-product.webp";
              $new_featured=layout_media("/tmp/drielo-products/assets/".$base."-CS-product.webp",$hero_key,$p->get_name()." centered featured",$run);
              $new_gallery=array();
              foreach(array(2,3,4) as $n){
                $key="assets/".$base."-CS-gallery-".$n.".webp";
                $new_gallery[]=layout_media("/tmp/drielo-products/assets/".$base."-CS-gallery-".$n.".webp",$key,$p->get_name()." centered gallery ".$n,$run);
              }

              $p->set_image_id($new_featured);
              $p->set_gallery_image_ids($new_gallery);
              $p->save();

              foreach(array_merge(array($old_featured),$old_gallery) as $old){
                if($old>0){
                  delete_post_meta($old,"_drielo_source_asset");
                  delete_post_meta($old,"_drielo_source_hash");
                  delete_post_meta($old,"_drielo_source_revision");
                }
              }

              $url=wp_get_attachment_url($new_featured);
              echo $sku." product_id=".$pid." featured=".$new_featured." url=".$url." gallery=".implode(",",$new_gallery).PHP_EOL;
              if(strpos((string)$url,"-layout".$run.".webp")===false){throw new RuntimeException("Versioned URL missing ".$sku);}
              if(count($p->get_downloads())<1){throw new RuntimeException("Download missing ".$sku);}
            }

            wp_cache_flush();
            global $wpdb;
            $wpdb->query("DELETE FROM {$wpdb->options} WHERE option_name LIKE \'_transient_%\' OR option_name LIKE \'_site_transient_%\'");

            $ids=get_posts(array("post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids","tax_query"=>array(array("taxonomy"=>"product_collection","field"=>"slug","terms"=>array("baby-nursery")))));
            echo "Baby Nursery published after: ".count($ids).PHP_EOL;
            if(count($ids)!==60){throw new RuntimeException("Expected 60 after layout update");}
          '

          "${DOCKER[@]}" exec make-wp sh -lc 'if [ -d /var/www/html/wp-content/cache ]; then find /var/www/html/wp-content/cache -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true; fi'
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Verify public hero bytes
        shell: bash
        run: |
          set -euo pipefail
          for base in I0021 I0025 I0026 I0027 I0029 I0043 I0044 I0057; do
            public="https://drielo.com/wp-content/uploads/2026/09/${base}-CS-product-layout${GITHUB_RUN_ID}.webp"
            curl -fL --retry 5 --retry-delay 2 -H 'Cache-Control: no-cache' "$public" -o "/tmp/${base}-public.webp"
            gh=$(sha256sum "content/products/assets/${base}-CS-product.webp" | awk '{print $1}')
            live=$(sha256sum "/tmp/${base}-public.webp" | awk '{print $1}')
            echo "${base} local=${gh} public=${live}"
            [ "$gh" = "$live" ] || { echo "PUBLIC_HASH_MISMATCH ${base}"; exit 2; }
            echo "PUBLIC_MATCH ${base}"
          done

      - name: Commit corrected source and generated assets
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/catalog-before-layout-recenter.json content/products/catalog.json
          for base in I0021 I0025 I0026 I0027 I0029 I0043 I0044 I0057; do
            git restore "content/products/files/Drielo_${base}-CS.pdf" 2>/dev/null || true
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             content/source-images/collections/baby-nursery/products/I0021-whale.png             content/source-images/collections/baby-nursery/products/I0025-seahorse.png             content/source-images/collections/baby-nursery/products/I0026-long-neck-dinosaur.png             content/source-images/collections/baby-nursery/products/I0027-triceratops.png             content/source-images/collections/baby-nursery/products/I0029-stegosaurus.png             content/source-images/collections/baby-nursery/products/I0043-rainbow-clouds.png             content/source-images/collections/baby-nursery/products/I0044-sun.png             content/source-images/collections/baby-nursery/products/I0057-rattle.png             content/source-images/collections/baby-nursery/source-manifest.json             content/source-images/collections/baby-nursery/qa_report.json             content/pattern-system/collections/baby-nursery/designs.json             content/pattern-system/collections/baby-nursery/layout-normalization-2026-09-28.json

          for base in I0021 I0025 I0026 I0027 I0029 I0043 I0044 I0057; do
            code="${base}-CS"
            git add               "content/pattern-system/collections/baby-nursery/mapped-designs/${base}-"*"-dmc.png"               "content/pattern-system/patterns/${code}/pattern.json"               "content/pattern-system/products/${code}/product.json"               "content/products/assets/${code}-product.webp"               "content/products/assets/${code}-gallery-2.webp"               "content/products/assets/${code}-gallery-3.webp"               "content/products/assets/${code}-gallery-4.webp"
          done

          if git diff --cached --quiet; then
            echo "No layout changes to commit."
          else
            git commit -m "Recenter selected Baby Nursery designs [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

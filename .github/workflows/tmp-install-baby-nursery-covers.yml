name: TEMP install Baby Nursery cover assets

on:
  push:
    branches: [main]
    paths:
      - 'tmp/baby-nursery-covers/READY'

permissions:
  contents: write

concurrency:
  group: drielo-baby-nursery-cover-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild approved cover source images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/baby-covers content/pattern-system/collections/baby-nursery/assets
          for name in cross-stitch latch-hook tapestry-crochet c2c-crochet; do
            cat tmp/baby-nursery-covers/${name}.part* | base64 -d > /tmp/baby-covers/${name}.avif
            test -s /tmp/baby-covers/${name}.avif
          done

      - name: Convert to repository PNG assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow pillow-avif-plugin
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import pillow_avif

          src = Path('/tmp/baby-covers')
          dst = Path('content/pattern-system/collections/baby-nursery/assets')
          mapping = {
              'cross-stitch': 'cover-cross-stitch.png',
              'latch-hook': 'cover-latch-hook.png',
              'tapestry-crochet': 'cover-tapestry-crochet.png',
              'c2c-crochet': 'cover-c2c-crochet.png',
          }
          for stem, filename in mapping.items():
              im = Image.open(src / f'{stem}.avif').convert('RGB')
              if im.size != (900, 900):
                  raise SystemExit(f'{stem}: unexpected size {im.size}')
              out = dst / filename
              im.save(out, 'PNG', optimize=True)
              print(filename, out.stat().st_size)
          PY

      - name: Wire assets into Baby Nursery collection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('content/pattern-system/collections/baby-nursery/collection.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          spec = data.setdefault('mockup_spec', {})
          spec['technique_assets'] = {
              'CS': 'content/pattern-system/collections/baby-nursery/assets/cover-cross-stitch.png',
              'C2C': 'content/pattern-system/collections/baby-nursery/assets/cover-c2c-crochet.png',
              'TC': 'content/pattern-system/collections/baby-nursery/assets/cover-tapestry-crochet.png',
              'LH': 'content/pattern-system/collections/baby-nursery/assets/cover-latch-hook.png',
          }
          spec['status'] = 'approved-page-1-images'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit installed assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/baby-nursery-covers
          rm -f .github/workflows/tmp-install-baby-nursery-covers.yml
          git config user.name 'Drielo Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add content/pattern-system/collections/baby-nursery .github/workflows tmp/baby-nursery-covers || true
          git add -u
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Add Baby Nursery collection cover assets [skip ci]'
          git push origin HEAD:main

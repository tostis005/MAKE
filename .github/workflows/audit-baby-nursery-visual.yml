name: Audit Baby Nursery Source PNGs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-baby-nursery-visual.yml'
      - 'content/pattern-system/baby_nursery/audit_visual.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet Pillow
      - name: Build visual audit
        run: python3 content/pattern-system/baby_nursery/audit_visual.py
      - uses: actions/upload-artifact@v4
        with:
          name: baby-nursery-visual-audit
          path: tmp/baby-nursery-visual-audit
          retention-days: 7

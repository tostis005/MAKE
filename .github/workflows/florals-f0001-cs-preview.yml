name: Florals F0001 Cross Stitch Preview

on:
  push:
    branches:
      - feature/florals-auto-publish
    paths:
      - '.github/workflows/florals-f0001-cs-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-florals-f0001-cs-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Florals branch
        uses: actions/checkout@v4
        with:
          ref: feature/florals-auto-publish
          fetch-depth: 0

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Build only F0001-CS
        env:
          DRIELO_GALLERY_REVISION: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/florals/f0001_cs_preview.py

      - name: Validate F0001-CS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageChops
          root=Path('.')
          system=root/'content/pattern-system'
          src=Image.open(system/'collections/florals/source-designs/F0001-blue-daisy-pitcher.png').convert('RGBA')
          ref=Image.open(system/'collections/florals/reference-masters/F0001-blue-daisy-pitcher-reference.png').convert('RGBA')
          if src.size!=(100,120) or ref.size!=(800,960):
              raise SystemExit('F0001 canonical dimensions are wrong')
          if ImageChops.difference(src.resize((800,960),Image.Resampling.NEAREST),ref).getbbox() is not None:
              raise SystemExit('F0001 source/reference mismatch')
          pat=json.loads((system/'patterns/F0001-CS/pattern.json').read_text(encoding='utf-8'))
          if pat['code']!='F0001-CS' or pat['collection']!='florals':
              raise SystemExit('Wrong F0001 product identity')
          if len(pat['threads'])>14 or pat['total_stitches']<=0:
              raise SystemExit('Invalid F0001 colour/stitch count')
          if (pat.get('outline_policy') or {}).get('enabled'):
              raise SystemExit('External outline is forbidden')
          pdf=root/'content/products/files/Drielo_F0001-CS.pdf'
          feat=root/'content/products/assets/F0001-CS-product.webp'
          gal=[root/f'content/products/assets/F0001-CS-gallery-{i}.webp' for i in (2,3,4)]
          if not pdf.is_file() or pdf.read_bytes()[:4]!=b'%PDF' or pdf.stat().st_size<100000:
              raise SystemExit('Invalid F0001 PDF')
          if not feat.is_file() or feat.stat().st_size<40000:
              raise SystemExit('Invalid F0001 product image')
          if any((not p.is_file()) or p.stat().st_size<25000 for p in gal):
              raise SystemExit('Invalid F0001 gallery')
          cat=json.loads((root/'content/products/catalog.json').read_text(encoding='utf-8'))
          florals=[p for p in cat['products'] if p.get('collection')=='florals']
          if [p['code'] for p in florals] != ['F0001-CS']:
              raise SystemExit(f'Only F0001-CS may exist in Florals preview catalog: {florals}')
          print('F0001_CS_VALID',pat['total_stitches'],len(pat['threads']),pdf.stat().st_size)
          PY

      - name: Build isolated WooCommerce package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="/tmp/drielo-F0001-CS-${GITHUB_RUN_ID}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"
          python3 - "$STAGE" <<'PY'
          import json,sys
          from pathlib import Path
          stage=Path(sys.argv[1])
          d=json.loads(Path('content/products/catalog.json').read_text(encoding='utf-8'))
          product=next(p for p in d['products'] if p.get('code')=='F0001-CS')
          cats=set(product.get('categories',[]))
          out=dict(d)
          out['products']=[product]
          out['collections']=[c for c in d.get('collections',[]) if c.get('slug')=='florals']
          out['categories']=[c for c in d.get('categories',[]) if c.get('slug') in cats or c.get('slug')=='cross-stitch-patterns']
          out['retired_products']=[]
          out['retired_collections']=[]
          (stage/'content/products/catalog.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cp content/products/assets/F0001-CS-product.webp "$STAGE/content/products/assets/"
          cp content/products/assets/F0001-CS-gallery-2.webp "$STAGE/content/products/assets/"
          cp content/products/assets/F0001-CS-gallery-3.webp "$STAGE/content/products/assets/"
          cp content/products/assets/F0001-CS-gallery-4.webp "$STAGE/content/products/assets/"
          cp content/products/files/Drielo_F0001-CS.pdf "$STAGE/content/products/files/"
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf "/tmp/drielo-F0001-CS-${GITHUB_RUN_ID}.tgz" -C "$STAGE" content

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_f0001_key
          chmod 600 ~/.ssh/drielo_f0001_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload isolated package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/drielo_f0001_key "/tmp/drielo-F0001-CS-${GITHUB_RUN_ID}.tgz"             "$VPS_USER@$VPS_HOST:/tmp/drielo-F0001-CS-${GITHUB_RUN_ID}.tgz"

      - name: Publish only F0001-CS and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_f0001_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-F0001-CS-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-F0001-CS-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          CONTAINER_STAGE="/tmp/drielo-products-florals-f0001-${GITHUB_RUN_ID}"
          IMPORTER="/tmp/drielo-import-florals-f0001-${GITHUB_RUN_ID}.php"
          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$CONTAINER_STAGE' '$IMPORTER' && mkdir -p '$CONTAINER_STAGE'"
          "${DOCKER[@]}" cp "$STAGE/content/products/." "make-wp:${CONTAINER_STAGE}/"
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" "make-wp:${IMPORTER}"
          ok=0
          for attempt in 1 2 3; do
            if "${DOCKER[@]}" exec make-wp php -d memory_limit=1024M -d max_execution_time=0               "$IMPORTER" /var/www/html "$CONTAINER_STAGE"; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          "${DOCKER[@]}" exec make-wp php -d memory_limit=1024M -r '
            require "/var/www/html/wp-load.php";
            $id=wc_get_product_id_by_sku("DRIELO-F0001-CS");
            $p=$id ? wc_get_product($id) : false;
            if(!$p){fwrite(STDERR,"F0001-CS missing".PHP_EOL);exit(2);}
            $cols=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
            echo "DRIELO-F0001-CS id=".$id." image=".$p->get_image_id()." gallery=".count($p->get_gallery_image_ids())." downloads=".count($p->get_downloads())." collection=".implode(",",$cols).PHP_EOL;
            if($p->get_status()!=="publish" || !$p->get_image_id() || count($p->get_gallery_image_ids())<3 || count($p->get_downloads())<1 || !in_array("florals",$cols,true)){exit(3);}
            global $wpdb;
            $others=$wpdb->get_var("SELECT COUNT(*) FROM {$wpdb->postmeta} WHERE meta_key=\"_sku\" AND meta_value LIKE \"DRIELO-F%\" AND meta_value<>\"DRIELO-F0001-CS\"");
            if((int)$others!==0){fwrite(STDERR,"Unexpected additional Florals SKUs: ".$others.PHP_EOL);exit(4);}
          '
          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$CONTAINER_STAGE' '$IMPORTER'"
          REMOTE

      - name: Commit F0001-CS preview artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             content/pattern-system/patterns/F0001-CS/pattern.json             content/pattern-system/products/F0001-CS/product.json             content/products/catalog.json             content/products/assets/F0001-CS-product.webp             content/products/assets/F0001-CS-gallery-2.webp             content/products/assets/F0001-CS-gallery-3.webp             content/products/assets/F0001-CS-gallery-4.webp             content/products/files/Drielo_F0001-CS.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish redesigned F0001 cross-stitch preview [skip ci]"
            git fetch origin feature/florals-auto-publish
            git rebase origin/feature/florals-auto-publish
            git push origin HEAD:feature/florals-auto-publish
          fi

      - name: Archive F0001-CS PDF
        uses: actions/upload-artifact@v4
        with:
          name: florals-F0001-CS-preview
          path: |
            content/products/files/Drielo_F0001-CS.pdf
            content/products/assets/F0001-CS-product.webp
          retention-days: 30

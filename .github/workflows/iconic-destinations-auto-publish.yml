name: Iconic Destinations Auto Publish
# trigger: uploaded-zip-reset-2026-09-26

on:
  push:
    branches: [main]
    paths:
      - 'content/pattern-system/iconic_destinations/publish_queue.json'
      - '.github/workflows/iconic-destinations-auto-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: drielo-iconic-destinations-auto-publish
  cancel-in-progress: false

jobs:
  publish-next:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select next pending destination
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/iconic_destinations/queue_state.py next --github-output "$GITHUB_OUTPUT"

      - name: Show queue state
        shell: bash
        run: |
          python3 content/pattern-system/iconic_destinations/queue_state.py summary
          echo "Selected: ${{ steps.select.outputs.design_id }}"

      - name: Install renderer dependencies
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Build exact 100x120 pattern and PDF
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/iconic_destinations/publish_design.py "${{ steps.select.outputs.design_id }}"

      - name: Validate one-to-one cross-stitch bundle
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          python3 - "$DESIGN" <<'PY'
          import json,sys
          from pathlib import Path
          from PIL import Image
          base=sys.argv[1]; code=base+'-CS'; root=Path('.'); system=root/'content'/'pattern-system'
          designs=json.loads((system/'collections'/'iconic-destinations'/'designs.json').read_text(encoding='utf-8'))['designs']
          d=next(x for x in designs if x['base_design_id']==base)
          if d.get('variants') != [code]: raise SystemExit(f'{base}: non-CS variant detected')
          src=system/d['source_asset']; im=Image.open(src).convert('RGB')
          if im.size!=(100,120): raise SystemExit(f'{base}: final source is not exactly 100x120')
          pat=json.loads((system/'patterns'/code/'pattern.json').read_text(encoding='utf-8'))
          prod=json.loads((system/'products'/code/'product.json').read_text(encoding='utf-8'))
          if (pat.get('stitch_width'),pat.get('stitch_height'))!=(100,120): raise SystemExit(f'{code}: wrong grid')
          if len(pat.get('matrix',[]))!=120 or any(len(r)!=100 for r in pat['matrix']): raise SystemExit(f'{code}: malformed matrix')
          if any(v in (None,'') for row in pat['matrix'] for v in row): raise SystemExit(f'{code}: every source pixel must map to a stitch')
          if pat.get('total_stitches')!=12000: raise SystemExit(f'{code}: exact grid must contain 12000 stitches')
          if not (1<=len(pat.get('threads',[]))<=50): raise SystemExit(f'{code}: unexpected palette size')
          if prod.get('render_ready') is not True or prod.get('technique')!='cross-stitch': raise SystemExit(f'{code}: product is not render-ready CS')
          colours={t['symbol']:tuple(int(t['color'][i:i+2],16) for i in (1,3,5)) for t in pat['threads']}
          for n,pixel in enumerate(im.getdata()):
              y,x=divmod(n,100)
              if colours[pat['matrix'][y][x]]!=pixel: raise SystemExit(f'{code}: one-to-one mismatch at {x},{y}')
          pdf=root/'content'/'products'/'files'/f'Drielo_{code}.pdf'
          featured=root/'content'/'products'/'assets'/f'{code}-product.webp'
          gallery=[root/'content'/'products'/'assets'/f'{code}-design.webp',root/'content'/'products'/'assets'/f'{code}-gallery-2.webp',root/'content'/'products'/'assets'/f'{code}-gallery-3.webp',root/'content'/'products'/'assets'/f'{code}-gallery-4.webp']
          if not pdf.is_file() or pdf.stat().st_size<100000 or pdf.read_bytes()[:4]!=b'%PDF': raise SystemExit(f'{code}: invalid PDF')
          if not featured.is_file() or featured.stat().st_size<30000: raise SystemExit(f'{code}: invalid product image')
          if any(not p.is_file() or p.stat().st_size<5000 for p in gallery): raise SystemExit(f'{code}: invalid gallery')
          cat=json.loads((root/'content'/'products'/'catalog.json').read_text(encoding='utf-8'))
          row=next((p for p in cat.get('products',[]) if p.get('code')==code),None)
          if not row or row.get('collection')!='iconic-destinations' or row.get('technique')!='cross-stitch': raise SystemExit(f'{code}: wrong catalog routing')
          storefront=root/'content'/'products'/row['featured_image']
          if not storefront.is_file() or storefront.stat().st_size<30000: raise SystemExit(f'{code}: missing versioned storefront image')
          collection_doc=json.loads((system/'collections'/'iconic-destinations'/'collection.json').read_text(encoding='utf-8'))
          background=system/'collections'/'iconic-destinations'/collection_doc['mockup_spec']['asset']
          if not background.is_file(): raise SystemExit(f'{code}: missing full storefront background')
          with Image.open(background) as bg_im, Image.open(storefront) as hero_im:
              if hero_im.size != bg_im.size:
                  raise SystemExit(f'{code}: storefront image cropped/resized {hero_im.size}, expected full background {bg_im.size}')
              if hero_im.size == (1200,1500):
                  raise SystemExit(f'{code}: legacy 4:5 storefront crop detected')
          if row.get('gallery') != []: raise SystemExit(f'{code}: Iconic storefront must expose only the featured image')
          print(code,'EXACT_1_TO_1','colors',len(pat['threads']),'pdf',pdf.stat().st_size)
          PY

      - name: Build one-product WooCommerce package
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"; CODE="${DESIGN}-CS"; STAGE="/tmp/drielo-${CODE}"
          rm -rf "$STAGE"; mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"
          python3 - "$CODE" "$STAGE" <<'PY'
          import json,sys
          from pathlib import Path
          code=sys.argv[1]; stage=Path(sys.argv[2]); src=json.loads(Path('content/products/catalog.json').read_text(encoding='utf-8'))
          row=next(p for p in src['products'] if p.get('code')==code)
          collection=next(c for c in src['collections'] if c.get('slug')=='iconic-destinations')
          cats=[c for c in src['categories'] if c.get('slug')=='cross-stitch-patterns']
          out=dict(src); out['products']=[row]; out['collections']=[collection]; out['categories']=cats; out['retired_products']=[]; out['retired_collections']=[]
          (stage/'content/products/catalog.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cp "content/products/assets/${CODE}-product.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-${{ steps.select.outputs.slug }}-product.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-design.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-gallery-2.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-gallery-3.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-gallery-4.webp" "$STAGE/content/products/assets/"
          cp "content/products/files/Drielo_${CODE}.pdf" "$STAGE/content/products/files/"
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf "/tmp/drielo-${CODE}.tgz" -C "$STAGE" content

      - name: Configure SSH
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          CODE="${{ steps.select.outputs.design_id }}-CS"
          scp -i ~/.ssh/drielo_products_key "/tmp/drielo-${CODE}.tgz" "$VPS_USER@$VPS_HOST:/tmp/drielo-${CODE}-${GITHUB_RUN_ID}.tgz"

      - name: Publish cross-stitch product to WooCommerce
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"; CODE="${DESIGN}-CS"
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "CODE='${CODE}' GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-${CODE}-${GITHUB_RUN_ID}.tgz"; STAGE="/tmp/drielo-${CODE}-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }; trap cleanup EXIT
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); elif sudo -n docker inspect make-wp >/dev/null 2>&1; then DOCKER=(sudo -n docker); else echo "ERROR: make-wp container not found"; exit 1; fi
          rm -rf "$STAGE" && mkdir -p "$STAGE"; tar -xzf "$ARCHIVE" -C "$STAGE"
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products
          "${DOCKER[@]}" exec -e CODE="$CODE" make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $code=getenv("CODE"); $sku="DRIELO-".$code; $id=wc_get_product_id_by_sku($sku); $p=$id?wc_get_product($id):false;
            if(!$p){fwrite(STDERR,"Missing ".$sku.PHP_EOL);exit(2);}
            $cols=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
            echo $sku." id=".$id." status=".$p->get_status()." image=".$p->get_image_id()." gallery=".count($p->get_gallery_image_ids())." downloads=".count($p->get_downloads())." collection=".implode(",",is_wp_error($cols)?array():$cols)." url=".get_permalink($id).PHP_EOL;
            if($p->get_status()!=="publish"||!$p->get_image_id()||count($p->get_downloads())<1||!in_array("iconic-destinations",is_wp_error($cols)?array():$cols,true)){fwrite(STDERR,"Incomplete ".$sku.PHP_EOL);exit(3);}
          '
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Mark destination published
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          python3 content/pattern-system/iconic_destinations/queue_state.py success "${{ steps.select.outputs.design_id }}" --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Commit generated sources and storefront assets
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"; CODE="${DESIGN}-CS"; SLUG="${{ steps.select.outputs.slug }}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pattern-system/iconic_destinations/publish_queue.json content/pattern-system/collections/iconic-destinations/designs.json             "content/pattern-system/collections/iconic-destinations/approved-pixel-designs/${DESIGN}-${SLUG}.png"             "content/pattern-system/collections/iconic-destinations/source-designs/${DESIGN}-${SLUG}.png"             "content/pattern-system/patterns/${CODE}/pattern.json" "content/pattern-system/products/${CODE}/product.json" content/products/catalog.json             "content/products/assets/${CODE}-product.webp" "content/products/assets/${CODE}-${SLUG}-product.webp" "content/products/assets/${CODE}-design.webp"             "content/products/assets/${CODE}-gallery-2.webp" "content/products/assets/${CODE}-gallery-3.webp" "content/products/assets/${CODE}-gallery-4.webp"
          git commit -m "Publish Iconic Destinations ${DESIGN} cross stitch [skip ci]"
          git fetch origin main; git rebase origin/main; git push origin HEAD:main

      - name: Archive generated PDF
        if: success() && steps.select.outputs.design_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: iconic-destinations-${{ steps.select.outputs.design_id }}-pdf
          path: content/products/files/Drielo_${{ steps.select.outputs.design_id }}-CS.pdf
          retention-days: 30

      - name: Record failure
        if: failure() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main; git reset --hard origin/main
          python3 content/pattern-system/iconic_destinations/queue_state.py fail "$DESIGN" --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --error "Automatic Iconic Destinations publish run failed; see GitHub Actions logs."
          git add content/pattern-system/iconic_destinations/publish_queue.json
          git commit -m "Record Iconic Destinations ${DESIGN} publish failure [skip ci]"; git push origin HEAD:main

      - name: Continue Iconic publication queue
        if: always() && steps.select.outputs.design_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [ "$(python3 content/pattern-system/iconic_destinations/queue_state.py has-work)" = "yes" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/iconic-destinations-auto-publish.yml/dispatches" -f ref=main
            echo "NEXT_ICONIC_RUN_DISPATCHED"
          else
            echo "ICONIC_QUEUE_COMPLETE"
          fi

name: Iconic Destinations Auto Publish
# source-policy: approved-clean-zip-png-only

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: drielo-iconic-destinations-auto-publish
  cancel-in-progress: false

jobs:
  publish-next:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select next pending destination
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/iconic_destinations/queue_state.py next --github-output "$GITHUB_OUTPUT"

      - name: Show queue state
        shell: bash
        run: |
          python3 content/pattern-system/iconic_destinations/queue_state.py summary
          echo "Selected: ${{ steps.select.outputs.design_id }}"

      - name: Install renderer dependencies
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Build exact 100x120 pattern and PDF
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/iconic_destinations/publish_design.py "${{ steps.select.outputs.design_id }}"

      - name: Validate clean ZIP provenance and one-to-one cross-stitch bundle
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          python3 - "$DESIGN" <<'PY'
          import json,os,sys,zipfile
          from pathlib import Path
          from PIL import Image

          base=sys.argv[1]
          code=base+'-CS'
          root=Path('.')
          system=root/'content'/'pattern-system'
          col=system/'collections'/'iconic-destinations'
          queue=json.loads((system/'iconic_destinations'/'publish_queue.json').read_text(encoding='utf-8'))
          designs_doc=json.loads((col/'designs.json').read_text(encoding='utf-8'))
          designs=designs_doc['designs']

          if not str(queue.get('mode','')).startswith('direct-zip-png-'):
              raise SystemExit(f"{base}: non-ZIP Iconic queue mode is forbidden: {queue.get('mode')}")
          if designs_doc.get('source_policy')!='individual-pngs-from-approved-clean-batch-zips-only':
              raise SystemExit(f"{base}: design manifest is not clean-ZIP-only")

          d=next(x for x in designs if x['base_design_id']==base)
          q=next(x for x in queue['items'] if x['base_design_id']==base)
          if d.get('variants') != [code]:
              raise SystemExit(f'{base}: non-CS variant detected')

          forbidden_fields=('reference_board','preview_mosaic','mosaic_source','mosaic_crop','board_source','source_pdf','source_pdf_page')
          for key in forbidden_fields:
              if key in d or key in q:
                  raise SystemExit(f'{base}: forbidden legacy provenance field {key}')

          input_rel=q.get('input_png')
          prefix='collections/iconic-destinations/input-pngs-q50/'
          if not input_rel or not input_rel.startswith(prefix):
              raise SystemExit(f'{base}: source is not an individual ZIP PNG')
          if d.get('input_png')!=input_rel or d.get('source_asset')!=input_rel:
              raise SystemExit(f'{base}: ZIP input/source provenance mismatch')

          zip_rel=q.get('source_zip')
          member=q.get('source_zip_member')
          if d.get('source_zip')!=zip_rel or d.get('source_zip_member')!=member:
              raise SystemExit(f'{base}: design/queue ZIP provenance mismatch')
          zip_path=system/zip_rel
          src=system/input_rel
          if not zip_path.is_file() or not src.is_file():
              raise SystemExit(f'{base}: ZIP or extracted source is missing')
          with zipfile.ZipFile(zip_path,'r') as zf:
              if zf.read(member)!=src.read_bytes():
                  raise SystemExit(f'{base}: extracted PNG differs from ZIP member')

          with Image.open(src) as im:
              rgb=im.convert('RGB')
              if rgb.size!=(100,120):
                  raise SystemExit(f'{base}: source PNG is not exactly 100x120')
              colours=len(set(rgb.getdata()))
              if not (1<=colours<=50):
                  raise SystemExit(f'{base}: source PNG palette is invalid: {colours}')

          approved=col/'approved-pixel-designs'/f"{base}-{d['slug']}.png"
          if not approved.is_file() or approved.read_bytes()!=src.read_bytes():
              raise SystemExit(f'{base}: approved copy differs from ZIP-derived PNG')

          mapped_rel=d.get('dmc_mapped_asset')
          mapped=system/mapped_rel if mapped_rel else None
          if mapped is None or not mapped.is_file():
              raise SystemExit(f'{base}: missing DMC-mapped derivative')

          pat=json.loads((system/'patterns'/code/'pattern.json').read_text(encoding='utf-8'))
          prod=json.loads((system/'products'/code/'product.json').read_text(encoding='utf-8'))
          if pat.get('source_asset')!=input_rel or prod.get('source_artwork')!=input_rel:
              raise SystemExit(f'{code}: generated metadata is not ZIP-derived')
          if pat.get('mapped_asset')!=mapped_rel or prod.get('mapped_artwork')!=mapped_rel:
              raise SystemExit(f'{code}: mapped derivative metadata mismatch')
          if (pat.get('stitch_width'),pat.get('stitch_height'))!=(100,120):
              raise SystemExit(f'{code}: wrong grid')
          if len(pat.get('matrix',[]))!=120 or any(len(r)!=100 for r in pat['matrix']):
              raise SystemExit(f'{code}: malformed matrix')
          if pat.get('total_stitches')!=12000:
              raise SystemExit(f'{code}: exact grid must contain 12000 stitches')
          if not (1<=len(pat.get('threads',[]))<=50):
              raise SystemExit(f'{code}: unexpected DMC palette size')

          pdf=root/'content'/'products'/'files'/f'Drielo_{code}.pdf'
          featured=root/'content'/'products'/'assets'/f'{code}-product.webp'
          if not pdf.is_file() or pdf.stat().st_size<100000 or pdf.read_bytes()[:4]!=b'%PDF':
              raise SystemExit(f'{code}: invalid PDF')
          if not featured.is_file() or featured.stat().st_size<30000:
              raise SystemExit(f'{code}: invalid product image')

          cat=json.loads((root/'content'/'products'/'catalog.json').read_text(encoding='utf-8'))
          row=next((p for p in cat.get('products',[]) if p.get('code')==code),None)
          if not row or row.get('collection')!='iconic-destinations':
              raise SystemExit(f'{code}: wrong catalog routing')
          expected_suffix=f"-r{os.environ['GITHUB_RUN_ID']}.webp"
          if not str(row.get('featured_image','')).endswith(expected_suffix):
              raise SystemExit(f"{code}: featured image is not revisioned for this run")

          print(code,'ZIP_SOURCE_ONLY_VALID','source',input_rel,'member',member,'colors',len(pat['threads']))
          PY

      - name: Build one-product WooCommerce package
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"; CODE="${DESIGN}-CS"; STAGE="/tmp/drielo-${CODE}"
          rm -rf "$STAGE"; mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"
          python3 - "$CODE" "$STAGE" <<'PY'
          import json,shutil,sys
          from pathlib import Path
          code=sys.argv[1]; stage=Path(sys.argv[2]); src=json.loads(Path('content/products/catalog.json').read_text(encoding='utf-8'))
          row=next(p for p in src['products'] if p.get('code')==code)
          collection=next(c for c in src['collections'] if c.get('slug')=='iconic-destinations')
          cats=[c for c in src['categories'] if c.get('slug')=='cross-stitch-patterns']
          out=dict(src); out['products']=[row]; out['collections']=[collection]; out['categories']=cats; out['retired_products']=[]; out['retired_collections']=[]
          (stage/'content/products/catalog.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          featured=Path('content/products')/row['featured_image']
          if not featured.is_file():
              raise SystemExit(f'Missing featured image {featured}')
          target=stage/'content/products'/row['featured_image']
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy2(featured,target)
          PY
          cp "content/products/assets/${CODE}-product.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-design.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-gallery-2.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-gallery-3.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-gallery-4.webp" "$STAGE/content/products/assets/"
          cp "content/products/files/Drielo_${CODE}.pdf" "$STAGE/content/products/files/"
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf "/tmp/drielo-${CODE}.tgz" -C "$STAGE" content

      - name: Configure SSH
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          CODE="${{ steps.select.outputs.design_id }}-CS"
          scp -i ~/.ssh/drielo_products_key "/tmp/drielo-${CODE}.tgz" "$VPS_USER@$VPS_HOST:/tmp/drielo-${CODE}-${GITHUB_RUN_ID}.tgz"

      - name: Publish cross-stitch product to WooCommerce
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"; CODE="${DESIGN}-CS"; SLUG="${{ steps.select.outputs.slug }}"
          EXPECTED_ASSET="assets/${CODE}-${SLUG}-product-r${GITHUB_RUN_ID}.webp"
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "CODE='${CODE}' EXPECTED_ASSET='${EXPECTED_ASSET}' GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-${CODE}-${GITHUB_RUN_ID}.tgz"; STAGE="/tmp/drielo-${CODE}-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }; trap cleanup EXIT
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); elif sudo -n docker inspect make-wp >/dev/null 2>&1; then DOCKER=(sudo -n docker); else echo "ERROR: make-wp container not found"; exit 1; fi
          rm -rf "$STAGE" && mkdir -p "$STAGE"; tar -xzf "$ARCHIVE" -C "$STAGE"
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products
          "${DOCKER[@]}" exec -e CODE="$CODE" -e EXPECTED_ASSET="$EXPECTED_ASSET" make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $code=getenv("CODE"); $expected=getenv("EXPECTED_ASSET"); $sku="DRIELO-".$code; $id=wc_get_product_id_by_sku($sku); $p=$id?wc_get_product($id):false;
            if(!$p){fwrite(STDERR,"Missing ".$sku.PHP_EOL);exit(2);}
            $cols=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
            $image_id=(int)$p->get_image_id();
            $source=$image_id?(string)get_post_meta($image_id,"_drielo_source_asset",true):"";
            $known_hash=$image_id?(string)get_post_meta($image_id,"_drielo_source_hash",true):"";
            $attached=$image_id?(string)get_attached_file($image_id):"";
            $actual_hash=$attached&&is_file($attached)?(string)md5_file($attached):"";
            $url=$image_id?(string)wp_get_attachment_url($image_id):"";
            echo $sku." id=".$id." status=".$p->get_status()." image=".$image_id." source=".$source." image_url=".$url." hash=".$actual_hash." gallery=".count($p->get_gallery_image_ids())." downloads=".count($p->get_downloads())." collection=".implode(",",is_wp_error($cols)?array():$cols)." url=".get_permalink($id).PHP_EOL;
            if($p->get_status()!=="publish"||!$image_id||count($p->get_downloads())<1||!in_array("iconic-destinations",is_wp_error($cols)?array():$cols,true)){fwrite(STDERR,"Incomplete ".$sku.PHP_EOL);exit(3);}
            if($source!==$expected){fwrite(STDERR,"Wrong featured source ".$source." expected ".$expected.PHP_EOL);exit(4);}
            if(!$known_hash||!$actual_hash||!hash_equals($known_hash,$actual_hash)){fwrite(STDERR,"Featured image hash mismatch".PHP_EOL);exit(5);}
          '
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Mark destination published
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          python3 content/pattern-system/iconic_destinations/queue_state.py success "${{ steps.select.outputs.design_id }}" --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Commit generated sources and storefront assets
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"; CODE="${DESIGN}-CS"; SLUG="${{ steps.select.outputs.slug }}"
          FEATURED="content/products/assets/${CODE}-${SLUG}-product-r${GITHUB_RUN_ID}.webp"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pattern-system/iconic_destinations/publish_queue.json content/pattern-system/collections/iconic-destinations/designs.json             "content/pattern-system/collections/iconic-destinations/approved-pixel-designs/${DESIGN}-${SLUG}.png"             "content/pattern-system/collections/iconic-destinations/source-designs/${DESIGN}-${SLUG}.png"             "content/pattern-system/patterns/${CODE}/pattern.json" "content/pattern-system/products/${CODE}/product.json" content/products/catalog.json             "content/products/assets/${CODE}-product.webp" "$FEATURED" "content/products/assets/${CODE}-design.webp"             "content/products/assets/${CODE}-gallery-2.webp" "content/products/assets/${CODE}-gallery-3.webp" "content/products/assets/${CODE}-gallery-4.webp"
          git add -A -- ":(glob)content/products/assets/${CODE}-${SLUG}-product-r*.webp"
          git commit -m "Publish Iconic Destinations ${DESIGN} cross stitch [skip ci]"
          git fetch origin main; git rebase origin/main; git push origin HEAD:main

      - name: Archive generated PDF
        if: success() && steps.select.outputs.design_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: iconic-destinations-${{ steps.select.outputs.design_id }}-pdf
          path: content/products/files/Drielo_${{ steps.select.outputs.design_id }}-CS.pdf
          retention-days: 30

      - name: Record failure
        if: failure() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main; git reset --hard origin/main
          python3 content/pattern-system/iconic_destinations/queue_state.py fail "$DESIGN" --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --error "Automatic Iconic Destinations publish run failed; see GitHub Actions logs."
          git add content/pattern-system/iconic_destinations/publish_queue.json
          git commit -m "Record Iconic Destinations ${DESIGN} publish failure [skip ci]"; git push origin HEAD:main

      - name: Continue Iconic publication queue
        if: always() && !cancelled() && steps.select.outputs.design_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if [ "$(python3 content/pattern-system/iconic_destinations/queue_state.py has-work)" = "yes" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/iconic-destinations-auto-publish.yml/dispatches" -f ref=main
            echo "NEXT_ICONIC_RUN_DISPATCHED"
          else
            echo "ICONIC_QUEUE_COMPLETE"
          fi

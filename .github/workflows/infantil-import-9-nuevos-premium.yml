name: Infantil Import 9 New Premium
# rollout-generation: ACTIVE-new-premium-9-no-reindeer-clean-v2-2026-09-24
# additive import: exactly nine new premium motifs, no reindeer; one design per run
# Pop Art-style featured + 3 gallery previews

on:
  push:
    branches: [feature/infantil-9-nuevos-premium]
    paths:
      - '.github/workflows/infantil-import-9-nuevos-premium.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: drielo-infantil-new9-premium
  cancel-in-progress: false

jobs:
  publish-next:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout sequential rebuild branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Preflight exact nine new premium designs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path

          system=Path("content/pattern-system")
          collection=system/"collections"/"baby-nursery"
          designs=json.loads((collection/"designs.json").read_text(encoding="utf-8"))["designs"]
          by_id={d["base_design_id"]:d for d in designs}
          expected=[f"I{i:04d}" for i in range(12,21)]
          expected_sha={
            "I0012":"a367038273ccaf60c94092e7803520e487bd7810e078a76076ff7b1c8d018968",
            "I0013":"6824966717a6501e4e12f08dc7ac6e0fc56935761345eee08b7df212863a2e86",
            "I0014":"26185b07e3a2424ae27629d5d0696f5886584d26c0c8e6bc33dc990381fed7f6",
            "I0015":"38bced43db375b58d9370c6179203efbf80bb756de44431f2279d8929de29cf9",
            "I0016":"1ab227834df5af6aba4f80adcb992520c310406e7dd25b03d6023b6cfe8a7763",
            "I0017":"dad725cfec92a27b51e0c112dfdaecfa7fc7f59408de9da34eb8d2065f34f005",
            "I0018":"5d9983c5d644ce5a7a8b8a0c49e1c5729ffb9a93a4447150fa5b196408ce0c03",
            "I0019":"48fe7956d1432f724aee78afeb9b118183cd2c8197cfc0c0219cb3504f9517ff",
            "I0020":"30e186dd4e7841066c7e48e58452b8aa36e7d4a045ff86a1b92ab7492f23bc9d",
          }
          seen=set()
          for did in expected:
              d=by_id.get(did)
              if not d:
                  raise SystemExit(f"{did}: missing from designs.json")
              if d.get("approved_batch")!="new-premium-9-no-reindeer":
                  raise SystemExit(f"{did}: wrong approved batch")
              text=" ".join(str(d.get(k,"")) for k in ("title_en","title_es","slug")).lower()
              if any(word in text for word in ("reindeer","deer","reno","ciervito")):
                  raise SystemExit(f"{did}: rejected deer/reindeer detected")
              rel=f"collections/baby-nursery/approved-new-9/{did}.matrix.zlib.b64"
              if d.get("approved_matrix_asset")!=rel:
                  raise SystemExit(f"{did}: wrong matrix asset {d.get('approved_matrix_asset')}")
              p=system/rel
              if not p.is_file():
                  raise SystemExit(f"{did}: matrix asset missing")
              raw=zlib.decompress(base64.b64decode(p.read_text(encoding="ascii").strip(),validate=True))
              digest=hashlib.sha256(raw).hexdigest()
              if digest!=expected_sha[did] or d.get("approved_matrix_sha256")!=expected_sha[did]:
                  raise SystemExit(f"{did}: SHA mismatch {digest}")
              rows=raw.decode("ascii").splitlines()
              if len(rows)!=120 or any(len(row)!=100 for row in rows):
                  raise SystemExit(f"{did}: matrix is not 100x120")
              if digest in seen:
                  raise SystemExit(f"{did}: duplicate matrix")
              seen.add(digest)
              print("NEW_PREMIUM_MATRIX_OK",did,d["slug"],digest)
          if len(seen)!=9:
              raise SystemExit("Expected nine unique matrices")
          print("NEW_PREMIUM_9_PREFLIGHT_OK")
          PY

      - name: Select next pending design
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/baby_nursery/queue_state.py next --github-output "$GITHUB_OUTPUT"

      - name: Show queue state
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/baby_nursery/queue_state.py summary
          echo "Selected: ${{ steps.select.outputs.design_id }}"

      - name: Verify new-nine queue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("content/pattern-system/baby_nursery/publish_queue.json").read_text(encoding="utf-8"))
          ids=[x["base_design_id"] for x in q["items"]]
          expected=[f"I{i:04d}" for i in range(12,21)]
          if ids!=expected or q.get("exact_allowlist")!=expected:
              raise SystemExit(f"Unexpected new-nine queue: {ids}")
          if any(x.get("status") not in {"pending","published","failed"} for x in q["items"]):
              raise SystemExit("Unexpected queue status")
          item_text=" ".join(
              " ".join(str(item.get(k,"")) for k in ("title_en","title_es","slug","base_design_id"))
              for item in q["items"]
          ).lower()
          if any(word in item_text for word in ("reindeer","ciervito","reno")):
              raise SystemExit("Rejected reindeer/deer design detected in queue")
          print("NEW_PREMIUM_QUEUE_OK",ids)
          PY

      - name: Install renderer dependencies
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Build canonical master-derived patterns and render four techniques
        if: steps.select.outputs.design_id != ''
        env:
          DRIELO_GALLERY_REVISION: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/baby_nursery/publish_design.py "${{ steps.select.outputs.design_id }}"

      - name: Validate generated design bundle
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          python3 - "$DESIGN" <<'PY'
          import json
          import sys
          from pathlib import Path
          from PIL import Image

          design=sys.argv[1]
          root=Path(".")
          system=root/"content"/"pattern-system"
          sys.path.insert(0,str((system/"baby_nursery").resolve()))
          from generate_reference_master import design_meta, load_design_reference

          meta=design_meta(design)
          direct=load_design_reference(design,meta)
          if not direct:
              raise SystemExit(f"{design}: approved reference missing")
          if direct["source_sha256"] != meta.get("approved_matrix_sha256"):
              raise SystemExit(f"{design}: generated reference did not come from configured approved matrix")
          rows=direct["canonical"]["rows"]
          if len(rows)!=120 or any(len(r)!=100 for r in rows):
              raise SystemExit(f"{design}: approved matrix is not 100x120")

          collection=json.loads((system/"collections"/"baby-nursery"/"collection.json").read_text(encoding="utf-8"))
          allowed_hex={p["hex"].upper() for p in collection["palette"]}
          allowed_rgb={tuple(int(p["hex"].lstrip("#")[i:i+2],16) for i in (0,2,4)) for p in collection["palette"]}
          grids={"CS":(100,120),"C2C":(60,72),"TC":(80,96),"LH":(60,72)}

          for suffix,(w,h) in grids.items():
              code=f"{design}-{suffix}"
              pat=json.loads((system/"patterns"/code/"pattern.json").read_text(encoding="utf-8"))
              if (pat.get("stitch_width"),pat.get("stitch_height"))!=(w,h):
                  raise SystemExit(f"{code}: wrong grid")
              if len(pat.get("matrix",[]))!=h or any(len(r)!=w for r in pat["matrix"]):
                  raise SystemExit(f"{code}: malformed matrix")
              if pat.get("total_stitches",0)<=0 or not pat.get("threads"):
                  raise SystemExit(f"{code}: empty pattern")
              if any(str(t.get("color","")).upper() not in allowed_hex for t in pat["threads"]):
                  raise SystemExit(f"{code}: colour outside approved palette")
              if suffix=="CS":
                  canonical=[[None if c=="." else c for c in row] for row in rows]
                  if pat["matrix"]!=canonical:
                      raise SystemExit(f"{code}: CS matrix differs from mapped approved reference")

              pdf=root/"content/products/files"/f"Drielo_{code}.pdf"
              image=root/"content/products/assets"/f"{code}-product.webp"
              gallery=[root/"content/products/assets"/f"{code}-gallery-{i}.webp" for i in (2,3,4)]
              if not pdf.is_file() or pdf.stat().st_size<100000 or pdf.read_bytes()[:4]!=b"%PDF":
                  raise SystemExit(f"{code}: invalid PDF")
              if not image.is_file() or image.stat().st_size<50000:
                  raise SystemExit(f"{code}: invalid product image")
              if any((not g.is_file()) or g.stat().st_size<30000 for g in gallery):
                  raise SystemExit(f"{code}: invalid gallery")

          ref=system/"collections"/"baby-nursery"/"reference-masters"/f"{design}-{meta['slug']}-reference.png"
          im=Image.open(ref).convert("RGBA")
          if im.size!=(800,960):
              raise SystemExit(f"{design}: reference master wrong size")
          alpha=im.getchannel("A")
          if alpha.getextrema()!=(0,255) or not alpha.getbbox():
              raise SystemExit(f"{design}: reference master must have transparent exterior")
          for r,g,b,a in im.getdata():
              if a and (r,g,b) not in allowed_rgb:
                  raise SystemExit(f"{design}: master colour outside approved palette {(r,g,b)}")

          print(design,"SEQUENTIAL_BUNDLE_VALID")
          PY

      - name: Build four-product WooCommerce package
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          STAGE="/tmp/drielo-${DESIGN}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"

          python3 - "$DESIGN" "$STAGE" <<'PY'
          import json
          import sys
          from pathlib import Path

          design=sys.argv[1]
          stage=Path(sys.argv[2])
          d=json.loads(Path('content/products/catalog.json').read_text(encoding='utf-8'))
          codes={f'{design}-{s}' for s in ('CS','C2C','TC','LH')}
          cats={
            'cross-stitch-patterns','cross-stitch-baby-nursery',
            'c2c-crochet-patterns','c2c-crochet-baby-nursery',
            'tapestry-crochet-patterns','tapestry-crochet-baby-nursery',
            'latch-hook-rug-patterns','latch-hook-rug-baby-nursery',
          }
          out=dict(d)
          out['products']=[p for p in d.get('products',[]) if p.get('code') in codes]
          out['collections']=[c for c in d.get('collections',[]) if c.get('slug')=='baby-nursery']
          out['categories']=[c for c in d.get('categories',[]) if c.get('slug') in cats]
          found={p.get('code') for p in out['products']}
          if found!=codes:
              raise SystemExit(f'Package catalog mismatch: {found} != {codes}')
          (stage/'content/products/catalog.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          PY

          for suffix in CS C2C TC LH; do
            code="${DESIGN}-${suffix}"
            cp "content/products/assets/${code}-product.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-2.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-3.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-4.webp" "$STAGE/content/products/assets/"
            cp "content/products/files/Drielo_${code}.pdf" "$STAGE/content/products/files/"
          done
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf "/tmp/drielo-${DESIGN}.tgz" -C "$STAGE" content

      - name: Configure SSH
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          scp -i ~/.ssh/drielo_products_key "/tmp/drielo-${DESIGN}.tgz" "$VPS_USER@$VPS_HOST:/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}.tgz"

      - name: Publish four products to WooCommerce and verify
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "DESIGN='${DESIGN}' GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products

          "${DOCKER[@]}" exec -e DESIGN="$DESIGN" make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $design=getenv("DESIGN");
            $suffixes=array("CS","C2C","TC","LH");
            foreach ($suffixes as $suffix) {
              $sku="DRIELO-".$design."-".$suffix;
              $id=wc_get_product_id_by_sku($sku);
              $p=$id ? wc_get_product($id) : false;
              if (!$p) { fwrite(STDERR,"Missing ".$sku.PHP_EOL); exit(2); }
              $cols=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
              $downloads=count($p->get_downloads());
              $image=$p->get_image_id();
              $gallery_ids=$p->get_gallery_image_ids();
              $gallery=count($gallery_ids);
              $expected_feature="assets/".$design."-".$suffix."-product.webp";
              $feature_source=(string)get_post_meta($image,"_drielo_source_asset",true);
              $feature_hash=(string)get_post_meta($image,"_drielo_source_hash",true);
              $feature_file="/tmp/drielo-products/".$expected_feature;
              $expected_feature_hash=is_file($feature_file) ? md5_file($feature_file) : "";
              $expected_gallery=array(
                "assets/".$design."-".$suffix."-gallery-2.webp",
                "assets/".$design."-".$suffix."-gallery-3.webp",
                "assets/".$design."-".$suffix."-gallery-4.webp"
              );
              $actual_gallery_sources=array();
              foreach($gallery_ids as $gid){
                $src=(string)get_post_meta($gid,"_drielo_source_asset",true);
                $hash=(string)get_post_meta($gid,"_drielo_source_hash",true);
                $file="/tmp/drielo-products/".$src;
                $expected_hash=is_file($file) ? md5_file($file) : "";
                if(!$src || !$expected_hash || !hash_equals($expected_hash,$hash)){
                  fwrite(STDERR,"Gallery media hash/source mismatch ".$sku." attachment=".$gid." source=".$src.PHP_EOL); exit(4);
                }
                $actual_gallery_sources[]=$src;
              }
              sort($actual_gallery_sources);
              $sorted_expected=$expected_gallery; sort($sorted_expected);

              echo $sku." id=".$id." status=".$p->get_status()." image=".$image." gallery=".$gallery." downloads=".$downloads." collection=".implode(",",is_wp_error($cols)?array():$cols)." feature_source=".$feature_source." url=".get_permalink($id).PHP_EOL;
              if ($p->get_status()!=="publish" || !$image || $gallery!==3 || $downloads<1 || !in_array("baby-nursery",is_wp_error($cols)?array():$cols,true)) {
                fwrite(STDERR,"Incomplete ".$sku.PHP_EOL); exit(3);
              }
              if($feature_source!==$expected_feature || !$expected_feature_hash || !hash_equals($expected_feature_hash,$feature_hash)){
                fwrite(STDERR,"Featured media hash/source mismatch ".$sku." got=".$feature_source." expected=".$expected_feature.PHP_EOL); exit(4);
              }
              if($actual_gallery_sources!==$sorted_expected){
                fwrite(STDERR,"Gallery source mismatch ".$sku." got=".implode(",",$actual_gallery_sources)." expected=".implode(",",$sorted_expected).PHP_EOL); exit(4);
              }
            }
          '

          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Commit generated new design to branch
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/pattern-system/collections/baby-nursery/source-designs/${DESIGN}-*.png content/pattern-system/collections/baby-nursery/reference-masters/${DESIGN}-*-reference.png content/pattern-system/patterns/${DESIGN}-CS/pattern.json content/pattern-system/patterns/${DESIGN}-C2C/pattern.json content/pattern-system/patterns/${DESIGN}-TC/pattern.json content/pattern-system/patterns/${DESIGN}-LH/pattern.json content/pattern-system/products/${DESIGN}-CS/product.json content/pattern-system/products/${DESIGN}-C2C/product.json content/pattern-system/products/${DESIGN}-TC/product.json content/pattern-system/products/${DESIGN}-LH/product.json content/products/catalog.json content/products/assets/${DESIGN}-CS-product.webp content/products/assets/${DESIGN}-CS-gallery-2.webp content/products/assets/${DESIGN}-CS-gallery-3.webp content/products/assets/${DESIGN}-CS-gallery-4.webp content/products/assets/${DESIGN}-C2C-product.webp content/products/assets/${DESIGN}-C2C-gallery-2.webp content/products/assets/${DESIGN}-C2C-gallery-3.webp content/products/assets/${DESIGN}-C2C-gallery-4.webp content/products/assets/${DESIGN}-TC-product.webp content/products/assets/${DESIGN}-TC-gallery-2.webp content/products/assets/${DESIGN}-TC-gallery-3.webp content/products/assets/${DESIGN}-TC-gallery-4.webp content/products/assets/${DESIGN}-LH-product.webp content/products/assets/${DESIGN}-LH-gallery-2.webp content/products/assets/${DESIGN}-LH-gallery-3.webp content/products/assets/${DESIGN}-LH-gallery-4.webp

          if git diff --cached --quiet; then
            echo "Generated design already matches sequential branch."
          else
            git commit -m "Publish new premium Infantil ${DESIGN} in four techniques [skip ci]"
            git fetch origin feature/infantil-9-nuevos-premium
            git rebase origin/feature/infantil-9-nuevos-premium
            git push origin HEAD:feature/infantil-9-nuevos-premium
          fi

      - name: Mark design published in queue
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/infantil-9-nuevos-premium
          git reset --hard origin/feature/infantil-9-nuevos-premium
          python3 content/pattern-system/baby_nursery/queue_state.py success "$DESIGN" --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git add content/pattern-system/baby_nursery/publish_queue.json
          if git diff --cached --quiet; then
            echo "Queue already reflects published state."
          else
            git commit -m "Mark new premium Infantil ${DESIGN} published [skip ci]"
            git push origin HEAD:feature/infantil-9-nuevos-premium
          fi

      - name: Archive PDFs for this design
        if: success() && steps.select.outputs.design_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: baby-nursery-${{ steps.select.outputs.design_id }}-pdfs
          path: |
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-CS.pdf
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-C2C.pdf
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-TC.pdf
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-LH.pdf
          retention-days: 30

      - name: Record failure and stop queue
        if: failure() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/infantil-9-nuevos-premium
          git reset --hard origin/feature/infantil-9-nuevos-premium
          python3 content/pattern-system/baby_nursery/queue_state.py fail "$DESIGN"             --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             --error "Automatic publish run failed; see GitHub Actions logs."
          git add content/pattern-system/baby_nursery/publish_queue.json
          git commit -m "Record new premium Infantil ${DESIGN} failure [skip ci]"
          git push origin HEAD:feature/infantil-9-nuevos-premium

      - name: Dispatch next queued design
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(python3 content/pattern-system/baby_nursery/queue_state.py has-work)" = "yes" ]; then
            echo "Exactly one next new premium Infantil design will be dispatched."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/infantil-import-9-nuevos-premium.yml/dispatches" -f ref=feature/infantil-9-nuevos-premium
          else
            echo "No pending new premium Infantil designs remain."
            python3 content/pattern-system/baby_nursery/queue_state.py summary
          fi

# canonical reference migration pause trigger

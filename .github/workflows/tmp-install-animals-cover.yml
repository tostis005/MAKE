name: TEMP install Animals collection cover

on:
  push:
    branches: [main]
    paths:
      - 'tmp/animals-cover/READY'

permissions:
  contents: write

concurrency:
  group: drielo-animals-cover-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild approved Animals cover
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/animals-cover/cover.part* > /tmp/animals-cover.b64
          base64 -d /tmp/animals-cover.b64 > /tmp/animals-collection-cover-v3.webp
          test -s /tmp/animals-collection-cover-v3.webp

      - name: Verify final image
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          p='/tmp/animals-collection-cover-v3.webp'
          im=Image.open(p)
          if im.size != (1536, 1536):
              raise SystemExit(f'Unexpected Animals cover size: {im.size}')
          if im.format != 'WEBP':
              raise SystemExit(f'Unexpected Animals cover format: {im.format}')
          print('VERIFIED', im.format, im.size)
          PY

      - name: Install cover and update repository references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/products/assets
          cp /tmp/animals-collection-cover-v3.webp content/products/assets/animals-collection-cover-v3.webp

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path('content/products/collection-covers.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['updated_at'] = '2026-09-28'
          source = data.setdefault('source', {})
          source['transport'] = 'gmail-temporary-handoff'
          source['gmail_message_id'] = '1a0e9c2a9ee1cf23'
          source['note'] = (
              'Approved collection cover images supplied by the user and relayed through Gmail before installation in GitHub. '
              'Animals cover refreshed with exact 1536x1536 mockup geometry; Aida opening x438 y212 w685 h822.'
          )
          for item in data.get('collections', []):
              if item.get('slug') == 'animals':
                  item['cover_asset'] = 'assets/animals-collection-cover-v3.webp'
                  item['source_filename'] = 'animals-webp-20.webp'
                  item['technical_geometry'] = {
                      'source_px': {'width': 1536, 'height': 1536},
                      'area_px': {'x': 438, 'y': 212, 'width': 685, 'height': 822}
                  }
                  break
          else:
              raise SystemExit('Animals collection entry not found in collection-covers.json')
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sync = Path('.github/workflows/tmp-sync-collection-covers-live.yml')
          text = sync.read_text(encoding='utf-8')
          text = text.replace(
              'content/products/assets/animals-collection-cover-v2.jpg',
              'content/products/assets/animals-collection-cover-v3.webp'
          )
          text = text.replace(
              'assets/animals-collection-cover-v2.jpg',
              'assets/animals-collection-cover-v3.webp'
          )
          sync.write_text(text, encoding='utf-8')
          PY

      - name: Commit installed cover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Drielo Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add content/products/assets/animals-collection-cover-v3.webp
          git add content/products/collection-covers.json
          git add .github/workflows/tmp-sync-collection-covers-live.yml
          git rm -r tmp/animals-cover
          git rm .github/workflows/tmp-install-animals-cover.yml
          git commit -m 'Update Animals collection cover [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

name: TEMP install Animals collection cover

on:
  push:
    branches: [main]
    paths:
      - 'tmp/animals-cover/READY'

permissions:
  contents: write

concurrency:
  group: drielo-animals-cover-install-fast
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rebuild approved Animals source
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/animals-cover/cover.part* > /tmp/animals-cover.b64
          base64 -d /tmp/animals-cover.b64 > /tmp/animals-source.avif
          test -s /tmp/animals-source.avif

      - name: Verify and convert final image
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow pillow-avif-plugin
          python3 - <<'PY'
          from PIL import Image
          import pillow_avif

          src='/tmp/animals-source.avif'
          dst='/tmp/animals-collection-cover-v3.jpg'
          im=Image.open(src)
          if im.size != (1536, 1536):
              raise SystemExit(f'Unexpected Animals source size: {im.size}')
          im.convert('RGB').save(dst, 'JPEG', quality=92, optimize=True, subsampling=0)
          check=Image.open(dst)
          if check.size != (1536, 1536) or check.format != 'JPEG':
              raise SystemExit(f'Unexpected final Animals cover: {check.format} {check.size}')
          print('VERIFIED_FINAL', check.format, check.size)
          PY

      - name: Install cover and update manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/products/assets
          cp /tmp/animals-collection-cover-v3.jpg content/products/assets/animals-collection-cover-v3.jpg

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path('content/products/collection-covers.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['updated_at'] = '2026-09-28'
          source = data.setdefault('source', {})
          source['transport'] = 'gmail-temporary-handoff'
          source['gmail_message_id'] = '1a0e9c14f64516c5'
          source['note'] = (
              'Approved Animals cover supplied through temporary Gmail handoff and installed in GitHub. '
              'Final asset is 1536x1536; Aida opening x438 y212 w685 h822.'
          )
          for item in data.get('collections', []):
              if item.get('slug') == 'animals':
                  item['cover_asset'] = 'assets/animals-collection-cover-v3.jpg'
                  item['source_filename'] = 'animals-webp-60.webp'
                  item['technical_geometry'] = {
                      'source_px': {'width': 1536, 'height': 1536},
                      'area_px': {'x': 438, 'y': 212, 'width': 685, 'height': 822}
                  }
                  break
          else:
              raise SystemExit('Animals collection entry not found in collection-covers.json')
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit installed cover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Drielo Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add content/products/assets/animals-collection-cover-v3.jpg
          git add content/products/collection-covers.json
          git rm -r tmp/animals-cover
          git commit -m 'Update Animals collection cover [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

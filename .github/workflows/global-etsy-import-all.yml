name: Global Etsy import all products

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-etsy-import-all.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-all:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_global_etsy_key
          chmod 600 ~/.ssh/drielo_global_etsy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Enable, queue and start all Drielo Etsy products
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_global_etsy_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";
            require_once ABSPATH."wp-admin/includes/plugin.php";

            $plugin=get_plugin_data(WP_PLUGIN_DIR."/drielo-etsy-sync/drielo-etsy-sync.php",false,false);
            $version=(string)($plugin["Version"]??"");
            echo "PLUGIN_VERSION=".$version.PHP_EOL;
            if(version_compare($version,"1.4.7","<") || !class_exists("Drielo_Etsy_Sync")){
              fwrite(STDERR,"Drielo Etsy Sync 1.4.7+ required".PHP_EOL);
              exit(2);
            }

            $sync=Drielo_Etsy_Sync::instance();
            $ref=new ReflectionClass($sync);
            $snapshot_method=$ref->getMethod("sync_run_snapshot"); $snapshot_method->setAccessible(true);
            $set_state=$ref->getMethod("set_batch_product_state"); $set_state->setAccessible(true);
            $refresh=$ref->getMethod("refresh_sync_run"); $refresh->setAccessible(true);

            $existing=$snapshot_method->invoke($sync,null);
            if(!empty($existing["active"])){
              fwrite(STDERR,"A sync is already active: ".wp_json_encode(array(
                "id"=>$existing["id"]??"",
                "status"=>$existing["status"]??"",
                "completed"=>$existing["completed"]??0,
                "total"=>$existing["total"]??0
              )).PHP_EOL);
              exit(3);
            }

            $allowed=array("cross-stitch","c2c-crochet","tapestry-crochet","latch-hook");
            $ids=get_posts(array(
              "post_type"=>"product",
              "post_status"=>"publish",
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "orderby"=>"ID",
              "order"=>"ASC"
            ));
            $selected=array();
            $by=array("CS"=>0,"C2C"=>0,"TC"=>0,"LH"=>0,"OTHER"=>0);
            $existing_linked=0;
            $new_count=0;

            foreach($ids as $id){
              $p=wc_get_product($id);
              if(!$p) continue;
              $sku=(string)$p->get_sku();
              $tech=(string)get_post_meta($id,"_drielo_technique",true);
              $code="";
              if(preg_match("/-(CS|C2C|TC|LH)$/",$sku,$m)) $code=$m[1];
              if(!$code && in_array($tech,$allowed,true)){
                $code=array_search($tech,array(
                  "CS"=>"cross-stitch",
                  "C2C"=>"c2c-crochet",
                  "TC"=>"tapestry-crochet",
                  "LH"=>"latch-hook"
                ),true);
              }
              if(!$code) continue;

              $selected[]=(int)$id;
              if(isset($by[$code])) $by[$code]++; else $by["OTHER"]++;
              update_post_meta($id,"_drielo_etsy_enabled","yes");
              $target=(string)get_post_meta($id,"_drielo_etsy_target_state",true);
              if(!in_array($target,array("active","draft"),true)){
                update_post_meta($id,"_drielo_etsy_target_state","active");
              }

              if(absint(get_post_meta($id,"_drielo_etsy_listing_id",true))) $existing_linked++;
              else $new_count++;
            }

            $selected=array_values(array_unique($selected));
            echo "SELECTED=".count($selected).PHP_EOL;
            echo "BY_TECH=".wp_json_encode($by).PHP_EOL;
            echo "ALREADY_LINKED=".$existing_linked.PHP_EOL;
            echo "NEW_LISTINGS=".$new_count.PHP_EOL;
            if(count($selected)<200){
              fwrite(STDERR,"Unexpectedly low global product count".PHP_EOL);
              exit(4);
            }

            $batch=wp_generate_uuid4();
            $now=current_time("mysql");
            update_option("drielo_etsy_sync_run",array(
              "id"=>$batch,
              "mode"=>"safe",
              "product_ids"=>$selected,
              "started_at"=>$now,
              "started_by"=>1,
              "status"=>"queued",
              "completed_at"=>"",
              "updated_at"=>$now,
              "global_import"=>1
            ),false);

            $queued=0;$failed=0;
            foreach($selected as $id){
              delete_post_meta($id,"_drielo_etsy_batch_id");
              delete_post_meta($id,"_drielo_etsy_batch_state");
              delete_post_meta($id,"_drielo_etsy_batch_message");
              delete_post_meta($id,"_drielo_etsy_batch_updated_at");
              $set_state->invoke($sync,(int)$id,$batch,"queued","Importación global: pendiente de procesamiento.");

              $args=array((int)$id,0,$batch);
              $scheduled=false;
              if(function_exists("as_enqueue_async_action")){
                $action_id=as_enqueue_async_action("drielo_etsy_sync_product_async",$args,"drielo-etsy",true);
                $scheduled=!empty($action_id);
                if(!$scheduled && function_exists("as_has_scheduled_action")){
                  $scheduled=(bool)as_has_scheduled_action("drielo_etsy_sync_product_async",$args,"drielo-etsy");
                }
              } else {
                $scheduled=wp_schedule_single_event(time()+1,"drielo_etsy_sync_product_async",$args);
              }

              if($scheduled){
                update_post_meta($id,"_drielo_etsy_queue_state","queued-safe");
                $queued++;
              } else {
                update_post_meta($id,"_drielo_etsy_queue_state","failed");
                $set_state->invoke($sync,(int)$id,$batch,"failed","No se pudo añadir a la cola.");
                $failed++;
              }
            }
            $refresh->invoke($sync,$batch);
            echo "BATCH=".$batch." QUEUED=".$queued." QUEUE_FAILED=".$failed.PHP_EOL;
            if($queued<1) exit(5);

            if(class_exists("ActionScheduler_QueueRunner")){
              for($round=1;$round<=30;$round++){
                $pending=function_exists("as_get_scheduled_actions")
                  ? count(as_get_scheduled_actions(array(
                      "hook"=>"drielo_etsy_sync_product_async",
                      "group"=>"drielo-etsy",
                      "status"=>"pending",
                      "per_page"=>500
                    ),"ids"))
                  : 0;
                $snap=$snapshot_method->invoke($sync,null);
                echo "ROUND=".$round
                  ." PENDING=".$pending
                  ." SUCCESS=".($snap["counts"]["success"]??0)
                  ." FAILED=".($snap["counts"]["failed"]??0)
                  ." RUNNING=".($snap["counts"]["running"]??0)
                  .PHP_EOL;
                if($pending===0) break;
                $processed=ActionScheduler_QueueRunner::instance()->run();
                echo "PROCESSED=".$processed.PHP_EOL;
                if((int)$processed<=0) break;
              }
            }

            $final=$snapshot_method->invoke($sync,null);
            echo "SNAPSHOT=".wp_json_encode(array(
              "id"=>$final["id"]??"",
              "status"=>$final["status"]??"",
              "total"=>$final["total"]??0,
              "completed"=>$final["completed"]??0,
              "pending"=>$final["pending"]??0,
              "counts"=>$final["counts"]??array()
            )).PHP_EOL;
          '

          # Also poke WordPress cron after the explicit runner.
          curl -fsS --max-time 30 "https://drielo.com/wp-cron.php?doing_wp_cron=$(date +%s)" >/dev/null || true
          REMOTE

      - name: Verify global batch is moving
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          ssh -i ~/.ssh/drielo_global_etsy_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $run=get_option("drielo_etsy_sync_run",array());
            $batch=(string)($run["id"]??"");
            $ids=array_values(array_filter(array_map("absint",(array)($run["product_ids"]??array()))));
            $counts=array("queued"=>0,"running"=>0,"success"=>0,"failed"=>0,"skipped"=>0,"other"=>0);
            foreach($ids as $id){
              $bid=(string)get_post_meta($id,"_drielo_etsy_batch_id",true);
              $state=(string)get_post_meta($id,"_drielo_etsy_batch_state",true);
              if(!$bid||!hash_equals($batch,$bid)){$counts["other"]++;continue;}
              if(isset($counts[$state]))$counts[$state]++;else $counts["other"]++;
            }
            echo "VERIFY_BATCH=".$batch.PHP_EOL;
            echo "VERIFY_COUNTS=".wp_json_encode($counts).PHP_EOL;
            if($counts["success"]+$counts["failed"]+$counts["running"]===0){
              fwrite(STDERR,"Global Etsy batch did not start moving.".PHP_EOL);
              exit(6);
            }
          '
          REMOTE

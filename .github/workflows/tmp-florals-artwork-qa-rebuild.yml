name: TEMP Florals Artwork QA Rebuild

on:
  push:
    branches:
      - feature/florals-pattern-generation
    paths:
      - '.github/workflows/tmp-florals-artwork-qa-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-florals-artwork-qa-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout paused Florals branch
        uses: actions/checkout@v4
        with:
          ref: feature/florals-pattern-generation
          fetch-depth: 1

      - name: Install QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow numpy playwright
          python3 -m playwright install --with-deps chromium

      - name: Repair blue artefacts in canonical source PNGs
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/florals/repair_blue_artifacts.py

      - name: Rebuild all 120 pattern and product JSONs
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/florals/build_collection.py

      - name: Regenerate QA assets for F0002 F0003 F0004 only
        env:
          DRIELO_GALLERY_REVISION: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for DESIGN in F0002 F0003 F0004; do
            python3 content/pattern-system/florals/publish_design.py "$DESIGN"
          done

      - name: Validate corrected patterns and renders
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('content/pattern-system')
          store=Path('content/products')
          banned={'3753','3325','3760','3747'}
          for bid in ('F0002','F0003','F0004'):
              for suffix in ('CS','C2C','TC','LH'):
                  code=f'{bid}-{suffix}'
                  p=json.loads((root/'patterns'/code/'pattern.json').read_text(encoding='utf-8'))
                  dmcs={str(t['dmc']) for t in p['threads']}
                  if dmcs & banned:
                      raise SystemExit(f'{code}: blue DMC artefact still present {sorted(dmcs & banned)}')
                  image=store/'assets'/f'{code}-product.webp'
                  pdf=store/'files'/f'Drielo_{code}.pdf'
                  if not image.is_file() or image.stat().st_size < 40000:
                      raise SystemExit(f'{code}: QA product image missing/invalid')
                  if not pdf.is_file() or pdf.stat().st_size < 100000:
                      raise SystemExit(f'{code}: QA PDF missing/invalid')
                  print(code,'colors',len(p['threads']),'stitches',p['total_stitches'],
                        'image',image.stat().st_size,'pdf',pdf.stat().st_size)

          status=json.loads((root/'florals/generation_status.json').read_text(encoding='utf-8'))
          if status.get('pattern_count') != 120 or status.get('production_publish') is not False:
              raise SystemExit('Florals generation_status invalid after QA rebuild')
          print('FLORALS_QA_REBUILD_VALID')
          PY

      - name: Keep queue paused and place corrected offenders first for later republish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('content/pattern-system/florals/publish_queue.json')
          q=json.loads(p.read_text(encoding='utf-8'))
          q['auto_continue']=False
          for item in q['items']:
              if item['base_design_id'] in {'F0002','F0003','F0004'}:
                  item['status']='pending'
                  item['attempts']=0
                  item['last_run']=None
                  item['last_error']=None
                  item.pop('published_at',None)
                  item.pop('failed_at',None)
          p.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit QA rebuild without publishing to WooCommerce
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-florals-artwork-qa-rebuild.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A             .github/workflows/tmp-florals-artwork-qa-rebuild.yml             content/pattern-system/collections/florals/source-designs             content/pattern-system/collections/florals/reference-masters             content/pattern-system/collections/florals/designs.json             content/pattern-system/florals/generation_status.json             content/pattern-system/florals/publish_queue.json             content/pattern-system/florals/artwork_quality_review.json             content/pattern-system/patterns/F*             content/pattern-system/products/F*             content/products/catalog.json             content/products/assets/F0002-*             content/products/assets/F0003-*             content/products/assets/F0004-*             content/products/files/Drielo_F0002-*             content/products/files/Drielo_F0003-*             content/products/files/Drielo_F0004-*

          git commit -m "Repair Florals blue artefacts and rebuild QA patterns [skip ci]"
          git fetch --depth=20 origin feature/florals-pattern-generation
          git rebase origin/feature/florals-pattern-generation
          git push origin HEAD:feature/florals-pattern-generation

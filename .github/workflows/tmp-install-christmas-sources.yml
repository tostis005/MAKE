name: Install Christmas source assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-install-christmas-sources.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved source assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/source-images/collections/christmas/background
          mkdir -p content/source-images/collections/christmas/products
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-18f4-820e-b1c3-398a288b8395/raw?se=2026-10-03T21%3A36%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=d0b64b4e-2eac-561e-80ab-dcc402c564ca&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T13%3A27%3A40Z&ske=2026-10-04T13%3A27%3A40Z&sks=b&skv=2026-02-06&sig=VsnXXgmzVIWGDFfjGzimL4kz1wd5p3V6Ns6YrD5w4qw%3D' -o 'content/source-images/collections/christmas/background/christmas-collection-background.png'

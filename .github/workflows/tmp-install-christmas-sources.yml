          EOF
          sha256sum -c /tmp/christmas.sha256

      - name: Verify PNG dimensions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          def png_size(p):
              b=Path(p).read_bytes()
              assert b[:8] == b'\x89PNG\r\n\x1a\n', p
              return struct.unpack(">II", b[16:24])
          bg=Path("content/source-images/collections/christmas/background/christmas-collection-background.png")
          assert png_size(bg)==(1536,1536), png_size(bg)
          products=sorted(Path("content/source-images/collections/christmas/products").glob("*.png"))
          assert len(products)==15, len(products)
          for p in products:
              assert png_size(p)==(50,60), (p, png_size(p))
          print("OK: background 1536x1536 and 15 products 50x60")
          PY

      - name: Write collection config and palette
        shell: bash
        run: |
          cat > content/source-images/collections/christmas/config.json <<'EOF'
          {
            "schema_version": "1.0",
            "collection_id": "christmas",
            "product_size_px": [50, 60],
            "product_format": "png",
            "background_mode": "single",
            "background_directory": "background",
            "product_directory": "products",
            "filename_examples": ["N0001-christmas-tree.png"],
            "legacy_background_fallbacks": [],
            "notes": "Christmas Minis source set: 15 approved 50x60 PNG designs using one shared palette of at most 20 RGB colors. Background is the approved 1536x1536 Christmas mockup with the protected frame/canvas geometry preserved."
          }
          EOF
          cat > content/source-images/collections/christmas/palette20_rgb.json <<'EOF'
          {
            "schema_version": "1.0",
            "collection_id": "christmas",
            "palette_rgb": [
              [245,237,226],[228,198,165],[226,185,147],[164,99,57],[124,69,38],
              [73,38,20],[41,21,14],[246,168,152],[161,4,7],[204,87,82],
              [154,13,16],[45,75,51],[55,91,60],[109,134,75],[116,151,117],
              [202,139,51],[120,144,164],[238,232,220],[161,159,160],[155,156,151]
            ]
          }
          EOF

      - name: Register Christmas source collection
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("content/source-images/collections/registry.json")
          data=json.loads(p.read_text())
          entry={"id":"christmas","config":"christmas/config.json","catalogued":False}
          data["collections"]=[x for x in data.get("collections",[]) if x.get("id")!="christmas"]
          data["collections"].append(entry)
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+"\n")
          PY

      - name: Commit source assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/source-images/collections/christmas content/source-images/collections/registry.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add Christmas collection source assets"
            git push
          fi

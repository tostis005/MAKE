      - name: Verify exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/christmas.sha256 <<'EOF'
          d2d479e67ec39584f389b2dc0c1f4b99d7fed58e9448a259912adb7c09564b17  content/source-images/collections/christmas/background/christmas-collection-background.png

name: Temporary install collection covers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-install-collection-covers.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Download approved collection covers from temporary Gmail handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/drielo-covers
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b2ac-820e-a2ed-e5a070497064/raw?se=2026-09-28T07%3A35%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=900a7100-99a3-52db-94ed-3f56ec3f7fdc&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T07%3A28%3A10Z&ske=2026-09-29T07%3A28%3A10Z&sks=b&skv=2026-02-06&sig=N0/t7cLH571iZxB4b7ZBdDe9p4UPFzaqglNGqVuEfw4%3D' -o /tmp/drielo-covers/baby-nursery-collection-cover-v2.jpg
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-625c-820e-b5e7-f723c50b5fc9/raw?se=2026-09-28T07%3A35%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=1d620793-8bbe-538d-a1a7-57531feafd6a&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A15%3A42Z&ske=2026-09-29T00%3A15%3A42Z&sks=b&skv=2026-02-06&sig=PLVpQ/l9sAls/Awgd0JvjpEQHO7DZLeaQfhnX9r01vQ%3D' -o /tmp/drielo-covers/animals-collection-cover-v2.jpg
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-cf68-820e-b159-8b46b6fc450a/raw?se=2026-09-28T07%3A35%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=3f70fcdc-e732-5332-8c05-b63538651d7e&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T02%3A51%3A39Z&ske=2026-09-29T02%3A51%3A39Z&sks=b&skv=2026-02-06&sig=877fZlyV4RiLMLAGBiClY5NAwyd1ljUx%2B0hHdqWdU8k%3D' -o /tmp/drielo-covers/retratos-pop-art-collection-cover.png
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-5814-820e-ad7c-48eb90423871/raw?se=2026-09-28T07%3A35%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=f5963a6d-4639-5973-b720-18f5c3e74f4b&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A32%3A33Z&ske=2026-09-29T00%3A32%3A33Z&sks=b&skv=2026-02-06&sig=38jRsif83ZLdnRh8dvYhGMHXDgF/DDw2Cj8uOv8lFug%3D' -o /tmp/drielo-covers/iconic-destinations-collection-cover.png
          for f in /tmp/drielo-covers/*; do
            test -s "$f"
            test "$(stat -c %s "$f")" -gt 500000
            file "$f"
            sha256sum "$f"
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            content/products/assets
          sparse-checkout-cone-mode: true

      - name: Commit covers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/products/assets
          cp /tmp/drielo-covers/* content/products/assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             content/products/assets/baby-nursery-collection-cover-v2.jpg             content/products/assets/animals-collection-cover-v2.jpg             content/products/assets/retratos-pop-art-collection-cover.png             content/products/assets/iconic-destinations-collection-cover.png
          if git diff --cached --quiet; then
            echo "Collection covers already current."
            exit 0
          fi
          git commit -m "Install approved collection covers [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

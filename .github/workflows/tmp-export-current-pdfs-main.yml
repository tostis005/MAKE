name: Temporary export current Drielo PDFs

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/tmp-export-current-pdfs.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Persist run marker
        run: |
          set -euo pipefail
          mkdir -p tmp
          printf '{"run_id":%s,"sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > tmp/export-workflow-started.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/export-workflow-started.json
          git commit -m "Store temporary export run marker [skip ci]"
          git push origin HEAD:main

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_export_key
          chmod 600 ~/.ssh/drielo_export_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Export current WooCommerce PDF downloads
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          REMOTE_TAR="/tmp/drielo-current-pdfs-${GITHUB_RUN_ID}.tgz"
          ssh -i ~/.ssh/drielo_export_key "$VPS_USER@$VPS_HOST" "REMOTE_TAR='$REMOTE_TAR' bash -s" <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          CONTAINER_DIR="/tmp/drielo-current-pdfs"
          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$CONTAINER_DIR' && mkdir -p '$CONTAINER_DIR'"

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $out = "/tmp/drielo-current-pdfs";
            $ids = get_posts(array(
              "post_type"=>"product",
              "post_status"=>"publish",
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "meta_key"=>"_drielo_managed_product",
              "meta_value"=>"1",
              "orderby"=>"ID",
              "order"=>"ASC"
            ));
            $uploads = wp_upload_dir();
            $copied = 0;
            foreach ($ids as $id) {
              $p = wc_get_product($id);
              if (!$p) continue;
              $sku = $p->get_sku();
              if (!preg_match("/P(\\d{4})$/", $sku, $m)) continue;
              $code = "P".$m[1];
              $downloads = $p->get_downloads();
              if (!$downloads) {
                echo "NO_DOWNLOAD ".$code.PHP_EOL;
                continue;
              }
              $d = reset($downloads);
              $file = $d->get_file();
              $path = $file;
              if (preg_match("#^https?://#", $file)) {
                if (strpos($file, $uploads["baseurl"]) === 0) {
                  $path = $uploads["basedir"] . substr($file, strlen($uploads["baseurl"]));
                } else {
                  $site = site_url("/");
                  if (strpos($file, $site) === 0) {
                    $rel = ltrim(substr($file, strlen($site)), "/");
                    $path = ABSPATH . $rel;
                  }
                }
              }
              if (!is_file($path)) {
                echo "MISSING ".$code." file=".$file." path=".$path.PHP_EOL;
                continue;
              }
              $target = $out . "/Drielo_" . $code . ".pdf";
              if (!copy($path, $target)) {
                echo "COPY_FAILED ".$code.PHP_EOL;
                continue;
              }
              echo "COPIED ".$code." ".filesize($target)." bytes".PHP_EOL;
              $copied++;
            }
            echo "TOTAL=".$copied.PHP_EOL;
            if ($copied < 1) exit(3);
          '

          "${DOCKER[@]}" exec make-wp tar -czf /tmp/drielo-current-pdfs.tgz -C "$CONTAINER_DIR" .
          "${DOCKER[@]}" cp make-wp:/tmp/drielo-current-pdfs.tgz "$REMOTE_TAR"
          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$CONTAINER_DIR' /tmp/drielo-current-pdfs.tgz"
          REMOTE

          ssh -i ~/.ssh/drielo_export_key "$VPS_USER@$VPS_HOST" "cat '$REMOTE_TAR' && rm -f '$REMOTE_TAR'" > /tmp/drielo-current-pdfs.tgz
          mkdir -p exported-pdfs
          tar -xzf /tmp/drielo-current-pdfs.tgz -C exported-pdfs
          ls -lh exported-pdfs
          COUNT="$(find exported-pdfs -maxdepth 1 -type f -name '*.pdf' | wc -l)"
          echo "PDF_COUNT=$COUNT"
          test "$COUNT" -ge 1

      - name: Upload current PDFs
        uses: actions/upload-artifact@v4
        with:
          name: drielo-current-pdfs
          path: exported-pdfs/*.pdf
          if-no-files-found: error
          retention-days: 1

      - name: Persist artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 3
          mkdir -p tmp
          JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          ARTIFACT_ID="$(printf '%s' "$JSON" | jq -r '.artifacts[] | select(.name=="drielo-current-pdfs") | .id' | head -n1)"
          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "Artifact metadata not found"
            printf '%s\n' "$JSON"
            exit 1
          fi
          jq -n --argjson run_id "$GITHUB_RUN_ID" --argjson artifact_id "$ARTIFACT_ID"             '{run_id:$run_id, artifact_id:$artifact_id, artifact_name:"drielo-current-pdfs"}'             > tmp/export-artifact-main.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/export-artifact-main.json
          git commit -m "Store temporary PDF export artifact metadata [skip ci]"
          git push origin HEAD:main

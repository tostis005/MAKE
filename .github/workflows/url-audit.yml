name: Audit localized Drielo URLs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/url-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_url_audit_key
          chmod 600 ~/.ssh/drielo_url_audit_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Audit localized URL architecture
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_url_audit_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "make-wp container not found" >&2
            exit 1
          fi
          SITE_HOST="$("${DOCKER[@]}" exec make-wp php -r 'require "/var/www/html/wp-load.php"; $u=parse_url(home_url("/")); echo $u["host"] . (isset($u["port"]) ? ":" . $u["port"] : "");')"

          audit_route(){
            local route="$1"
            local label="$2"
            "${DOCKER[@]}" exec -e AUDIT_HOST="$SITE_HOST" -e AUDIT_ROUTE="$route" -e AUDIT_LABEL="$label" make-wp php -r '
              $host=getenv("AUDIT_HOST"); $route=getenv("AUDIT_ROUTE"); $label=getenv("AUDIT_LABEL");
              $ctx=stream_context_create(array("http"=>array(
                "method"=>"GET",
                "header"=>"Host: ".$host."\r\nUser-Agent: Drielo-URL-Audit\r\n",
                "ignore_errors"=>true, "follow_location"=>0, "timeout"=>15
              )));
              $html=@file_get_contents("http://127.0.0.1".$route,false,$ctx);
              $status=$http_response_header[0] ?? "no-status";
              $location="";
              foreach(($http_response_header ?? array()) as $h){ if(stripos($h,"Location:")===0){$location=trim(substr($h,9));}}
              $count=$html===false ? -1 : substr_count($html,"make_lang=");
              echo "ROUTE ".$label." ".$route." STATUS=".$status." LOCATION=".$location." MAKE_LANG_COUNT=".$count.PHP_EOL;
            '
          }

          audit_route "/tienda/" "shop-es"
          audit_route "/en/shop/" "shop-en"
          audit_route "/tienda/marilyn-monroe-con-chicle-patron-punto-de-cruz/" "product-es"
          audit_route "/en/shop/bubble-gum-portrait-cross-stitch-pattern/" "product-en"
          audit_route "/carrito/" "cart-es"
          audit_route "/en/cart/" "cart-en"
          audit_route "/mi-cuenta/" "account-es"
          audit_route "/en/my-account/" "account-en"
          audit_route "/finalizar-compra/" "checkout-es"
          audit_route "/en/checkout/" "checkout-en"
          audit_route "/articulos/" "articles-es"
          audit_route "/en/articles/" "articles-en"
          audit_route "/producto/bubble-gum-portrait-cross-stitch-pattern/" "legacy-product-es"
          audit_route "/producto/bubble-gum-portrait-cross-stitch-pattern/?make_lang=en" "legacy-product-en-query"
          audit_route "/journal/" "legacy-journal-es"
          audit_route "/en/journal/" "legacy-journal-en"
          audit_route "/categoria/florals/" "legacy-theme-es"
          audit_route "/en/category/florals/" "legacy-theme-en"

          "${DOCKER[@]}" exec make-wp php -r '
            require "/var/www/html/wp-load.php";
            echo "=== PAGES ===".PHP_EOL;
            foreach(get_pages(array("post_status"=>"publish")) as $p){
              echo "PAGE id=".$p->ID." slug=".$p->post_name." title=".$p->post_title." url=".get_permalink($p->ID).PHP_EOL;
            }
            echo "=== MENUS ===".PHP_EOL;
            $locations=get_nav_menu_locations();
            foreach($locations as $loc=>$term_id){
              echo "MENU_LOCATION ".$loc." term_id=".$term_id.PHP_EOL;
              $items=wp_get_nav_menu_items($term_id);
              if(is_array($items)) foreach($items as $item){
                echo "MENU_ITEM ".$loc." id=".$item->ID." title=".$item->title." url=".$item->url.PHP_EOL;
              }
            }
          '
          REMOTE

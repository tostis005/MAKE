name: TEMP Import Florals Sources Batch 2 Retry
on:
  push:
    branches: [feature/florals-pattern-generation]
    paths: ['.github/workflows/tmp-import-florals-sources-b2-retry.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drielo-florals-source-import-b2-retry
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/florals-pattern-generation
          fetch-depth: 0
      - name: Download approved sources F0006-F0010
        shell: bash
        run: |
          set -euo pipefail
          D='content/pattern-system/collections/florals/source-designs'
          mkdir -p "$D"
          curl -fL --retry 2 'https://sdmntprwestus.oaiusercontent.com/files/00000000-b834-8230-a3f8-3158f60f725d/raw?se=2026-09-24T14%3A28%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=59d1fcc1-08c1-504e-9e67-8aa571524a35&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T14%3A01%3A41Z&ske=2026-09-25T14%3A01%3A41Z&sks=b&skv=2026-02-06&sig=qGpCWCs15jqiMl8Gp4PZaxm6rbsHnBrm4iJ0qiyX3uk%3D' -o "$D/F0006-cherry-blossom-branch.png"
          curl -fL --retry 2 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-67f0-81fd-b8a5-65eaa9f746b9/raw?se=2026-09-24T14%3A28%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=46e1ad2d-c8d0-5d6d-852b-998840035e2a&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T14%3A09%3A28Z&ske=2026-09-25T14%3A09%3A28Z&sks=b&skv=2026-02-06&sig=ud%2BdFTntBjm%2BKYByzSVgsgLPBUVMEZewdZb19n52iGk%3D' -o "$D/F0007-pink-floral-heart-wreath.png"
          curl -fL --retry 2 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-d578-81fd-bd6d-a36842e46fba/raw?se=2026-09-24T14%3A28%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=4dc0e889-64bd-5969-9c1b-2968c2643baa&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A29%3A55Z&ske=2026-09-25T13%3A29%3A55Z&sks=b&skv=2026-02-06&sig=WaQKSXB9DZ6MX6TPDVNUcTGiwtci9L3KliW8K54HuQU%3D' -o "$D/F0008-daisy-mason-jar.png"
          curl -fL --retry 2 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-d614-81f4-93e9-ea43d10d3ed7/raw?se=2026-09-24T14%3A28%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=40899006-316f-538b-bbfc-54a7ece140ba&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T14%3A11%3A50Z&ske=2026-09-25T14%3A11%3A50Z&sks=b&skv=2026-02-06&sig=vx9es2JIVMbX8WD%2BURj/5hrbkCj%2B8VegrJhM6E6hG/0%3D' -o "$D/F0009-eucalyptus-ribbon-bundle.png"
          curl -fL --retry 2 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-236c-8211-ab16-4d6f6ca43c7d/raw?se=2026-09-24T14%3A28%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=40d4384f-8d48-56f6-8de2-9d33173c1650&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A54%3A07Z&ske=2026-09-25T13%3A54%3A07Z&sks=b&skv=2026-02-06&sig=jugpNaRTQBM3GewYscN/dJzYlGuS%2BZjrXgH8ds8A4E8%3D' -o "$D/F0010-potted-strawberry-plant.png"
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          d=Path('content/pattern-system/collections/florals/source-designs')
          for i in range(6,11):
              p=next(d.glob(f'F{i:04d}-*.png'))
              im=Image.open(p).convert('RGBA')
              if im.size!=(100,120) or im.getchannel('A').getbbox() is None: raise SystemExit(f'bad {p}: {im.size}')
              print(p.name,p.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pattern-system/collections/florals/source-designs/F000{6,7,8,9}-*.png content/pattern-system/collections/florals/source-designs/F0010-*.png
          git commit -m "Import approved Florals sources F0006-F0010 [skip ci]"
          git fetch origin feature/florals-pattern-generation
          git rebase origin/feature/florals-pattern-generation
          git push origin HEAD:feature/florals-pattern-generation

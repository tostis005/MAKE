name: TEMP export original Pop Art covers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-export-original-popart-covers.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original cover assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin regenerate-vivid-clean-p0001-p0020:refs/remotes/origin/regenerate-vivid-clean-p0001-p0020 --depth=1
          mkdir -p /tmp/original-popart
          for f in cover-cross-stitch.png cover-c2c-crochet.png cover-crochet.png cover-rug.png; do
            git show "origin/regenerate-vivid-clean-p0001-p0020:content/pattern-system/multitech/assets/$f" > "/tmp/original-popart/$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: original-popart-covers
          path: /tmp/original-popart/*.png
          retention-days: 1

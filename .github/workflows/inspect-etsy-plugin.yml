name: Inspect Etsy callback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-etsy-plugin.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect callback code
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode plugins/drielo-etsy-sync-1.0.0.zip.b64 > /tmp/plugin.zip
          unzip -q /tmp/plugin.zip -d /tmp/plugin
          echo '--- MATCHES ---'
          grep -nEi 'callback|redirect_uri|admin-post|oauth|etsy/connect' /tmp/plugin/drielo-etsy-sync/drielo-etsy-sync.php || true

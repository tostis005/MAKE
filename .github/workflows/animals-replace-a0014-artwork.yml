name: Replace Animals A0014 Artwork

on:
  push:
    branches:
      - feature/animals-auto-publish
    paths:
      - '.github/workflows/animals-replace-a0014-artwork.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/animals-auto-publish
          fetch-depth: 0

      - name: Download approved A0014 replacement
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-5ac0-820e-95fa-1dc6429b48a2/raw?se=2026-09-24T14%3A14%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=e96ac26d-33ca-5d21-b41d-7e9056c68385&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A25%3A07Z&ske=2026-09-25T12%3A25%3A07Z&sks=b&skv=2026-02-06&sig=Va9UJvA5ngwCBsBs9UOUr82RL/yNX0e4BzKIz5yCXOQ%3D' -o /tmp/A0014-approved.png
          echo 'bf10dfec3e4df072b49a7cc80133362a2b8168ecf78067059832d36260495ae1  /tmp/A0014-approved.png' | sha256sum -c -

      - name: Build canonical 100x120 source, master and sheet
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from collections import deque
          import hashlib, json
          from PIL import Image, ImageDraw

          root=Path('.')
          col=root/'content'/'pattern-system'/'collections'/'animals'
          source_path=col/'source-designs'/'A0014-elephant-heart-balloon.png'
          master_path=col/'reference-masters'/'A0014-elephant-heart-balloon-reference.png'
          sheet_path=col/'reference-sheets'/'animals-reference-sheet-03.png'
          designs_path=col/'designs.json'
          manifest_path=col/'reference-library'/'manifest.json'

          palette_hex=[
              '#000000','#404040','#8C8C8C','#FFFFFF','#F5ECDF','#FEE7DA',
              '#E4BB8E','#CB9051','#985B3B','#653919','#1E1916','#C72B3B',
              '#E96A67','#F78B2D','#DFB65B','#FFD600','#BDBF9F','#829879',
              '#627650','#8EB8BC','#86B1D0','#FC9F8B','#E996B8','#FFD7E2'
          ]
          allowed={tuple(int(h[i:i+2],16) for i in (1,3,5)) for h in palette_hex}

          approved=Image.open('/tmp/A0014-approved.png').convert('RGB')
          used=set(approved.getdata())
          if not used.issubset(allowed):
              raise SystemExit(f'Approved elephant contains out-of-palette colours: {sorted(used-allowed)[:10]}')

          # Remove only the pure-white area connected to the image border.
          # Internal white details such as eye highlights remain part of the motif.
          flood=approved.copy()
          sentinel=(1,2,3)
          ImageDraw.floodfill(flood,(0,0),sentinel,thresh=0)
          fp=flood.load()
          ap=approved.load()
          rgba=Image.new('RGBA',approved.size,(0,0,0,0))
          rp=rgba.load()
          for y in range(approved.height):
              for x in range(approved.width):
                  if fp[x,y] != sentinel:
                      r,g,b=ap[x,y]
                      rp[x,y]=(r,g,b,255)

          bbox=rgba.getchannel('A').getbbox()
          if not bbox:
              raise SystemExit('Approved elephant became empty after background removal')
          crop=rgba.crop(bbox)

          # Fit the approved motif into the canonical 100x120 grid with a six-cell safe margin.
          max_w,max_h=88,108
          scale=min(max_w/crop.width,max_h/crop.height)
          nw=max(1,round(crop.width*scale))
          nh=max(1,round(crop.height*scale))
          motif=crop.resize((nw,nh),Image.Resampling.NEAREST)
          source=Image.new('RGBA',(100,120),(0,0,0,0))
          left=(100-nw)//2
          top=(120-nh)//2
          source.alpha_composite(motif,(left,top))

          sbbox=source.getchannel('A').getbbox()
          if not sbbox or sbbox[0] < 6 or sbbox[1] < 6 or sbbox[2] > 94 or sbbox[3] > 114:
              raise SystemExit(f'A0014 safe margin invalid: {sbbox}')
          visible={(r,g,b) for r,g,b,a in source.getdata() if a>=128}
          if not visible.issubset(allowed):
              raise SystemExit(f'A0014 canonical source has out-of-palette colours: {sorted(visible-allowed)}')
          source.save(source_path,optimize=True)

          master=source.resize((800,960),Image.Resampling.NEAREST)
          master.save(master_path,optimize=True)

          # Rebuild sheet 3 from the six canonical sources (A0013-A0018).
          names=[
              'A0013-teddy-blue-bow.png',
              'A0014-elephant-heart-balloon.png',
              'A0015-giraffe-daisies.png',
              'A0016-lamb-flower-crown.png',
              'A0017-koala-eucalyptus.png',
              'A0018-panda-bamboo.png',
          ]
          sheet=Image.new('RGBA',(1200,960),(0,0,0,0))
          for i,name in enumerate(names):
              src=Image.open(col/'source-designs'/name).convert('RGBA')
              if src.size != (100,120):
                  raise SystemExit(f'{name}: wrong source size {src.size}')
              cell=src.resize((400,480),Image.Resampling.NEAREST)
              x=(i%3)*400
              y=(i//3)*480
              sheet.alpha_composite(cell,(x,y))
          sheet.save(sheet_path,optimize=True)

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          designs=json.loads(designs_path.read_text(encoding='utf-8'))
          item=next(x for x in designs['designs'] if x['base_design_id']=='A0014')
          item['artwork_status']='canonical-approved-replacement'
          item['product_status']='needs-regeneration'
          item['artwork_revision']='2026-09-24-elephant-palette-replacement'
          item['approved_palette_compliance']='100%'
          designs_path.write_text(json.dumps(designs,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['reference_policy']=(
              'The five Animals reference sheets are canonical. A0014 has an approved '
              '2026-09-24 replacement that supersedes the historical v2 matrix archive '
              'for A0014 only; all other designs remain tied to that archive.'
          )
          for s in manifest.get('source_reference_sheets',[]):
              if s.get('sheet')==3:
                  s['sha256']=sha(sheet_path)
          manifest['approved_overrides']={
              **manifest.get('approved_overrides',{}),
              'A0014':{
                  'revision':'2026-09-24-elephant-palette-replacement',
                  'source_sha256':sha(source_path),
                  'master_sha256':sha(master_path),
                  'palette_compliance':'100%',
                  'source_grid':'100x120',
                  'safe_bbox':list(sbbox),
                  'reason':'Approved improved elephant artwork; replaces prior colour treatment.'
              }
          }
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print('A0014_SOURCE_SHA256',sha(source_path))
          print('A0014_MASTER_SHA256',sha(master_path))
          print('SHEET3_SHA256',sha(sheet_path))
          print('A0014_BBOX',sbbox,'VISIBLE_COLORS',len(visible))
          PY

      - name: Commit A0014 canonical replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pattern-system/collections/animals/source-designs/A0014-elephant-heart-balloon.png
          git add content/pattern-system/collections/animals/reference-masters/A0014-elephant-heart-balloon-reference.png
          git add content/pattern-system/collections/animals/reference-sheets/animals-reference-sheet-03.png
          git add content/pattern-system/collections/animals/designs.json
          git add content/pattern-system/collections/animals/reference-library/manifest.json
          git commit -m "Replace Animals A0014 elephant artwork"
          git fetch origin feature/animals-auto-publish
          git rebase origin/feature/animals-auto-publish
          git push origin HEAD:feature/animals-auto-publish

name: Bulk build and deploy P0002-P0020
on:
  push:
    branches: [bulk-multitech-p0002-p0020]
    paths: ['.github/workflows/tmp-bulk-deploy-p0002-p0020.yml']
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install renderer
        run: |
          set -euo pipefail
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Generate 76 technique products
        run: |
          set -euo pipefail
          python content/pattern-system/multitech/bulk_generate.py --start 2 --end 20 --workers 4
      - name: Validate generated catalogue and files
        run: |
          set -euo pipefail
          php -l content/tools/import-products.php
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('content/products')
          cat=json.loads((root/'catalog.json').read_text())
          variants=[p for p in cat['products'] if re.fullmatch(r'P00(?:0[1-9]|1[0-9]|20)-(?:CS|C2C|TC|LH)',p.get('code',''))]
          assert len(variants)==80,len(variants)
          assert len({p['sku'] for p in cat['products']})==len(cat['products'])
          for p in variants:
              pdf=root/p['download']
              img=root/p['gallery'][0]
              if p['base_design_id']=='P0001':
                  # P0001 PDF already lives in WooCommerce; no rebuild required in this batch.
                  continue
              assert pdf.is_file() and pdf.stat().st_size>100000,(p['code'],pdf)
              assert img.is_file() and img.stat().st_size>10000,(p['code'],img)
              assert len(p['gallery'])==1
          print('validated variants',len(variants))
          PY
      - name: Commit JSON sources, catalogue and product images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/products/catalog.json content/products/assets/P00*-product.webp content/pattern-system/products/P00* content/pattern-system/patterns/P00*
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "Generate P0002-P0020 multitech sources [skip ci]"
            git push origin HEAD:bulk-multitech-p0002-p0020
          fi
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Package generated products including PDFs
        run: |
          set -euo pipefail
          tar -czf /tmp/drielo-products.tgz content/products content/tools/import-products.php
      - name: Upload product package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/drielo_products_key /tmp/drielo-products.tgz "$VPS_USER@$VPS_HOST:/tmp/drielo-products-${GITHUB_RUN_ID}.tgz"
      - name: Import directly into WooCommerce
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-products-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-products-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=1024M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products
          "${DOCKER[@]}" exec make-wp php -r '
            require "/var/www/html/wp-load.php";
            $ids=get_posts(array("post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids","meta_key"=>"_drielo_managed_product","meta_value"=>"1"));
            echo "DRIELO_PRODUCTS=".count($ids).PHP_EOL;
            $bad=0;
            foreach($ids as $id){
              $p=wc_get_product($id); $sku=$p->get_sku();
              if(strpos($sku,"DRIELO-P00")===0 && (count($p->get_downloads())<1 || (1+count($p->get_gallery_image_ids()))<1)) $bad++;
            }
            echo "BAD_PRODUCTS=".$bad.PHP_EOL;
            if($bad) exit(2);
          '
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: P0002-P0020-multitech-pdfs
          path: content/products/files/Drielo_P00*.pdf
          retention-days: 7

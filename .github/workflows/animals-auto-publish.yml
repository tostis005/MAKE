name: Animals Cross Stitch Regeneration Queue

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: drielo-animals-cross-stitch-regeneration
  cancel-in-progress: false

jobs:
  publish-next:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Animals regeneration branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/animals-auto-publish

      - name: Select next pending Animals design
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/animals_auto/queue_state.py next --github-output "$GITHUB_OUTPUT"

      - name: Show queue state
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/animals_auto/queue_state.py summary
          echo "Selected: ${{ steps.select.outputs.design_id }}"

      - name: Install renderer dependencies
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Regenerate canonical Cross Stitch product
        if: steps.select.outputs.design_id != ''
        env:
          DRIELO_GALLERY_REVISION: ${{ github.run_id }}
          DRIELO_SUFFIXES: CS
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/animals_auto/publish_design.py "${{ steps.select.outputs.design_id }}"

      - name: Validate regenerated Cross Stitch bundle
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          python3 - "$DESIGN" <<'PY'
          import json, sys
          from pathlib import Path
          from PIL import Image, ImageChops

          design=sys.argv[1]
          root=Path('.')
          system=root/'content'/'pattern-system'
          collection=json.loads((system/'collections'/'animals'/'collection.json').read_text(encoding='utf-8'))
          geom=collection.get('mockup_spec',{}).get('cross_stitch_geometry',{})
          expected_geom={'source_width':1536,'source_height':1536,'x':438,'y':212,'width':685,'height':822}
          if geom != expected_geom:
              raise SystemExit(f'Animals CS geometry mismatch: {geom}')
          if len(collection.get('palette',[])) != 24:
              raise SystemExit('Animals collection must have exactly 24 master colours')
          palette={p['hex'].upper() for p in collection['palette']}

          designs=json.loads((system/'collections'/'animals'/'designs.json').read_text(encoding='utf-8'))['designs']
          meta=next(x for x in designs if x['base_design_id']==design)
          src=system/meta['source_asset']
          ref=system/meta['reference_asset']
          sim=Image.open(src).convert('RGBA')
          rim=Image.open(ref).convert('RGBA')
          if sim.size != (100,120) or rim.size != (800,960):
              raise SystemExit(f'{design}: canonical dimensions invalid')
          if ImageChops.difference(sim.resize((800,960),Image.Resampling.NEAREST),rim).getbbox() is not None:
              raise SystemExit(f'{design}: reference differs from canonical source')
          bbox=sim.getchannel('A').getbbox()
          if not bbox or bbox[0]<=0 or bbox[1]<=0 or bbox[2]>=100 or bbox[3]>=120:
              raise SystemExit(f'{design}: invalid transparent safe margin {bbox}')
          used={f'#{r:02X}{g:02X}{b:02X}' for r,g,b,a in sim.getdata() if a>=128}
          if not used.issubset(palette):
              raise SystemExit(f'{design}: source uses out-of-palette colours')

          cover_rel=collection['mockup_spec']['technique_assets']['CS']
          cover=system/'collections'/'animals'/cover_rel
          if not cover.is_file() or Image.open(cover).size != (1536,1536):
              raise SystemExit(f'Invalid Animals CS cover: {cover}')

          code=f'{design}-CS'
          pat=json.loads((system/'patterns'/code/'pattern.json').read_text(encoding='utf-8'))
          prod=json.loads((system/'products'/code/'product.json').read_text(encoding='utf-8'))
          if (pat.get('stitch_width'),pat.get('stitch_height')) != (100,120):
              raise SystemExit(f'{code}: wrong grid')
          if len(pat.get('matrix',[])) != 120 or any(len(r)!=100 for r in pat['matrix']):
              raise SystemExit(f'{code}: malformed matrix')
          if pat.get('total_stitches',0) <= 0 or not pat.get('threads') or len(pat['threads']) > 24:
              raise SystemExit(f'{code}: invalid stitches/threads')
          if prod.get('collection') != 'animals' or prod.get('page_1_asset') != cover_rel:
              raise SystemExit(f'{code}: invalid product metadata')

          pdf=root/'content/products/files'/f'Drielo_{code}.pdf'
          image=root/'content/products/assets'/f'{code}-product.webp'
          galleries=[root/'content/products/assets'/f'{code}-gallery-{i}.webp' for i in (2,3,4)]
          if not pdf.is_file() or pdf.stat().st_size < 100000 or pdf.read_bytes()[:4] != b'%PDF':
              raise SystemExit(f'{code}: invalid PDF')
          if not image.is_file() or image.stat().st_size < 50000:
              raise SystemExit(f'{code}: invalid product image')
          for g in galleries:
              if not g.is_file() or g.stat().st_size < 30000:
                  raise SystemExit(f'{code}: invalid gallery {g.name}')

          catalog=json.loads((root/'content/products/catalog.json').read_text(encoding='utf-8'))
          row=next((p for p in catalog.get('products',[]) if p.get('code')==code),None)
          if not row or row.get('collection')!='animals' or row.get('technique_code')!='CS':
              raise SystemExit(f'{code}: missing catalogue row')
          print(code,'VALID','stitches',pat['total_stitches'],'colors',len(pat['threads']))
          PY

      - name: Build one-product WooCommerce package
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          CODE="${DESIGN}-CS"
          STAGE="/tmp/drielo-${CODE}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"

          python3 - "$CODE" "$STAGE" <<'PY'
          import json, sys
          from pathlib import Path
          code=sys.argv[1]
          stage=Path(sys.argv[2])
          catalog=json.loads(Path('content/products/catalog.json').read_text(encoding='utf-8'))
          selected=[p for p in catalog.get('products',[]) if p.get('code')==code]
          if len(selected)!=1:
              raise SystemExit(f'Expected one catalogue row for {code}, got {len(selected)}')
          cats=set(selected[0].get('categories',[]))
          out=dict(catalog)
          out['collections']=[c for c in catalog.get('collections',[]) if c.get('slug')=='animals']
          out['categories']=[c for c in catalog.get('categories',[]) if c.get('slug') in cats]
          out['products']=selected
          (stage/'content/products/catalog.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cp "content/products/assets/${CODE}-product.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-gallery-2.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-gallery-3.webp" "$STAGE/content/products/assets/"
          cp "content/products/assets/${CODE}-gallery-4.webp" "$STAGE/content/products/assets/"
          cp "content/products/files/Drielo_${CODE}.pdf" "$STAGE/content/products/files/"
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf "/tmp/drielo-${CODE}.tgz" -C "$STAGE" content

      - name: Configure SSH
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_animals_cs_key
          chmod 600 ~/.ssh/drielo_animals_cs_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload Cross Stitch package
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          CODE="${DESIGN}-CS"
          scp -i ~/.ssh/drielo_animals_cs_key "/tmp/drielo-${CODE}.tgz"             "$VPS_USER@$VPS_HOST:/tmp/drielo-${CODE}-${GITHUB_RUN_ID}.tgz"

      - name: Publish Cross Stitch product to WooCommerce and verify
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          CODE="${DESIGN}-CS"
          ssh -i ~/.ssh/drielo_animals_cs_key "$VPS_USER@$VPS_HOST"             "CODE='${CODE}' GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-${CODE}-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-${CODE}-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"; exit 1
          fi

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          CONTAINER_STAGE="/tmp/drielo-products-animals-cs-${GITHUB_RUN_ID}"
          CONTAINER_IMPORTER="/tmp/drielo-import-products-animals-cs-${GITHUB_RUN_ID}.php"
          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '${CONTAINER_STAGE}' '${CONTAINER_IMPORTER}' && mkdir -p '${CONTAINER_STAGE}'"
          "${DOCKER[@]}" cp "$STAGE/content/products/." "make-wp:${CONTAINER_STAGE}/"
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" "make-wp:${CONTAINER_IMPORTER}"

          ok=0
          for attempt in 1 2 3; do
            echo "Importing ${CODE} attempt ${attempt}/3"
            if "${DOCKER[@]}" exec make-wp php -d memory_limit=1024M -d max_execution_time=0                  "${CONTAINER_IMPORTER}" /var/www/html "${CONTAINER_STAGE}"; then
              ok=1; break
            fi
            sleep 3
          done
          [ "$ok" = "1" ] || { echo "ERROR: import failed for ${CODE}"; exit 4; }

          "${DOCKER[@]}" exec -e CODE="$CODE" make-wp php -d memory_limit=1024M -r '
            require "/var/www/html/wp-load.php";
            $code=getenv("CODE");
            $sku="DRIELO-".$code;
            $id=wc_get_product_id_by_sku($sku);
            $p=$id ? wc_get_product($id) : false;
            if (!$p) { fwrite(STDERR,"Missing ".$sku.PHP_EOL); exit(2); }
            $cols=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
            $downloads=count($p->get_downloads());
            $image=$p->get_image_id();
            $gallery=count($p->get_gallery_image_ids());
            echo $sku." id=".$id." status=".$p->get_status()." image=".$image.
                 " gallery=".$gallery." downloads=".$downloads." collection=".
                 implode(",",is_wp_error($cols)?array():$cols)." url=".get_permalink($id).PHP_EOL;
            if ($p->get_status()!=="publish" || !$image || $gallery<3 || $downloads<1 ||
                !in_array("animals",is_wp_error($cols)?array():$cols,true)) {
              fwrite(STDERR,"Incomplete ".$sku.PHP_EOL); exit(3);
            }
          '
          "${DOCKER[@]}" exec make-wp sh -lc "rm -rf '${CONTAINER_STAGE}' '${CONTAINER_IMPORTER}'"
          REMOTE

      - name: Mark Animals design published
        if: success() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          python3 content/pattern-system/animals_auto/queue_state.py success "$DESIGN"             --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Commit regenerated Cross Stitch product and advance queue
        if: success() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          CODE="${DESIGN}-CS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/pattern-system/animals_auto/publish_queue.json
          git add content/pattern-system/collections/animals/designs.json
          git add content/products/catalog.json
          git add "content/pattern-system/patterns/${CODE}/pattern.json"
          git add "content/pattern-system/products/${CODE}/product.json"
          git add "content/products/assets/${CODE}-product.webp"
          git add "content/products/assets/${CODE}-gallery-2.webp"
          git add "content/products/assets/${CODE}-gallery-3.webp"
          git add "content/products/assets/${CODE}-gallery-4.webp"
          git add "content/products/files/Drielo_${CODE}.pdf"

          git commit -m "Regenerate Animals ${CODE}"
          git fetch origin feature/animals-auto-publish
          git rebase origin/feature/animals-auto-publish
          git push origin HEAD:feature/animals-auto-publish

      - name: Archive regenerated Animals Cross Stitch PDF
        if: success() && steps.select.outputs.design_id != ''
        uses: actions/upload-artifact@v6
        with:
          name: animals-${{ steps.select.outputs.design_id }}-cross-stitch
          path: content/products/files/Drielo_${{ steps.select.outputs.design_id }}-CS.pdf
          retention-days: 30

      - name: Record failure
        if: failure() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/animals-auto-publish
          git reset --hard origin/feature/animals-auto-publish
          python3 content/pattern-system/animals_auto/queue_state.py fail "$DESIGN"             --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             --error "Animals Cross Stitch regeneration failed; see GitHub Actions logs."
          git add content/pattern-system/animals_auto/publish_queue.json
          git commit -m "Record Animals ${DESIGN} CS regeneration failure"
          git push origin HEAD:feature/animals-auto-publish

      - name: Dispatch next queued Animals Cross Stitch design
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/animals-auto-publish
          git reset --hard origin/feature/animals-auto-publish
          if [ "$(python3 content/pattern-system/animals_auto/queue_state.py has-work)" = "yes" ]; then
            echo "Pending Animals Cross Stitch designs remain; dispatching next run."
            gh api --method POST               "repos/${GITHUB_REPOSITORY}/actions/workflows/animals-auto-publish.yml/dispatches"               -f ref=feature/animals-auto-publish
          else
            echo "Animals Cross Stitch regeneration queue complete."
            python3 content/pattern-system/animals_auto/queue_state.py summary
          fi

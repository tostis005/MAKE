name: Patch Etsy product workflow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-etsy-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch product selection and sync flow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/etsy-patch /tmp/etsy-old.zip /tmp/etsy-new.zip
          base64 --decode plugins/drielo-etsy-sync-1.0.0.zip.b64 > /tmp/etsy-old.zip
          unzip -q /tmp/etsy-old.zip -d /tmp/etsy-patch
          FILE=/tmp/etsy-patch/drielo-etsy-sync/drielo-etsy-sync.php
          JS=/tmp/etsy-patch/drielo-etsy-sync/assets/admin.js

          python3 - "$FILE" "$JS" <<'PY'
          from pathlib import Path
          import re, sys

          path = Path(sys.argv[1])
          js_path = Path(sys.argv[2])
          text = path.read_text()

          text = text.replace(" * Version: 1.0.0", " * Version: 1.0.1", 1)
          text = text.replace("const VERSION = '1.0.0';", "const VERSION = '1.0.1';", 1)

          old_form = '<form method="post" id="drielo-products-form">'
          new_form = '<form method="post" action="<?php echo esc_url( admin_url( \'admin-post.php\' ) ); ?>" id="drielo-products-form">'
          if text.count(old_form) != 1:
              raise SystemExit("Product form marker not found exactly once")
          text = text.replace(old_form, new_form, 1)

          hidden = '                <input type="hidden" name="action" id="drielo-action" value="drielo_etsy_save_products" />\n'
          if hidden not in text:
              raise SystemExit("Hidden action input not found")
          text = text.replace(hidden, '', 1)

          save_old = '<button type="submit" class="button button-primary" data-drielo-action="save">Guardar selección</button>'
          save_new = '<button type="submit" class="button button-primary" name="action" value="drielo_etsy_save_products">Guardar selección</button>'
          sync_old = '<button type="submit" class="button button-secondary" data-drielo-action="sync" <?php disabled( ! $this->is_connected() ); ?>>Sincronizar marcados</button>'
          sync_new = '<button type="submit" class="button button-secondary" name="action" value="drielo_etsy_sync_products" <?php disabled( ! $this->is_connected() ); ?>>Sincronizar con Etsy</button>'
          if text.count(save_old) != 2 or text.count(sync_old) != 2:
              raise SystemExit(f"Unexpected button counts save={text.count(save_old)} sync={text.count(sync_old)}")
          text = text.replace(save_old, save_new)
          text = text.replace(sync_old, sync_new)

          text = text.replace('<th>Enviar a Etsy</th>', '<th>Publicar en Etsy</th>', 1)

          intro_old = '<p>Selecciona qué productos de WooCommerce se gestionan en Etsy y controla su estado desde un único panel.</p>'
          intro_new = '<p>Activa <strong>Publicar en Etsy</strong> en los productos que quieras gestionar. Elige <strong>Borrador</strong> o <strong>Publicado</strong>, guarda la selección y después pulsa <strong>Sincronizar con Etsy</strong>. La casilla de la primera columna se usa solo para acciones en bloque.</p>'
          if intro_old not in text:
              raise SystemExit("Intro copy not found")
          text = text.replace(intro_old, intro_new, 1)

          text = text.replace(
              "rawurlencode( 'Selección guardada.' )",
              "rawurlencode( 'Selección guardada. Los productos activados conservarán este estado hasta que lo cambies.' )",
              1
          )

          old_selected = """        $selected = array_map( 'absint', (array) ( $_POST['selected_ids'] ?? [] ) );
                  $selected = array_filter( array_unique( $selected ) );
                  if ( empty( $selected ) ) {
                      wp_safe_redirect( add_query_arg( 'drielo_notice', rawurlencode( 'No había productos marcados para sincronizar.' ), wp_get_referer() ?: admin_url( 'admin.php?page=drielo-etsy' ) ) );
                      exit;
                  }
          """
          new_selected = """        $selected = get_posts( [
                      'post_type'      => 'product',
                      'post_status'    => [ 'publish', 'draft', 'private', 'pending' ],
                      'posts_per_page' => -1,
                      'fields'         => 'ids',
                      'meta_key'       => self::META_ENABLED,
                      'meta_value'     => 'yes',
                      'orderby'        => 'ID',
                      'order'          => 'ASC',
                  ] );
                  $selected = array_map( 'absint', (array) $selected );
                  $selected = array_filter( array_unique( $selected ) );
                  if ( empty( $selected ) ) {
                      wp_safe_redirect( add_query_arg( 'drielo_notice', rawurlencode( 'No hay productos con “Publicar en Etsy” activado.' ), wp_get_referer() ?: admin_url( 'admin.php?page=drielo-etsy' ) ) );
                      exit;
                  }
          """
          if old_selected not in text:
              raise SystemExit("Old selected-products block not found")
          text = text.replace(old_selected, new_selected, 1)

          path.write_text(text)

          js = js_path.read_text()
          js = re.sub(
              r"\n\s*\$\('\[data-drielo-action\]'\)\.on\('click', function\(\)\{.*?\n\s*\}\);\n",
              "\n",
              js,
              count=1,
              flags=re.S
          )
          js_path.write_text(js)
          PY

          php -l "$FILE"
          node --check "$JS"
          grep -n "drielo-products-form\|Publicar en Etsy\|Sincronizar con Etsy\|meta_value.*yes" "$FILE"

          (
            cd /tmp/etsy-patch
            zip -qr /tmp/etsy-new.zip drielo-etsy-sync
          )
          base64 -w 0 /tmp/etsy-new.zip > plugins/drielo-etsy-sync-1.0.0.zip.b64
          printf '\n' >> plugins/drielo-etsy-sync-1.0.0.zip.b64

      - name: Commit plugin fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/inspect-etsy-state.yml
          git config user.name "Drielo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add plugins/drielo-etsy-sync-1.0.0.zip.b64 .github/workflows/inspect-etsy-state.yml
          git commit -m "Fix Etsy product selection and sync flow"
          git push

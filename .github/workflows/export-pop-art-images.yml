name: Export current Pop Art source images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-pop-art-images.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and package current Pop Art PNG sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zipfile

          root = Path("content/pattern-system/collections/pop-art-25/sources")
          expected = [root / f"P{1000+i:04d}.png" for i in range(1, 61)]
          missing = [p.name for p in expected if not p.is_file()]
          if missing:
              raise SystemExit(f"Missing current Pop Art PNGs: {missing}")

          def png_size(path):
              b = path.read_bytes()
              if b[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path.name}: not a PNG")
              if b[12:16] != b"IHDR":
                  raise SystemExit(f"{path.name}: invalid PNG header")
              return struct.unpack(">II", b[16:24])

          for p in expected:
              size = png_size(p)
              if size != (100, 120):
                  raise SystemExit(f"{p.name}: expected 100x120, got {size}")

          out = Path("exports/pop-art-current-60-100x120.zip")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.unlink(missing_ok=True)
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for p in expected:
                  zf.write(p, arcname=p.name)

          with zipfile.ZipFile(out) as zf:
              names = zf.namelist()
              if names != [p.name for p in expected]:
                  raise SystemExit("ZIP contents mismatch")
          print(f"Created {out} with {len(expected)} current 100x120 PNGs")
          PY

      - name: Commit export and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/pop-art-current-60-100x120.zip
          git rm .github/workflows/export-pop-art-images.yml
          git commit -m "Export current Pop Art 60 PNG sources [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

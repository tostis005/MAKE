name: TEMP republish verified I0001 full feet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-republish-i0001-fullfeet-verified.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-i0001-fullfeet-verified
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Validate verified full-feet source and JSONs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root=Path('.')
          system=root/'content'/'pattern-system'
          src=system/'collections'/'baby-nursery'/'source-designs'/'I0001-teddy-bear.png'
          im=Image.open(src).convert('RGBA')
          bbox=im.getchannel('A').getbbox()
          if bbox != (24,144,776,920):
              raise SystemExit(f'Unexpected I0001 full-feet source bbox: {bbox}')
          if 960-bbox[3] < 32:
              raise SystemExit(f'Feet too close to bottom edge: bbox={bbox}')

          expected={
            'CS':('collections/baby-nursery/assets/cover-cross-stitch.jpg',6748),
            'C2C':('collections/baby-nursery/assets/cover-crochet.jpg',2488),
            'TC':('collections/baby-nursery/assets/cover-c2c-crochet.jpg',4358),
            'LH':('collections/baby-nursery/assets/cover-rug.jpg',2488),
          }
          for suffix,(cover,total) in expected.items():
              code=f'I0001-{suffix}'
              p=json.loads((system/'patterns'/code/'pattern.json').read_text(encoding='utf-8'))
              q=json.loads((system/'products'/code/'product.json').read_text(encoding='utf-8'))
              if p.get('total_stitches') != total:
                  raise SystemExit(f'{code}: unexpected stitches {p.get("total_stitches")} != {total}')
              if q.get('page_1_asset') != cover:
                  raise SystemExit(f'{code}: wrong cover mapping {q.get("page_1_asset")}')
              if p.get('source_asset') != 'collections/baby-nursery/source-designs/I0001-teddy-bear.png':
                  raise SystemExit(f'{code}: wrong source asset')
              print(code,'stitches',total,'colors',len(p.get('threads',[])),'cover',cover)
          print('I0001_VERIFIED_FULLFEET_SOURCE_OK')
          PY

      - name: Render four current I0001 products
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/baby_nursery/publish_i0001.py

      - name: Validate rendered PDFs and images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          cat=json.loads((root/'content/products/catalog.json').read_text(encoding='utf-8'))
          rows={p.get('code'):p for p in cat.get('products',[])}
          for suffix in ('CS','C2C','TC','LH'):
              code=f'I0001-{suffix}'
              pdf=root/'content/products/files'/f'Drielo_{code}.pdf'
              img=root/'content/products/assets'/f'{code}-product.webp'
              if not pdf.is_file() or pdf.stat().st_size < 100000 or pdf.read_bytes()[:4] != b'%PDF':
                  raise SystemExit(f'{code}: invalid PDF')
              if not img.is_file() or img.stat().st_size < 50000:
                  raise SystemExit(f'{code}: invalid image')
              if str(rows[code].get('gallery_revision')) != '2026092403':
                  raise SystemExit(f'{code}: stale media revision {rows[code].get("gallery_revision")}')
              print(code,'pdf',pdf.stat().st_size,'image',img.stat().st_size)
          print('I0001_RENDERED_FULLFEET_OK')
          PY

      - name: Build I0001-only WooCommerce package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/drielo-i0001-verified
          mkdir -p /tmp/drielo-i0001-verified/content/products/assets
          mkdir -p /tmp/drielo-i0001-verified/content/products/files
          mkdir -p /tmp/drielo-i0001-verified/content/tools

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('content/products/catalog.json').read_text(encoding='utf-8'))
          codes={'I0001-CS','I0001-C2C','I0001-TC','I0001-LH'}
          cats={
            'cross-stitch-patterns','cross-stitch-baby-nursery',
            'c2c-crochet-patterns','c2c-crochet-baby-nursery',
            'tapestry-crochet-patterns','tapestry-crochet-baby-nursery',
            'latch-hook-rug-patterns','latch-hook-rug-baby-nursery',
          }
          out=dict(d)
          out['products']=[p for p in d.get('products',[]) if p.get('code') in codes]
          out['collections']=[c for c in d.get('collections',[]) if c.get('slug')=='baby-nursery']
          out['categories']=[c for c in d.get('categories',[]) if c.get('slug') in cats]
          Path('/tmp/drielo-i0001-verified/content/products/catalog.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          PY

          for code in I0001-CS I0001-C2C I0001-TC I0001-LH; do
            cp "content/products/assets/${code}-product.webp" /tmp/drielo-i0001-verified/content/products/assets/
            cp "content/products/files/Drielo_${code}.pdf" /tmp/drielo-i0001-verified/content/products/files/
          done
          cp content/tools/import-products.php /tmp/drielo-i0001-verified/content/tools/
          tar -czf /tmp/drielo-i0001-verified.tgz -C /tmp/drielo-i0001-verified content

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/drielo_products_key /tmp/drielo-i0001-verified.tgz "$VPS_USER@$VPS_HOST:/tmp/drielo-i0001-verified-${GITHUB_RUN_ID}.tgz"

      - name: Import into WooCommerce and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-i0001-verified-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-i0001-verified-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $codes=array("DRIELO-I0001-CS","DRIELO-I0001-C2C","DRIELO-I0001-TC","DRIELO-I0001-LH");
            foreach ($codes as $sku) {
              $id=wc_get_product_id_by_sku($sku);
              $p=$id ? wc_get_product($id) : false;
              if (!$p) { fwrite(STDERR,"Missing ".$sku.PHP_EOL); exit(2); }
              $cols=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
              echo $sku." id=".$id." status=".$p->get_status()." image=".$p->get_image_id()." downloads=".count($p->get_downloads())." collection=".implode(",",is_wp_error($cols)?array():$cols)." url=".get_permalink($id).PHP_EOL;
              if ($p->get_status()!=="publish" || !$p->get_image_id() || count($p->get_downloads())<1 || !in_array("baby-nursery",is_wp_error($cols)?array():$cols,true)) {
                fwrite(STDERR,"Incomplete ".$sku.PHP_EOL); exit(3);
              }
            }
          '
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Persist production images and catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             content/products/catalog.json             content/products/assets/I0001-CS-product.webp             content/products/assets/I0001-C2C-product.webp             content/products/assets/I0001-TC-product.webp             content/products/assets/I0001-LH-product.webp
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Republish verified I0001 full-feet products [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Archive PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baby-nursery-I0001-verified-fullfeet-pdfs
          path: |
            content/products/files/Drielo_I0001-CS.pdf
            content/products/files/Drielo_I0001-C2C.pdf
            content/products/files/Drielo_I0001-TC.pdf
            content/products/files/Drielo_I0001-LH.pdf
          retention-days: 30

name: Pop Art Final Visual Corrections

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pop-art-resto-24
    paths:
      - '.github/workflows/pop-art-final-visual-corrections.yml'
      - 'content/pattern-system/pop_art_25/protected_rebuilds.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: drielo-pop-art-final-visual-corrections
  cancel-in-progress: false

jobs:
  publish-next:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        design: [P0010, P0016]

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/pop-art-resto-24

      - name: Select explicit final correction
        id: select
        shell: bash
        run: |
          set -euo pipefail
          echo "design_id=${{ matrix.design }}" >> "$GITHUB_OUTPUT"
          echo "allow_protected=false" >> "$GITHUB_OUTPUT"

      - name: Show queue state
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/pop_art_25/queue_state.py summary
          echo "Selected: ${{ steps.select.outputs.design_id }}"

      - name: Guard protected approved designs
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          ALLOW_PROTECTED="${{ steps.select.outputs.allow_protected }}"
          if { [ "$DESIGN" = "P0001" ] || [ "$DESIGN" = "P0012" ]; } && [ "$ALLOW_PROTECTED" != "true" ]; then
            echo "ERROR: protected approved design selected without explicit permission: $DESIGN"
            exit 1
          fi

      - name: Install renderer dependencies
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
          python3 -m playwright install --with-deps chromium

      - name: Build source, patterns and four techniques
        if: steps.select.outputs.design_id != ''
        env:
          DRIELO_GALLERY_REVISION: ${{ github.run_id }}
          DRIELO_ALLOW_PROTECTED: ${{ steps.select.outputs.allow_protected == 'true' && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/pop_art_25/publish_design.py "${{ steps.select.outputs.design_id }}"

      - name: Validate generated design bundle
        if: steps.select.outputs.design_id != ''
        env:
          DRIELO_ALLOW_PROTECTED: ${{ steps.select.outputs.allow_protected == 'true' && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          python3 - "$DESIGN" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from PIL import Image

          design=sys.argv[1]
          if design in {'P0001','P0012'} and os.environ.get('DRIELO_ALLOW_PROTECTED') != '1':
              raise SystemExit(f'Protected design rebuild not explicitly authorized: {design}')

          root=Path('.')
          system=root/'content'/'pattern-system'
          collection=json.loads((system/'collections'/'pop-art-25'/'collection.json').read_text(encoding='utf-8'))
          if len(collection.get('palette',[])) != 25:
              raise SystemExit('Pop Art collection must have exactly 25 master colours')

          covers=collection['mockup_spec']['technique_assets']
          expected={
              'CS':'../../multitech/assets/cover-cross-stitch.webp',
              'C2C':'../../multitech/assets/cover-crochet.webp',
              'TC':'../../multitech/assets/cover-c2c-crochet.webp',
              'LH':'../../multitech/assets/cover-rug.webp',
          }
          if {k:covers[k] for k in expected} != expected:
              raise SystemExit(f'Pop Art cover mapping changed unexpectedly: {covers}')

          src=system/'collections'/'pop-art-25'/'sources'/f'{design}.png'
          if not src.is_file():
              raise SystemExit(f'{design}: transparent source PNG missing')
          im=Image.open(src).convert('RGBA')
          if im.size != (800,960):
              raise SystemExit(f'{design}: wrong source size {im.size}')
          amin,amax=im.getchannel('A').getextrema()
          bbox=im.getchannel('A').getbbox()
          if amin != 0 or amax == 0 or not bbox:
              raise SystemExit(f'{design}: source is not truly transparent')
          margins=(bbox[0],bbox[1],800-bbox[2],960-bbox[3])
          if min(margins) < 24:
              raise SystemExit(f'{design}: source too close to edge: bbox={bbox} margins={margins}')

          catalog=json.loads((root/'content/products/catalog.json').read_text(encoding='utf-8'))
          rows={p.get('code'):p for p in catalog.get('products',[])}
          grids={'CS':(100,120),'C2C':(60,72),'TC':(80,96),'LH':(60,72)}

          for suffix in ('CS','C2C','TC','LH'):
              code=f'{design}-{suffix}'
              pat=json.loads((system/'patterns'/code/'pattern.json').read_text(encoding='utf-8'))
              prod=json.loads((system/'products'/code/'product.json').read_text(encoding='utf-8'))
              w,h=grids[suffix]
              if (pat.get('stitch_width'),pat.get('stitch_height')) != (w,h):
                  raise SystemExit(f'{code}: wrong grid')
              if len(pat.get('matrix',[])) != h or any(len(r)!=w for r in pat['matrix']):
                  raise SystemExit(f'{code}: malformed matrix')
              if pat.get('total_stitches',0) <= 0 or not pat.get('threads'):
                  raise SystemExit(f'{code}: empty pattern')
              if len(pat['threads']) > 25:
                  raise SystemExit(f'{code}: palette exceeds 25 colours')
              if prod.get('collection') != 'pop-art-25':
                  raise SystemExit(f'{code}: wrong collection')
              if prod.get('page_1_asset') != covers[suffix]:
                  raise SystemExit(f'{code}: wrong cover route {prod.get("page_1_asset")}')
              if not prod.get('transparent_source'):
                  raise SystemExit(f'{code}: transparent source flag missing')

              pdf=root/'content/products/files'/f'Drielo_{code}.pdf'
              image=root/'content/products/assets'/f'{code}-product.webp'
              gallery=[root/'content/products/assets'/f'{code}-gallery-{i}.webp' for i in (2,3,4)]
              if not pdf.is_file() or pdf.stat().st_size < 100000 or pdf.read_bytes()[:4] != b'%PDF':
                  raise SystemExit(f'{code}: invalid PDF')
              if not image.is_file() or image.stat().st_size < 50000:
                  raise SystemExit(f'{code}: invalid product image')
              for g in gallery:
                  if not g.is_file() or g.stat().st_size < 30000:
                      raise SystemExit(f'{code}: invalid gallery preview {g.name}')
              row=rows.get(code)
              if not row or row.get('collection') != 'pop-art-25':
                  raise SystemExit(f'{code}: missing Pop Art catalogue row')
              expected_gallery=[f'assets/{code}-gallery-{i}.webp' for i in (2,3,4)]
              if row.get('gallery') != expected_gallery:
                  raise SystemExit(f'{code}: wrong gallery list {row.get("gallery")}')
              if row.get('gallery_preview_pages') != {'facts':3,'colour_a1':8,'symbol_a1':12}:
                  raise SystemExit(f'{code}: gallery preview page mapping missing')
              print(code,'stitches',pat['total_stitches'],'colors',len(pat['threads']),
                    'pdf',pdf.stat().st_size,'image',image.stat().st_size,
                    'gallery',[g.stat().st_size for g in gallery])

          print(design,'BUNDLE_VALID','bbox',bbox,'margins',margins)
          PY

      - name: Build four-product WooCommerce package
        if: steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          STAGE="/tmp/drielo-${DESIGN}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/content/products/assets" "$STAGE/content/products/files" "$STAGE/content/tools"

          python3 - "$DESIGN" "$STAGE" <<'PY'
          import json
          import sys
          from pathlib import Path

          design=sys.argv[1]
          stage=Path(sys.argv[2])
          catalog=json.loads(Path('content/products/catalog.json').read_text(encoding='utf-8'))
          codes={f'{design}-{s}' for s in ('CS','C2C','TC','LH')}
          selected=[p for p in catalog.get('products',[]) if p.get('code') in codes]
          found={p.get('code') for p in selected}
          if found != codes:
              raise SystemExit(f'Package catalogue mismatch: {found} != {codes}')
          cats={slug for p in selected for slug in p.get('categories',[])}

          base=dict(catalog)
          base['collections']=[c for c in catalog.get('collections',[]) if c.get('slug')=='pop-art-25']
          base['categories']=[c for c in catalog.get('categories',[]) if c.get('slug') in cats]
          if len(base['collections']) != 1:
              raise SystemExit('Pop Art collection definition missing')

          out=dict(base)
          out['products']=selected
          (stage/'content/products/catalog.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )

          by_code={p['code']:p for p in selected}
          for suffix in ('CS','C2C','TC','LH'):
              one=dict(base)
              one['products']=[by_code[f'{design}-{suffix}']]
              (stage/f'content/products/catalog-{suffix}.json').write_text(
                  json.dumps(one,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
              )
          PY

          for suffix in CS C2C TC LH; do
            code="${DESIGN}-${suffix}"
            cp "content/products/assets/${code}-product.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-2.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-3.webp" "$STAGE/content/products/assets/"
            cp "content/products/assets/${code}-gallery-4.webp" "$STAGE/content/products/assets/"
            cp "content/products/files/Drielo_${code}.pdf" "$STAGE/content/products/files/"
          done
          cp content/tools/import-products.php "$STAGE/content/tools/"
          tar -czf "/tmp/drielo-${DESIGN}.tgz" -C "$STAGE" content

      - name: Configure SSH
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_pop_art_key
          chmod 600 ~/.ssh/drielo_pop_art_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          scp -i ~/.ssh/drielo_pop_art_key "/tmp/drielo-${DESIGN}.tgz"             "$VPS_USER@$VPS_HOST:/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}.tgz"

      - name: Publish four products to WooCommerce and verify
        if: steps.select.outputs.design_id != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          ssh -i ~/.ssh/drielo_pop_art_key "$VPS_USER@$VPS_HOST"             "DESIGN='${DESIGN}' GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-${DESIGN}-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"

          # Start from a clean staging directory in the WordPress container.
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php && mkdir -p /tmp/drielo-products'
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php

          # Import one technique at a time. This prevents a late media/download
          # failure from leaving the last products half-created.
          for suffix in CS C2C TC LH; do
            code="${DESIGN}-${suffix}"
            "${DOCKER[@]}" exec make-wp sh -lc "
              test -s /tmp/drielo-products/assets/${code}-product.webp &&
              test -s /tmp/drielo-products/assets/${code}-gallery-2.webp &&
              test -s /tmp/drielo-products/assets/${code}-gallery-3.webp &&
              test -s /tmp/drielo-products/assets/${code}-gallery-4.webp &&
              test -s /tmp/drielo-products/files/Drielo_${code}.pdf &&
              cp /tmp/drielo-products/catalog-${suffix}.json /tmp/drielo-products/catalog.json
            "

            ok=0
            for attempt in 1 2 3; do
              echo "Importing ${code} attempt ${attempt}/3"
              if "${DOCKER[@]}" exec make-wp php -d memory_limit=1024M -d max_execution_time=0                    /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products; then
                ok=1
                break
              fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: failed to import ${code} after 3 attempts"
              exit 4
            fi
          done

          "${DOCKER[@]}" exec -e DESIGN="$DESIGN" make-wp php -d memory_limit=1024M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";
            $design=getenv("DESIGN");
            foreach (array("CS","C2C","TC","LH") as $suffix) {
              $sku="DRIELO-".$design."-".$suffix;
              $id=wc_get_product_id_by_sku($sku);
              $p=$id ? wc_get_product($id) : false;
              if (!$p) { fwrite(STDERR,"Missing ".$sku.PHP_EOL); exit(2); }
              $cols=wp_get_object_terms($id,"product_collection",array("fields"=>"slugs"));
              $downloads=count($p->get_downloads());
              $image=$p->get_image_id();
              $gallery=count($p->get_gallery_image_ids());
              echo $sku." id=".$id." status=".$p->get_status()." image=".$image.
                   " gallery=".$gallery." downloads=".$downloads." collection=".
                   implode(",",is_wp_error($cols)?array():$cols)." url=".get_permalink($id).PHP_EOL;
              if ($p->get_status()!=="publish" || !$image || $gallery<3 || $downloads<1 ||
                  !in_array("pop-art-25",is_wp_error($cols)?array():$cols,true)) {
                fwrite(STDERR,"Incomplete ".$sku.PHP_EOL); exit(3);
              }
            }
          '
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Mark design published
        if: success() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          python3 content/pattern-system/pop_art_25/queue_state.py success "$DESIGN"             --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Commit generated design and advance queue
        if: success() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/pattern-system/pop_art_25/publish_queue.json
          if [ -f content/pattern-system/pop_art_25/protected_rebuilds.json ]; then
            git add content/pattern-system/pop_art_25/protected_rebuilds.json
          fi
          git add content/pattern-system/collections/pop-art-25/designs.json
          git add "content/pattern-system/collections/pop-art-25/sources/${DESIGN}.png"
          git add content/pattern-system/collections/pop-art-25/reference-masters/${DESIGN}-*-reference.png
          git add content/products/catalog.json
          for suffix in CS C2C TC LH; do
            code="${DESIGN}-${suffix}"
            git add "content/pattern-system/patterns/${code}/pattern.json"
            git add "content/pattern-system/products/${code}/product.json"
            git add "content/products/assets/${code}-product.webp"
            git add "content/products/assets/${code}-gallery-2.webp"
            git add "content/products/assets/${code}-gallery-3.webp"
            git add "content/products/assets/${code}-gallery-4.webp"
            git add "content/products/files/Drielo_${code}.pdf"
          done

          git commit -m "Publish Pop Art ${DESIGN} in four techniques"
          git fetch origin feature/pop-art-resto-24
          git rebase origin/feature/pop-art-resto-24
          git push origin HEAD:feature/pop-art-resto-24

      - name: Archive four PDFs
        if: success() && steps.select.outputs.design_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: pop-art-${{ steps.select.outputs.design_id }}-pdfs
          path: |
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-CS.pdf
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-C2C.pdf
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-TC.pdf
            content/products/files/Drielo_${{ steps.select.outputs.design_id }}-LH.pdf
          retention-days: 30

      - name: Record failure and advance or retry queue
        if: failure() && steps.select.outputs.design_id != ''
        shell: bash
        run: |
          set -euo pipefail
          DESIGN="${{ steps.select.outputs.design_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/pop-art-resto-24
          git reset --hard origin/feature/pop-art-resto-24
          python3 content/pattern-system/pop_art_25/queue_state.py fail "$DESIGN"             --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             --error "Automatic Pop Art publish run failed; see GitHub Actions logs."
          git add content/pattern-system/pop_art_25/publish_queue.json
          if [ -f content/pattern-system/pop_art_25/protected_rebuilds.json ]; then
            git add content/pattern-system/pop_art_25/protected_rebuilds.json
          fi
          git commit -m "Record Pop Art ${DESIGN} auto-publish result"
          git push origin HEAD:feature/pop-art-resto-24


      - name: Final queue summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 content/pattern-system/pop_art_25/queue_state.py summary
          echo "Explicit final visual correction job complete for ${{ matrix.design }}."

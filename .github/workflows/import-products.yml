name: Import Drielo products

on:
  push:
    branches: [main]
    paths:
      - 'content/products/**'
      - 'content/tools/import-products.php'
      - 'tmp/pop-art-60-upload/pop_art_60_png_100x120_exact30.zip'
      - '.github/scripts/rebuild_pop_art_60.py'
      - '.github/scripts/render_pop_art_60_pdfs.py'
      - 'content/tools/repair-pop-art-60.php'
      - '.github/workflows/import-products.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-product-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild Pop Art 60 from exact Gmail/GitHub source
        shell: bash
        run: |
          set -euo pipefail
          if python3 .github/scripts/rebuild_pop_art_60.py --needs-rebuild; then
            echo "New Pop Art 60 source detected; rebuilding 60 exact 100x120 cross-stitch products."
            python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
            python3 -m playwright install --with-deps chromium
            python3 .github/scripts/rebuild_pop_art_60.py
          else
            echo "Pop Art 60 source already processed; keeping the current generated catalogue."
          fi

      - name: Fetch private product PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path('content/products/pdf-sources.json')
          if not source.is_file():
              print('No staged product PDFs; preserving existing WooCommerce downloads.')
              raise SystemExit(0)
          import base64
          data = json.loads(source.read_text(encoding='utf-8'))
          out = pathlib.Path('content/products/files')
          out.mkdir(parents=True, exist_ok=True)
          for filename, spec in data.items():
              if not spec:
                  continue
              if isinstance(spec, str):
                  url = spec
                  encoded = False
              else:
                  url = spec.get('url', '')
                  encoded = bool(spec.get('base64'))
              if not url:
                  continue
              target = out / filename
              tmp = target.with_suffix(target.suffix + '.download')
              print(f'Downloading {filename}...')
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=180) as response, tmp.open('wb') as fh:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          fh.write(chunk)
                  if encoded:
                      target.write_bytes(base64.b64decode(tmp.read_bytes(), validate=False))
                      tmp.unlink(missing_ok=True)
                  else:
                      tmp.replace(target)
                  if target.stat().st_size < 100000 or target.read_bytes()[:4] != b'%PDF':
                      raise RuntimeError(f'{filename}: invalid PDF download')
                  print(f'{filename}: {target.stat().st_size} bytes')
              except Exception as exc:
                  tmp.unlink(missing_ok=True)
                  target.unlink(missing_ok=True)
                  print(f'WARNING: {filename} was not staged: {exc}')
          PY

      - name: Fetch refreshed product galleries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          import base64, tarfile, tempfile
          source = pathlib.Path('content/products/gallery-sources.json')
          bundle_source = pathlib.Path('content/products/gallery-bundle-source.json')
          out = pathlib.Path('content/products/assets')
          out.mkdir(parents=True, exist_ok=True)

          if bundle_source.is_file():
              spec = json.loads(bundle_source.read_text(encoding='utf-8'))
              url = spec.get('url', '')
              if not url:
                  raise SystemExit('gallery-bundle-source.json has no url')
              print('Downloading gallery bundle...')
              request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(request, timeout=180) as response:
                  encoded = response.read()
              archive_bytes = base64.b64decode(encoded, validate=False) if spec.get('base64', True) else encoded
              with tempfile.NamedTemporaryFile(suffix='.tar.gz') as fh:
                  fh.write(archive_bytes); fh.flush()
                  with tarfile.open(fh.name, 'r:gz') as tar:
                      members = [m for m in tar.getmembers() if m.isfile() and '/' not in m.name and m.name.endswith('.webp')]
                      if not members:
                          raise SystemExit('Gallery bundle contains no WEBP assets')
                      tar.extractall(out, members=members, filter='data')
                      print(f'Extracted {len(members)} gallery assets')

          if not source.is_file():
              if bundle_source.is_file():
                  raise SystemExit(0)
              print('No staged gallery refresh.')
              raise SystemExit(0)
          data = json.loads(source.read_text(encoding='utf-8'))
          for filename, url in data.items():
              if not url:
                  continue
              target = out / filename
              print(f'Downloading {filename}...')
              request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(request, timeout=120) as response, target.open('wb') as fh:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      fh.write(chunk)
              if target.stat().st_size < 100000:
                  raise SystemExit(f'{filename}: gallery download too small')
              print(f'{filename}: {target.stat().st_size} bytes')
          PY

      - name: Generate clean featured product images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 content/tools/generate-featured-images.py

      - name: Persist generated product gallery assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/products/assets content/products/catalog.json
          git add content/pattern-system/collections/pop-art-25
          git add content/pattern-system/products/P1*-CS content/pattern-system/patterns/P1*-CS 2>/dev/null || true
          git add -u content/pattern-system/products content/pattern-system/patterns
          git add -u -- content/products/files 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated gallery asset changes to persist."
          else
            git commit -m "Refresh generated product assets [skip ci]"
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Generated gallery assets persisted."
            else
              git rebase --abort >/dev/null 2>&1 || true
              echo "WARNING: main advanced concurrently; continuing the current import with the generated assets without blocking WooCommerce."
            fi
          fi

      - name: Validate product catalogue
        shell: bash
        run: |
          set -euo pipefail
          php -l content/tools/import-products.php
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('content/products/catalog.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          products = data.get('products', [])
          if not products:
              raise SystemExit('No products in catalogue')

          seen_sku = set()
          seen_code = set()
          for row in products:
              for key in ('code','sku','title','slug','price','collection','gallery','download','filters','design_id','grid_width','grid_height','color_count','featured_image'):
                  if key not in row:
                      raise SystemExit(f"Missing {key} in {row}")
              featured = Path('content/products') / row['featured_image']
              if not featured.is_file():
                  if row.get('collection') == 'pop-art-25':
                      raise SystemExit(f"Missing Pop Art featured image: {row['featured_image']}")
                  print(f"WARNING: preserving existing non-Pop-Art featured image not staged in repo: {row['featured_image']}")
              required_filters = ('technique','theme','style','project','orientation','difficulty','color-family','season')
              for filter_key in required_filters:
                  if filter_key not in row['filters']:
                      raise SystemExit(f"Missing filter {filter_key} in {row['sku']}")
              if not row['filters']['technique'] or not row['filters']['theme'] or not row['filters']['style']:
                  raise SystemExit(f"Core filters cannot be empty in {row['sku']}")
              if row['sku'] in seen_sku or row['code'] in seen_code:
                  raise SystemExit('Duplicate SKU or code')
              seen_sku.add(row['sku']); seen_code.add(row['code'])
              if float(row['price']) <= 0:
                  raise SystemExit(f"Invalid price for {row['sku']}")
              for asset in row['gallery']:
                  if not (Path('content/products') / asset).is_file():
                      if row.get('collection') == 'pop-art-25':
                          raise SystemExit(f"Missing Pop Art gallery asset: {asset}")
                      print(f"WARNING: preserving existing non-Pop-Art gallery asset not staged in repo: {asset}")

          print(f"Validated {len(products)} products")
          PY

      - name: Ensure all 60 Pop Art PDFs
        shell: bash
        run: |
          set -euo pipefail
          if python3 - <<'PY'
          from pathlib import Path
          missing=[]
          for i in range(1,61):
              p=Path('content/products/files')/f'Drielo_P{1000+i:04d}-CS.pdf'
              if not p.is_file() or p.stat().st_size < 100000:
                  missing.append(p.name)
          print('MISSING_POP_ART_PDFS=' + str(len(missing)))
          raise SystemExit(0 if not missing else 1)
          PY
          then
            echo "All Pop Art PDFs are already staged."
          else
            python3 -m pip install --disable-pip-version-check --quiet Pillow playwright
            python3 -m playwright install --with-deps chromium
            python3 .github/scripts/render_pop_art_60_pdfs.py
          fi

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Package products
        run: |
          set -euo pipefail
          tar -czf /tmp/drielo-products.tgz content/products content/tools/import-products.php content/tools/repair-pop-art-60.php content/tools/generate-featured-images.py

      - name: Upload product package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/drielo_products_key /tmp/drielo-products.tgz "$VPS_USER@$VPS_HOST:/tmp/drielo-products-${GITHUB_RUN_ID}.tgz"

      - name: Import into WooCommerce
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-products-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-products-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"

          # Always start with a clean container staging directory. Previous failed
          # imports could leave a nested/stale /tmp/drielo-products tree, causing
          # the next docker cp to put fresh assets in the wrong level.
          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php /tmp/drielo-repair-pop-art-60.php && mkdir -p /tmp/drielo-products'
          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" cp "$STAGE/content/tools/repair-pop-art-60.php" make-wp:/tmp/drielo-repair-pop-art-60.php

          # Verify both ends of the Pop Art 60 family are physically present in
          # the container before WordPress touches anything.
          "${DOCKER[@]}" exec make-wp sh -lc '
            test -s /tmp/drielo-products/assets/P1001-CS-product.webp &&
            test -s /tmp/drielo-products/assets/P1060-CS-product.webp &&
            test -s /tmp/drielo-products/assets/P1001-CS-design.webp &&
            test -s /tmp/drielo-products/assets/P1060-CS-gallery-4.webp &&
            test -s /tmp/drielo-products/files/Drielo_P1001-CS.pdf &&
            test -s /tmp/drielo-products/files/Drielo_P1060-CS.pdf
          '

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-repair-pop-art-60.php /var/www/html /tmp/drielo-products

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $ids=get_posts(array("post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids","meta_key"=>"_drielo_managed_product","meta_value"=>"1"));
            echo "DRIELO_PRODUCTS=" . count($ids) . PHP_EOL;
            $pop=array();
            foreach ($ids as $id) {
              $p=wc_get_product($id);
              if (!$p) { continue; }
              $sku=(string)$p->get_sku();
              $theme=wp_get_object_terms($id,"pa_theme",array("fields"=>"slugs"));
              $style=wp_get_object_terms($id,"pa_style",array("fields"=>"slugs"));
              $color=wp_get_object_terms($id,"pa_color-family",array("fields"=>"slugs"));
              $images=1+count($p->get_gallery_image_ids());
              $downloads=count($p->get_downloads());
              echo $sku . " id=" . $id . " status=" . $p->get_status() . " stock=" . $p->get_stock_status() . " images=" . $images . " downloads=" . $downloads . " theme=" . implode(",",is_wp_error($theme)?array():$theme) . " style=" . implode(",",is_wp_error($style)?array():$style) . " color=" . implode(",",is_wp_error($color)?array():$color) . " url=" . get_permalink($id) . PHP_EOL;
              if (is_wp_error($theme) || empty($theme) || is_wp_error($style) || empty($style) || is_wp_error($color) || empty($color)) { fwrite(STDERR,"Missing Drielo filter taxonomy for product " . $id . PHP_EOL); exit(2); }
              if (preg_match("/^DRIELO-P10(?:0[1-9]|[1-5][0-9]|60)-CS$/",$sku)) {
                $pop[$sku]=true;
                if ("instock" !== $p->get_stock_status()) { fwrite(STDERR,"Pop Art out of stock: ".$sku.PHP_EOL); exit(3); }
                if ($downloads < 1) { fwrite(STDERR,"Pop Art missing PDF: ".$sku.PHP_EOL); exit(4); }
                if ($images < 5) { fwrite(STDERR,"Pop Art missing gallery images: ".$sku." images=".$images.PHP_EOL); exit(5); }
              }
              if ("DRIELO-P1000-CS" === $sku) { fwrite(STDERR,"Legacy Pop Art P1000 residue still published".PHP_EOL); exit(6); }
            }
            if (count($pop)!==60) { fwrite(STDERR,"Expected exactly 60 Pop Art products, got ".count($pop).PHP_EOL); exit(7); }
            $popterm=get_term_by("slug","pop-art-25","product_collection");
            if (!$popterm || (int)$popterm->count!==60) { fwrite(STDERR,"Expected Pop Art collection count 60".PHP_EOL); exit(8); }
            echo "POP_ART_VERIFIED=60" . PHP_EOL;
            $terms=get_terms(array("taxonomy"=>"product_collection","hide_empty"=>false));
            if (!is_wp_error($terms)) foreach($terms as $t) echo "COLLECTION=" . $t->slug . " count=" . $t->count . " url=" . get_term_link($t) . PHP_EOL;
          '

          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php /tmp/drielo-repair-pop-art-60.php'
          REMOTE

      - name: Verify public shop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          shop_url = 'https://drielo.com/tienda/?drielo_check=1'
          pop_url = 'https://drielo.com/tienda/coleccion/retratos-pop-art/?drielo_check=1'
          for label,url in [('SHOP',shop_url),('POP_ART',pop_url)]:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  html = r.read().decode('utf-8', 'replace')
              product_links = len(set(re.findall(r'/(?:producto|tienda)/[a-z0-9-]+/?', html)))
              print(label + '_PRODUCT_LINKS=' + str(product_links))
              if 'wp-block-woocommerce-coming-soon' in html:
                  raise SystemExit(label + ': WooCommerce storefront is still in Coming Soon mode')
              if product_links < 1:
                  raise SystemExit(label + ': public page contains no product links')
              if label == 'SHOP' and ('shop-hero' not in html or 'drielo-shop-views' not in html):
                  raise SystemExit('Drielo shop template is not being rendered')
              if label == 'POP_ART' and 'Retratos Pop Art' not in html:
                  raise SystemExit('Retratos Pop Art collection page is not being rendered')
          PY



      - name: Mark Pop Art 60 deployment complete
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('content/pattern-system/collections/pop-art-25/rework-60/processed.json')
          if p.is_file():
              data=json.loads(p.read_text(encoding='utf-8'))
              data['deployed']=True
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pattern-system/collections/pop-art-25/rework-60/processed.json
          if git diff --cached --quiet; then
            echo "Pop Art deployment marker already current."
          else
            git commit -m "Mark Pop Art 60 deployment complete [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

name: Import Drielo products

on:
  push:
    branches: [main]
    paths:
      - 'content/products/**'
      - 'content/tools/import-products.php'
      - '.github/workflows/import-products.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drielo-product-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch private product PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path('content/products/pdf-sources.json')
          if not source.is_file():
              print('No staged product PDFs; preserving existing WooCommerce downloads.')
              raise SystemExit(0)
          data = json.loads(source.read_text(encoding='utf-8'))
          out = pathlib.Path('content/products/files')
          out.mkdir(parents=True, exist_ok=True)
          for filename, url in data.items():
              if not url:
                  continue
              target = out / filename
              print(f'Downloading {filename}...')
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=120) as response, target.open('wb') as fh:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          fh.write(chunk)
                  if target.stat().st_size < 100000:
                      raise RuntimeError(f'{filename}: download too small')
                  print(f'{filename}: {target.stat().st_size} bytes')
              except Exception as exc:
                  target.unlink(missing_ok=True)
                  print(f'WARNING: {filename} was not staged: {exc}')
          PY

      - name: Validate product catalogue
        shell: bash
        run: |
          set -euo pipefail
          php -l content/tools/import-products.php
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('content/products/catalog.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          products = data.get('products', [])
          if not products:
              raise SystemExit('No products in catalogue')

          seen_sku = set()
          seen_code = set()
          for row in products:
              for key in ('code','sku','title','slug','price','collection','gallery','download'):
                  if key not in row:
                      raise SystemExit(f"Missing {key} in {row}")
              if row['sku'] in seen_sku or row['code'] in seen_code:
                  raise SystemExit('Duplicate SKU or code')
              seen_sku.add(row['sku']); seen_code.add(row['code'])
              if float(row['price']) <= 0:
                  raise SystemExit(f"Invalid price for {row['sku']}")
              for asset in row['gallery']:
                  if not (Path('content/products') / asset).is_file():
                      raise SystemExit(f"Missing gallery asset: {asset}")

          print(f"Validated {len(products)} products")
          PY

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Package products
        run: |
          set -euo pipefail
          tar -czf /tmp/drielo-products.tgz content/products content/tools/import-products.php

      - name: Upload product package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/drielo_products_key /tmp/drielo-products.tgz "$VPS_USER@$VPS_HOST:/tmp/drielo-products-${GITHUB_RUN_ID}.tgz"

      - name: Import into WooCommerce
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-products-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-products-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"

          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products

          "${DOCKER[@]}" exec make-wp php -r '
            require "/var/www/html/wp-load.php";
            $ids=get_posts(array("post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids","meta_key"=>"_drielo_managed_product","meta_value"=>"1"));
            echo "DRIELO_PRODUCTS=" . count($ids) . PHP_EOL;
            foreach ($ids as $id) {
              $p=wc_get_product($id);
              echo $p->get_sku() . " id=" . $id . " status=" . $p->get_status() . " stock=" . $p->get_stock_status() . " images=" . (1+count($p->get_gallery_image_ids())) . " downloads=" . count($p->get_downloads()) . " url=" . get_permalink($id) . PHP_EOL;
            }
            $terms=get_terms(array("taxonomy"=>"product_collection","hide_empty"=>false));
            if (!is_wp_error($terms)) foreach($terms as $t) echo "COLLECTION=" . $t->slug . " count=" . $t->count . " url=" . get_term_link($t) . PHP_EOL;
            $shop_id=function_exists("wc_get_page_id") ? wc_get_page_id("shop") : 0;
            echo "SHOP_ID=" . $shop_id . PHP_EOL;
            if ($shop_id>0) echo "SHOP_TITLE=" . get_the_title($shop_id) . " SHOP_STATUS=" . get_post_status($shop_id) . " SHOP_URL=" . get_permalink($shop_id) . PHP_EOL;
            $page=get_page_by_path("tienda");
            if ($page) echo "TIENDA_PAGE_ID=" . $page->ID . " STATUS=" . get_post_status($page->ID) . " URL=" . get_permalink($page->ID) . PHP_EOL;
            $page2=get_page_by_path("shop");
            if ($page2) echo "SHOP_PAGE_SLUG_ID=" . $page2->ID . " STATUS=" . get_post_status($page2->ID) . " URL=" . get_permalink($page2->ID) . PHP_EOL;
            update_option("woocommerce_coming_soon","no");
            update_option("woocommerce_store_pages_only","no");
            echo "STORE_VISIBILITY=" . get_option("woocommerce_coming_soon","") . PHP_EOL;
            echo "PRODUCT_PUBLISHED=" . wp_count_posts("product")->publish . PHP_EOL;
            echo "POLYLANG=" . (function_exists("pll_get_post_language") ? "yes" : "no") . PHP_EOL;
            foreach($ids as $id){ $lang=function_exists("pll_get_post_language") ? pll_get_post_language($id,"slug") : ""; $vis=wp_get_post_terms($id,"product_visibility",array("fields"=>"slugs")); echo "PRODUCT_LANG=" . get_post_meta($id,"_sku",true) . ":" . ($lang ?: "NONE") . " VIS=" . implode(",",is_wp_error($vis)?array():$vis) . PHP_EOL; }
            $locations=get_nav_menu_locations();
            foreach($locations as $loc=>$menu_id){ echo "MENU_LOCATION=" . $loc . " ID=" . $menu_id . PHP_EOL; $items=wp_get_nav_menu_items($menu_id); if(is_array($items)) foreach($items as $mi) echo "MENU_ITEM=" . $mi->title . " URL=" . $mi->url . PHP_EOL; }
          '

          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Verify public shop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          url = 'https://drielo.com/tienda/?drielo_check=1'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=60) as r:
              html = r.read().decode('utf-8', 'replace')
          print('SHOP_HTTP_BYTES=' + str(len(html)))
          print('SHOP_PRODUCT_LINKS=' + str(len(re.findall(r'/producto/', html))))
          print('SHOP_HAS_P0001=' + str('bubble-gum-portrait-cross-stitch-pattern' in html).lower())
          print('SHOP_HAS_NO_PRODUCTS=' + str(('No se encontraron productos' in html) or ('No products were found' in html)).lower())
          print('SHOP_HAS_HERO=' + str('shop-hero' in html).lower())
          print('SHOP_HAS_VIEWS=' + str('drielo-shop-views' in html).lower())
          print('SHOP_HAS_PAGE_WRAP=' + str('page-wrap' in html).lower())
          m = re.search(r'<main[^>]*>(.*?)</main>', html, re.S|re.I)
          if m:
              snippet = re.sub(r'\s+', ' ', m.group(1))[:1800]
              print('SHOP_MAIN_SNIPPET=' + snippet)
          PY

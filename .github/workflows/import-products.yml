name: Import Drielo products

on:
  push:
    branches: [main]
    paths:
      - 'content/products/**'
      - 'content/tools/import-products.php'
      - '.github/workflows/import-products.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-product-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch private product PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path('content/products/pdf-sources.json')
          if not source.is_file():
              print('No staged product PDFs; preserving existing WooCommerce downloads.')
              raise SystemExit(0)
          import base64
          data = json.loads(source.read_text(encoding='utf-8'))
          out = pathlib.Path('content/products/files')
          out.mkdir(parents=True, exist_ok=True)
          for filename, spec in data.items():
              if not spec:
                  continue
              if isinstance(spec, str):
                  url = spec
                  encoded = False
              else:
                  url = spec.get('url', '')
                  encoded = bool(spec.get('base64'))
              if not url:
                  continue
              target = out / filename
              tmp = target.with_suffix(target.suffix + '.download')
              print(f'Downloading {filename}...')
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=180) as response, tmp.open('wb') as fh:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          fh.write(chunk)
                  if encoded:
                      target.write_bytes(base64.b64decode(tmp.read_bytes(), validate=False))
                      tmp.unlink(missing_ok=True)
                  else:
                      tmp.replace(target)
                  if target.stat().st_size < 100000 or target.read_bytes()[:4] != b'%PDF':
                      raise RuntimeError(f'{filename}: invalid PDF download')
                  print(f'{filename}: {target.stat().st_size} bytes')
              except Exception as exc:
                  tmp.unlink(missing_ok=True)
                  target.unlink(missing_ok=True)
                  print(f'WARNING: {filename} was not staged: {exc}')
          PY

      - name: Fetch refreshed product galleries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          import base64, tarfile, tempfile
          source = pathlib.Path('content/products/gallery-sources.json')
          bundle_source = pathlib.Path('content/products/gallery-bundle-source.json')
          out = pathlib.Path('content/products/assets')
          out.mkdir(parents=True, exist_ok=True)

          if bundle_source.is_file():
              spec = json.loads(bundle_source.read_text(encoding='utf-8'))
              url = spec.get('url', '')
              if not url:
                  raise SystemExit('gallery-bundle-source.json has no url')
              print('Downloading gallery bundle...')
              request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(request, timeout=180) as response:
                  encoded = response.read()
              archive_bytes = base64.b64decode(encoded, validate=False) if spec.get('base64', True) else encoded
              with tempfile.NamedTemporaryFile(suffix='.tar.gz') as fh:
                  fh.write(archive_bytes); fh.flush()
                  with tarfile.open(fh.name, 'r:gz') as tar:
                      members = [m for m in tar.getmembers() if m.isfile() and '/' not in m.name and m.name.endswith('.webp')]
                      if not members:
                          raise SystemExit('Gallery bundle contains no WEBP assets')
                      tar.extractall(out, members=members, filter='data')
                      print(f'Extracted {len(members)} gallery assets')

          if not source.is_file():
              if bundle_source.is_file():
                  raise SystemExit(0)
              print('No staged gallery refresh.')
              raise SystemExit(0)
          data = json.loads(source.read_text(encoding='utf-8'))
          for filename, url in data.items():
              if not url:
                  continue
              target = out / filename
              print(f'Downloading {filename}...')
              request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(request, timeout=120) as response, target.open('wb') as fh:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      fh.write(chunk)
              if target.stat().st_size < 100000:
                  raise SystemExit(f'{filename}: gallery download too small')
              print(f'{filename}: {target.stat().st_size} bytes')
          PY

      - name: Generate clean featured product images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 content/tools/generate-featured-images.py

      - name: Persist generated featured images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/products/assets/*-featured.webp 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No featured image changes to persist."
          else
            git commit -m "Refresh clean product featured images [skip ci]"
            git push origin HEAD:main
          fi

      - name: Persist refreshed gallery assets
        if: ${{ hashFiles('content/products/gallery-sources.json') != '' || hashFiles('content/products/gallery-bundle-source.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/products/assets
          if git diff --cached --quiet; then
            echo "No gallery asset changes to persist."
          else
            git commit -m "Refresh product gallery assets [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate product catalogue
        shell: bash
        run: |
          set -euo pipefail
          php -l content/tools/import-products.php
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('content/products/catalog.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          products = data.get('products', [])
          if not products:
              raise SystemExit('No products in catalogue')

          seen_sku = set()
          seen_code = set()
          for row in products:
              for key in ('code','sku','title','slug','price','collection','gallery','download','filters','design_id','grid_width','grid_height','color_count','featured_image'):
                  if key not in row:
                      raise SystemExit(f"Missing {key} in {row}")
              featured = Path('content/products') / row['featured_image']
              if not featured.is_file():
                  raise SystemExit(f"Missing featured image: {row['featured_image']}")
              required_filters = ('technique','theme','style','project','orientation','difficulty','color-family','season')
              for filter_key in required_filters:
                  if filter_key not in row['filters']:
                      raise SystemExit(f"Missing filter {filter_key} in {row['sku']}")
              if not row['filters']['technique'] or not row['filters']['theme'] or not row['filters']['style']:
                  raise SystemExit(f"Core filters cannot be empty in {row['sku']}")
              if row['sku'] in seen_sku or row['code'] in seen_code:
                  raise SystemExit('Duplicate SKU or code')
              seen_sku.add(row['sku']); seen_code.add(row['code'])
              if float(row['price']) <= 0:
                  raise SystemExit(f"Invalid price for {row['sku']}")
              for asset in row['gallery']:
                  if not (Path('content/products') / asset).is_file():
                      raise SystemExit(f"Missing gallery asset: {asset}")

          print(f"Validated {len(products)} products")
          PY

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Package products
        run: |
          set -euo pipefail
          tar -czf /tmp/drielo-products.tgz content/products content/tools/import-products.php content/tools/generate-featured-images.py

      - name: Upload product package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/drielo_products_key /tmp/drielo-products.tgz "$VPS_USER@$VPS_HOST:/tmp/drielo-products-${GITHUB_RUN_ID}.tgz"

      - name: Import into WooCommerce
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-products-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-products-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"

          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $ids=get_posts(array("post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids","meta_key"=>"_drielo_managed_product","meta_value"=>"1"));
            echo "DRIELO_PRODUCTS=" . count($ids) . PHP_EOL;
            foreach ($ids as $id) {
              $p=wc_get_product($id);
              $theme=wp_get_object_terms($id,"pa_theme",array("fields"=>"slugs"));
              $style=wp_get_object_terms($id,"pa_style",array("fields"=>"slugs"));
              $color=wp_get_object_terms($id,"pa_color-family",array("fields"=>"slugs"));
              echo $p->get_sku() . " id=" . $id . " status=" . $p->get_status() . " stock=" . $p->get_stock_status() . " images=" . (1+count($p->get_gallery_image_ids())) . " downloads=" . count($p->get_downloads()) . " theme=" . implode(",",is_wp_error($theme)?array():$theme) . " style=" . implode(",",is_wp_error($style)?array():$style) . " color=" . implode(",",is_wp_error($color)?array():$color) . " url=" . get_permalink($id) . PHP_EOL;
              if (is_wp_error($theme) || empty($theme) || is_wp_error($style) || empty($style) || is_wp_error($color) || empty($color)) { fwrite(STDERR,"Missing Drielo filter taxonomy for product " . $id . PHP_EOL); exit(2); }
            }
            $terms=get_terms(array("taxonomy"=>"product_collection","hide_empty"=>false));
            if (!is_wp_error($terms)) foreach($terms as $t) echo "COLLECTION=" . $t->slug . " count=" . $t->count . " url=" . get_term_link($t) . PHP_EOL;
          '

          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Verify public shop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          url = 'https://drielo.com/tienda/?drielo_check=1'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=60) as r:
              html = r.read().decode('utf-8', 'replace')
          product_links = len(set(re.findall(r'/(?:producto|tienda)/[a-z0-9-]+/?', html)))
          print('SHOP_PRODUCT_LINKS=' + str(product_links))
          if 'wp-block-woocommerce-coming-soon' in html:
              raise SystemExit('WooCommerce storefront is still in Coming Soon mode')
          if 'shop-hero' not in html or 'drielo-shop-views' not in html:
              raise SystemExit('Drielo shop template is not being rendered')
          if product_links < 1:
              raise SystemExit('Public shop contains no product links')
          if 'P0001-CS-featured' not in html:
              raise SystemExit('Clean P0001 featured image is not rendered in the public shop')
          PY


name: Import Drielo products

on:
  push:
    branches: [main]
    paths:
      - 'content/products/**'
      - 'content/tools/import-products.php'
      - '.github/workflows/import-products.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drielo-product-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch private product PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path('content/products/pdf-sources.json')
          if not source.is_file():
              print('No staged product PDFs; preserving existing WooCommerce downloads.')
              raise SystemExit(0)
          data = json.loads(source.read_text(encoding='utf-8'))
          out = pathlib.Path('content/products/files')
          out.mkdir(parents=True, exist_ok=True)
          for filename, url in data.items():
              if not url:
                  continue
              target = out / filename
              print(f'Downloading {filename}...')
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=120) as response, target.open('wb') as fh:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          fh.write(chunk)
                  if target.stat().st_size < 100000:
                      raise RuntimeError(f'{filename}: download too small')
                  print(f'{filename}: {target.stat().st_size} bytes')
              except Exception as exc:
                  target.unlink(missing_ok=True)
                  print(f'WARNING: {filename} was not staged: {exc}')
          PY

      - name: Fetch refreshed product galleries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          source = pathlib.Path('content/products/gallery-sources.json')
          if not source.is_file():
              print('No staged gallery refresh.')
              raise SystemExit(0)
          data = json.loads(source.read_text(encoding='utf-8'))
          out = pathlib.Path('content/products/assets')
          out.mkdir(parents=True, exist_ok=True)
          for filename, url in data.items():
              if not url:
                  continue
              target = out / filename
              print(f'Downloading {filename}...')
              request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(request, timeout=120) as response, target.open('wb') as fh:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      fh.write(chunk)
              if target.stat().st_size < 100000:
                  raise SystemExit(f'{filename}: gallery download too small')
              print(f'{filename}: {target.stat().st_size} bytes')
          PY

      - name: Persist refreshed gallery assets
        if: ${{ hashFiles('content/products/gallery-sources.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/products/assets
          if git diff --cached --quiet; then
            echo "No gallery asset changes to persist."
          else
            git commit -m "Refresh product gallery assets [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate product catalogue
        shell: bash
        run: |
          set -euo pipefail
          php -l content/tools/import-products.php
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('content/products/catalog.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          products = data.get('products', [])
          if not products:
              raise SystemExit('No products in catalogue')

          seen_sku = set()
          seen_code = set()
          for row in products:
              for key in ('code','sku','title','slug','price','collection','gallery','download'):
                  if key not in row:
                      raise SystemExit(f"Missing {key} in {row}")
              if row['sku'] in seen_sku or row['code'] in seen_code:
                  raise SystemExit('Duplicate SKU or code')
              seen_sku.add(row['sku']); seen_code.add(row['code'])
              if float(row['price']) <= 0:
                  raise SystemExit(f"Invalid price for {row['sku']}")
              for asset in row['gallery']:
                  if not (Path('content/products') / asset).is_file():
                      raise SystemExit(f"Missing gallery asset: {asset}")

          print(f"Validated {len(products)} products")
          PY

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_products_key
          chmod 600 ~/.ssh/drielo_products_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: TEMP export current WooCommerce PDFs
        env:
          VPS_HOST: \${{ secrets.VPS_HOST }}
          VPS_USER: \${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          REMOTE_TAR="/tmp/drielo-current-pdfs-\${GITHUB_RUN_ID}.tgz"
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "REMOTE_TAR='$REMOTE_TAR' bash -s" <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          CONTAINER_DIR="/tmp/drielo-current-pdfs"
          "\${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$CONTAINER_DIR' && mkdir -p '$CONTAINER_DIR'"

          "\${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $out = "/tmp/drielo-current-pdfs";
            $ids = get_posts(array(
              "post_type"=>"product",
              "post_status"=>"publish",
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "meta_key"=>"_drielo_managed_product",
              "meta_value"=>"1",
              "orderby"=>"ID",
              "order"=>"ASC"
            ));
            $uploads = wp_upload_dir();
            $copied = 0;
            foreach ($ids as $id) {
              $p = wc_get_product($id);
              if (!$p) continue;
              $sku = $p->get_sku();
              if (!preg_match("/P(\\\\d{4})$/", $sku, $m)) continue;
              $code = "P".$m[1];
              $downloads = $p->get_downloads();
              if (!$downloads) {
                echo "NO_DOWNLOAD ".$code.PHP_EOL;
                continue;
              }
              $d = reset($downloads);
              $file = $d->get_file();
              $path = $file;
              if (preg_match("#^https?://#", $file)) {
                if (strpos($file, $uploads["baseurl"]) === 0) {
                  $path = $uploads["basedir"] . substr($file, strlen($uploads["baseurl"]));
                } else {
                  $site = site_url("/");
                  if (strpos($file, $site) === 0) {
                    $rel = ltrim(substr($file, strlen($site)), "/");
                    $path = ABSPATH . $rel;
                  }
                }
              }
              if (!is_file($path)) {
                echo "MISSING ".$code." file=".$file." path=".$path.PHP_EOL;
                continue;
              }
              $target = $out . "/Drielo_" . $code . ".pdf";
              if (!copy($path, $target)) {
                echo "COPY_FAILED ".$code.PHP_EOL;
                continue;
              }
              echo "COPIED ".$code." ".filesize($target)." bytes".PHP_EOL;
              $copied++;
            }
            echo "TOTAL=".$copied.PHP_EOL;
            if ($copied < 1) exit(3);
          '

          "\${DOCKER[@]}" exec make-wp tar -czf /tmp/drielo-current-pdfs.tgz -C "$CONTAINER_DIR" .
          "\${DOCKER[@]}" cp make-wp:/tmp/drielo-current-pdfs.tgz "$REMOTE_TAR"
          "\${DOCKER[@]}" exec make-wp sh -lc "rm -rf '$CONTAINER_DIR' /tmp/drielo-current-pdfs.tgz"
          REMOTE

          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "cat '$REMOTE_TAR' && rm -f '$REMOTE_TAR'" > /tmp/drielo-current-pdfs.tgz
          mkdir -p exported-pdfs
          tar -xzf /tmp/drielo-current-pdfs.tgz -C exported-pdfs
          COUNT="$(find exported-pdfs -maxdepth 1 -type f -name '*.pdf' | wc -l)"
          echo "PDF_COUNT=$COUNT"
          ls -lh exported-pdfs
          test "$COUNT" -ge 1

      - name: TEMP upload current PDFs
        uses: actions/upload-artifact@v4
        with:
          name: drielo-current-pdfs
          path: exported-pdfs/*.pdf
          if-no-files-found: error
          retention-days: 1

      - name: TEMP persist export artifact metadata
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          sleep 3
          mkdir -p tmp
          JSON="$(gh api "repos/\${GITHUB_REPOSITORY}/actions/runs/\${GITHUB_RUN_ID}/artifacts")"
          ARTIFACT_ID="$(printf '%s' "$JSON" | jq -r '.artifacts[] | select(.name=="drielo-current-pdfs") | .id' | head -n1)"
          test -n "$ARTIFACT_ID"
          test "$ARTIFACT_ID" != "null"
          jq -n --argjson run_id "$GITHUB_RUN_ID" --argjson artifact_id "$ARTIFACT_ID" \
            '{run_id:$run_id, artifact_id:$artifact_id, artifact_name:"drielo-current-pdfs"}' \
            > tmp/export-artifact-main.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/export-artifact-main.json
          git commit -m "Store temporary PDF export artifact metadata [skip ci]"
          git push origin HEAD:main

      - name: Package products
        run: |
          set -euo pipefail
          tar -czf /tmp/drielo-products.tgz content/products content/tools/import-products.php

      - name: Upload product package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/drielo_products_key /tmp/drielo-products.tgz "$VPS_USER@$VPS_HOST:/tmp/drielo-products-${GITHUB_RUN_ID}.tgz"

      - name: Import into WooCommerce
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_products_key "$VPS_USER@$VPS_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="/tmp/drielo-products-${GITHUB_RUN_ID}.tgz"
          STAGE="/tmp/drielo-products-${GITHUB_RUN_ID}"
          cleanup(){ rm -rf "$ARCHIVE" "$STAGE"; }
          trap cleanup EXIT

          if docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker inspect make-wp >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          else
            echo "ERROR: make-wp container not found"
            exit 1
          fi

          rm -rf "$STAGE" && mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"

          "${DOCKER[@]}" cp "$STAGE/content/products/." make-wp:/tmp/drielo-products/
          "${DOCKER[@]}" cp "$STAGE/content/tools/import-products.php" make-wp:/tmp/drielo-import-products.php
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M /tmp/drielo-import-products.php /var/www/html /tmp/drielo-products

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $ids=get_posts(array("post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids","meta_key"=>"_drielo_managed_product","meta_value"=>"1"));
            echo "DRIELO_PRODUCTS=" . count($ids) . PHP_EOL;
            foreach ($ids as $id) {
              $p=wc_get_product($id);
              echo $p->get_sku() . " id=" . $id . " status=" . $p->get_status() . " stock=" . $p->get_stock_status() . " images=" . (1+count($p->get_gallery_image_ids())) . " downloads=" . count($p->get_downloads()) . " url=" . get_permalink($id) . PHP_EOL;
            }
            $terms=get_terms(array("taxonomy"=>"product_collection","hide_empty"=>false));
            if (!is_wp_error($terms)) foreach($terms as $t) echo "COLLECTION=" . $t->slug . " count=" . $t->count . " url=" . get_term_link($t) . PHP_EOL;
          '

          "${DOCKER[@]}" exec make-wp sh -lc 'rm -rf /tmp/drielo-products /tmp/drielo-import-products.php'
          REMOTE

      - name: Verify public shop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          url = 'https://drielo.com/tienda/?drielo_check=1'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=60) as r:
              html = r.read().decode('utf-8', 'replace')
          product_links = len(re.findall(r'/tienda/[a-z0-9-]+-patron-punto-de-cruz/', html))
          print('SHOP_PRODUCT_LINKS=' + str(product_links))
          if 'wp-block-woocommerce-coming-soon' in html:
              raise SystemExit('WooCommerce storefront is still in Coming Soon mode')
          if 'shop-hero' not in html or 'drielo-shop-views' not in html:
              raise SystemExit('Drielo shop template is not being rendered')
          if product_links < 1:
              raise SystemExit('Public shop contains no product links')
          PY


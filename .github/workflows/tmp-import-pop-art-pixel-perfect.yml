name: Temporary import pixel-perfect Pop Art cover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-import-pop-art-pixel-perfect.yml"

permissions:
  contents: write

jobs:
  import-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and validate pixel-perfect source
        shell: bash
        env:
          SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-a464-820e-ae5c-8a0fd6a07b77/raw?se=2026-09-27T18%3A43%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=c714a676-303b-586c-b646-b488584c9bf0&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T12%3A21%3A12Z&ske=2026-09-28T12%3A21%3A12Z&sks=b&skv=2026-02-06&sig=1DsS654jYtUIvmtbkjI3b8hdEb8Geijp3qapId2FGXo%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/pop-art-cover.png
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageChops
          import hashlib
          src_path = "/tmp/pop-art-cover.png"
          dst_path = "content/products/assets/pop-art-25-collection-cover.webp"
          src = Image.open(src_path).convert("RGB")
          if src.size != (1536, 1478):
              raise SystemExit(f"Unexpected source size: {src.size}")
          src.save(dst_path, "WEBP", lossless=True, method=6)
          out = Image.open(dst_path).convert("RGB")
          if out.size != src.size:
              raise SystemExit(f"Unexpected WEBP size: {out.size}")
          if ImageChops.difference(src, out).getbbox() is not None:
              raise SystemExit("Lossless verification failed: decoded WEBP differs from PNG")
          box = (359, 139, 1196, 1106)
          if ImageChops.difference(src.crop(box), out.crop(box)).getbbox() is not None:
              raise SystemExit("Pixel-perfect frame/canvas verification failed")
          with open(dst_path, "rb") as f:
              print("SHA256", hashlib.sha256(f.read()).hexdigest())
          print("PIXEL_PERFECT_OK", out.size, box)
          PY

      - name: Commit new Pop Art collection cover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/products/assets/pop-art-25-collection-cover.webp
          if git diff --cached --quiet; then
            echo "Cover already matches."
            exit 0
          fi
          git commit -m "Update Pop Art collection cover pixel-perfect [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

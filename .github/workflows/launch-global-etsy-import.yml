name: Launch global Etsy safe import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/launch-global-etsy-import.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_global_etsy_key
          chmod 600 ~/.ssh/drielo_global_etsy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Enable all craft products and queue safe sync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_global_etsy_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi

          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -d max_execution_time=0 -r '
            require "/var/www/html/wp-load.php";
            require_once ABSPATH."wp-admin/includes/plugin.php";

            $data=get_plugin_data(WP_PLUGIN_DIR."/drielo-etsy-sync/drielo-etsy-sync.php",false,false);
            $version=(string)($data["Version"]??"");
            echo "ETSY_PLUGIN_VERSION=".$version.PHP_EOL;
            if(version_compare($version,"1.4.7","<") || !class_exists("Drielo_Etsy_Sync")) exit(2);

            $sync=Drielo_Etsy_Sync::instance();
            $ref=new ReflectionClass($sync);
            $snapshot_method=$ref->getMethod("sync_run_snapshot"); $snapshot_method->setAccessible(true);
            $set_state=$ref->getMethod("set_batch_product_state"); $set_state->setAccessible(true);
            $refresh=$ref->getMethod("refresh_sync_run"); $refresh->setAccessible(true);

            $snapshot=$snapshot_method->invoke($sync);
            if(!empty($snapshot["active"])){
              fwrite(STDERR,"ACTIVE_BATCH_EXISTS id=".($snapshot["id"]??"")." pending=".($snapshot["pending"]??0).PHP_EOL);
              exit(3);
            }

            $ids=get_posts(array(
              "post_type"=>"product",
              "post_status"=>array("publish","draft","private","pending"),
              "posts_per_page"=>-1,
              "fields"=>"ids",
              "orderby"=>"ID",
              "order"=>"ASC"
            ));

            $selected=array();
            $bytech=array("CS"=>0,"C2C"=>0,"TC"=>0,"LH"=>0);
            $already_linked=0;
            $to_create=0;

            foreach($ids as $id){
              $p=wc_get_product($id); if(!$p) continue;
              $sku=(string)$p->get_sku();
              if(!preg_match("/-(CS|C2C|TC|LH)$/",$sku,$m)) continue;
              $code=$m[1];

              update_post_meta($id,"_drielo_etsy_enabled","yes");
              update_post_meta($id,"_drielo_etsy_target_state","active");

              $selected[]=(int)$id;
              $bytech[$code]++;
              if(absint(get_post_meta($id,"_drielo_etsy_listing_id",true))) $already_linked++;
              else $to_create++;
            }

            if(!$selected){
              fwrite(STDERR,"NO_PRODUCTS".PHP_EOL);
              exit(4);
            }

            $batch=wp_generate_uuid4();
            $run=array(
              "id"=>$batch,
              "mode"=>"safe",
              "product_ids"=>$selected,
              "started_at"=>current_time("mysql"),
              "started_by"=>0,
              "status"=>"queued",
              "completed_at"=>"",
              "updated_at"=>current_time("mysql")
            );
            update_option("drielo_etsy_sync_run",$run,false);

            $queued=0;$failed=0;
            foreach($selected as $id){
              $args=array((int)$id,0,$batch);
              delete_post_meta($id,"_drielo_etsy_batch_id");
              delete_post_meta($id,"_drielo_etsy_batch_state");
              delete_post_meta($id,"_drielo_etsy_batch_message");
              delete_post_meta($id,"_drielo_etsy_batch_updated_at");
              $set_state->invoke($sync,(int)$id,$batch,"queued","Pendiente de procesamiento.");

              $scheduled=false;
              if(function_exists("as_enqueue_async_action")){
                $action_id=as_enqueue_async_action("drielo_etsy_sync_product_async",$args,"drielo-etsy",true);
                $scheduled=!empty($action_id);
                if(!$scheduled && function_exists("as_has_scheduled_action")){
                  $scheduled=(bool)as_has_scheduled_action("drielo_etsy_sync_product_async",$args,"drielo-etsy");
                }
              }else{
                $scheduled=wp_schedule_single_event(time()+1,"drielo_etsy_sync_product_async",$args);
              }

              if($scheduled){
                update_post_meta($id,"_drielo_etsy_queue_state","queued-safe");
                $queued++;
              }else{
                update_post_meta($id,"_drielo_etsy_queue_state","failed");
                update_post_meta($id,"_drielo_etsy_last_error","No se pudo añadir el producto a la cola de sincronización.");
                $set_state->invoke($sync,(int)$id,$batch,"failed","No se pudo añadir el producto a la cola de sincronización.");
                $failed++;
              }
            }

            $refresh->invoke($sync,$batch);

            echo "BATCH=".$batch.PHP_EOL;
            echo "TOTAL=".count($selected).PHP_EOL;
            echo "BY_TECH=".wp_json_encode($bytech).PHP_EOL;
            echo "ALREADY_LINKED=".$already_linked.PHP_EOL;
            echo "TO_CREATE=".$to_create.PHP_EOL;
            echo "QUEUED=".$queued.PHP_EOL;
            echo "QUEUE_FAILED=".$failed.PHP_EOL;

            if($failed>0) exit(5);
          '
          REMOTE

name: Patch Etsy automatic shop config
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-etsy-autoconfig.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch automatic Shop ID and taxonomy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/etsy-auto /tmp/etsy-old.zip /tmp/etsy-new.zip
          base64 --decode plugins/drielo-etsy-sync-1.0.0.zip.b64 > /tmp/etsy-old.zip
          unzip -q /tmp/etsy-old.zip -d /tmp/etsy-auto
          FILE=/tmp/etsy-auto/drielo-etsy-sync/drielo-etsy-sync.php

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path=Path(sys.argv[1])
          text=path.read_text()

          text=text.replace(" * Version: 1.0.1"," * Version: 1.0.2",1)
          text=text.replace("const VERSION = '1.0.1';","const VERSION = '1.0.2';",1)

          old="'taxonomy_id'      => '',"
          new="'taxonomy_id'      => 6343,"
          if old not in text:
              raise SystemExit("taxonomy default marker not found")
          text=text.replace(old,new,1)

          old_return="""        return wp_parse_args( get_option( self::OPTION_SETTINGS, [] ), $defaults );
              }
          """
          new_return="""        $settings = wp_parse_args( get_option( self::OPTION_SETTINGS, [] ), $defaults );
                  if ( empty( $settings['taxonomy_id'] ) ) {
                      $settings['taxonomy_id'] = 6343;
                  }
                  return $settings;
              }
          """
          if old_return not in text:
              raise SystemExit("settings return marker not found")
          text=text.replace(old_return,new_return,1)

          marker="""    private function is_connected() {
                  $settings = $this->settings();
                  $tokens   = $this->tokens();
                  return ! empty( $settings['api_key'] ) && ! empty( $settings['shared_secret'] ) && ! empty( $tokens['refresh_token'] );
              }
          """
          helper=marker+"""
          
              private function ensure_shop_identity() {
                  $settings = $this->settings();
                  if ( ! empty( $settings['shop_id'] ) ) {
                      return $settings;
                  }
          
                  $tokens  = $this->tokens();
                  $user_id = preg_replace( '/\\D+/', '', (string) ( $tokens['user_id'] ?? '' ) );
                  if ( ! $user_id && ! empty( $tokens['access_token'] ) && strpos( $tokens['access_token'], '.' ) !== false ) {
                      $user_id = preg_replace( '/\\D+/', '', (string) strtok( $tokens['access_token'], '.' ) );
                  }
                  if ( ! $user_id ) {
                      return $settings;
                  }
          
                  $shop = $this->etsy_request( 'GET', '/v3/application/users/' . rawurlencode( $user_id ) . '/shops', [], false );
                  if ( ! is_wp_error( $shop ) && ! empty( $shop['shop_id'] ) ) {
                      $settings['shop_id']   = (string) absint( $shop['shop_id'] );
                      $settings['shop_name'] = sanitize_text_field( $shop['shop_name'] ?? '' );
                      update_option( self::OPTION_SETTINGS, $settings, false );
                  }
          
                  return $settings;
              }
          """
          if marker not in text:
              raise SystemExit("is_connected marker not found")
          text=text.replace(marker,helper,1)

          old_sync="""        $settings = $this->settings();
                  if ( empty( $settings['shop_id'] ) ) {
          """
          new_sync="""        $settings = $this->ensure_shop_identity();
                  if ( empty( $settings['shop_id'] ) ) {
          """
          # replace only the occurrence inside sync_product by anchoring after method
          idx=text.find("    private function sync_product( $product_id )")
          if idx < 0:
              raise SystemExit("sync_product not found")
          tail=text[idx:]
          if old_sync not in tail:
              raise SystemExit("sync settings block not found")
          tail=tail.replace(old_sync,new_sync,1)
          text=text[:idx]+tail

          text=text.replace(
              '<tr><th>Taxonomy ID</th><td><input type="number" name="settings[taxonomy_id]" value="<?php echo esc_attr( $settings[\'taxonomy_id\'] ); ?>" class="regular-text" min="1" /></td></tr>',
              '<tr><th>Taxonomy Etsy</th><td><input type="number" name="settings[taxonomy_id]" value="<?php echo esc_attr( $settings[\'taxonomy_id\'] ); ?>" class="regular-text" min="1" /><p class="description">Drielo usa por defecto 6343 · Craft Supplies &amp; Tools → Patterns &amp; How To → Patterns &amp; Blueprints.</p></td></tr>',
              1
          )

          path.write_text(text)
          PY

          php -l "$FILE"
          grep -n "Version: 1.0.2\|taxonomy_id.*6343\|function ensure_shop_identity\|ensure_shop_identity" "$FILE"
          (
            cd /tmp/etsy-auto
            zip -qr /tmp/etsy-new.zip drielo-etsy-sync
          )
          base64 -w 0 /tmp/etsy-new.zip > plugins/drielo-etsy-sync-1.0.0.zip.b64
          printf '\n' >> plugins/drielo-etsy-sync-1.0.0.zip.b64

      - name: Commit plugin update
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-etsy-autoconfig.yml
          git config user.name "Drielo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add plugins/drielo-etsy-sync-1.0.0.zip.b64 .github/workflows/patch-etsy-autoconfig.yml
          git commit -m "Auto-detect Etsy shop and default pattern taxonomy"
          git push

name: Force Cross Stitch web price

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-cross-stitch-web-price.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/drielo_cs_web_key
          chmod 600 ~/.ssh/drielo_cs_web_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Force 2.99 on every Cross Stitch product
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/drielo_cs_web_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if docker inspect make-wp >/dev/null 2>&1; then DOCKER=(docker); else DOCKER=(sudo -n docker); fi
          "${DOCKER[@]}" exec make-wp php -d memory_limit=768M -r '
            require "/var/www/html/wp-load.php";
            $ids=get_posts(array(
              "post_type"=>"product",
              "post_status"=>array("publish","draft","private","pending"),
              "posts_per_page"=>-1,
              "fields"=>"ids"
            ));
            $count=0;$bad=array();
            foreach($ids as $id){
              $p=wc_get_product($id);
              if(!$p) continue;
              $sku=(string)$p->get_sku();
              $tech=(string)get_post_meta($id,"_drielo_technique",true);
              if(!preg_match("/-CS$/",$sku) && $tech!=="cross-stitch") continue;
              $p->set_regular_price("2.99");
              $p->set_sale_price("");
              $p->set_price("2.99");
              $p->save();
              wc_delete_product_transients($id);
              $count++;
            }
            foreach($ids as $id){
              $p=wc_get_product($id);
              if(!$p) continue;
              $sku=(string)$p->get_sku();
              $tech=(string)get_post_meta($id,"_drielo_technique",true);
              if(!preg_match("/-CS$/",$sku) && $tech!=="cross-stitch") continue;
              if(abs((float)$p->get_regular_price("edit")-2.99)>0.001) $bad[]=$sku;
            }
            echo "CROSS_STITCH_UPDATED=".$count.PHP_EOL;
            echo "BAD=".wp_json_encode($bad).PHP_EOL;
            if($count<1 || $bad) exit(2);
          '
          REMOTE

name: TEMP install Baby Nursery design reference

on:
  push:
    branches: [main]
    paths:
      - 'tmp/baby-nursery-reference/READY'

permissions:
  contents: write

concurrency:
  group: drielo-baby-nursery-reference-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild approved visual reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/pattern-system/collections/baby-nursery/assets
          cat tmp/baby-nursery-reference/part* | base64 -d > content/pattern-system/collections/baby-nursery/assets/design-reference-master.avif
          test "$(stat -c%s content/pattern-system/collections/baby-nursery/assets/design-reference-master.avif)" = "76829"
          echo "85d686cc53f4a851f987503608cadec85028dbe797f7965a96e43acd4755b77e  content/pattern-system/collections/baby-nursery/assets/design-reference-master.avif" | sha256sum -c -

      - name: Mark reference as canonical
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('content/pattern-system/collections/baby-nursery/collection.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['design_reference'] = {
              'asset': 'collections/baby-nursery/assets/design-reference-master.avif',
              'status': 'approved',
              'purpose': 'Canonical visual reference for Baby & Nursery redesign and pattern regeneration.',
              'source_dimensions_px': {'width': 1536, 'height': 1024},
              'background': 'white',
              'target_cross_stitch_actual_stitches': '4500-8000 depending on motif complexity',
              'notes': 'Use the approved visual language and fine stitch density; do not force every motif to the same stitch count.'
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit installed reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/baby-nursery-reference
          rm -f .github/workflows/tmp-install-baby-nursery-reference.yml
          git config user.name 'Drielo Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add content/pattern-system/collections/baby-nursery
          git add -u .github/workflows tmp/baby-nursery-reference || true
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Add approved Baby Nursery design reference [skip ci]'
          git push origin HEAD:main

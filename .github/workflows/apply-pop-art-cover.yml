name: Apply Pop Art collection cover

on:
  push:
    paths:
      - ".github/tmp/pop-art-cover/**"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage Pop Art collection cover'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build cover and update catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/products/assets
          cat .github/tmp/pop-art-cover/part-* > content/products/assets/pop-art-25-collection-cover.webp
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("content/products/catalog.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          found = False
          for c in data.get("collections", []):
              if c.get("slug") == "pop-art-25":
                  c["cover_asset"] = "assets/pop-art-25-collection-cover.webp"
                  found = True
                  break
          if not found:
              raise SystemExit("Pop Art collection not found")
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          test -s content/products/assets/pop-art-25-collection-cover.webp
          file content/products/assets/pop-art-25-collection-cover.webp
          git rm -r .github/tmp/pop-art-cover
          git rm .github/workflows/apply-pop-art-cover.yml
          git add content/products/catalog.json content/products/assets/pop-art-25-collection-cover.webp

      - name: Commit and push final cover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Pop Art collection cover"
          git pull --rebase origin main
          git push origin HEAD:main

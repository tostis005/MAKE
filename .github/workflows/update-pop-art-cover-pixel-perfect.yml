name: Update Pop Art collection cover pixel-perfect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-pop-art-cover-pixel-perfect.yml"

permissions:
  contents: write

jobs:
  update-cover:
    if: github.event.head_commit.message == 'Update Pop Art collection cover from approved pixel-perfect image'
    runs-on: ubuntu-latest
    env:
      ASSET: content/products/assets/pop-art-25-collection-cover.webp
      EXPECTED_SHA256: c17734f1669683a00f3b152a6a8b40fe66a734858213749bac831c332ad3e438
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact approved PNG
        shell: bash
        env:
          SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-7534-820e-9f93-5c75042976eb/raw?se=2026-09-27T18%3A57%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=af240cdb-6b82-5f1a-995a-fc59a284dc47&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T13%3A45%3A10Z&ske=2026-09-28T13%3A45%3A10Z&sks=b&skv=2026-02-06&sig=ZTTggE0JbqGCWj9Ue3Y2B0RECYnHhy8vvxAdy0kSIOU%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$SOURCE_URL" -o /tmp/pop-art-cover.png
          echo "$EXPECTED_SHA256  /tmp/pop-art-cover.png" | sha256sum -c -

      - name: Convert to lossless WebP and verify pixels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageChops
          src = Image.open('/tmp/pop-art-cover.png').convert('RGBA')
          assert src.size == (1536, 1478), src.size
          out = '/tmp/pop-art-cover.webp'
          src.save(out, 'WEBP', lossless=True, method=4)
          chk = Image.open(out).convert('RGBA')
          assert chk.size == src.size
          assert ImageChops.difference(src, chk).getbbox() is None, 'WebP pixel mismatch'
          print('Pixel-perfect lossless WebP verified:', chk.size)
          PY

      - name: Replace asset directly through GitHub API
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$ASSET" --jq .sha)"
          export CURRENT_SHA
          python - <<'PY'
          import base64, json, os
          payload = {
              "message": "Update Pop Art collection cover asset",
              "content": base64.b64encode(open('/tmp/pop-art-cover.webp','rb').read()).decode('ascii'),
              "sha": os.environ["CURRENT_SHA"],
              "branch": "main",
          }
          with open('/tmp/payload.json','w',encoding='utf-8') as f:
              json.dump(payload, f, separators=(',', ':'))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$ASSET" --input /tmp/payload.json --jq '{commit_sha:.commit.sha,content_sha:.content.sha}'

name: Update Pop Art collection cover pixel-perfect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-pop-art-cover-pixel-perfect.yml"

permissions:
  contents: write

jobs:
  update-cover:
    if: github.event.head_commit.message == 'Update Pop Art collection cover from approved pixel-perfect image'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact approved PNG
        shell: bash
        env:
          SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-bb6c-820e-b9fa-7e6839765974/raw?se=2026-09-27T18%3A55%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=8c371073-3666-54b4-837e-409742e51672&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T13%3A16%3A57Z&ske=2026-09-28T13%3A16%3A57Z&sks=b&skv=2026-02-06&sig=kNJrCTO12kLDjr3Z7aWqE2om2%2BNk0sL6ZAxyruSp/NI%3D"
          EXPECTED_SHA256: "c17734f1669683a00f3b152a6a8b40fe66a734858213749bac831c332ad3e438"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$SOURCE_URL" -o /tmp/pop-art-cover.png
          echo "$EXPECTED_SHA256  /tmp/pop-art-cover.png" | sha256sum -c -

      - name: Convert to lossless WebP and verify pixels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          import numpy as np
          src = Image.open('/tmp/pop-art-cover.png').convert('RGBA')
          assert src.size == (1536, 1478), src.size
          out = 'content/products/assets/pop-art-25-collection-cover.webp'
          src.save(out, 'WEBP', lossless=True, method=4)
          chk = Image.open(out).convert('RGBA')
          assert chk.size == src.size
          assert np.array_equal(np.asarray(src), np.asarray(chk)), 'WebP pixel mismatch'
          print('Pixel-perfect lossless WebP verified:', chk.size)
          PY

      - name: Commit updated Pop Art cover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/products/assets/pop-art-25-collection-cover.webp
          if git diff --cached --quiet; then
            echo "Cover already matches approved image."
          else
            git commit -m "Update Pop Art collection cover asset"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

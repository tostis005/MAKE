name: Import validated Iconic batch 01

on:
  push:
    branches:
      - iconic-batch01-conceptual-v2
    paths:
      - 'content/pattern-system/collections/iconic-destinations/assets/iconic-batch-01-vivid-q50.zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: drielo-iconic-vivid-batch01-import
  cancel-in-progress: false

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout validated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Validate Gmail ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, zipfile
          from pathlib import Path
          from PIL import Image

          p=Path('content/pattern-system/collections/iconic-destinations/assets/iconic-batch-01-vivid-q50.zip')
          expected=[
            'D0031-paris-eiffel-tower.png',
            'D0032-london-big-ben.png',
            'D0033-rome-colosseum.png',
            'D0034-new-york-statue-liberty.png',
            'D0035-taj-mahal.png',
            'D0036-great-wall-china.png',
            'D0037-rio-christ-redeemer.png',
            'D0038-pyramids-giza.png',
            'D0039-sydney-opera-house.png',
            'D0046-cape-town-table-mountain.png',
          ]
          with zipfile.ZipFile(p,'r') as z:
              pngs=[n for n in z.namelist() if n.lower().endswith('.png')]
              if pngs != expected:
                  raise SystemExit(f'Wrong PNG members: {pngs}')
              for name in expected:
                  raw=z.read(name)
                  with Image.open(io.BytesIO(raw)) as im:
                      rgb=im.convert('RGB')
                      colours=len(set(rgb.getdata()))
                      if im.format!='PNG' or rgb.size!=(100,120) or colours!=50:
                          raise SystemExit(f'{name}: format={im.format} size={rgb.size} colours={colours}')
                      print(f'VALID {name} PNG 100x120 50-colours')
          print('GMAIL_ZIP_VALID count=10')
          PY

      - name: Import exact ZIP sources
        run: python3 .github/scripts/import_iconic_vivid_batch01.py

      - name: Validate imported source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          from PIL import Image

          root=Path('content/pattern-system')
          q=json.loads((root/'iconic_destinations'/'publish_queue.json').read_text())
          pending=[x for x in q['items'] if x.get('status')=='pending']
          held=[x for x in q['items'] if x.get('status')=='held']
          if len(pending)!=10:
              raise SystemExit(f'Expected 10 pending, got {len(pending)}')
          if len(held)!=50:
              raise SystemExit(f'Expected 50 held, got {len(held)}')
          zpath=root/q['source_zip']
          with zipfile.ZipFile(zpath,'r') as z:
              for row in pending:
                  raw=z.read(row['source_zip_member'])
                  src=root/row['input_png']
                  if raw != src.read_bytes():
                      raise SystemExit(f"{row['base_design_id']}: ZIP/input mismatch")
                  with Image.open(src) as im:
                      rgb=im.convert('RGB')
                      if rgb.size!=(100,120) or len(set(rgb.getdata()))!=50:
                          raise SystemExit(f"{row['base_design_id']}: invalid imported PNG")
          print('IMPORTED_BATCH_VALID pending=10 held=50')
          PY

      - name: Persist imported PNGs and queue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             content/pattern-system/collections/iconic-destinations/input-pngs-q50             content/pattern-system/collections/iconic-destinations/designs.json             content/pattern-system/iconic_destinations/publish_queue.json
          if git diff --cached --quiet; then
            echo "No imported source changes to commit"
          else
            git commit -m "Import validated Iconic batch 01 [skip ci]"
            git pull --rebase origin iconic-batch01-conceptual-v2
            git push origin HEAD:iconic-batch01-conceptual-v2
          fi

      - name: Start WooCommerce publication queue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/iconic-destinations-auto-publish.yml/dispatches"             -f ref=iconic-batch01-conceptual-v2
          echo "VALIDATED_ICONIC_BATCH01_PUBLICATION_STARTED"

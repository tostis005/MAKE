          curl -fsSL --retry 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8574-81f5-bd32-7964e6ebc8d9/raw?se=2026-09-24T14%3A32%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=141d4f6a-5a44-5fd6-bbbc-4c2e38ea5c91&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A41%3A08Z&ske=2026-09-25T13%3A41%3A08Z&sks=b&skv=2026-02-06&sig=qryH%2BSydx2zw9iciWs4Wnf0Z/%2BFJ6j4w2%2Bu6BFTqbEQ%3D' -o "/tmp/floral-src-6.png"

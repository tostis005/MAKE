          curl -fsSL --retry 2 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-5a20-822f-ae8b-6392cc683673/raw?se=2026-09-24T14%3A32%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=40e58175-ac36-51df-9389-ae0c65bc90ca&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A23%3A25Z&ske=2026-09-25T13%3A23%3A25Z&sks=b&skv=2026-02-06&sig=TZru%2BWAb9a40Qp4JmiRcDIEkWNmIe7uE960hNJbhqw4%3D' -o "/tmp/floral-src-8.png"
          curl -fsSL --retry 2 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-994c-81fd-9a20-3c60629ae46a/raw?se=2026-09-24T14%3A32%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=45fe084c-1c7c-5666-9d6a-27e32e299edb&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A53%3A26Z&ske=2026-09-25T12%3A53%3A26Z&sks=b&skv=2026-02-06&sig=03FwelA2p2EnQsKGd8MpfTZMIDilTeaVb7EpkpOEAG0%3D' -o "/tmp/floral-src-9.png"
          curl -fsSL --retry 2 'https://sdmntpreastus.oaiusercontent.com/files/00000000-8ee0-81f9-8b5a-de4356f19a7d/raw?se=2026-09-24T14%3A33%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=6d479539-34ad-5367-9e95-98da572d04f6&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T13%3A56%3A35Z&ske=2026-09-25T13%3A56%3A35Z&sks=b&skv=2026-02-06&sig=hQNolq3s9r73QqV1DLkpiR/i/VC9MIeZW2ZZ1LI6/pA%3D' -o "/tmp/floral-src-10.png"
          curl -fsSL --retry 2 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-8a98-820b-9d98-394c0d44fb0d/raw?se=2026-09-24T14%3A33%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=7d46e1ea-7661-5af4-aa5a-bd9d1c1278c5&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T14%3A16%3A25Z&ske=2026-09-25T14%3A16%3A25Z&sks=b&skv=2026-02-06&sig=grZHyBWwh6VGabd/xSiTJtNvj5%2BTgC9fvQvRdp13sJ4%3D' -o "/tmp/floral-src-11.png"
          curl -fsSL --retry 2 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-94b8-81f7-8221-08f57a10083a/raw?se=2026-09-24T14%3A33%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=4a1d95e8-92cc-5fa3-bfab-4eef303fcc5b&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A53%3A19Z&ske=2026-09-25T12%3A53%3A19Z&sks=b&skv=2026-02-06&sig=nHRWdq0C9mFWFd2FlpvYjXpo1WuvGYFdRIluptX7Epo%3D' -o "/tmp/floral-src-12.png"
          curl -fsSL --retry 2 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8a6c-820e-8708-29186240f5cf/raw?se=2026-09-24T14%3A33%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=97e5054f-226e-5059-b470-88f5ca5ae355&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T12%3A48%3A58Z&ske=2026-09-25T12%3A48%3A58Z&sks=b&skv=2026-02-06&sig=7yno8ZvoBRwcMhpqSsEZmHtl3SAqfFD%2BeDbMq14RfA4%3D' -o "/tmp/floral-src-13.png"
          curl -fsSL --retry 2 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-7290-8211-8340-32fc7a75ad08/raw?se=2026-09-24T14%3A33%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=dd0725b5-a76b-572f-a58a-775e50f7b115&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T14%3A01%3A39Z&ske=2026-09-25T14%3A01%3A39Z&sks=b&skv=2026-02-06&sig=f4tWr4BN7SGBaxv3Ya5Oytw/eKuCme7wxaOdSCeAqZo%3D' -o "/tmp/floral-src-14.png"

      - name: Commit binary sources directly through GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, struct, time, urllib.request, urllib.error

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GITHUB_TOKEN"]
          branch="feature/florals-pattern-generation"
          files=[
          ("content/pattern-system/collections/florals/source-designs/F0006-cherry-blossom-branch.png", "/tmp/floral-src-0.png"),
          ("content/pattern-system/collections/florals/source-designs/F0007-pink-floral-heart-wreath.png", "/tmp/floral-src-1.png"),
          ("content/pattern-system/collections/florals/source-designs/F0008-daisy-mason-jar.png", "/tmp/floral-src-2.png"),
          ("content/pattern-system/collections/florals/source-designs/F0009-eucalyptus-ribbon-bundle.png", "/tmp/floral-src-3.png"),
          ("content/pattern-system/collections/florals/source-designs/F0010-potted-strawberry-plant.png", "/tmp/floral-src-4.png"),
          ("content/pattern-system/collections/florals/source-designs/F0016-daffodil-bouquet.png", "/tmp/floral-src-5.png"),
          ("content/pattern-system/collections/florals/source-designs/F0017-lilac-twine-bouquet.png", "/tmp/floral-src-6.png"),
          ("content/pattern-system/collections/florals/source-designs/F0018-potted-lavender.png", "/tmp/floral-src-7.png"),
          ("content/pattern-system/collections/florals/source-designs/F0019-chamomile-bundle.png", "/tmp/floral-src-8.png"),
          ("content/pattern-system/collections/florals/source-designs/F0020-floral-watering-can.png", "/tmp/floral-src-9.png"),
          ("content/pattern-system/collections/florals/source-designs/F0021-hanging-pink-flower-basket.png", "/tmp/floral-src-10.png"),
          ("content/pattern-system/collections/florals/source-designs/F0022-bluebell-bouquet.png", "/tmp/floral-src-11.png"),
          ("content/pattern-system/collections/florals/source-designs/F0023-magnolia-branch.png", "/tmp/floral-src-12.png"),
          ("content/pattern-system/collections/florals/source-designs/F0024-enamel-herb-pot.png", "/tmp/floral-src-13.png"),
          ("content/pattern-system/collections/florals/source-designs/F0025-daisy-wreath.png", "/tmp/floral-src-14.png"),
          ]

          def request(method, path, payload=None):
              url="https://api.github.com/repos/"+repo+path
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,method=method)
              req.add_header("Authorization","Bearer "+token)
              req.add_header("Accept","application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version","2022-11-28")
              if data is not None:
                  req.add_header("Content-Type","application/json")
              with urllib.request.urlopen(req,timeout=60) as resp:
                  return json.loads(resp.read().decode()) if resp.length != 0 else {}

          blobs={}
          for target,local in files:
              raw=open(local,"rb").read()
              if raw[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(target+" is not PNG")
              width,height=struct.unpack(">II",raw[16:24])
              if (width,height)!=(100,120):
                  raise SystemExit(f"{target}: {(width,height)} != (100,120)")
              b64=base64.b64encode(raw).decode()
              blob=request("POST","/git/blobs",{"content":b64,"encoding":"base64"})
              blobs[target]=blob["sha"]
              print("BLOB",target,len(raw),blob["sha"])

          for attempt in range(1,8):
              ref=request("GET","/git/ref/heads/"+branch)
              parent=ref["object"]["sha"]
              commit=request("GET","/git/commits/"+parent)
              base_tree=commit["tree"]["sha"]
              tree=request("POST","/git/trees",{
                  "base_tree":base_tree,
                  "tree":[{"path":p,"mode":"100644","type":"blob","sha":s} for p,s in blobs.items()]
              })
              new_commit=request("POST","/git/commits",{
                  "message":"Import remaining approved Florals 100x120 sources [skip ci]",
                  "tree":tree["sha"],
                  "parents":[parent]
              })
              try:
                  request("PATCH","/git/refs/heads/"+branch,{"sha":new_commit["sha"],"force":False})
                  print("COMMITTED",new_commit["sha"])
                  break
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422) or attempt==7:
                      raise
                  print("REF_MOVED_RETRY",attempt)
                  time.sleep(2)
          PY

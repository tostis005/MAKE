name: TEMP Direct Import Missing Florals Sources
on:
  push:
    branches: [feature/florals-pattern-generation]
    paths: ['.github/workflows/tmp-import-florals-missing-direct.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drielo-florals-direct-source-import
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download approved missing sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-6c78-8206-bdde-65cd9abab146/raw?se=2026-09-24T14%3A32%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=982ec50a-c5e3-5637-8963-1d47b335cd09&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T14%3A13%3A21Z&ske=2026-09-25T14%3A13%3A21Z&sks=b&skv=2026-02-06&sig=OIMCfPUA0BdtRDsrdU2fu%2B6U6wKh316uliN/%2BOZ%2Bx0s%3D' -o "/tmp/floral-src-0.png"

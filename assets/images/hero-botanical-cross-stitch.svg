<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
<title id="title">Botanical cross-stitch in an embroidery hoop</title>
<desc id="desc">A delicate botanical cross-stitch motif. Every X is centered inside one square of the fabric grid and no stitches overlap.</desc>
<defs>
  <pattern id="aida" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#FFF9F2"/>
    <path d="M24 0H0V24" fill="none" stroke="#E3D5D1" stroke-width="1.1"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#694D55" flood-opacity=".18"/>
  </filter>
<g id="st-red" fill="none" stroke="#B9657D" stroke-width="5.5" stroke-linecap="round"><path d="M-6 -6 L6 6"/><path d="M6 -6 L-6 6"/></g>
<g id="st-pink" fill="none" stroke="#D89AAC" stroke-width="5.5" stroke-linecap="round"><path d="M-6 -6 L6 6"/><path d="M6 -6 L-6 6"/></g>
<g id="st-plum" fill="none" stroke="#744F6B" stroke-width="5.5" stroke-linecap="round"><path d="M-6 -6 L6 6"/><path d="M6 -6 L-6 6"/></g>
<g id="st-green" fill="none" stroke="#8DA286" stroke-width="5.5" stroke-linecap="round"><path d="M-6 -6 L6 6"/><path d="M6 -6 L-6 6"/></g>
<g id="st-sage" fill="none" stroke="#B8C4AE" stroke-width="5.5" stroke-linecap="round"><path d="M-6 -6 L6 6"/><path d="M6 -6 L-6 6"/></g>
<g id="st-gold" fill="none" stroke="#D8B46B" stroke-width="5.5" stroke-linecap="round"><path d="M-6 -6 L6 6"/><path d="M6 -6 L-6 6"/></g>
</defs>

<g filter="url(#shadow)">
  <circle cx="378" cy="382" r="294" fill="#C28A61"/>
  <circle cx="378" cy="382" r="271" fill="url(#aida)" stroke="#E2B58D" stroke-width="8"/>
  <rect x="335" y="77" width="86" height="38" rx="8" fill="#B87953"/>
  <rect x="353" y="50" width="50" height="43" rx="10" fill="#D5A77E"/>
</g>

<!-- True grid-based cross stitch: one centered X per occupied square. -->
<g>
  <use href="#st-pink" transform="translate(372 228)"/>
  <use href="#st-pink" transform="translate(348 252)"/>
  <use href="#st-red" transform="translate(372 252)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
<title id="title">Botanical cross-stitch in an embroidery hoop</title>
<desc id="desc">A delicate floral cross-stitch motif in dusty rose, plum and sage inside a wooden hoop.</desc>
<defs>
  <pattern id="aida" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#FFF9F2"/>
    <path d="M18 0H0V18" fill="none" stroke="#E8DCD4" stroke-width="1"/>
    <circle cx="9" cy="9" r="1.1" fill="#E0D0C8"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#694D55" flood-opacity=".18"/>
  </filter>
  <g id="xr" stroke="#B9657D" stroke-width="7" stroke-linecap="round"><path d="M-6-6 6 6M6-6-6 6"/></g>
  <g id="xl" stroke="#D89AAC" stroke-width="7" stroke-linecap="round"><path d="M-6-6 6 6M6-6-6 6"/></g>
  <g id="xp" stroke="#744F6B" stroke-width="7" stroke-linecap="round"><path d="M-6-6 6 6M6-6-6 6"/></g>
  <g id="xg" stroke="#8DA286" stroke-width="7" stroke-linecap="round"><path d="M-6-6 6 6M6-6-6 6"/></g>
  <g id="xgs" stroke="#B8C4AE" stroke-width="7" stroke-linecap="round"><path d="M-6-6 6 6M6-6-6 6"/></g>
  <g id="xc" stroke="#D8B46B" stroke-width="7" stroke-linecap="round"><path d="M-6-6 6 6M6-6-6 6"/></g>
</defs>

<g filter="url(#shadow)">
  <circle cx="378" cy="382" r="294" fill="#C28A61"/>
  <circle cx="378" cy="382" r="271" fill="url(#aida)" stroke="#E2B58D" stroke-width="8"/>
  <path d="M335 77h86v38h-86z" rx="8" fill="#B87953"/>
  <rect x="353" y="50" width="50" height="43" rx="10" fill="#D5A77E"/>
</g>

<!-- stems -->
<g>
  <use href="#xg" transform="translate(378 520)"/><use href="#xg" transform="translate(378 500)"/>
  <use href="#xg" transform="translate(378 480)"/><use href="#xg" transform="translate(378 460)"/>
  <use href="#xg" transform="translate(378 440)"/><use href="#xg" transform="translate(378 420)"/>
  <use href="#xg" transform="translate(378 400)"/><use href="#xg" transform="translate(378 380)"/>
  <use href="#xg" transform="translate(378 360)"/><use href="#xg" transform="translate(378 340)"/>

  <use href="#xg" transform="translate(358 440)"/><use href="#xg" transform="translate(338 420)"/>
  <use href="#xg" transform="translate(318 400)"/><use href="#xg" transform="translate(298 380)"/>
  <use href="#xg" transform="translate(398 455)"/><use href="#xg" transform="translate(418 435)"/>
  <use href="#xg" transform="translate(438 415)"/><use href="#xg" transform="translate(458 395)"/>
</g>

<!-- sage leaves -->
<g>
  <use href="#xgs" transform="translate(340 455)"/><use href="#xgs" transform="translate(322 455)"/><use href="#xg" transform="translate(304 455)"/>
  <use href="#xgs" transform="translate(416 470)"/><use href="#xgs" transform="translate(434 470)"/><use href="#xg" transform="translate(452 470)"/>
  <use href="#xgs" transform="translate(320 405)"/><use href="#xg" transform="translate(300 405)"/><use href="#xgs" transform="translate(282 405)"/>
  <use href="#xgs" transform="translate(436 420)"/><use href="#xg" transform="translate(456 420)"/><use href="#xgs" transform="translate(474 420)"/>
  <use href="#xg" transform="translate(358 385)"/><use href="#xgs" transform="translate(340 372)"/>
  <use href="#xg" transform="translate(398 395)"/><use href="#xgs" transform="translate(416 382)"/>
</g>

<!-- main rose flower -->
<g>
  <use href="#xp" transform="translate(378 276)"/>
  <use href="#xr" transform="translate(358 276)"/><use href="#xr" transform="translate(398 276)"/>
  <use href="#xr" transform="translate(378 256)"/><use href="#xr" transform="translate(378 296)"/>
  <use href="#xl" transform="translate(358 256)"/><use href="#xl" transform="translate(398 256)"/>
  <use href="#xl" transform="translate(358 296)"/><use href="#xl" transform="translate(398 296)"/>
  <use href="#xl" transform="translate(338 276)"/><use href="#xl" transform="translate(418 276)"/>
  <use href="#xc" transform="translate(378 276)"/>
</g>

<!-- left small flower -->
<g>
  <use href="#xp" transform="translate(286 350)"/>
  <use href="#xr" transform="translate(266 350)"/><use href="#xr" transform="translate(306 350)"/>
  <use href="#xl" transform="translate(286 330)"/><use href="#xl" transform="translate(286 370)"/>
  <use href="#xc" transform="translate(286 350)"/>
</g>

<!-- right small flower -->
<g>
  <use href="#xp" transform="translate(470 365)"/>
  <use href="#xr" transform="translate(450 365)"/><use href="#xr" transform="translate(490 365)"/>
  <use href="#xl" transform="translate(470 345)"/><use href="#xl" transform="translate(470 385)"/>
  <use href="#xc" transform="translate(470 365)"/>
</g>

<!-- tiny buds -->
<g>
  <use href="#xr" transform="translate(330 320)"/><use href="#xl" transform="translate(316 306)"/>
  <use href="#xr" transform="translate(430 325)"/><use href="#xl" transform="translate(444 311)"/>
  <use href="#xp" transform="translate(286 465)"/><use href="#xl" transform="translate(270 449)"/>
  <use href="#xp" transform="translate(488 455)"/><use href="#xl" transform="translate(504 439)"/>
</g>

<!-- loose stitches -->
<g opacity=".72">
  <use href="#xl" transform="translate(240 500)"/><use href="#xgs" transform="translate(520 505)"/>
  <use href="#xc" transform="translate(535 330)"/><use href="#xl" transform="translate(225 335)"/>
</g>
</svg>
.fact-card small{white-space:pre-line}

/* Footer URL: exact horizontal centering on the A4 page */
.footer{
  left:9mm!important;
  right:9mm!important;
  position:absolute;
}
.footer .url{
  position:absolute!important;
  left:50%!important;
  transform:translateX(-50%)!important;
  z-index:2;
  background:var(--paper);
  padding:0 3mm;
  text-align:center;
  text-decoration:none;
  color:inherit;
  cursor:pointer;
}
.footer .page-no{
  margin-left:auto;
  position:relative;
  z-index:3;
}

/* ============================================================
   DRIELO MASTER TEMPLATE - PDF PARITY FIXES
   These rules intentionally override only small rendering details.
   ============================================================ */
@media print{
  html,body{background:#faeef0!important}
  .page{margin:0!important;box-shadow:none!important}
}
.page{isolation:isolate}
.topbar,.footer{font-variant-numeric:tabular-nums}
.sym-chip{
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  text-align:center!important;
  line-height:1!important;
  padding:0!important;
  vertical-align:middle!important;
}
.palette{align-items:center}
.palette::before,.palette::after,.palette i::before,.palette i::after{content:none!important;display:none!important}
.palette i{display:block;flex:0 0 6mm;margin:0!important}
.thread-table{table-layout:fixed}
.thread-table th:nth-child(1),.thread-table td:nth-child(1){width:17mm;text-align:center}
.thread-table th:nth-child(2),.thread-table td:nth-child(2){width:19mm}
.thread-table th:nth-child(4),.thread-table td:nth-child(4){width:20mm;text-align:right}
.thread-table th:nth-child(5),.thread-table td:nth-child(5){width:31mm}
.thread-table td{vertical-align:middle}
.thread-table .sym-chip{margin:auto}
.thread-table .thread-swatch{margin-left:auto;margin-right:auto}
.chart-panel img,.detail-box img,.finished-wrap img,.facts-preview img,.layout-visual img{
  image-rendering:auto;
}
.detail-box{overflow:visible}
.chart-panel{overflow:visible}
.floral img{object-fit:contain}
@supports (font-variant-numeric: tabular-nums){
  .thread-table,.detail-box,.detail-meta{font-variant-numeric:tabular-nums}
}


/* DRIELO collection-aware vector frame overlay */
.hero-photo{position:relative}
.hero-photo>#cover-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.hero-frame-layer{position:absolute;z-index:2;overflow:hidden;display:flex;align-items:center;justify-content:center;pointer-events:none;transform-origin:0 0}
.hero-frame-fabric{position:absolute;inset:0;background-color:#f7f3ea;background-image:none;z-index:1}
.hero-frame-stitches{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
.hero-frame-stitches svg{display:block;max-width:100%;max-height:100%;overflow:visible}
</style>

   - title / subtitle

   - cover_image (lifestyle/mockup image)

- Do not hand-edit chart images: they are generated from matrix[].
- Detail chart rulers are generated once on TOP and LEFT only.

<div id="book"></div>

<script>
(function(){
"use strict";

const data = JSON.parse(document.getElementById("template-pattern-data").textContent);
const assets = JSON.parse(document.getElementById("template-assets").textContent);

const threadsBySymbol = Object.fromEntries(data.threads.map(t => [t.symbol, t]));
const W = Number(data.stitch_width);
const H = Number(data.stitch_height);
const MATRIX = data.matrix;
const WEBSITE = data.website || "www.drielo.com";
const CODE = data.product_code || "P-0000";
const PAGE_TOTAL = 17;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
}
function fmt(n) {
  return Number(n).toLocaleString("en-US");
}
function sizeFor(count) {
  return {
    inW: W / count, inH: H / count,
    cmW: W / count * 2.54, cmH: H / count * 2.54
  };
}
function pageNo(n) { return String(n).padStart(2,"0"); }
function svgData(svg) { return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }

function common(page, content, extraClass="") {
  return `<section class="page ${extraClass}">
    <div class="topbar"><span class="code">${esc(CODE)}</span><span class="rule"></span></div>
    <div class="floral tr"><img data-floral/></div>
    <div class="floral bl"><img data-floral/></div>
    ${content}
    <div class="footer"><span class="rule"></span><a class="url" href="https://www.drielo.com" target="_blank" rel="noopener">${esc(WEBSITE)}</a><span class="rule"></span><span class="page-no">${pageNo(page)}</span></div>
  </section>`;
}

function threadColor(symbol) {
  const t = threadsBySymbol[symbol];
  return t ? t.color : "#ffffff";
}
function luminance(hex) {
  let h = String(hex || "#ffffff").replace("#","");
  if (h.length === 3) h = h.split("").map(x=>x+x).join("");
  const rgb = [0,2,4].map(i => parseInt(h.slice(i,i+2),16)/255).map(v => v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4));
  return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];
}
function symbolInk(hex) { return luminance(hex) < .38 ? "#ffffff" : "#2e1d27"; }


function stitchSeed() {
  let h = 2166136261 >>> 0;
  const s = String(CODE || "DRIELO");
  for (let i=0; i<s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}
const STITCH_SEED = stitchSeed();

function stitchHash(x,y,salt=0) {
  let h = (
    STITCH_SEED ^
    Math.imul((x+1)|0, 374761393) ^
    Math.imul((y+1)|0, 668265263) ^
    Math.imul((salt+1)|0, 1442695041)
  ) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 1274126177) >>> 0;
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}

function parseHexColour(hex) {
  let h=String(hex || "#ffffff").replace("#","");
  if (h.length===3) h=h.split("").map(c=>c+c).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(h)) h="ffffff";
  return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
}
function rgbHexColour(rgb) {
  return "#" + rgb.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("").toUpperCase();
}
function mixColour(a,b,t) {
  const aa=parseHexColour(a), bb=parseHexColour(b), k=Math.max(0,Math.min(1,Number(t)||0));
  return rgbHexColour(aa.map((v,i)=>v+(bb[i]-v)*k));
}
function desaturateColour(hex,amount) {
  const c=parseHexColour(hex), k=Math.max(0,Math.min(1,Number(amount)||0));
  const g=.2126*c[0]+.7152*c[1]+.0722*c[2];
  return rgbHexColour(c.map(v=>v+(g-v)*k));
}
function darkenColour(hex,amount) {
  const c=parseHexColour(hex), k=1-Math.max(0,Math.min(1,Number(amount)||0));
  return rgbHexColour(c.map(v=>v*k));
}
function lightenColour(hex,amount) {
  return mixColour(hex,"#FFFFFF",Math.max(0,Math.min(1,Number(amount)||0)));
}
function colourLum255(hex) {
  const c=parseHexColour(hex);
  return .2126*c[0]+.7152*c[1]+.0722*c[2];
}
function pushGrouped(map,key,cmd) {
  if (!map.has(key)) map.set(key,[]);
  map.get(key).push(cmd);
}
function realisticStitchRules() {
  const root=data.preview_rules || {};
  const r=root.realistic_stitch || {};
  const n=(v,d)=>Number.isFinite(Number(v))?Number(v):d;
  return {
    fabric: root.fabric || {color:"#FBFAF6",dot:"#DDD8CF",dot_radius:.05},
    cross_margin:n(r.cross_margin,0.065),
    shadow_stroke:n(r.shadow_stroke,0.38),
    lower_stroke:n(r.lower_stroke,0.305),
    upper_stroke:n(r.upper_stroke,0.315),
    highlight_stroke:n(r.highlight_stroke,0.060),
    vertical_aida:r.vertical_aida || "#D1D1C9",
    horizontal_neutral:r.horizontal_neutral || "#3F3F3B",
    vertical_widths:Array.isArray(r.vertical_widths)?r.vertical_widths:[0.032,0.041,0.050],
    horizontal_widths:Array.isArray(r.horizontal_widths)?r.horizontal_widths:[0.050,0.061,0.072]
  };
}
function verticalSeamColour(base, neighbour, aida) {
  const reflected=mixColour(base,neighbour || base,.45);
  const muted=desaturateColour(reflected,.76);
  let out=mixColour(muted,aida,.43);
  const target=Math.min(216,colourLum255(reflected)+12);
  const current=colourLum255(out);
  if (current<target) out=lightenColour(out,Math.min(.14,(target-current)/140));
  return out;
}
function horizontalSeamColour(base, neighbour, neutral) {
  const reflected=mixColour(base,neighbour || base,.42);
  let out=desaturateColour(reflected,.19);
  out=darkenColour(out,.40);
  out=mixColour(out,neutral,.07);
  return out;
}

function stitchedSvg(matrix=MATRIX, x0=0, y0=0, x1=W, y1=H, transparent=false) {
  const vw=x1-x0, vh=y1-y0;
  const rules=realisticStitchRules();
  const baseGroups=new Map();
  const shadowGroups=new Map();
  const lowerGroups=new Map();
  const upperGroups=new Map();
  const highlightGroups=new Map();
  const verticalGroups=new Map();
  const horizontalGroups=new Map();

  for (let y=y0; y<y1; y++) {
    for (let x=x0; x<x1; x++) {
      const symbol=matrix[y]?.[x];
      if (!symbol) continue;
      const base=threadColor(symbol);
      const lx=x-x0, ly=y-y0;

      pushGrouped(baseGroups,symbol,"M"+lx+" "+ly+"h1v1h-1Z");

      const h0=stitchHash(x,y,0), h1=stitchHash(x,y,1), h2=stitchHash(x,y,2), h3=stitchHash(x,y,3);
      const m=Math.max(.038,Math.min(.095,rules.cross_margin+(h0-.5)*.028));
      const e=1-m;
      const ja=(h1-.5)*.032, jb=(h2-.5)*.032, jc=(h3-.5)*.026;

      const a1x=lx+m, a1y=ly+m+ja, a2x=lx+e, a2y=ly+e+jb;
      const b1x=lx+e, b1y=ly+m+jc, b2x=lx+m, b2y=ly+e-ja;
      const shadowOff=.015+(h2*.012);

      pushGrouped(shadowGroups,symbol,
        "M"+a1x.toFixed(3)+" "+(a1y+shadowOff).toFixed(3)+"L"+a2x.toFixed(3)+" "+(a2y+shadowOff).toFixed(3)+
        " M"+b1x.toFixed(3)+" "+(b1y+shadowOff).toFixed(3)+"L"+b2x.toFixed(3)+" "+(b2y+shadowOff).toFixed(3)
      );
      pushGrouped(lowerGroups,symbol,
        "M"+a1x.toFixed(3)+" "+a1y.toFixed(3)+"L"+a2x.toFixed(3)+" "+a2y.toFixed(3)
      );
      pushGrouped(upperGroups,symbol,
        "M"+b1x.toFixed(3)+" "+b1y.toFixed(3)+"L"+b2x.toFixed(3)+" "+b2y.toFixed(3)
      );
      pushGrouped(highlightGroups,symbol,
        "M"+b1x.toFixed(3)+" "+b1y.toFixed(3)+"L"+b2x.toFixed(3)+" "+b2y.toFixed(3)
      );

      const leftSymbol=matrix[y]?.[x-1] || symbol;
      const aboveSymbol=matrix[y-1]?.[x] || symbol;
      const vBucket=Math.min(2,Math.floor(stitchHash(x,y,4)*3));
      const hBucket=Math.min(2,Math.floor(stitchHash(x,y,5)*3));
      const vColour=verticalSeamColour(base,threadColor(leftSymbol),rules.vertical_aida);
      const hColour=horizontalSeamColour(base,threadColor(aboveSymbol),rules.horizontal_neutral);

      const vx=lx+(stitchHash(x,y,6)-.5)*.026;
      const bend1=(stitchHash(x,y,7)-.5)*.036;
      const bend2=(stitchHash(x,y,8)-.5)*.036;
      const yStart=ly+.115+stitchHash(x,y,9)*.035;
      const yMid1=ly+.405+(stitchHash(x,y,10)-.5)*.045;
      const yMid2=ly+.585+(stitchHash(x,y,11)-.5)*.045;
      const yEnd=ly+.885-stitchHash(x,y,12)*.035;
      const vCmd=
        "M"+vx.toFixed(3)+" "+yStart.toFixed(3)+
        "C"+(vx+bend1).toFixed(3)+" "+(yStart+.10).toFixed(3)+
        " "+(vx+bend2).toFixed(3)+" "+(yMid1-.08).toFixed(3)+
        " "+(vx+(bend1*.35)).toFixed(3)+" "+yMid1.toFixed(3)+
        " M"+(vx-(bend2*.30)).toFixed(3)+" "+yMid2.toFixed(3)+
        "C"+(vx-bend1).toFixed(3)+" "+(yMid2+.08).toFixed(3)+
        " "+(vx+bend2*.45).toFixed(3)+" "+(yEnd-.10).toFixed(3)+
        " "+vx.toFixed(3)+" "+yEnd.toFixed(3);
      pushGrouped(verticalGroups,symbol+"|"+vBucket+"|"+vColour,vCmd);

      const hy=ly+(stitchHash(x,y,13)-.5)*.024;
      const xStart=lx+.018+stitchHash(x,y,14)*.025;
      const xEnd=lx+.982-stitchHash(x,y,15)*.025;
      const q1=ly+(stitchHash(x,y,16)-.5)*.022;
      const q2=ly+(stitchHash(x,y,17)-.5)*.022;
      let hCmd;
      if (stitchHash(x,y,18)>.86) {
        const gap=.045+stitchHash(x,y,19)*.045;
        hCmd=
          "M"+xStart.toFixed(3)+" "+hy.toFixed(3)+
          "C"+(lx+.22).toFixed(3)+" "+q1.toFixed(3)+" "+(lx+.38).toFixed(3)+" "+q2.toFixed(3)+" "+(lx+.50-gap).toFixed(3)+" "+hy.toFixed(3)+
          " M"+(lx+.50+gap).toFixed(3)+" "+hy.toFixed(3)+
          "C"+(lx+.64).toFixed(3)+" "+q2.toFixed(3)+" "+(lx+.80).toFixed(3)+" "+q1.toFixed(3)+" "+xEnd.toFixed(3)+" "+hy.toFixed(3);
      } else {
        hCmd=
          "M"+xStart.toFixed(3)+" "+hy.toFixed(3)+
          "C"+(lx+.30).toFixed(3)+" "+q1.toFixed(3)+" "+(lx+.68).toFixed(3)+" "+q2.toFixed(3)+" "+xEnd.toFixed(3)+" "+hy.toFixed(3);
      }
      pushGrouped(horizontalGroups,symbol+"|"+hBucket+"|"+hColour,hCmd);
    }
  }

  const out=[];
  const f=rules.fabric || {};
  const fabricBase=esc(f.color || "#F7F3EA");
  const fabricLight=esc(f.light || "#FFFDF7");
  const fabricMid=esc(f.mid || "#E6DFD2");
  const fabricShadow=esc(f.shadow || "#CFC6B8");
  const fabricHole=esc(f.hole || "#AFA79B");
  /*
    One SVG unit is one cross-stitch square.  The Aida weave therefore keeps
    the same physical scale as the 100 x 120 stitch matrix: holes sit exactly
    on integer stitch intersections and the yarn bundles continue across
    neighbouring empty cells instead of being generated cell-by-cell.
  */
  out.push(
    '<defs>'+
      '<pattern id="aidaFabric" width="1" height="1" patternUnits="userSpaceOnUse">'+
        '<rect width="1" height="1" fill="'+fabricBase+'"/>'+
        '<path d="M0 .205 C.23 .190 .77 .220 1 .205 M0 .335 C.26 .320 .74 .350 1 .335 M0 .665 C.24 .650 .76 .680 1 .665 M0 .795 C.22 .780 .78 .810 1 .795" fill="none" stroke="'+fabricLight+'" stroke-width=".060" stroke-linecap="round" opacity=".74"/>'+
        '<path d="M0 .245 C.25 .235 .75 .255 1 .245 M0 .375 C.25 .365 .75 .385 1 .375 M0 .705 C.25 .695 .75 .715 1 .705 M0 .835 C.25 .825 .75 .845 1 .835" fill="none" stroke="'+fabricMid+'" stroke-width=".034" stroke-linecap="round" opacity=".72"/>'+
        '<path d="M.205 0 C.190 .23 .220 .77 .205 1 M.335 0 C.320 .26 .350 .74 .335 1 M.665 0 C.650 .24 .680 .76 .665 1 M.795 0 C.780 .22 .810 .78 .795 1" fill="none" stroke="'+fabricLight+'" stroke-width=".056" stroke-linecap="round" opacity=".66"/>'+
        '<path d="M.245 0 C.235 .25 .255 .75 .245 1 M.375 0 C.365 .25 .385 .75 .375 1 M.705 0 C.695 .25 .715 .75 .705 1 M.835 0 C.825 .25 .845 .75 .835 1" fill="none" stroke="'+fabricShadow+'" stroke-width=".031" stroke-linecap="round" opacity=".48"/>'+
        '<circle cx="0" cy="0" r=".115" fill="'+fabricShadow+'" opacity=".78"/>'+
        '<circle cx="0" cy="0" r=".071" fill="'+fabricHole+'" opacity=".72"/>'+
        '<circle cx="0" cy="0" r=".035" fill="#817B73" opacity=".26"/>'+
        '<path d="M.080 .018 Q.125 .058 .145 .118 M.018 .080 Q.058 .125 .118 .145" fill="none" stroke="'+fabricLight+'" stroke-width=".025" stroke-linecap="round" opacity=".72"/>'+
      '</pattern>'+
    '</defs>'+
    '<rect width="'+vw+'" height="'+vh+'" fill="url(#aidaFabric)"/>'
  );

  for (const [symbol,commands] of baseGroups.entries()) {
    out.push('<path d="'+commands.join(" ")+'" fill="'+threadColor(symbol)+'"/>');
  }
  for (const [symbol,commands] of shadowGroups.entries()) {
    out.push('<path d="'+commands.join(" ")+'" fill="none" stroke="'+darkenColour(threadColor(symbol),.28)+'" stroke-width="'+rules.shadow_stroke+'" stroke-linecap="round" stroke-linejoin="round" opacity=".34"/>');
  }
  for (const [symbol,commands] of lowerGroups.entries()) {
    out.push('<path d="'+commands.join(" ")+'" fill="none" stroke="'+darkenColour(threadColor(symbol),.035)+'" stroke-width="'+rules.lower_stroke+'" stroke-linecap="round" stroke-linejoin="round" opacity=".96"/>');
  }
  for (const [symbol,commands] of upperGroups.entries()) {
    out.push('<path d="'+commands.join(" ")+'" fill="none" stroke="'+lightenColour(threadColor(symbol),.035)+'" stroke-width="'+rules.upper_stroke+'" stroke-linecap="round" stroke-linejoin="round" opacity=".98"/>');
  }
  for (const [symbol,commands] of highlightGroups.entries()) {
    out.push('<path d="'+commands.join(" ")+'" fill="none" stroke="'+lightenColour(threadColor(symbol),.18)+'" stroke-width="'+rules.highlight_stroke+'" stroke-linecap="round" opacity=".24"/>');
  }
  for (const [key,commands] of verticalGroups.entries()) {
    const parts=key.split("|"), bucket=Number(parts[1]), colour=parts[2];
    out.push('<path d="'+commands.join(" ")+'" fill="none" stroke="'+colour+'" stroke-width="'+rules.vertical_widths[bucket]+'" stroke-linecap="round" opacity=".56"/>');
  }
  for (const [key,commands] of horizontalGroups.entries()) {
    const parts=key.split("|"), bucket=Number(parts[1]), colour=parts[2];
    out.push('<path d="'+commands.join(" ")+'" fill="none" stroke="'+colour+'" stroke-width="'+rules.horizontal_widths[bucket]+'" stroke-linecap="round" opacity=".58"/>');
  }

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+vw+' '+vh+'" preserveAspectRatio="xMidYMid meet">'+out.join("")+'</svg>';
}


function applyHeroFrame() {
  const cfg = assets.frame || {};
  if (!cfg.enabled) return;
  const hero = document.querySelector('.hero-photo');
  const image = document.getElementById('cover-image');
  if (!hero || !image) return;
  const render = () => {
    const cw=hero.clientWidth, ch=hero.clientHeight;
    let layer=hero.querySelector('.hero-frame-layer');
    if (!layer) {
      layer=document.createElement('div'); layer.className='hero-frame-layer';
      layer.innerHTML='<div class="hero-frame-fabric"></div><div class="hero-frame-stitches"></div>';
      hero.appendChild(layer);
    }
    const pct = cfg.area_pct || {};
    if (Number(pct.width)>0 && Number(pct.height)>0) {
      layer.style.left=`${cw*Number(pct.x||0)/100}px`;
      layer.style.top=`${ch*Number(pct.y||0)/100}px`;
      layer.style.width=`${cw*Number(pct.width)/100}px`;
      layer.style.height=`${ch*Number(pct.height)/100}px`;
    } else {
      const source = cfg.source_px || {};
      const sw = Number(source.width || image.naturalWidth || 0);
      const sh = Number(source.height || image.naturalHeight || 0);
      const a = cfg.area_px || {};
      if (!(sw>0 && sh>0 && Number(a.width)>0 && Number(a.height)>0)) return;
      const scale=Math.max(cw/sw,ch/sh); // matches object-fit: cover
      const ox=(cw-sw*scale)/2, oy=(ch-sh*scale)/2;
      layer.style.left=`${ox+Number(a.x)*scale}px`;
      layer.style.top=`${oy+Number(a.y)*scale}px`;
      layer.style.width=`${Number(a.width)*scale}px`;
      layer.style.height=`${Number(a.height)*scale}px`;
    }
    const fabric=cfg.fabric || {};
    const fabricEl=layer.querySelector('.hero-frame-fabric');
    fabricEl.style.backgroundColor=fabric.color || '#f7f3ea';
    fabricEl.style.backgroundImage=fabric.texture_css || 'none';
    const pad=Math.max(0,Math.min(.25,Number(cfg.padding_ratio ?? .05)));
    const stitches=layer.querySelector('.hero-frame-stitches');
    stitches.style.inset=`${pad*100}%`;
    stitches.innerHTML=stitchedSvg(MATRIX,0,0,W,H,true);
  };
  if (image.complete) render(); else image.addEventListener('load', render, {once:true});
  window.addEventListener('resize',render);
}

  let fine=[];

  let major=[];

  return out.join("");
}

function detailSvg(x0,y0,w,h,mode) {
  let out=[`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.6 -3.6 ${w+7.2} ${h+7.2}" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="${w}" height="${h}" fill="#fff"/>`];

  if(mode==="colour") {
    for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++) {
      const s=MATRIX[y0+yy]?.[x0+xx];
      if(s) out.push(`<rect x="${xx}" y="${yy}" width="1" height="1" fill="${threadColor(s)}"/>`);
    }
  }

  let fine=[];
  for(let xx=0;xx<=w;xx++) fine.push(`M${xx} 0V${h}`);
  for(let yy=0;yy<=h;yy++) fine.push(`M0 ${yy}H${w}`);
  out.push(`<path d="${fine.join(" ")}" fill="none" stroke="#aaa4a7" stroke-width="0.035"/>`);
  let major=[];
  for(let xx=0;xx<=w;xx+=10) major.push(`M${xx} 0V${h}`);
  for(let yy=0;yy<=h;yy+=10) major.push(`M0 ${yy}H${w}`);
  out.push(`<path d="${major.join(" ")}" fill="none" stroke="#665b61" stroke-width="0.11"/>`);

  const symbolSize = mode==="colour" ? "0.61" : "0.7";
  const defaultInk = mode==="colour" ? "#2d2228" : "#30242b";
  out.push(`<g font-family="Arial, sans-serif" font-size="${symbolSize}" font-weight="700" text-anchor="middle" dominant-baseline="central">`);
  for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++) {
    const s=MATRIX[y0+yy]?.[x0+xx];
    if(!s) continue;
    const ink=mode==="colour" ? (luminance(threadColor(s)) < .38 ? "#fff" : defaultInk) : defaultInk;
    out.push(`<text x="${(xx+.5).toFixed(2)}" y="${(yy+.51).toFixed(2)}" fill="${ink}">${esc(s)}</text>`);
  }
  out.push(`</g><g font-family="Arial, sans-serif" font-size="1.35" fill="#594951" text-anchor="middle">`);
  for(let local=10;local<=w;local+=10) out.push(`<text x="${(local-.5).toFixed(2)}" y="-1.35">${x0+local}</text>`);
  for(let local=10;local<=h;local+=10) out.push(`<text x="-1.45" y="${(local-.42).toFixed(2)}" text-anchor="end">${y0+local}</text>`);
  out.push(`</g></svg>`);
  return out.join("");
}

  pages.push(common(5, `<div class="page-content">${titleBlock("Visual guide","Colour overview of the full design")}
    <div class="chart-panel"><img id="colour-overview" alt="Full solid-colour chart"/></div>
    <div class="palette" id="palette"></div>
    <div class="chart-help">Each filled square represents one full cross stitch. Empty squares show unstitched fabric.</div>
  </div>`));

  // 06 symbol overview
  pages.push(common(6, `<div class="page-content">${titleBlock("Symbol chart","Black & white overview for easy reference")}
    <div class="chart-panel"><img id="symbol-overview" alt="Full symbol chart"/></div>
    <div class="chart-help">Use this overview together with the enlarged symbol sections and the DMC colour key.</div>
  </div>`));

  // 07 layout
  pages.push(common(7, `<div class="page-content">${titleBlock("Pattern layout",`The ${W} × ${H} design is divided into four enlarged chart sections`)}
    <div class="layout-card">
      <div class="layout-visual"><img id="layout-preview" alt="Pattern section layout"/><span class="cut-v"></span><span class="cut-h"></span><span class="lab tl">A1</span><span class="lab tr">A2</span><span class="lab bl">B1</span><span class="lab br">B2</span></div>
      <div class="layout-info"><h2>4 chart sections</h2><p>Each section covers ${Math.ceil(W/2)} columns × ${Math.ceil(H/2)} rows. The split follows the centre lines of the full design.</p>
        <div class="order"><b>Section order</b><div>A1 → A2<br/>B1 → B2</div></div>
      </div>
    </div>
    <div class="steps">
      <div class="step"><div class="n">1</div><div><strong>Find the centre</strong><span>Fold your fabric in half both ways and locate row ${Math.ceil(H/2)} / column ${Math.ceil(W/2)}.</span></div></div>
      <div class="step"><div class="n">2</div><div><strong>Choose a chart</strong><span>Use colour + symbols or the black-and-white symbol version.</span></div></div>
      <div class="step"><div class="n">3</div><div><strong>Track progress</strong><span>Mark completed stitches or rows as you work through each section.</span></div></div>
      <div class="step"><div class="n">4</div><div><strong>Match grid lines</strong><span>Heavy grid lines mark every 10 stitches for reliable alignment.</span></div></div>
    </div>
  </div>`));

  const splitX=Math.ceil(W/2), splitY=Math.ceil(H/2);
  const sections=[
    {key:"A1",label:"Top left",x:0,y:0,w:splitX,h:splitY},
    {key:"A2",label:"Top right",x:splitX,y:0,w:W-splitX,h:splitY},
    {key:"B1",label:"Bottom left",x:0,y:splitY,w:splitX,h:H-splitY},
    {key:"B2",label:"Bottom right",x:splitX,y:splitY,w:W-splitX,h:H-splitY}
  ];
  sections.forEach((s,idx)=>{
    const sub=`${s.label} · columns ${s.x+1}–${s.x+s.w} · rows ${s.y+1}–${s.y+s.h}`;
    pages.push(common(8+idx, `<div class="page-content">${titleBlock(`Colour chart - ${s.key}`,sub)}<div class="detail-box"><img id="detail-colour-${s.key}" alt="color chart ${s.key}"/></div></div>`));
  });
  sections.forEach((s,idx)=>{
    const sub=`${s.label} · columns ${s.x+1}–${s.x+s.w} · rows ${s.y+1}–${s.y+s.h}`;
    pages.push(common(12+idx, `<div class="page-content">${titleBlock(`Symbol chart - ${s.key}`,sub)}<div class="detail-box"><img id="detail-symbol-${s.key}" alt="symbol chart ${s.key}"/></div></div>`));
  });

  // 16 guide
  const sizeRows=(data.fabric_counts||[14,16,18]).map(c=>{
    const s=sizes[c];
    return `<tr><td>${c} ct Aida</td><td>${s.cmW.toFixed(1)} × ${s.cmH.toFixed(1)} cm</td><td>${s.inW.toFixed(1)} × ${s.inH.toFixed(1)} in</td></tr>`;
  }).join("");
  pages.push(common(16, `<div class="page-content">${titleBlock("Print & stitch guide","A simple setup for a clear, accurate stitch")}
    <div class="guide-list">
      <div class="guide-card"><div class="num">01</div><div><h2>Choose your fabric</h2><p>On ${mainCount}-count Aida the stitched area is approximately ${mainSize.cmW.toFixed(1)} × ${mainSize.cmH.toFixed(1)} cm (${mainSize.inW.toFixed(1)} × ${mainSize.inH.toFixed(1)} in).</p></div></div>
      <div class="guide-card"><div class="num">02</div><div><h2>Find the centre</h2><p>Fold your fabric gently in half both ways. Match the centre to row ${Math.ceil(H/2)} and column ${Math.ceil(W/2)}.</p></div></div>
      <div class="guide-card"><div class="num">03</div><div><h2>Use the enlarged charts</h2><p>Pages 8–11 show colour + symbols. Pages 12–15 repeat the same sections in black and white.</p></div></div>
      <div class="guide-card"><div class="num">04</div><div><h2>Keep the DMC key nearby</h2><p>Every symbol maps to the same DMC number shown on the thread-colour page.</p></div></div>
    </div>
    <div class="size-reference"><h2>Finished-size reference</h2><table><thead><tr><th>Fabric</th><th>Stitched area</th><th>Approx. inches</th></tr></thead><tbody>${sizeRows}</tbody></table></div>
    <div class="guide-banner"><div><b>Print at 100%</b><span>For consistent chart scale, avoid printer options that resize the page unexpectedly.</span></div><div><b>View at a comfortable size</b><span>When viewing digitally, zoom in as needed so the chart symbols are easy to follow.</span></div></div>
  </div>`));

  // 17 closing
  pages.push(common(17, `<div class="page-content">${titleBlock("Thank you","Pattern information & personal-use note")}
    <div class="closing"><h2>Thank you for stitching with Drielo</h2>
      <p>This digital pattern is designed for personal use. Please do not redistribute, resell or share the file or its charts.</p>
      <p>Use the DMC colour key on page 4 together with the colour and symbol charts throughout this booklet.</p>
      <hr/>
      <div class="closing-meta">
        <div><b>Pattern</b><span>${esc(CODE)}</span></div>
        <div><b>Format</b><span>Digital PDF pattern</span></div>
        <div><b>Threads</b><span>${threadCount} DMC colours</span></div>
        <div><b>Website</b><span>${esc(WEBSITE)}</span></div>
      </div>
    </div>
  </div>`));

  document.getElementById("book").innerHTML=pages.join("");

  // Assign shared brand assets once after the DOM exists.
  document.querySelectorAll("[data-floral]").forEach(img=>img.src=assets.floral);
  document.getElementById("cover-image").src=assets.cover_image;
  applyHeroFrame();

  // Vector graphics.
  const stitched=svgData(stitchedSvg());
  document.getElementById("finished-design").src=stitched;
  document.getElementById("facts-preview").src=stitched;
  document.getElementById("layout-preview").src=stitched;
  document.getElementById("colour-overview").src=svgData(colourOverviewSvg());
  document.getElementById("symbol-overview").src=svgData(symbolOverviewSvg());

  const palette=document.getElementById("palette");
  data.threads.forEach(t=>{
    const i=document.createElement("i");
    i.style.background=t.color;
    i.title=`DMC ${t.dmc} - ${t.name}`;
    palette.appendChild(i);
  });

  sections.forEach(s=>{
    document.getElementById(`detail-colour-${s.key}`).src=svgData(detailSvg(s.x,s.y,s.w,s.h,"colour"));
    document.getElementById(`detail-symbol-${s.key}`).src=svgData(detailSvg(s.x,s.y,s.w,s.h,"symbol"));
  });

  document.documentElement.setAttribute("data-drielo-ready","1");
}
renderPages();
})();
</script>
</body>
</html>

<!--
=================================================================
DRIELO REUSABLE PDF MASTER TEMPLATE - v6
=================================================================
PURPOSE
- This HTML is the master source for the 17-page product PDF.
- The visual geometry mirrors the existing DRIELO product booklet.
- Pattern artwork, charts, rulers and symbols are generated as SVG vectors.

FOR A NEW PRODUCT, EDIT ONLY:
1) #template-pattern-data
   - product_code
   - collection
   - title / subtitle
   - stitch_width / stitch_height
   - total_stitches
   - threads[]
   - matrix[][]
   - skill_level / stitch_type / materials / fabric_counts
2) #template-assets
   - cover_image (lifestyle/mockup image)
   - floral only if brand decoration ever changes

IMPORTANT
- Do not hand-edit chart images: they are generated from matrix[].
- Detail chart rulers are generated once on TOP and LEFT only.
- Symbols are mathematically centered inside every stitch cell.
- The finished-design previews use real X-shaped stitches, not pixel blocks.
- Colour overview uses filled squares by design; enlarged charts add symbols.
=================================================================
-->

<script id="template-pattern-data" type="application/json">{"product_code":"P0000","collection":"Pop Art Portraits","collection_id":"pop-art-portraits","title":"Pattern Title","technique":"rug","subtitle":"A modern rug and latch-hook colour chart","stitch_width":1,"stitch_height":1,"total_stitches":0,"threads":[],"matrix":[[null]],"skill_level":"Beginner friendly","stitch_type":"Latch hook / rug knots","website":"https://www.drielo.com","materials":["Wool or rug yarn in the listed collection colours","Latch hook / tufting tool","Suitable rug canvas or backing","Scissors and finishing materials"],"fabric_counts":[],"size_options":[{"label":"Fine canvas - 0.6 cm/knot","cmW":36.0,"cmH":43.2,"inW":14.2,"inH":17.0},{"label":"Medium canvas - 0.8 cm/knot","cmW":48.0,"cmH":57.6,"inW":18.9,"inH":22.7},{"label":"Large canvas - 1.0 cm/knot","cmW":60.0,"cmH":72.0,"inW":23.6,"inH":28.3}],"unit_label":"knots","measure_label":"Knots","cover_colour_label":"Wool colours","cover_colour_value":"19 collection colours","facts_colour_label":"Wool colours","colour_unit":"collection colours","finished_title":"Finished design","finished_subtitle":"A preview of the completed rug design","finished_caption":"Use this page as a visual reference while you build the rug.","facts_title":"Pattern facts","facts_subtitle":"Everything you need before you start your rug","preview_label":"Finished rug preview","cover_overlay":{"left":21.7,"top":7.5,"width":59.0,"height":71.0,"opacity":0.82,"safe_inset_pct":4.5},"cover_stage_scale":125}</script>

<script>
(function(){
"use strict";

const data = JSON.parse(document.getElementById("template-pattern-data").textContent);
const assets = JSON.parse(document.getElementById("template-assets").textContent);

const threadsBySymbol = Object.fromEntries(data.threads.map(t => [t.symbol, t]));
const W = Number(data.stitch_width);
const H = Number(data.stitch_height);
const MATRIX = data.matrix;
const WEBSITE = data.website || "www.drielo.com";
const CODE = data.product_code || "P-0000";
const PAGE_TOTAL = 17;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
}
function fmt(n) {
  return Number(n).toLocaleString("en-US");
}
function sizeFor(count) {
  return {
    inW: W / count, inH: H / count,
    cmW: W / count * 2.54, cmH: H / count * 2.54
  };
}
function pageNo(n) { return String(n).padStart(2,"0"); }
function svgData(svg) { return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }

function common(page, content, extraClass="") {
  return `<section class="page ${extraClass}">
    <div class="topbar"><span class="code">${esc(CODE)}</span><span class="rule"></span></div>
    <div class="floral tr"><img data-floral/></div>
    <div class="floral bl"><img data-floral/></div>
    ${content}
    <div class="footer"><span class="rule"></span><a class="url" href="https://www.drielo.com" target="_blank" rel="noopener">${esc(WEBSITE)}</a><span class="rule"></span><span class="page-no">${pageNo(page)}</span></div>
  </section>`;
}

function threadColor(symbol) {
  const t = threadsBySymbol[symbol];
  return t ? t.color : "#ffffff";
}
function luminance(hex) {
  let h = String(hex || "#ffffff").replace("#","");
  if (h.length === 3) h = h.split("").map(x=>x+x).join("");
  const rgb = [0,2,4].map(i => parseInt(h.slice(i,i+2),16)/255).map(v => v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4));
  return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];
}
function symbolInk(hex) { return luminance(hex) < .38 ? "#ffffff" : "#2e1d27"; }

function stitchedSvg(matrix=MATRIX, x0=0, y0=0, x1=W, y1=H, includeBackground=true) {
  const vw=x1-x0, vh=y1-y0; let paths=[];
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++) {
    const s=matrix[y]?.[x]; if(!s) continue; const c=threadColor(s); const lx=x-x0, ly=y-y0;
    const p=.06; paths.push(`<rect x="${(lx+p).toFixed(3)}" y="${(ly+p).toFixed(3)}" width="${(1-2*p).toFixed(3)}" height="${(1-2*p).toFixed(3)}" rx=".24" fill="${c}"/><circle cx="${(lx+.5).toFixed(3)}" cy="${(ly+.5).toFixed(3)}" r=".10" fill="rgba(255,255,255,.25)"/>`);
  }
  const background = includeBackground ? `<rect width="${vw}" height="${vh}" fill="#ffffff"/>` : ``;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vw} ${vh}" preserveAspectRatio="xMidYMid meet">${background}${paths.join("")}</svg>`;
}

function colourOverviewSvg() {
  let out=[`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 ${W+10} ${H+10}" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) {
    const s=MATRIX[y]?.[x];
    if(s) out.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="${threadColor(s)}"/>`);
  }
  let fine=[];
  for(let x=0;x<=W;x++) fine.push(`M${x} 0V${H}`);
  for(let y=0;y<=H;y++) fine.push(`M0 ${y}H${W}`);
  out.push(`<path d="${fine.join(" ")}" fill="none" stroke="#aaa4a7" stroke-width="0.035"/>`);
  let major=[];
  for(let x=0;x<=W;x+=10) major.push(`M${x} 0V${H}`);
  for(let y=0;y<=H;y+=10) major.push(`M0 ${y}H${W}`);
  out.push(`<path d="${major.join(" ")}" fill="none" stroke="#665b61" stroke-width="0.11"/>`);
  out.push(`<g font-family="Arial, sans-serif" font-size="1.2" fill="#594951" text-anchor="middle">`);
  for(let n=10;n<=W;n+=10) out.push(`<text x="${(n-.5).toFixed(2)}" y="-2">${n}</text>`);
  for(let n=10;n<=H;n+=10) out.push(`<text x="-2.2" y="${(n-.42).toFixed(2)}" text-anchor="end">${n}</text>`);
  out.push(`</g></svg>`);
  return out.join("");
}

function symbolOverviewSvg() {
  let out=[`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 ${W+10} ${H+10}" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`];
  let fine=[];
  for(let x=0;x<=W;x++) fine.push(`M${x} 0V${H}`);
  for(let y=0;y<=H;y++) fine.push(`M0 ${y}H${W}`);
  out.push(`<path d="${fine.join(" ")}" fill="none" stroke="#aaa4a7" stroke-width="0.035"/>`);
  let major=[];
  for(let x=0;x<=W;x+=10) major.push(`M${x} 0V${H}`);
  for(let y=0;y<=H;y+=10) major.push(`M0 ${y}H${W}`);
  out.push(`<path d="${major.join(" ")}" fill="none" stroke="#665b61" stroke-width="0.11"/>`);
  out.push(`<g font-family="Arial, sans-serif" font-size="0.5" font-weight="700" text-anchor="middle" dominant-baseline="central">`);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) {
    const s=MATRIX[y]?.[x];
    if(s) out.push(`<text x="${(x+.5).toFixed(2)}" y="${(y+.51).toFixed(2)}" fill="#30242b">${esc(s)}</text>`);
  }
  out.push(`</g><g font-family="Arial, sans-serif" font-size="1.2" fill="#594951" text-anchor="middle">`);
  for(let n=10;n<=W;n+=10) out.push(`<text x="${(n-.5).toFixed(2)}" y="-2">${n}</text>`);
  for(let n=10;n<=H;n+=10) out.push(`<text x="-2.2" y="${(n-.42).toFixed(2)}" text-anchor="end">${n}</text>`);
  out.push(`</g></svg>`);
  return out.join("");
}

function detailSvg(x0,y0,w,h,mode) {
  let out=[`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.6 -3.6 ${w+7.2} ${h+7.2}" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="${w}" height="${h}" fill="#fff"/>`];

  if(mode==="colour") {
    for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++) {
      const s=MATRIX[y0+yy]?.[x0+xx];
      if(s) out.push(`<rect x="${xx}" y="${yy}" width="1" height="1" fill="${threadColor(s)}"/>`);
    }
  }

  let fine=[];
  for(let xx=0;xx<=w;xx++) fine.push(`M${xx} 0V${h}`);
  for(let yy=0;yy<=h;yy++) fine.push(`M0 ${yy}H${w}`);
  out.push(`<path d="${fine.join(" ")}" fill="none" stroke="#aaa4a7" stroke-width="0.035"/>`);
  let major=[];
  for(let xx=0;xx<=w;xx+=10) major.push(`M${xx} 0V${h}`);
  for(let yy=0;yy<=h;yy+=10) major.push(`M0 ${yy}H${w}`);
  out.push(`<path d="${major.join(" ")}" fill="none" stroke="#665b61" stroke-width="0.11"/>`);

  const symbolSize = mode==="colour" ? "0.61" : "0.7";
  const defaultInk = mode==="colour" ? "#2d2228" : "#30242b";
  out.push(`<g font-family="Arial, sans-serif" font-size="${symbolSize}" font-weight="700" text-anchor="middle" dominant-baseline="central">`);
  for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++) {
    const s=MATRIX[y0+yy]?.[x0+xx];
    if(!s) continue;
    const ink=mode==="colour" ? (luminance(threadColor(s)) < .38 ? "#fff" : defaultInk) : defaultInk;
    out.push(`<text x="${(xx+.5).toFixed(2)}" y="${(yy+.51).toFixed(2)}" fill="${ink}">${esc(s)}</text>`);
  }
  out.push(`</g><g font-family="Arial, sans-serif" font-size="1.35" fill="#594951" text-anchor="middle">`);
  for(let local=10;local<=w;local+=10) out.push(`<text x="${(local-.5).toFixed(2)}" y="-1.35">${x0+local}</text>`);
  for(let local=10;local<=h;local+=10) out.push(`<text x="-1.45" y="${(local-.42).toFixed(2)}" text-anchor="end">${y0+local}</text>`);
  out.push(`</g></svg>`);
  return out.join("");
}

function floralHTML(){
  return `<div class="floral tr"><img data-floral/></div><div class="floral bl"><img data-floral/></div>`;
}

function titleBlock(title, subtitle) {
  return `<h1>${esc(title)}</h1><div class="subtitle">${esc(subtitle)}</div>`;
}

function iconFact(icon,title,value,small="") {
  return `<div class="fact-card"><div class="icon-disc">${icon}</div><div><b>${esc(title)}</b><span>${esc(value)}</span>${small?`<small>${esc(small)}</small>`:""}</div></div>`;
}

function renderPages() {
  const sizeOptions = (data.size_options || []).length ? data.size_options : (data.fabric_counts || [14,16,18]).map(c=>{ const s=sizeFor(c); return {label:`${c} ct Aida`,cmW:s.cmW,cmH:s.cmH,inW:s.inW,inH:s.inH}; });
  const mainSize = sizeOptions[0];
  const threadCount=data.threads.length;

  const pages=[];

  // 01 Cover
  pages.push(common(1, `<div class="page-content">${titleBlock(data.title, data.subtitle || "Technique subtitle")}
    <div class="cover-layout">
      <div class="hero-photo" data-product-image><div class="cover-stage" id="cover-stage"><img id="cover-image" class="cover-bg" alt="Technique display background"/><img id="cover-overlay" class="cover-overlay" alt="Vector pattern overlay"/></div></div>
      <div class="facts-rail">
        <div class="rail-item"><div class="icon-disc">✦</div><b>Skill level</b><span>${esc(data.skill_level || "Beginner friendly")}</span></div>
        <div class="rail-item"><div class="icon-disc">↔</div><b>Finished size</b><span>${W} × ${H} ${data.unit_label || "stitches"}</span></div>
        <div class="rail-item"><div class="icon-disc">◎</div><b>${esc(data.cover_colour_label || "Colours")}</b><span>${esc(data.cover_colour_value || `${threadCount} colours`)}</span></div>
        <div class="rail-item"><div class="icon-disc">×</div><b>Type</b><span>${esc(data.stitch_type || "Full cross stitch")}</span></div>
      </div>
    </div>
  </div>`, "cover"));

  // 02 Finished
  pages.push(common(2, `<div class="page-content">${titleBlock(data.finished_title || "Finished design",data.finished_subtitle || "A preview of the completed design")}
    <div class="finished-wrap"><img id="finished-design" alt="Exact stitched design"/></div>
    <div class="finished-caption">${esc(data.finished_caption || "Use this page as a visual reference.")}</div>
  </div>`));

  // 03 Facts
  const ctText=sizeOptions.map(s=>`${s.label}: ${Number(s.cmW).toFixed(1)} × ${Number(s.cmH).toFixed(1)} cm`).join("\n");
  const mats=(data.materials||[]).map(m=>`<li><span class="check">✓</span><span>${esc(m)}</span></li>`).join("");
  pages.push(common(3, `<div class="page-content">${titleBlock(data.facts_title || "Pattern facts",data.facts_subtitle || "Everything you need before you start")}
    <div class="facts-layout">
      <div class="facts-preview"><img id="facts-preview" alt="Exact stitched preview"/><small>${esc(data.preview_label || "Finished design preview")}</small></div>
      <div class="facts-cards">
        <div class="fact-row">
          ${iconFact("✦","Skill level",data.skill_level || "Beginner friendly","One knot or tuft per chart cell.")}
          ${iconFact("▦", data.measure_label || "Stitches", fmt(data.total_stitches))}
        </div>
        <div class="fact-row single">
          ${iconFact("↔","Finished size",`${W} × ${H} ${data.unit_label || 'stitches'}`,ctText)}
        </div>
        <div class="fact-row">
          ${iconFact("◎", data.facts_colour_label || "Colours",`${threadCount} ${data.colour_unit || 'colours'}`)}
          ${iconFact("×","Type",data.stitch_type || "Full cross stitch")}
        </div>
        <div class="materials"><div class="icon-disc">＋</div><div><h2>Materials</h2><ul>${mats}</ul></div></div>
      </div>
    </div>
  </div>`));

  // 04 Wool colours
  const threadRows=data.threads.map(t=>`<tr>
    <td><span class="sym-chip">${esc(t.symbol)}</span></td>
    <td>${esc(t.dmc)}</td>
    <td>${esc(t.name)}</td>
    <td>${fmt(t.stitches)}</td>
    <td><span class="thread-swatch" style="background:${esc(t.color)}"></span></td>
  </tr>`).join("");
  pages.push(common(4, `<div class="page-content">${titleBlock(data.colour_page_title || "Wool colours",data.colour_page_subtitle || "Colour key and stitch counts")}
    <div class="thread-area">
      <table class="thread-table"><thead><tr><th>Symbol</th><th>Colour ID</th><th>Colour name</th><th>Knots</th><th>Colour</th></tr></thead><tbody>${threadRows}</tbody></table>
      <div class="thread-foot">
        <div class="note-card"><b>${threadCount} collection colours</b><span>Keep this key nearby while working. Each chart symbol corresponds to one collection colour.</span></div>
        <div class="note-card"><b>${fmt(data.total_stitches)} total knots</b><span>Use the stitch counts as a simple reference for planning and tracking your progress.</span></div>
      </div>
    </div>
  </div>`));

  // 05 visual guide
  pages.push(common(5, `<div class="page-content">${titleBlock("Visual guide","Colour overview of the full design")}
    <div class="chart-panel"><img id="colour-overview" alt="Full solid-colour chart"/></div>
    <div class="palette" id="palette"></div>
    <div class="chart-help">Each filled square represents one knot / tuft position. Empty squares show the background canvas.</div>
  </div>`));

  // 06 symbol overview
  pages.push(common(6, `<div class="page-content">${titleBlock("Symbol chart","Black & white overview for easy reference")}
    <div class="chart-panel"><img id="symbol-overview" alt="Full symbol chart"/></div>
    <div class="chart-help">Use this overview together with the enlarged symbol sections and the DMC colour key.</div>
  </div>`));

  // 07 layout
  pages.push(common(7, `<div class="page-content">${titleBlock("Pattern layout",`The ${W} × ${H} design is divided into four enlarged chart sections`)}
    <div class="layout-card">
      <div class="layout-visual"><img id="layout-preview" alt="Pattern section layout"/><span class="cut-v"></span><span class="cut-h"></span><span class="lab tl">A1</span><span class="lab tr">A2</span><span class="lab bl">B1</span><span class="lab br">B2</span></div>
      <div class="layout-info"><h2>4 chart sections</h2><p>Each section covers ${Math.ceil(W/2)} columns × ${Math.ceil(H/2)} rows. The split follows the centre lines of the full design.</p>
        <div class="order"><b>Section order</b><div>A1 → A2<br/>B1 → B2</div></div>
      </div>
    </div>
    <div class="steps">
      <div class="step"><div class="n">1</div><div><strong>Find the centre</strong><span>Fold your fabric in half both ways and locate row ${Math.ceil(H/2)} / column ${Math.ceil(W/2)}.</span></div></div>
      <div class="step"><div class="n">2</div><div><strong>Choose a chart</strong><span>Use colour + symbols or the black-and-white symbol version.</span></div></div>
      <div class="step"><div class="n">3</div><div><strong>Track progress</strong><span>Mark completed knots or rows as you work through each section.</span></div></div>
      <div class="step"><div class="n">4</div><div><strong>Match grid lines</strong><span>Heavy grid lines mark every 10 stitches for reliable alignment.</span></div></div>
    </div>
  </div>`));

  const splitX=Math.ceil(W/2), splitY=Math.ceil(H/2);
  const sections=[
    {key:"A1",label:"Top left",x:0,y:0,w:splitX,h:splitY},
    {key:"A2",label:"Top right",x:splitX,y:0,w:W-splitX,h:splitY},
    {key:"B1",label:"Bottom left",x:0,y:splitY,w:splitX,h:H-splitY},
    {key:"B2",label:"Bottom right",x:splitX,y:splitY,w:W-splitX,h:H-splitY}
  ];
  sections.forEach((s,idx)=>{
    const sub=`${s.label} · columns ${s.x+1}–${s.x+s.w} · rows ${s.y+1}–${s.y+s.h}`;
    pages.push(common(8+idx, `<div class="page-content">${titleBlock(`Colour chart - ${s.key}`,sub)}<div class="detail-box"><img id="detail-colour-${s.key}" alt="color chart ${s.key}"/></div></div>`));
  });
  sections.forEach((s,idx)=>{
    const sub=`${s.label} · columns ${s.x+1}–${s.x+s.w} · rows ${s.y+1}–${s.y+s.h}`;
    pages.push(common(12+idx, `<div class="page-content">${titleBlock(`Symbol chart - ${s.key}`,sub)}<div class="detail-box"><img id="detail-symbol-${s.key}" alt="symbol chart ${s.key}"/></div></div>`));
  });

  // 16 guide
  const sizeRows=sizeOptions.map(s=>`<tr><td>${esc(s.label)}</td><td>${Number(s.cmW).toFixed(1)} × ${Number(s.cmH).toFixed(1)} cm</td><td>${Number(s.inW).toFixed(1)} × ${Number(s.inH).toFixed(1)} in</td></tr>`).join("");
  pages.push(common(16, `<div class="page-content">${titleBlock(data.guide_title || "Print & rug-making guide",data.guide_subtitle || "A simple setup for an accurate rug")}
    <div class="guide-list">
      <div class="guide-card"><div class="num">01</div><div><h2>Choose your canvas & wool</h2><p>${data.guide_choice_text || `At the first listed size option, the finished area is approximately ${Number(mainSize.cmW).toFixed(1)} × ${Number(mainSize.cmH).toFixed(1)} cm (${Number(mainSize.inW).toFixed(1)} × ${Number(mainSize.inH).toFixed(1)} in).`}</p></div></div>
      <div class="guide-card"><div class="num">02</div><div><h2>Find the centre</h2><p>Fold your fabric gently in half both ways. Match the centre to row ${Math.ceil(H/2)} and column ${Math.ceil(W/2)}.</p></div></div>
      <div class="guide-card"><div class="num">03</div><div><h2>Use the enlarged charts</h2><p>Pages 8–11 show colour + symbols. Pages 12–15 repeat the same sections in black and white.</p></div></div>
      <div class="guide-card"><div class="num">04</div><div><h2>Keep the DMC key nearby</h2><p>Every symbol maps to the same DMC number shown on the thread-colour page.</p></div></div>
    </div>
    <div class="size-reference"><h2>Finished-size reference</h2><table><thead><tr><th>Size option</th><th>Finished area</th><th>Approx. inches</th></tr></thead><tbody>${sizeRows}</tbody></table></div>
    <div class="guide-banner"><div><b>Print at 100%</b><span>For consistent chart scale, avoid printer options that resize the page unexpectedly.</span></div><div><b>View at a comfortable size</b><span>When viewing digitally, zoom in as needed so the chart symbols are easy to follow.</span></div></div>
  </div>`));

  // 17 closing
  pages.push(common(17, `<div class="page-content">${titleBlock("Thank you","Pattern information & personal-use note")}
    <div class="closing"><h2>Thank you for stitching with Drielo</h2>
      <p>This digital pattern is designed for personal use. Please do not redistribute, resell or share the file or its charts.</p>
      <p>Use the collection colour key on page 4 together with the colour and symbol charts throughout this booklet.</p>
      <hr/>
      <div class="closing-meta">
        <div><b>Pattern</b><span>${esc(CODE)}</span></div>
        <div><b>Format</b><span>Digital PDF pattern</span></div>
        <div><b>Threads</b><span>${threadCount} collection colours</span></div>
        <div><b>Website</b><span>${esc(WEBSITE)}</span></div>
      </div>
    </div>
  </div>`));

  document.getElementById("book").innerHTML=pages.join("");

  // Assign shared brand assets once after the DOM exists.
  document.querySelectorAll("[data-floral]").forEach(img=>img.src=assets.floral);
  document.getElementById("cover-image").src=assets.cover_image;

  // Vector graphics.
  const stitched=svgData(stitchedSvg(MATRIX,0,0,W,H,true));
  const coverVector=svgData(stitchedSvg(MATRIX,0,0,W,H,false));
  document.getElementById("finished-design").src=stitched;
  document.getElementById("facts-preview").src=stitched;
  document.getElementById("layout-preview").src=stitched;
  const ov=document.getElementById("cover-overlay");
  if(ov){
    const o=data.cover_overlay||{left:20,top:10,width:60,height:70,opacity:.85,safe_inset_pct:0};
    const inset=Math.max(0,Math.min(20,Number(o.safe_inset_pct||0)))/100;
    const left=Number(o.left)+Number(o.width)*inset;
    const top=Number(o.top)+Number(o.height)*inset;
    const width=Number(o.width)*(1-2*inset);
    const height=Number(o.height)*(1-2*inset);
    ov.src=coverVector;
    ov.style.left=left+"%"; ov.style.top=top+"%";
    ov.style.width=width+"%"; ov.style.height=height+"%";
    ov.style.opacity=(o.opacity ?? .85);
    ov.style.objectFit="contain"; ov.style.objectPosition="center center";
    ov.style.maxWidth="100%"; ov.style.maxHeight="100%";
  }
  const stage=document.getElementById("cover-stage"); if(stage && data.cover_stage_scale) stage.style.width=data.cover_stage_scale+"%";
  document.getElementById("colour-overview").src=svgData(colourOverviewSvg());
  document.getElementById("symbol-overview").src=svgData(symbolOverviewSvg());

  const palette=document.getElementById("palette");
  data.threads.forEach(t=>{
    const i=document.createElement("i");
    i.style.background=t.color;
    i.title=`Colour ${t.dmc} - ${t.name}`;
    palette.appendChild(i);
  });

  sections.forEach(s=>{
    document.getElementById(`detail-colour-${s.key}`).src=svgData(detailSvg(s.x,s.y,s.w,s.h,"colour"));
    document.getElementById(`detail-symbol-${s.key}`).src=svgData(detailSvg(s.x,s.y,s.w,s.h,"symbol"));
  });

  document.documentElement.setAttribute("data-drielo-ready","1");
}
renderPages();
})();
</script>
